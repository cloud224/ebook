ss{accent-color:var(--accent);flex:1;min-width:180px;height:14px}.check{display:flex;gap:14px;padding:14px 18px;margin:8px 0;border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer}.check input{width:20px;height:20px;flex:none;margin-top:7px;accent-color:var(--accent)}.check:has(input:checked){background:var(--wash)}.small{font-size:14px;color:var(--muted)}footer{padding:30px 24px;border-top:1px solid var(--line);text-align:center;font-size:14px;color:var(--muted)}.skip{position:absolute;top:-100px;padding:10px;background:var(--paper)}.skip:focus{top:5px;z-index:10}body.dark{--bg:#18211e;--paper:#202d27;--ink:#edf2ec;--muted:#b9cabe;--line:#405249;--accent:#8fd6c3;--wash:#30463b}@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr);gap:20px;padding:24px 16px 50px}nav{position:static;max-height:220px;border:1px solid var(--line);padding:12px;border-radius:8px}.bar{padding:10px 16px;flex-wrap:wrap}.brand{font-size:15px}header button{font-size:14px;padding:6px 10px}.hero{padding-top:16px}article{padding:18px}body{font-size:16px}.lead{font-size:18px}}@media print{header,nav,.tools button,.skip{display:none}.layout{display:block;padding:0}body{background:white;color:black;font-size:11pt}section{padding:20px 0}article{break-inside:avoid;background:white}a{color:black}h1{font-size:28pt}.note{background:#eee}footer{display:none}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#main\">跳到內容\u003c/a>\u003cheader>\u003cdiv class=\"bar\">\u003cspan class=\"brand\">乾淨系統／安全建置手冊\u003c/span>\u003cbutton id=\"theme\">切換明暗\u003c/button>\u003cbutton id=\"print\">列印／另存 PDF\u003c/button>\u003c/div>\u003c/header>\u003cdiv class=\"layout\">\u003cnav aria-label=\"章節目錄\">\u003ca href=\"#s1\">01　原則與建置順序\u003c/a>\u003ca href=\"#s2\">02　開始前：網路與復原準備\u003c/a>\u003ca href=\"#s3\">03　更新：先修補，再開始工作\u003c/a>\u003ca href=\"#s4\">04　帳號：保護信箱，再保護其他服務\u003c/a>\u003ca href=\"#s5\">05　權限分離：管理員只用於管理\u003c/a>\u003ca href=\"#s6\">06　Windows：防毒、防火牆與磁碟加密\u003c/a>\u003ca href=\"#s7\">07　Mac：FileVault、更新與隱私權\u003c/a>\u003ca href=\"#s8\">08　Android：Play Protect 與敏感權限\u003c/a>\u003ca href=\"#s9\">09　iPhone：鎖定、尋找與遭竊保護\u003c/a>\u003ca href=\"#s10\">10　軟體與工作環境：少裝、少授權\u003c/a>\u003ca href=\"#s11\">11　AI 開發與 API 金鑰\u003c/a>\u003ca href=\"#s12\">12　搬資料：分批，先驗證\u003c/a>\u003ca href=\"#s13\">13　備份：離線、加密、真正還原過\u003c/a>\u003ca href=\"#s14\">14　持續維護與異常處理\u003c/a>\u003ca href=\"#checklist\">16　互動驗收清單\u003c/a>\u003ca href=\"#official\">官方文件入口\u003c/a>\u003c/nav>\u003cmain id=\"main\">\u003cdiv class=\"hero\">\u003cp class=\"eyebrow\">SECURITY SETUP · 2026.10\u003c/p>\u003ch1>先把安全底子打好，\u003cbr>再開始工作。\u003c/h1>\u003cp class=\"lead\">適用於乾淨新機與可信任重建環境。涵蓋 Windows、Mac、Android、iPhone，以及印刷工作、ERP、LINE 與 AI 開發的實務注意事項。\u003c/p>\u003cdiv class=\"sequence\">\u003cspan>準備\u003c/span>\u003cspan>更新\u003c/span>\u003cspan>帳號\u003c/span>\u003cspan>權限\u003c/span>\u003cspan>防護\u003c/span>\u003cspan>軟體\u003c/span>\u003cspan>備份\u003c/span>\u003c/div>\u003cdiv class=\"note\">這是可離線閱讀的單一 HTML，不載入外部字型、圖片、追蹤或程式庫，也不蒐集帳密。點開官方文件才需要網路。以下路徑因版本、地區與管理政策可能不同，請以裝置顯示和官方說明為準。\u003c/div>\u003c/div>\u003csection id=\"s1\">\u003cp class=\"eyebrow\">STEP 01\u003c/p>\u003ch2>原則與建置順序\u003c/h2>\u003cp class=\"intro\">乾淨系統只是可信任的起點，不是永久安全的保證。建議順序為：準備可信任的網路與復原資訊 → 更新系統 → 保護帳號 → 分離權限 → 設定各平台防護 → 安裝必要軟體 → 分批搬資料 → 建立並測試備份。沒有任何設定能保證百分之百不被入侵。\u003c/p>\u003carticle>\u003ch3>先不要做什麼\u003c/h3>\u003cp>不要立即整包還原舊環境、安裝破解軟體或照陌生網頁指示貼上終端機指令。先把基本防護建立好，再逐項加入需要的功能。\u003c/p>\u003c/article>\u003carticle>\u003ch3>本指南的範圍\u003c/h3>\u003cp>適用於自己持有、確定乾淨的新機或正式重建後的裝置。若原本已遭入侵，還要處理帳號工作階段、雲端授權與外洩憑證，重灌無法自動清除這些風險。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s2\">\u003cp class=\"eyebrow\">STEP 02\u003c/p>\u003ch2>開始前：網路與復原準備\u003c/h2>\u003cp class=\"intro\">第一次開機可連接自己管理且已更新的路由器。不要為了追求完全離線而跳過必要的啟用與安全更新。\u003c/p>\u003carticle>\u003ch3>路由器設定\u003c/h3>\u003cp>更新韌體，更改預設管理密碼；Wi-Fi 優先使用 WPA3 Personal，舊設備需要相容時可使用 WPA2/WPA3 過渡模式，最低採 WPA2 AES。避免 WEP、舊版 WPA 與 TKIP。沒有需求就關閉從網際網路遠端管理路由器及不必要的連接埠轉送。\u003c/p>\u003c/article>\u003carticle>\u003ch3>先安排救援方式\u003c/h3>\u003cp>準備密碼管理器、帳號復原方式和安全保存紙本的位置。磁碟加密復原金鑰、MFA 備援碼不要只存在同一台裝置，也不要和筆電一起放在包包。公司管理裝置先詢問 IT，勿自行移除 MDM 或安全政策。\u003c/p>\u003c/article>\u003carticle>\u003ch3>軟體仍受支援\u003c/h3>\u003cp>選擇仍提供安全更新的系統和裝置。Windows 10 一般支援已在 2025 年 10 月 14 日結束；ESU、LTSC 等另有條件與期限，不要把一般 Windows 10 視為長期安全的新建環境。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s3\">\u003cp class=\"eyebrow\">STEP 03\u003c/p>\u003ch2>更新：先修補，再開始工作\u003c/h2>\u003cp class=\"intro\">接上電源，完成系統更新並依要求重新啟動，再回到更新頁檢查一次。畫面顯示最新，不代表所有硬體或第三方軟體都有更新，需分開檢查。\u003c/p>\u003carticle>\u003ch3>Windows\u003c/h3>\u003cp>設定 → Windows Update → 檢查更新。驅動程式優先透過 Windows Update 或電腦原廠官方工具取得；韌體依原廠指示更新，不使用不明的驅動更新包。保留 UEFI 安全開機、TPM 等預設機制，修改前先確認加密復原金鑰可取得。\u003c/p>\u003c/article>\u003carticle>\u003ch3>Mac\u003c/h3>\u003cp>系統設定 → 一般 → 軟體更新。開啟合適的自動更新項目與系統安全資料更新；Apple 晶片 Mac 保留預設安全啟動政策。若工作用舊外掛要求降低安全性，先向廠商確認新版或隔離替代方案。\u003c/p>\u003c/article>\u003carticle>\u003ch3>手機與應用程式\u003c/h3>\u003cp>iPhone：設定 → 一般 → 軟體更新。Android：設定中搜尋系統更新與 Google Play 系統更新，各品牌路徑不同。再到 App Store／Play 商店更新 App；瀏覽器、Adobe、Office、PDF 閱讀器也要更新。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s4\">\u003cp class=\"eyebrow\">STEP 04\u003c/p>\u003ch2>帳號：保護信箱，再保護其他服務\u003c/h2>\u003cp class=\"intro\">乾淨的電腦仍可能登入已外洩密碼的帳號。主要信箱通常是其他服務的復原入口，應優先保護。\u003c/p>\u003carticle>\u003ch3>密碼與 MFA\u003c/h3>\u003cp>每個服務使用不同的長密碼，由可信任密碼管理器產生與保存。有支援時優先採通行金鑰或 FIDO 安全金鑰等抗釣魚方式；不支援時使用驗證器等可用的 MFA。簡訊驗證通常仍比完全沒開好，但不能當成所有風險都已消失。不要核准非本人發起的驗證提示。\u003c/p>\u003c/article>\u003carticle>\u003ch3>清查登入與授權\u003c/h3>\u003cp>Google 帳戶 → 安全性／安全性與登入 → 你的裝置 → 管理所有裝置；檢查不認識的工作階段。Apple、Microsoft 同樣檢查帳號裝置及第三方授權。若有可疑活動，依平台的遭入侵處理流程改密碼、撤銷工作階段並檢查復原資訊。\u003c/p>\u003c/article>\u003carticle>\u003ch3>LINE\u003c/h3>\u003cp>主要手機開啟 LINE → 主頁 → 設定 → 我的帳號 → 登入中的裝置；登出不認識的裝置。若確認不是本人操作，再變更密碼並檢查帳號資料。不要掃描陌生人提供的登入 QR Code 或交出驗證碼。\u003c/p>\u003c/article>\u003carticle>\u003ch3>防止把自己鎖在外面\u003c/h3>\u003cp>設定 MFA 之後實際確認第二種登入或復原方式可用，例如另一把安全金鑰或離線備援碼。不要把所有驗證方式集中在唯一一支手機。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s5\">\u003cp class=\"eyebrow\">STEP 05\u003c/p>\u003ch2>權限分離：管理員只用於管理\u003c/h2>\u003cp class=\"intro\">電腦建議保留一個管理員帳號和一個日常標準帳號。標準帳號仍能執行惡意程式並損失自己可存取的資料，所以分權不是防毒替代品。\u003c/p>\u003carticle>\u003ch3>如何建立\u003c/h3>\u003cp>Windows：設定 → 帳戶 → 其他使用者，新增帳號並確認日常帳號類型為標準使用者。Mac：系統設定 → 使用者與群組 → 加入使用者，類型選標準。先確認管理員可登入且密碼可用，才調整既有帳號權限；至少保留一個可用管理員。\u003c/p>\u003c/article>\u003carticle>\u003ch3>日常使用習慣\u003c/h3>\u003cp>用標準帳號收信、上網、處理稿件。需要系統權限時再提供管理員憑證。Mac 標準使用者仍可能安裝自己的 App；不是所有安裝都會跳出管理員提示。不要把管理員密碼交給同事共用。\u003c/p>\u003c/article>\u003carticle>\u003ch3>手機差異\u003c/h3>\u003cp>一般 iPhone 與 Android 不是以建立日常／管理員帳號來操作；重點是螢幕鎖、App 權限、不要越獄或 root，以及保留原廠開機安全機制。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s6\">\u003cp class=\"eyebrow\">STEP 06\u003c/p>\u003ch2>Windows：防毒、防火牆與磁碟加密\u003c/h2>\u003cp class=\"intro\">從開始選單搜尋「Windows 安全性」。功能名稱會因版本、硬體和公司管理政策而不同，請依實機顯示確認。\u003c/p>\u003carticle>\u003ch3>即時防毒與竄改防護\u003c/h3>\u003cp>病毒與威脅防護 → 管理設定，確認使用中的防毒正常、定義檔更新；若使用 Defender，確認即時保護與竄改防護開啟。合法第三方防毒可能讓 Defender 切換模式，不要為了讓兩套同時掃描而強行啟用。\u003c/p>\u003c/article>\u003carticle>\u003ch3>防火牆與網路類型\u003c/h3>\u003cp>防火牆與網路保護中確認各適用網路類型皆有有效防護。外出和不信任網路採公用設定。程式不能連線時先查明原因，再限制範圍新增例外，不要直接關掉整個防火牆。\u003c/p>\u003c/article>\u003carticle>\u003ch3>裝置安全\u003c/h3>\u003cp>檢查安全開機、TPM、核心隔離等裝置安全資訊。記憶體完整性若因舊驅動不相容而無法啟用，先向原廠找更新，不要隨意刪除不明驅動。\u003c/p>\u003c/article>\u003carticle>\u003ch3>裝置加密／BitLocker\u003c/h3>\u003cp>設定中搜尋裝置加密，或搜尋管理 BitLocker。支援程度依版本與硬體而異：Home 可能提供裝置加密，完整 BitLocker 管理另有版本限制。確認磁碟已受保護，並備份對應復原金鑰；不要假設登入 Microsoft 帳號後一定已成功完成加密。\u003c/p>\u003c/article>\u003carticle>\u003ch3>選用：受控資料夾存取\u003c/h3>\u003cp>在勒索軟體防護中可評估開啟。先拿測試資料驗證 Illustrator、ERP 匯出、PDF 輸出與自動化流程。被阻擋時只放行已確認的程式，不把整顆硬碟或下載資料夾加入防毒排除。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s7\">\u003cp class=\"eyebrow\">STEP 07\u003c/p>\u003ch2>Mac：FileVault、更新與隱私權\u003c/h2>\u003cp class=\"intro\">保留系統內建防護，避免為不明軟體繞過 Gatekeeper、停用 SIP 或降低啟動安全性。內建防護並非不會中毒的保證。\u003c/p>\u003carticle>\u003ch3>FileVault\u003c/h3>\u003cp>系統設定 → 隱私權與安全性 → FileVault，確認狀態並依指示啟用。Apple 晶片或 T2 Mac 本身已有儲存加密，FileVault 增加登入憑證對解密存取的保護。依設定選擇可用復原方式並妥善保存；不要只抄下不確定是否對應目前裝置的舊金鑰。\u003c/p>\u003c/article>\u003carticle>\u003ch3>日常帳號可否開機解鎖\u003c/h3>\u003cp>啟用 FileVault 後，確認日常使用者具備可用的磁碟解鎖資格。重新啟動實際測試一次，確保不是只有管理員能解鎖，避免需要使用時才發現無法進入。\u003c/p>\u003c/article>\u003carticle>\u003ch3>敏感權限\u003c/h3>\u003cp>檢查完整磁碟取用權限、輔助使用、螢幕與系統音訊錄製、輸入監控等清單。螢幕共享、遠端管理、遠端登入沒有需求就關閉。合法遠端工具也可能取得大量資料，授權前應確認用途。\u003c/p>\u003c/article>\u003carticle>\u003ch3>備份\u003c/h3>\u003cp>可用 Time Machine 建立版本備份，並依需求加密；另保留不持續連線的副本。Time Machine 不是所有硬體、所有系統版本都能直接複製開機的完整映像，復原流程要依官方工具與實機測試。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s8\">\u003cp class=\"eyebrow\">STEP 08\u003c/p>\u003ch2>Android：Play Protect 與敏感權限\u003c/h2>\u003cp class=\"intro\">優先選仍受原廠安全更新支援的裝置。系統更新、防護開啟、鎖定螢幕與安裝來源管理，比隨意加裝清理工具重要。\u003c/p>\u003carticle>\u003ch3>Play Protect 與認證不同\u003c/h3>\u003cp>Play 商店 → 個人頭像 → Play Protect，確認應用程式掃描功能正常。裝置的 Play Protect 認證通常在 Play 商店 → 設定 → 關於；通過認證和開啟掃描是不同檢查，不能相互替代。\u003c/p>\u003c/article>\u003carticle>\u003ch3>安裝未知 App\u003c/h3>\u003cp>不需要側載時，不對瀏覽器、通訊軟體、檔案管理器授予安裝未知 App 權限。必要的企業 App 先確認開發者、取得管道及管理政策；不要因陌生客服指示安裝 APK。\u003c/p>\u003c/article>\u003carticle>\u003ch3>高風險權限\u003c/h3>\u003cp>輔助使用、裝置管理員、通知存取、VPN、螢幕投放及受限制設定，逐項確認用途。輔助使用可能讓 App 讀取畫面並代操作；不要為領獎、退款、驗證銀行帳戶而授權。\u003c/p>\u003c/article>\u003carticle>\u003ch3>遺失與開機安全\u003c/h3>\u003cp>使用長 PIN 或密碼搭配生物辨識，開啟裝置尋找功能並確認帳號可登入。不為一般日常使用解鎖 Bootloader 或 root。重新上鎖 Bootloader 有資料清除或無法開機風險，只依原廠程序操作。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s9\">\u003cp class=\"eyebrow\">STEP 09\u003c/p>\u003ch2>iPhone：鎖定、尋找與遭竊保護\u003c/h2>\u003cp class=\"intro\">初始設定可選擇不搬入舊資料，之後再決定同步內容。不是所有情況都需要放棄備份還原；來源可信、可管理的備份仍有用途。\u003c/p>\u003carticle>\u003ch3>基本設定\u003c/h3>\u003cp>設定較長的裝置密碼、Face ID／Touch ID，並確認軟體自動更新。到 Apple 帳號確認雙重認證、可信任電話與裝置。勿把裝置密碼告訴他人。\u003c/p>\u003c/article>\u003carticle>\u003ch3>尋找與遭竊裝置防護\u003c/h3>\u003cp>確認尋找功能開啟；若版本支援，於 Face ID／Touch ID 與密碼中檢查遭竊裝置防護。此功能有驗證條件、延遲設定與前置需求，依系統引導完成，不把它當成所有情境都會阻止帳號修改的絕對保證。\u003c/p>\u003c/article>\u003carticle>\u003ch3>描述檔、VPN 與權限\u003c/h3>\u003cp>設定 → 一般 → VPN 與裝置管理，確認沒有不明描述檔；公司 MDM 屬管理機制，不要未經確認就移除。檢查定位、照片、麥克風與相機權限，只提供需要的範圍。\u003c/p>\u003c/article>\u003carticle>\u003ch3>關於防毒 App\u003c/h3>\u003cp>iPhone 的第三方 App 受系統沙箱限制，不能像桌面防毒一樣任意掃描整個系統。網頁過濾、詐騙提醒或 VPN 只是特定功能，不能宣稱裝一套就能完整掃毒。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s10\">\u003cp class=\"eyebrow\">STEP 10\u003c/p>\u003ch2>軟體與工作環境：少裝、少授權\u003c/h2>\u003cp class=\"intro\">先列出必要軟體：瀏覽器、密碼管理器、Adobe、Office、LINE、ERP、備份工具。每安裝一項就驗證一次，留下來源、用途和授權紀錄。\u003c/p>\u003carticle>\u003ch3>下載與瀏覽器擴充\u003c/h3>\u003cp>使用官方商店或原廠網站，不點搜尋廣告中來路不明的下載頁。擴充功能盡量少裝，注意能否讀取所有網站資料。官方來源降低風險，但不等於永遠安全，仍須更新與檢查權限。\u003c/p>\u003c/article>\u003carticle>\u003ch3>遠端控制與網路服務\u003c/h3>\u003cp>無需求不安裝常駐遠端工具；需要時啟用 MFA、限制使用者並保留連線紀錄。不要直接對網際網路開放 RDP、SMB、NAS 管理頁。VPN 或零信任存取也需要修補、驗證與權限管理，並非裝好就無風險。\u003c/p>\u003c/article>\u003carticle>\u003ch3>印刷與 ERP 工作站\u003c/h3>\u003cp>用測試稿驗證 AI／PDF 開啟、字型、外掛、網路印表機、共用資料夾與 ERP 匯出。若舊 RIP 或設備只能用舊系統，規劃網路分段、限制檔案交換與帳號權限，不把它當成一般上網電腦使用。\u003c/p>\u003c/article>\u003carticle>\u003ch3>客戶檔案\u003c/h3>\u003cp>檔名、PDF、Office、壓縮檔都不能因客戶寄來就直接信任。不要開啟外部 Office 文件要求啟用的巨集；不要雙擊偽裝成稿件的執行檔。掃毒通過也不能保證安全。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s11\">\u003cp class=\"eyebrow\">STEP 11\u003c/p>\u003ch2>AI 開發與 API 金鑰\u003c/h2>\u003cp class=\"intro\">開發環境可用獨立專案、測試帳號、虛擬環境或容器，減少測試工具接觸正式資料的範圍。容器與虛擬機不是絕對隔離，掛載主機目錄或給高權限會削弱保護。\u003c/p>\u003carticle>\u003ch3>限制 AI 工具的範圍\u003c/h3>\u003cp>只開放需要的專案資料夾；對外送出資料前移除客戶個資、帳密與機密稿件。執行終端機指令、安裝套件、刪除檔案及對外傳送資料前，保留人工確認。不要給 AI 工具任意管理員權限。\u003c/p>\u003c/article>\u003carticle>\u003ch3>金鑰保存\u003c/h3>\u003cp>測試與正式環境分開金鑰；用服務端秘密管理或適合的環境變數方式，不把秘密放進前端 HTML、JavaScript 或公開 Git。加入 .gitignore 只能避免之後誤加入，不能刪除已提交的歷史秘密。\u003c/p>\u003c/article>\u003carticle>\u003ch3>外洩處理\u003c/h3>\u003cp>立即在供應商服務端撤銷並換新金鑰，檢查使用紀錄與費用。重灌、刪除本機檔案、把 Git 改成私有，都不會讓已外流的金鑰自動失效。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s12\">\u003cp class=\"eyebrow\">STEP 12\u003c/p>\u003ch2>搬資料：分批，先驗證\u003c/h2>\u003cp class=\"intro\">新環境完成防護後再搬資料。保留舊資料的離線副本，不急著刪除唯一來源，也不要把整個舊系統的啟動項目、外掛和設定不加檢查搬回來。\u003c/p>\u003carticle>\u003ch3>搬移順序\u003c/h3>\u003cp>先搬必要文件、照片及工作稿，再搬經確認的設定；程式重新從官方來源安裝。PDF、AI、Office 檔也可能觸發解析漏洞或包含危險內容，所以先更新閱讀軟體，不把「資料檔」理解成絕對安全。\u003c/p>\u003c/article>\u003carticle>\u003ch3>驗收工作流程\u003c/h3>\u003cp>先用複本測試：開啟設計稿、存檔、輸出 PDF、ERP 匯出 CSV、印表機與網路分享。確認沒有缺字、權限不足或安全工具誤擋，再擴大搬移。不要拿唯一正式稿當測試品。\u003c/p>\u003c/article>\u003carticle>\u003ch3>同步也要檢查\u003c/h3>\u003cp>登入雲端後可能同步瀏覽器擴充、設定和檔案。先看同步項目與共享連結，移除不必要內容。同步刪除也可能傳播到其他裝置，所以同步不是獨立備份的替代品。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s13\">\u003cp class=\"eyebrow\">STEP 13\u003c/p>\u003ch2>備份：離線、加密、真正還原過\u003c/h2>\u003cp class=\"intro\">初始復原資料與每天變動的工作資料要分開規劃。備份成功的通知不等於真的可還原。\u003c/p>\u003carticle>\u003ch3>初始復原組合\u003c/h3>\u003cp>保存軟體清單、設定紀錄、授權資訊、官方重建方法及必要備份；Windows 可依合適工具建立系統映像，Mac 依官方復原與移轉流程規劃。不要求所有手機都建立可整機複製的黃金映像。\u003c/p>\u003c/article>\u003carticle>\u003ch3>工作資料備份\u003c/h3>\u003cp>保留多個時間版本，並至少有一份不長期掛載的離線副本，另規劃異地或獨立雲端副本。NAS RAID 解決部分磁碟故障，不取代備份；同帳號可以刪掉的雲端副本仍有共同風險。\u003c/p>\u003c/article>\u003carticle>\u003ch3>加密與離線\u003c/h3>\u003cp>備份含客戶資料應加密，解鎖資訊另外保存。外接硬碟備份完成後安全退出並拔除；長期連線的硬碟可能和主機一起被加密。離線副本還需更新，避免最後可還原版本太舊。\u003c/p>\u003c/article>\u003carticle>\u003ch3>實際測試\u003c/h3>\u003cp>先把一個測試文件備份，改動內容後，再還原舊版到另一資料夾，確認可開啟且內容正確。再測試多檔與資料庫復原；不要直接覆蓋正式資料。從舊映像恢復時，先安裝後續安全更新，再投入工作。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"s14\">\u003cp class=\"eyebrow\">STEP 14\u003c/p>\u003ch2>持續維護與異常處理\u003c/h2>\u003cp class=\"intro\">以下維護週期是實務建議，不是安全合格保證；重要漏洞與異常應立即處理，不要等固定日期。\u003c/p>\u003carticle>\u003ch3>每週／每月\u003c/h3>\u003cp>確認更新、防護警示與備份成功狀態；抽查工作檔還原。每月清查多餘 App、擴充功能及分享連結。重要安全修補依風險及工作測試盡快完成。\u003c/p>\u003c/article>\u003carticle>\u003ch3>每季與重大變更後\u003c/h3>\u003cp>檢查帳號、遠端工具、MFA 備援方式、加密復原金鑰保存位置。測試備份還原，確認更換手機後仍能登入。升級 Adobe、ERP 或 RIP 前先備份並測試相容性。\u003c/p>\u003c/article>\u003carticle>\u003ch3>疑似遭入侵時\u003c/h3>\u003cp>立即拔網路線或停用 Wi-Fi，暫停與共用資料及備份的連線。用另一台可信任裝置保護信箱、登出工作階段並撤銷外洩憑證；保留時間、截圖與日誌，必要時尋求專業協助。不要為了測試而繼續操作受害設備或插上唯一備份。\u003c/p>\u003c/article>\u003carticle>\u003ch3>還原前先找原因\u003c/h3>\u003cp>公司事件可能需要鑑識和通報，不要急著清掉證據。先確認攻擊入口、帳號和其他裝置也已處理，才重建與復原。不要因掃毒顯示無威脅就認定所有問題已解除。\u003c/p>\u003c/article>\u003c/section>\u003csection id=\"checklist\">\u003cp class=\"eyebrow\">ACCEPTANCE\u003c/p>\u003ch2>互動驗收清單\u003c/h2>\u003cp>請依實際設備勾選；不適用的項目不代表設定失敗。進度只是人工檢查紀錄，不是安全掃描或風險評分。\u003c/p>\u003cdiv class=\"tools\">\u003cprogress id=\"progress\" max=\"16\" value=\"0\" aria-label=\"檢查進度\">\u003c/progress>\u003cspan id=\"count\" aria-live=\"polite\">0 / 16\u003c/span>\u003cbutton id=\"clear\">清除勾選\u003c/button>\u003c/div>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>已確認系統與裝置仍受安全更新支援\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>路由器韌體與管理密碼已處理\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>系統、瀏覽器與工作軟體已更新\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>主要信箱和重要帳號已啟用 MFA\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>已清查 Google、Apple、Microsoft、LINE 的登入裝置\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>已備妥獨立的帳號復原方式\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>電腦已分開管理員與日常標準帳號\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>防毒／系統內建防護與防火牆已確認\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>磁碟加密已確認，復原金鑰另外保存\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>手機螢幕鎖、尋找功能與權限已檢查\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>未授權不明遠端工具與高風險 App 權限\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>必要軟體皆從官方來源安裝\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>已用複本驗證 Adobe、ERP、列印與匯出\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>API 金鑰與測試／正式資料已隔離\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>已有離線加密備份\u003c/span>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\">\u003cspan>已實際還原測試文件並確認內容\u003c/span>\u003c/label>\u003cp class=\"small\">勾選只保留於目前頁面，重新整理會清除；需要留底可列印或另存 PDF。請勿在這個 HTML 寫入真正的密碼、金鑰或個資。\u003c/p>\u003c/section>\u003csection id=\"official\">\u003ch2>官方文件入口\u003c/h2>\u003cp>以下為提供進一步核對的官方支援入口，不代表本檔已即時逐頁查核。遇到介面不同、受管理裝置或復原問題，請以目前官方文件為準。\u003c/p>\u003cul>\u003cli>\u003ca href=\"https://www.cisa.gov/stopransomware/ransomware-guide\" target=\"_blank\" rel=\"noopener noreferrer\">CISA：StopRansomware 指南\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.cisa.gov/secure-our-world/turn-mfa\" target=\"_blank\" rel=\"noopener noreferrer\">CISA：多重要素驗證\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://support.apple.com/102766\" target=\"_blank\" rel=\"noopener noreferrer\">Apple：Wi-Fi 路由器建議設定\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://support.apple.com/guide/mac-help/welcome/mac\" target=\"_blank\" rel=\"noopener noreferrer\">Apple：Mac 使用手冊\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://support.apple.com/guide/iphone/welcome/ios\" target=\"_blank\" rel=\"noopener noreferrer\">Apple：iPhone 使用手冊\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://support.microsoft.com/windows\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：Windows 安全性\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://support.google.com/accounts/answer/3067630?hl=zh-Hant\" target=\"_blank\" rel=\"noopener noreferrer\">Google：檢查登入裝置\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://support.google.com/android/answer/12623953?hl=zh-Hant\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Android 受限制設定\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://support.google.com/googleplay/answer/2812853?hl=zh-Hant\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Play Protect\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://help.line.me/line/smartphone/?lang=zh-Hant\" target=\"_blank\" rel=\"noopener noreferrer\">LINE 支援中心\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\u003c/main>\u003c/div>\u003cfooter>乾淨系統安全建置指南 · 建置建議不取代專業事件鑑識或公司管理政策\u003c/footer>\u003cscript>(()=>{const body=document.body;if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)body.classList.add('dark');document.getElementById('theme').addEventListener('click',()=>body.classList.toggle('dark'));document.getElementById('print').addEventListener('click',()=>window.print());const checks=[...document.querySelectorAll('.check input')];function update(){let n=checks.filter(x=>x.checked).length;document.getElementById('progress').value=n;document.getElementById('count').textContent=n+' / '+checks.length;}checks.forEach(x=>x.addEventListener('change',update));document.getElementById('clear').addEventListener('click',()=>{checks.forEach(x=>x.checked=false);update();});})();\u003c/script>\u003c/body>\u003c/html>"},{"title":"AI 程式交接實作指南｜理解・排錯・擴充","path":"讓 AI 說清楚程式：功能、排錯與擴充交接指南Perplexity/AI程式交接-詳細說明.html","snippet":"跳到主要內容 AI / CODE HANDOFF 實作指南首次分析指令下載全部範本列印／另存 PDF目錄 FIELD GUIDE / CONTENTS搜尋章節內容清除篩選01使用這份指南02交付標準與四種需求03交接檔案…","size":102631,"mtime":1793440172819,"html":"\u003c!doctype html>\n\u003chtml lang=\"zh-Hant-TW\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"description\" content=\"AI 程式碼交接的繁體中文實作指南：功能、架構、排錯、擴充、可複製指令、文件範本與人工檢查表。單檔離線閱讀。\">\u003cmeta name=\"theme-color\" content=\"#102c3c\">\u003ctitle>AI 程式交接實作指南｜理解・排錯・擴充\u003c/title>\u003cstyle>\n:root{--bg:#f3f5f7;--paper:#fff;--ink:#1d2d3c;--muted:#5d6d7c;--line:#dde5ea;--accent:#007c70;--navy:#102c3c;--soft:#eaf5f2;--warn:#fff6e6;--shadow:0 8px 32px #172c3d08}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:88px}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 -apple-system,BlinkMacSystemFont,\"Segoe UI\",
