\"#layers\">\u003cspan class=\"nav-n\">02\u003c/span>\u003cspan>分清楚技術的層次\u003c/span>\u003c/a>\u003ca href=\"#questions\">\u003cspan class=\"nav-n\">03\u003c/span>\u003cspan>選型前的七個問題\u003c/span>\u003c/a>\u003ca href=\"#ai-tools\">\u003cspan class=\"nav-n\">04\u003c/span>\u003cspan>AI 開發工具怎麼選\u003c/span>\u003c/a>\u003ca href=\"#models\">\u003cspan class=\"nav-n\">05\u003c/span>\u003cspan>模型選擇與實測\u003c/span>\u003c/a>\u003ca href=\"#languages\">\u003cspan class=\"nav-n\">06\u003c/span>\u003cspan>程式語言選型表\u003c/span>\u003c/a>\u003ca href=\"#frameworks\">\u003cspan class=\"nav-n\">07\u003c/span>\u003cspan>框架與架構要多簡單\u003c/span>\u003c/a>\u003ca href=\"#routes\">\u003cspan class=\"nav-n\">08\u003c/span>\u003cspan>不同程度的起步路線\u003c/span>\u003c/a>\u003ca href=\"#selector\">\u003cspan class=\"nav-n\">09\u003c/span>\u003cspan>互動選型助手\u003c/span>\u003c/a>\u003ca href=\"#communication\">\u003cspan class=\"nav-n\">10\u003c/span>\u003cspan>把需求說成可驗收的工作\u003c/span>\u003c/a>\u003ca href=\"#workflow\">\u003cspan class=\"nav-n\">11\u003c/span>\u003cspan>一次只完成可檢查的一段\u003c/span>\u003c/a>\u003ca href=\"#templates\">\u003cspan class=\"nav-n\">12\u003c/span>\u003cspan>六套可直接複製的範本\u003c/span>\u003c/a>\u003ca href=\"#builder\">\u003cspan class=\"nav-n\">13\u003c/span>\u003cspan>互動需求指令產生器\u003c/span>\u003c/a>\u003ca href=\"#project-files\">\u003cspan class=\"nav-n\">14\u003c/span>\u003cspan>把對話變成專案資料\u003c/span>\u003c/a>\u003ca href=\"#example\">\u003cspan class=\"nav-n\">15\u003c/span>\u003cspan>完整案例：訂單 CSV 驗證\u003c/span>\u003c/a>\u003ca href=\"#testing\">\u003cspan class=\"nav-n\">16\u003c/span>\u003cspan>驗收不只看能不能啟動\u003c/span>\u003c/a>\u003ca href=\"#git\">\u003cspan class=\"nav-n\">17\u003c/span>\u003cspan>版本控制與修壞時的處理\u003c/span>\u003c/a>\u003ca href=\"#security\">\u003cspan class=\"nav-n\">18\u003c/span>\u003cspan>權限、安全與正式資料\u003c/span>\u003c/a>\u003ca href=\"#offline\">\u003cspan class=\"nav-n\">19\u003c/span>\u003cspan>本機與離線要分開看\u003c/span>\u003c/a>\u003ca href=\"#cost\">\u003cspan class=\"nav-n\">20\u003c/span>\u003cspan>費用與交付方式\u003c/span>\u003c/a>\u003ca href=\"#learning\">\u003cspan class=\"nav-n\">21\u003c/span>\u003cspan>與 AI 協作仍要懂什麼\u003c/span>\u003c/a>\u003ca href=\"#checklist\">\u003cspan class=\"nav-n\">22\u003c/span>\u003cspan>可勾選的交付清單\u003c/span>\u003c/a>\u003ca href=\"#glossary\">\u003cspan class=\"nav-n\">23\u003c/span>\u003cspan>名詞與使用說明\u003c/span>\u003c/a>\u003c/nav>\u003cfooter>單一 HTML · 可離線閱讀\u003cbr>整理：2026.10.31\u003c/footer>\u003c/aside>\u003cdiv class=\"mobile-shade\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"layout\">\u003cheader class=\"toolbar\">\u003cbutton class=\"menu\" id=\"menu\" aria-controls=\"sidebar\" aria-expanded=\"false\" type=\"button\">目錄\u003c/button>\u003cdiv class=\"search\">\u003clabel class=\"sr-only\" for=\"search\">搜尋章節內容\u003c/label>\u003cinput type=\"search\" id=\"search\" placeholder=\"搜尋主題：Python、除錯、ERP、範本…\" autocomplete=\"off\">\u003c/div>\u003cspan id=\"search-status\" role=\"status\">23 個章節\u003c/span>\u003cbutton type=\"button\" id=\"clear-search\" aria-label=\"清除搜尋\">清除\u003c/button>\u003cbutton type=\"button\" id=\"theme\" aria-pressed=\"false\" aria-label=\"切換深淺主題\">深色\u003c/button>\u003cbutton type=\"button\" id=\"print\">列印 / PDF\u003c/button>\u003cdiv class=\"readbar\" aria-hidden=\"true\">\u003c/div>\u003c/header>\u003cmain id=\"main\" class=\"container\">\u003cdiv class=\"hero\">\u003cdiv class=\"eyebrow\">PRACTICAL GUIDE · 2026.10\u003c/div>\u003ch1>用 AI 開發軟體與工具\u003cbr>如何選擇，如何正確溝通\u003c/h1>\u003cp>從第一個資料小工具，到 Web、LINE 與 ERP 整合。建立能測試、能回復、能交接的開發方式，不只追求 AI 一次寫出多少程式。\u003c/p>\u003cdiv class=\"chips\">\u003cspan>AI 工具與模型\u003c/span>\u003cspan>語言與框架\u003c/span>\u003cspan>六套可複製範本\u003c/span>\u003cspan>互動指令產生器\u003c/span>\u003cspan>驗收與安全\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"print-note\">此列印版包含完整說明與範本，互動助手請於原始 HTML 使用。\u003c/p>\u003cdiv class=\"quicknav\" aria-label=\"快速前往\">\u003ca href=\"#ai-tools\">選 AI 工具\u003c/a>\u003ca href=\"#languages\">選程式語言\u003c/a>\u003ca href=\"#templates\">直接用範本\u003c/a>\u003ca href=\"#builder\">產生任務指令\u003c/a>\u003ca href=\"#checklist\">交付清單\u003c/a>\u003c/div>\u003cnoscript>\u003cp>JavaScript 已停用：說明與範本仍可閱讀，互動、複製、搜尋與按鈕需啟用 JavaScript；列印可使用瀏覽器功能。\u003c/p>\u003c/noscript>\u003cp id=\"no-results\" hidden>沒有符合的章節。請試較短關鍵字，或按上方「清除」。\u003c/p>\u003csection id=\"start\" aria-labelledby=\"h-start\">\u003cdiv class=\"section-index\">Guide / 01\u003c/div>\u003ch2 id=\"h-start\">先建立正確觀念\u003c/h2>\u003cp class=\"desc\">不是找一個最強的 AI，而是建立能驗證、能回復、能維護的開發方式。\u003c/p>\u003cp class=\"lead\">先決定\u003cstrong>成品、平台、資料與維護方式\u003c/strong>，再選語言與 AI；先定義驗收，才開始讓 AI 修改程式。你負責需求、業務規則與核准，AI 協助分析、實作及測試。\u003c/p>\u003cdiv class=\"cards\">\u003cdiv class=\"card\">\u003ch3>用 AI 開發軟體\u003c/h3>\u003cp>AI 幫忙規劃、寫程式、修錯。成品可以完全沒有模型呼叫，例如 CSV 驗證器、檔名整理器。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>開發有 AI 的軟體\u003c/h3>\u003cp>成品執行時呼叫模型，例如詢價內容擷取、文件問答。另需評估輸出品質、費用、失敗處理與權限。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>同一個專案可有兩種 AI\u003c/h3>\u003cp>開發時使用的程式代理，與產品執行時使用的模型不必相同；不要把兩者的額度及責任混在一起。\u003c/p>\u003c/div>\u003c/div>\u003cp>程式代理不只產生文字，也可能讀檔、改檔、執行命令；操作範圍取決於工具與權限。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://prod.cursor.com/help/ai-features/coding-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Cursor：Agent 的組成 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://geminicli.com/docs/reference/tools/\" target=\"_blank\" rel=\"noopener noreferrer\">Gemini CLI：工具與核准 ↗\u003c/a>\u003c/p>\u003caside class=\"callout info\">\u003cstrong>本文如何閱讀\u003c/strong>\u003cp>「官方能力」附文件連結；「建議」是情境式設計判斷，不是效能保證。文中的 CSV 與工單案例是教學範例，不代表你的正式規格。\u003c/p>\u003c/aside>\u003c/section>\u003csection id=\"layers\" aria-labelledby=\"h-layers\">\u003cdiv class=\"section-index\">Guide / 02\u003c/div>\u003ch2 id=\"h-layers\">分清楚技術的層次\u003c/h2>\u003cp class=\"desc\">模型、開發工具、語言、框架、資料庫與部署不是同一種東西。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">層次\u003c/th>\u003cth scope=\"col\">常見例子\u003c/th>\u003cth scope=\"col\">實際決定什麼\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>模型\u003c/td>\u003ctd>各家程式／推理模型\u003c/td>\u003ctd>理解、推理與生成能力；需用實際任務驗證\u003c/td>\u003c/tr>\u003ctr>\u003ctd>開發工具\u003c/td>\u003ctd>Cursor、Copilot、Claude Code、Codex、Gemini CLI\u003c/td>\u003ctd>如何取得上下文、改檔、執行與審閱\u003c/td>\u003c/tr>\u003ctr>\u003ctd>程式語言\u003c/td>\u003ctd>Python、JavaScript／TypeScript、C#、Dart\u003c/td>\u003ctd>程式寫法、平台整合與維護技能\u003c/td>\u003c/tr>\u003ctr>\u003ctd>框架\u003c/td>\u003ctd>FastAPI、Next.js、Streamlit、Electron、Flutter\u003c/td>\u003ctd>API、畫面、狀態與桌面／手機功能的結構\u003c/td>\u003c/tr>\u003ctr>\u003ctd>資料\u003c/td>\u003ctd>CSV、SQLite、PostgreSQL、既有 ERP\u003c/td>\u003ctd>保存、查詢、多人使用與一致性\u003c/td>\u003c/tr>\u003ctr>\u003ctd>部署\u003c/td>\u003ctd>本機、公司主機、雲端；Docker 等封裝方式\u003c/td>\u003ctd>安裝、更新、網路、權限及備份\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout info\">\u003cstrong>避免分類混淆\u003c/strong>\u003cp>SQL 是資料查詢語言；PostgreSQL 是資料庫；Git 是版本控制；Docker 是封裝與執行環境的工具。它們不能直接拿來取代 Python 或 TypeScript。\u003c/p>\u003c/aside>\u003cp>Cursor 官方將 Agent 分為指令、工具與模型；選模型與選開發環境應分開看。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://prod.cursor.com/help/ai-features/coding-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Cursor：Agent 的組成 ↗\u003c/a>\u003c/p>\u003c/section>\u003csection id=\"questions\" aria-labelledby=\"h-questions\">\u003cdiv class=\"section-index\">Guide / 03\u003c/div>\u003ch2 id=\"h-questions\">選型前的七個問題\u003c/h2>\u003cp class=\"desc\">先回答會改變架構的條件，不要從框架清單開始。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">先問\u003c/th>\u003cth scope=\"col\">請具體回答\u003c/th>\u003cth scope=\"col\">可能改變的決策\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>誰使用？\u003c/td>\u003ctd>自己、內部同事、外部客戶；是否同時操作\u003c/td>\u003ctd>介面、登入、權限、資料庫\u003c/td>\u003c/tr>\u003ctr>\u003ctd>要交付什麼？\u003c/td>\u003ctd>腳本、HTML、網站、桌面安裝檔、手機 App\u003c/td>\u003ctd>語言、框架、打包方式\u003c/td>\u003c/tr>\u003ctr>\u003ctd>在哪裡執行？\u003c/td>\u003ctd>Windows、Mac、手機；公司內網或雲端\u003c/td>\u003ctd>原生整合、主機、連線限制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>資料從哪裡來？\u003c/td>\u003ctd>CSV、PDF、Excel、ERP API；有無個資\u003c/td>\u003ctd>套件、資料流、敏感資訊處理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>哪些不能錯？\u003c/td>\u003ctd>金額、庫存、材料、尺寸、客戶權限\u003c/td>\u003ctd>固定規則、交易、人工核准與測試\u003c/td>\u003c/tr>\u003ctr>\u003ctd>誰維護？\u003c/td>\u003ctd>自己、學生、公司 IT、外包；既有語言\u003c/td>\u003ctd>技術複雜度、文件、可接手性\u003c/td>\u003c/tr>\u003ctr>\u003ctd>成本與限制？\u003c/td>\u003ctd>工具月費、主機、API、離線與備份\u003c/td>\u003ctd>雲端／本機、模型與擴充方式\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout info\">\u003cstrong>不知道時的溝通方式\u003c/strong>\u003cp>直接寫「尚未決定」，要求 AI 分開列出事實、假設與建議；不要讓它把猜測默默變成規格。\u003c/p>\u003c/aside>\u003cdiv class=\"flow\">\u003cspan>需求\u003c/span>\u003cb>→\u003c/b>\u003cspan>平台與資料\u003c/span>\u003cb>→\u003c/b>\u003cspan>語言框架\u003c/span>\u003cb>→\u003c/b>\u003cspan>AI 工具\u003c/span>\u003cb>→\u003c/b>\u003cspan>驗收\u003c/span>\u003c/div>\u003c/section>\u003csection id=\"ai-tools\" aria-labelledby=\"h-ai-tools\">\u003cdiv class=\"section-index\">Guide / 04\u003c/div>\u003ch2 id=\"h-ai-tools\">AI 開發工具怎麼選\u003c/h2>\u003cp class=\"desc\">先選操作方式，再驗證專案能力；本表不是品牌強弱排名。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">工具類型\u003c/th>\u003cth scope=\"col\">適合情境\u003c/th>\u003cth scope=\"col\">能力與選前檢查\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>一般對話介面\u003c/td>\u003ctd>需求拆解、架構討論、解釋錯誤\u003c/td>\u003ctd>是否真有專案檔案與執行權限？不能只憑貼出的片段假設掌握全案\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cursor\u003c/td>\u003ctd>偏好圖形化編輯與差異檢視\u003c/td>\u003ctd>Agent 可使用檔案與終端工具；核對模型、核准設定與額度\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VS Code＋Copilot\u003c/td>\u003ctd>已使用 VS Code，想沿用環境\u003c/td>\u003ctd>Agent 可編輯與執行；Plan 模式可先研究與提案\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Claude Code\u003c/td>\u003ctd>接受終端機與完整專案協作\u003c/td>\u003ctd>使用專案指示與檢查命令；核對檔案、命令與安全設定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Codex\u003c/td>\u003ctd>將任務拆成可審查變更\u003c/td>\u003ctd>核對目前使用模式、環境、沙箱與核准政策\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gemini CLI\u003c/td>\u003ctd>願意以命令列協作\u003c/td>\u003ctd>工具可讀寫檔案與執行 Shell；檢查可信目錄及核准\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Continue＋Ollama\u003c/td>\u003ctd>有本機模型或離線需求\u003c/td>\u003ctd>先確認模型、工具呼叫能力、硬體與是否仍啟用雲端功能\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>上述專案操作、規劃與控制能力可在各工具官方文件確認；不同方案與版本不一定提供相同功能。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://prod.cursor.com/help/ai-features/coding-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Cursor：Agent 的組成 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub：Copilot Agent／Plan 模式 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://code.claude.com/docs/en/best-practices.md\" target=\"_blank\" rel=\"noopener noreferrer\">Claude Code：最佳實踐 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://openai.com/index/running-codex-safely/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAI：Codex 的安全執行 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://geminicli.com/docs/reference/tools/\" target=\"_blank\" rel=\"noopener noreferrer\">Gemini CLI：工具與核准 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://docs.continue.dev/guides/running-continue-without-internet\" target=\"_blank\" rel=\"noopener noreferrer\">Continue：離線設定 ↗\u003c/a>\u003c/p>\u003caside class=\"callout info\">\u003cstrong>起步建議\u003c/strong>\u003cp>一套主要開發工具＋一份可攜的專案規格即可。需要額外角度時再找另一個模型審查，不必先讓多個 Agent 同時改同一批檔案。\u003c/p>\u003c/aside>\u003c/section>\u003csection id=\"models\" aria-labelledby=\"h-models\">\u003cdiv class=\"section-index\">Guide / 05\u003c/div>\u003ch2 id=\"h-models\">模型選擇與實測\u003c/h2>\u003cp class=\"desc\">比較實際任務，不把回答流暢或單次成功當成能力證明。\u003c/p>\u003cp>工具文件建議將快速模型用於日常修改、較強模型用於複雜推理。實際是否划算，仍需用你的專案測試。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://cursor.com/docs/cursor-router\" target=\"_blank\" rel=\"noopener noreferrer\">Cursor：依任務路由模型 ↗\u003c/a>\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">任務\u003c/th>\u003cth scope=\"col\">建議策略\u003c/th>\u003cth scope=\"col\">驗收重點\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>整理需求與說明程式\u003c/td>\u003ctd>先用預設／日常模型\u003c/td>\u003ctd>是否清楚列出假設、限制與缺漏\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小範圍修改\u003c/td>\u003ctd>沿用目前工具，限定檔案與目標\u003c/td>\u003ctd>功能通過，且沒有不相關改動\u003c/td>\u003c/tr>\u003ctr>\u003ctd>難解錯誤、資料結構或權限設計\u003c/td>\u003ctd>比較高推理設定或換一個模型診斷\u003c/td>\u003ctd>原因能否重現，修正是否有回歸測試\u003c/td>\u003c/tr>\u003ctr>\u003ctd>獨立審查\u003c/td>\u003ctd>新工作階段或第二模型，先唯讀\u003c/td>\u003ctd>每項問題有位置、證據與影響，不只意見\u003c/td>\u003c/tr>\u003ctr>\u003ctd>產品內 AI 欄位擷取\u003c/td>\u003ctd>另外建立產品模型評估集\u003c/td>\u003ctd>欄位正確、缺值不猜、格式可驗證、有人工回退\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>同條件試三個任務\u003c/h3>\u003col>\u003cli>在同一個 Git 基準分支新增一個小功能，例如 CSV 錯誤清單匯出。\u003c/li>\u003cli>修復一個已知錯誤，要求先提供能重現的測試。\u003c/li>\u003cli>針對既有功能補上空白、錯誤、邊界與重複資料案例。\u003c/li>\u003c/ol>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">記錄項目\u003c/th>\u003cth scope=\"col\">應保留的證據\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>完成情況\u003c/td>\u003ctd>通過／部分通過／未通過，以及未完成需求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>返工與時間\u003c/td>\u003ctd>補充幾次、人工修正什麼、實際等待與審查時間\u003c/td>\u003c/tr>\u003ctr>\u003ctd>範圍控制\u003c/td>\u003ctd>是否新增套件、修改共用畫面、刪除測試\u003c/td>\u003c/tr>\u003ctr>\u003ctd>費用\u003c/td>\u003ctd>實際帳單或用量記錄，不用猜測的 token 數估成果\u003c/td>\u003c/tr>\u003ctr>\u003ctd>接手能力\u003c/td>\u003ctd>換工作階段後，能否依規格、命令與交接摘要繼續\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout warn\">\u003cstrong>不要只要求 AI 自評\u003c/strong>\u003cp>讓 AI 解釋很有幫助，但不能讓它自行改寫驗收標準，再宣稱全部通過。需求與重要預期結果需由人確認。\u003c/p>\u003c/aside>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://docs.github.com/en/copilot/tutorials/review-ai-generated-code\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub：審查 AI 生成程式 ↗\u003c/a>\u003c/p>\u003c/section>\u003csection id=\"languages\" aria-labelledby=\"h-languages\">\u003cdiv class=\"section-index\">Guide / 06\u003c/div>\u003ch2 id=\"h-languages\">程式語言選型表\u003c/h2>\u003cp class=\"desc\">沒有單一最好語言；平台、套件與維護者比熱門程度更重要。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">成品\u003c/th>\u003cth scope=\"col\">建議起點\u003c/th>\u003cth scope=\"col\">優點與條件\u003c/th>\u003cth scope=\"col\">不要忽略\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>資料、檔案、批次工具\u003c/td>\u003ctd>Python\u003c/td>\u003ctd>先做可測試腳本，需要介面再加 Streamlit\u003c/td>\u003ctd>套件安裝、打包與不同電腦的環境\u003c/td>\u003c/tr>\u003ctr>\u003ctd>網站、後台、客戶入口\u003c/td>\u003ctd>JavaScript → TypeScript\u003c/td>\u003ctd>可搭配 Next.js，逐步學會型別與 Web\u003c/td>\u003ctd>仍需理解 HTTP、驗證、登入與部署\u003c/td>\u003c/tr>\u003ctr>\u003ctd>文件／AI 處理 API\u003c/td>\u003ctd>Python＋FastAPI\u003c/td>\u003ctd>提供 API 與自動介面描述\u003c/td>\u003ctd>長任務、錯誤處理與資料權限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LINE Bot\u003c/td>\u003ctd>Python 或 TypeScript\u003c/td>\u003ctd>配合主系統語言，先避免第二套後端\u003c/td>\u003ctd>Webhook 驗證、重複事件與重試\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Windows 專用桌面\u003c/td>\u003ctd>C#＋.NET／WPF\u003c/td>\u003ctd>對 Windows 桌面需求可優先評估\u003c/td>\u003ctd>WPF 不是跨平台 UI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>跨平台桌面\u003c/td>\u003ctd>TypeScript／JavaScript＋Electron\u003c/td>\u003ctd>沿用 Web 技術建立桌面程式\u003c/td>\u003ctd>封裝、簽章、更新與裝置權限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Android／iOS 跨平台 App\u003c/td>\u003ctd>Dart＋Flutter\u003c/td>\u003ctd>同一程式碼基礎支援多平台\u003c/td>\u003ctd>各平台建置與上架條件仍需處理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>既有企業系統擴充\u003c/td>\u003ctd>沿用原語言與框架\u003c/td>\u003ctd>減少重寫與交接成本\u003c/td>\u003ctd>不要為了 AI 把可運作系統整套翻掉\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>官方資料確認：TypeScript 做靜態型別檢查；WPF 限 Windows；Electron 使用 Web 技術建立桌面程式；Flutter 以 Dart 支援多平台。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://www.typescriptlang.org/docs/handbook/typescript-from-scratch\" target=\"_blank\" rel=\"noopener noreferrer\">TypeScript：語言與型別檢查 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://www.learn.microsoft.com/en-us/dotnet/desktop/wpf/overview/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：WPF 平台限制 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://www.electronjs.org/docs/latest\" target=\"_blank\" rel=\"noopener noreferrer\">Electron：桌面框架 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://dart.dev/multiplatform-apps\" target=\"_blank\" rel=\"noopener noreferrer\">Dart：Flutter 多平台開發 ↗\u003c/a>\u003c/p>\u003caside class=\"callout info\">\u003cstrong>TypeScript 不等於執行時驗證\u003c/strong>\u003cp>型別資訊在編譯後會被移除。來自表單、檔案、API 與資料庫的外部資料，仍須在執行時驗證。\u003c/p>\u003c/aside>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://www.typescriptlang.org/docs/handbook/typescript-from-scratch\" target=\"_blank\" rel=\"noopener noreferrer\">TypeScript：語言與型別檢查 ↗\u003c/a>\u003c/p>\u003c/section>\u003csection id=\"frameworks\" aria-labelledby=\"h-frameworks\">\u003cdiv class=\"section-index\">Guide / 07\u003c/div>\u003ch2 id=\"h-frameworks\">框架與架構要多簡單\u003c/h2>\u003cp class=\"desc\">先選剛好能交付的結構，不因為 AI 寫得快就增加維護負擔。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">方案\u003c/th>\u003cth scope=\"col\">建議用途\u003c/th>\u003cth scope=\"col\">主要取捨\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>HTML＋CSS＋JavaScript\u003c/td>\u003ctd>說明文件、無登入的小計算器、展示原型\u003c/td>\u003ctd>簡單可攜；重要資料保存與多人協作需另設計\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Python 腳本\u003c/td>\u003ctd>檔案整理、轉換、批次驗證\u003c/td>\u003ctd>先驗證核心規則，不急著包成 App\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Python＋Streamlit\u003c/td>\u003ctd>內部資料工具、模型示範、報表操作\u003c/td>\u003ctd>以本機／遠端伺服器提供瀏覽器介面，不是原生桌面\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Python＋FastAPI\u003c/td>\u003ctd>API、文件處理服務\u003c/td>\u003ctd>畫面需另外規劃；不要誤以為加 API 就有完整後台\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TypeScript＋Next.js\u003c/td>\u003ctd>網站、管理介面、客戶入口\u003c/td>\u003ctd>可先一個專案完成，不必立刻拆微服務\u003c/td>\u003c/tr>\u003ctr>\u003ctd>TypeScript Web＋Python API\u003c/td>\u003ctd>同時確有 Web 與 Python 專用處理需求\u003c/td>\u003ctd>增加介面版本、部署、除錯與權限協調成本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Electron\u003c/td>\u003ctd>需要桌面包裝、本機檔案或裝置整合\u003c/td>\u003ctd>不代表自動離線，也不代表不必維護安全更新\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Streamlit 會啟動伺服器並在瀏覽器呈現；FastAPI 可產生 OpenAPI 描述；Next.js 內建 TypeScript 支援；Electron 包含 Chromium 與 Node.js。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://docs.streamlit.io/get-started/fundamentals/main-concepts\" target=\"_blank\" rel=\"noopener noreferrer\">Streamlit：基本運作方式 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://fastapi.tiangolo.com/tutorial/first-steps/\" target=\"_blank\" rel=\"noopener noreferrer\">FastAPI：API 與 OpenAPI ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://nextjs.org/docs/app/getting-started/installation\" target=\"_blank\" rel=\"noopener noreferrer\">Next.js：安裝與 TypeScript ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://www.electronjs.org/docs/latest\" target=\"_blank\" rel=\"noopener noreferrer\">Electron：桌面框架 ↗\u003c/a>\u003c/p>\u003caside class=\"callout info\">\u003cstrong>不必兩種語言一起學\u003c/strong>\u003cp>先用一種語言完成端到端 MVP。只有在實際需求明確、維護成本可接受時，再讓 Python 與 TypeScript 透過 API 分工。\u003c/p>\u003c/aside>\u003c/section>\u003csection id=\"routes\" aria-labelledby=\"h-routes\">\u003cdiv class=\"section-index\">Guide / 08\u003c/div>\u003ch2 id=\"h-routes\">不同程度的起步路線\u003c/h2>\u003cp class=\"desc\">一般初學者與企業流程規劃者，不應使用同一份起步清單。\u003c/p>\u003cdiv class=\"cards\">\u003cdiv class=\"card\">\u003ch3>初學者／一般大學生\u003c/h3>\u003cp>先做一個能解釋、能測試、能展示的作品。工具類先 Python；網站類先 HTML／CSS／JavaScript，再加 TypeScript。不要第一週就學資料庫、Docker、RAG 與微服務全部。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>懂流程、主要讓 AI 寫程式\u003c/h3>\u003cp>重心放在資料欄位、業務規則、驗收、版本與部署。每次要求 AI 解釋資料流與改動原因；不理解的高風險部分先暫停。\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3>已有程式能力\u003c/h3>\u003cp>用 AI 做定位、重構提案、測試與文件；自己掌握架構、公開介面與安全。將常用命令與規則放進專案指示，減少反覆貼上下文。\u003c/p>\u003c/div>\u003c/div>\u003ch3>企業與印刷場景的階段\u003c/h3>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">階段\u003c/th>\u003cth scope=\"col\">建議交付\u003c/th>\u003cth scope=\"col\">暫緩項目\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>單一工作驗證\u003c/td>\u003ctd>CSV 驗證／尺寸整理／文件清單工具\u003c/td>\u003ctd>正式 ERP 寫入與自動報價\u003c/td>\u003c/tr>\u003ctr>\u003ctd>多人操作\u003c/td>\u003ctd>登入、表單、查詢、權限、資料庫與備份\u003c/td>\u003ctd>沒有必要的複雜 Agent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>系統串接\u003c/td>\u003ctd>先測試 API 與唯讀查詢，觀察紀錄\u003c/td>\u003ctd>正式資料庫管理權限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AI 輔助\u003c/td>\u003ctd>文字擷取、候選值與人工確認\u003c/td>\u003ctd>AI 自行決定價格、庫存與授權\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout info\">\u003cstrong>共同底線\u003c/strong>\u003cp>每個階段都要能說明：資料從哪裡來、規則在哪裡、如何測試、出錯如何回復、誰能接手。\u003c/p>\u003c/aside>\u003c/section>\u003csection id=\"selector\" aria-labelledby=\"h-selector\">\u003cdiv class=\"section-index\">Guide / 09\u003c/div>\u003ch2 id=\"h-selector\">互動選型助手\u003c/h2>\u003cp class=\"desc\">依成品與限制，產生起步建議；這是固定決策規則，不會呼叫 AI 或上傳資料。\u003c/p>\u003cdiv class=\"widget\">\u003cdiv class=\"form-grid\">\u003clabel>你想交付什麼？\u003cselect id=\"sel-product\">\u003coption value=\"data\">資料／文件／CSV 小工具\u003c/option>\u003coption value=\"web\">網站／後台／客戶入口\u003c/option>\u003coption value=\"line\">LINE Bot 與系統串接\u003c/option>\u003coption value=\"desktop\">跨平台桌面工具\u003c/option>\u003coption value=\"windows\">Windows 專用桌面\u003c/option>\u003coption value=\"mobile\">Android／iOS App\u003c/option>\u003coption value=\"existing\">擴充既有系統\u003c/option>\u003c/select>\u003c/label>\u003clabel>主要協作方式\u003cselect id=\"sel-style\">\u003coption value=\"gui\">圖形介面，想看修改差異\u003c/option>\u003coption value=\"cli\">可用終端機\u003c/option>\u003coption value=\"local\">需要本機模型／離線開發\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003clabel class=\"checkline\">\u003cinput type=\"checkbox\" id=\"sel-risk\">會修改正式資料、金額、庫存或重要權限\u003c/label>\u003cbutton class=\"primary\" id=\"recommend\" type=\"button\">產生起步建議\u003c/button>\u003cdiv id=\"recommend-output\" class=\"result\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003caside class=\"callout info\">\u003cstrong>使用方式\u003c/strong>\u003cp>這個助手只幫你縮小範圍，不會替代效能實測、資安審查或平台相容性驗證。硬體、預算、既有程式與維護者仍需再確認。\u003c/p>\u003c/aside>\u003c/section>\u003csection id=\"communication\" aria-labelledby=\"h-communication\">\u003cdiv class=\"section-index\">Guide / 10\u003c/div>\u003ch2 id=\"h-communication\">把需求說成可驗收的工作\u003c/h2>\u003cp class=\"desc\">自然語言可以很精確，關鍵是提供可檢查的條件。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">欄位\u003c/th>\u003cth scope=\"col\">需要說清楚\u003c/th>\u003cth scope=\"col\">例子\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>目的\u003c/td>\u003ctd>誰使用、要減少什麼工作\u003c/td>\u003ctd>業務匯入詢價資料，先找出錯誤欄位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>現況\u003c/td>\u003ctd>版本、相關檔案、資料表、既有行為\u003c/td>\u003ctd>目前只有 CSV，尚未連 ERP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>範圍\u003c/td>\u003ctd>本次必做與不做\u003c/td>\u003ctd>只驗證與匯出錯誤，不做報價、付款\u003c/td>\u003c/tr>\u003ctr>\u003ctd>輸入輸出\u003c/td>\u003ctd>格式、欄位、編碼、範例與空值\u003c/td>\u003ctd>尺寸為 mm；錯誤輸出保留原列號\u003c/td>\u003c/tr>\u003ctr>\u003ctd>規則\u003c/td>\u003ctd>計算、單位、狀態、權限\u003c/td>\u003ctd>尺寸必須正數；缺單位不得猜\u003c/td>\u003c/tr>\u003ctr>\u003ctd>限制\u003c/td>\u003ctd>不能改什麼、不能連什麼\u003c/td>\u003ctd>不覆寫原檔、不操作正式資料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>驗收\u003c/td>\u003ctd>正常與錯誤資料的預期結果\u003c/td>\u003ctd>非法資料出現在錯誤清單且不進下一步\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交付\u003c/td>\u003ctd>成品、文件、命令、限制\u003c/td>\u003ctd>README、測試、設定範本與未驗證項目\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>不夠明確與可執行的差別\u003c/h3>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">避免這樣說\u003c/th>\u003cth scope=\"col\">建議改成\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>幫我做完整報價系統\u003c/td>\u003ctd>本次只做詢價表單與列表；價格規則另案，先不要寫程式\u003c/td>\u003c/tr>\u003ctr>\u003ctd>介面漂亮一點\u003c/td>\u003ctd>桌面顯示表格、手機顯示卡片；每筆列出狀態與更新時間；先給版型\u003c/td>\u003c/tr>\u003ctr>\u003ctd>程式壞了，修好\u003c/td>\u003ctd>附環境、重現步驟、預期、實際、完整錯誤與最近異動\u003c/td>\u003c/tr>\u003ctr>\u003ctd>順便優化所有程式\u003c/td>\u003ctd>先唯讀列出問題及影響；本次只修指定缺陷，不改公開介面\u003c/td>\u003c/tr>\u003ctr>\u003ctd>你測一下就好\u003c/td>\u003ctd>列出實際執行命令、輸出、失敗項目及沒有執行的檢查\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout info\">\u003cstrong>三種資訊要分開\u003c/strong>\u003cp>事實＝已確認的環境與需求；假設＝尚待確認的條件；建議＝可選的做法。讓 AI 明確標示，避免建議被當成你已核准的規格。\u003c/p>\u003c/aside>\u003cp>官方實務重視明確規格與驗證證據；審查時仍需檢查需求是否完整實作。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://code.claude.com/docs/en/best-practices.md\" target=\"_blank\" rel=\"noopener noreferrer\">Claude Code：最佳實踐 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://docs.github.com/en/copilot/tutorials/review-ai-generated-code\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub：審查 AI 生成程式 ↗\u003c/a>\u003c/p>\u003c/section>\u003csection id=\"workflow\" aria-labelledby=\"h-workflow\">\u003cdiv class=\"section-index\">Guide / 11\u003c/div>\u003ch2 id=\"h-workflow\">一次只完成可檢查的一段\u003c/h2>\u003cp class=\"desc\">先讀、先計畫、再修改；不是把整套系統一次丟給 AI。\u003c/p>\u003cdiv class=\"steps\">\u003carticle>\u003cb>01\u003c/b>\u003cdiv>\u003ch3>描述最小成果\u003c/h3>\u003cp>把「做 ERP」縮成「匯入詢價 CSV 並顯示錯誤」。定義不做的範圍。\u003c/p>\u003c/div>\u003c/article>\u003carticle>\u003cb>02\u003c/b>\u003cdiv>\u003ch3>補齊規格與測試資料\u003c/h3>\u003cp>由人確認欄位、預期結果與錯誤情境。測試資料要去識別化。\u003c/p>\u003c/div>\u003c/article>\u003carticle>\u003cb>03\u003c/b>\u003cdiv>\u003ch3>要求唯讀計畫\u003c/h3>\u003cp>先讀專案、列異動檔案、必要套件及驗收。核准前不修改。\u003c/p>\u003c/div>\u003c/article>\u003carticle>\u003cb>04\u003c/b>\u003cdiv>\u003ch3>保留基準再實作\u003c/h3>\u003cp>使用 Git 分支／提交，確認沒有需要保留的未提交工作。限制本次修改範圍。\u003c/p>\u003c/div>\u003c/article>\u003carticle>\u003cb>05\u003c/b>\u003cdiv>\u003ch3>執行檢查並看 diff\u003c/h3>\u003cp>建置、型別檢查、測試與需求逐項對照。不接受以跳過測試換取通過。\u003c/p>\u003c/div>\u003c/article>\u003carticle>\u003cb>06\u003c/b>\u003cdiv>\u003ch3>人工試用與交接\u003c/h3>\u003cp>依真實流程操作、檢查錯誤與復原，最後更新文件、限制與下一步。\u003c/p>\u003c/div>\u003c/article>\u003c/div>\u003caside class=\"callout info\">\u003cstrong>每次任務的合理大小\u003c/strong>\u003cp>以能獨立驗收為準，不用固定以檔案數或程式行數切割。一個功能可能涉及多個檔案，但不應混進多個無關需求。\u003c/p>\u003c/aside>\u003cp>Copilot 支援先提出計畫再改程式；官方審查文件要求先執行檢查，再做需求與程式審閱。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub：Copilot Agent／Plan 模式 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://docs.github.com/en/copilot/tutorials/review-ai-generated-code\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub：審查 AI 生成程式 ↗\u003c/a>\u003c/p>\u003c/section>\u003csection id=\"templates\" aria-labelledby=\"h-templates\">\u003cdiv class=\"section-index\">Guide / 12\u003c/div>\u003ch2 id=\"h-templates\">六套可直接複製的範本\u003c/h2>\u003cp class=\"desc\">每份範本都可以獨立使用；方括號是需要你補齊的資訊。\u003c/p>\u003ch3>選型與規劃\u003c/h3>\u003cdiv class=\"codebox\">\u003cdiv class=\"codebar\">\u003cspan>選型與規劃\u003c/span>\u003cbutton class=\"copy-btn\" type=\"button\">複製內容\u003c/button>\u003c/div>\u003cpre>\u003ccode>我要開發：[工作與使用者]。\n\n目前狀況：\n- 我的程式能力：[程度]\n- 使用人員與操作方式：[單人／多人，是否同時操作]\n- 平台：[Windows／Mac／手機／瀏覽器]\n- 部署：[本機／內網／雲端，是否離線]\n- 資料來源與敏感性：[CSV、PDF、ERP、個資等]\n- 既有技術與維護者：[不知道就寫不知道]\n- 預算：[開發工具、主機、模型 API 分開]\n\n本次必做：[功能]\n本次不做：[排除項目]\n\n先不要寫程式，也不要修改檔案。\n1. 列出會影響選型的缺漏資訊。\n2. 比較兩個最簡方案，說明取捨與維護成本。\n3. 推薦一個 MVP，列語言、框架、資料與部署理由。\n4. 區分已確認事實、假設與建議。\n5. 列驗收條件，等待我確認。\u003c/code>\u003c/pre>\u003c/div>\u003ch3>限定範圍實作\u003c/h3>\u003cdiv class=\"codebox\">\u003cdiv class=\"codebar\">\u003cspan>限定範圍實作\u003c/span>\u003cbutton class=\"copy-btn\" type=\"button\">複製內容\u003c/button>\u003c/div>\u003cpre>\u003ccode>先閱讀 SPEC.md、README.md、相關程式與測試。\n目標：[本次唯一要完成的功能]。\n輸入範例：[資料或路徑]\n輸出範例：[具體預期]\n業務規則：[必填、單位、狀態、錯誤處理]\n\n限制：\n- 只改本次必要部分，不順便重構。\n- 不新增套件；必要時先說明名稱、用途、版本與替代方式。\n- 不改資料表、公開 API 或共用畫面，除非先核准。\n- 不刪除、跳過或弱化測試來取得通過。\n- 只用開發環境與測試資料，不操作正式資料。\n- 不自行部署、推送、安裝全域工具或新增付費資源。\n\n先列計畫、異動檔案與驗收測試，確認後實作。\n完成後列異動內容、實際命令、測試結果、未執行項目與限制。\n沒有執行環境就明確寫未驗證，不得假稱測試通過。\u003c/code>\u003c/pre>\u003c/div>\u003ch3>精確錯誤回報\u003c/h3>\u003cdiv class=\"codebox\">\u003cdiv class=\"codebar\">\u003cspan>精確錯誤回報\u003c/span>\u003cbutton class=\"copy-btn\" type=\"button\">複製內容\u003c/button>\u003c/div>\u003cpre>\u003ccode>先診斷，不要立刻重寫整個模組。\n環境：[OS、語言、框架、套件版本]\n專案版本：[commit 或可辨識版本]\n重現步驟：[依序操作]\n預期結果：[應發生什麼]\n實際結果：[實際發生什麼]\n完整錯誤：[文字紀錄，先遮蔽密鑰及個資]\n相關檔案：[路徑]\n最近變更：[改了什麼]\n已嘗試：[方法與結果]\n\n區分事實、假設與待驗證項目。\n先提出最小診斷步驟，必要時先加觀測與紀錄。\n建立能重現問題的測試，再做最小修正與回歸測試。\n若需要破壞性操作或資料遷移，先停止並等待核准。\u003c/code>\u003c/pre>\u003c/div>\u003ch3>獨立唯讀審查\u003c/h3>\u003cdiv class=\"codebox\">\u003cdiv class=\"codebar\">\u003cspan>獨立唯讀審查\u003c/span>\u003cbutton class=\"copy-btn\" type=\"button\">複製內容\u003c/button>\u003c/div>\u003cpre>\u003ccode>以唯讀方式審查目前 diff，先不要修改程式。\n依 SPEC.md 與驗收條件檢查：\n- 是否完整實作，是否增加未要求功能。\n- 權限、敏感資料、錯誤處理、重試及邊界條件。\n- 套件與 API 是否存在，版本是否相容。\n- 是否刪除、跳過測試或減弱驗收。\n- 文件、設定與啟動方式是否仍正確。\n\n每項發現附：路徑、位置、重現／證據、影響、建議與嚴重程度。\n不能確認的標為待驗證，不把猜測當缺陷。\n先報影響正確性與安全的問題，不只挑排版或個人風格。\u003c/code>\u003c/pre>\u003c/div>\u003ch3>介面修改\u003c/h3>\u003cdiv class=\"codebox\">\u003cdiv class=\"codebar\">\u003cspan>介面修改\u003c/span>\u003cbutton class=\"copy-btn\" type=\"button\">複製內容\u003c/button>\u003c/div>\u003cpre>\u003ccode>本次只修改：[指定頁面與元件]。\n參考：[附自己的畫面或可使用的設計說明]\n目標裝置：[桌面／手機／兩者]\n需要保留：[欄位、文字、按鈕、互動與既有 API]\n要改的部分：[版面、間距、狀態顯示、錯誤提示等]\n\n先列出版面與互動方案，不先改程式。\n確認後只修改必要檔案，不更名欄位、不改業務邏輯。\n驗證：鍵盤操作、標籤、空資料、錯誤、載入中、長文字與小螢幕。\n如有瀏覽器工具，實際開啟並提供結果；沒有就列為未驗證。\n不要把靜態截圖當成所有互動已通過。\u003c/code>\u003c/pre>\u003c/div>\u003ch3>交接與部署前確認\u003c/h3>\u003cdiv class=\"codebox\">\u003cdiv class=\"codebar\">\u003cspan>交接與部署前確認\u003c/span>\u003cbutton class=\"copy-btn\" type=\"button\">複製內容\u003c/button>\u003c/div>\u003cpre>\u003ccode>請建立交接摘要，不修改功能、不包含密鑰與客戶資料。\n1. 目前分支、commit 與尚未提交異動。\n2. 本次目標、已完成、未完成與規格變更。\n3. 安裝、啟動、測試與建置的實際命令。\n4. 實際執行結果，以及未驗證項目。\n5. 環境變數名稱、資料位置與備份還原方式。\n6. 已知限制、失敗嘗試與診斷證據。\n7. 下一個最小任務與需要人工決定事項。\n\n請標示文件是否已更新；若指示互相衝突，列出而不要自行選擇。\n若要部署，先提供部署、驗收及回復方案，等待我核准。\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"callout warn\">\u003cstrong>範本是協作約定，不是強制防護\u003c/strong>\u003cp>提示詞之外，仍需權限、沙箱與核准設定。套用前要確認工具確實載入相關檔案。\u003c/p>\u003c/aside>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://openai.com/index/running-codex-safely/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAI：Codex 的安全執行 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://code.claude.com/docs/en/memory\" target=\"_blank\" rel=\"noopener noreferrer\">Claude Code：專案指示與記憶 ↗\u003c/a>\u003c/p>\u003c/section>\u003csection id=\"builder\" aria-labelledby=\"h-builder\">\u003cdiv class=\"section-index\">Guide / 13\u003c/div>\u003ch2 id=\"h-builder\">互動需求指令產生器\u003c/h2>\u003cp class=\"desc\">填入自己的情境，產生可複製或下載的任務文字；所有處理都在此頁面內完成。\u003c/p>\u003cdiv class=\"widget\">\u003cdiv class=\"form-grid\">\u003clabel>專案與目的\u003cinput id=\"p-title\" value=\"訂單 CSV 驗證工具\" maxlength=\"250\">\u003c/label>\u003clabel>使用者與平台\u003cinput id=\"p-users\" value=\"內部業務；先在 Mac／Windows 本機使用\" maxlength=\"300\">\u003c/label>\u003clabel>現況與既有技術\u003cinput id=\"p-current\" placeholder=\"例如：只有 CSV；尚未選語言\" maxlength=\"500\">\u003c/label>\u003clabel>部署與離線限制\u003cinput id=\"p-deploy\" value=\"先本機測試，不連正式 ERP\" maxlength=\"400\">\u003c/label>\u003c/div>\u003clabel>本次必做\u003ctextarea id=\"p-do\" rows=\"3\">匯入 CSV、檢查欄位、顯示列號與錯誤、匯出錯誤清單\u003c/textarea>\u003c/label>\u003clabel>本次不做\u003ctextarea id=\"p-not\" rows=\"2\">不做報價、付款、登入及 ERP 寫入\u003c/textarea>\u003c/label>\u003cdiv class=\"form-grid\">\u003clabel>輸入、欄位與規則\u003ctextarea id=\"p-rules\" rows=\"4\">欄位與範例尚待確認；尺寸單位為 mm，缺值不得猜測，不改原始檔\u003c/textarea>\u003c/label>\u003clabel>驗收條件\u003ctextarea id=\"p-tests\" rows=\"4\">有效資料可通過；錯誤顯示原列號與原因；匯出內容一致；空檔及缺欄不當機\u003c/textarea>\u003c/label>\u003c/div>\u003clabel>任務階段\u003cselect id=\"p-phase\">\u003coption value=\"plan\">先規劃，不修改檔案\u003c/option>\u003coption value=\"implement\">已確認需求，先列實作計畫\u003c/option>\u003coption value=\"review\">先唯讀審查，不修改程式\u003c/option>\u003c/select>\u003c/label>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" id=\"build-prompt\" type=\"button\">產生指令\u003c/button>\u003cbutton id=\"copy-prompt\" type=\"button\">複製結果\u003c/button>\u003cbutton id=\"download-prompt\" type=\"button\">下載 .txt\u003c/button>\u003c/div>\u003clabel>產生結果\u003ctextarea id=\"prompt-output\" rows=\"16\" readonly aria-describedby=\"builder-note\">\u003c/textarea>\u003c/label>\u003cp id=\"builder-note\" class=\"fine\">這是固定文字範本產生器，不會替你檢查業務規格是否合理。頁面重新整理後，請勿假設資料會保留；重要內容請下載。\u003c/p>\u003c/div>\u003c/section>\u003csection id=\"project-files\" aria-labelledby=\"h-project-files\">\u003cdiv class=\"section-index\">Guide / 14\u003c/div>\u003ch2 id=\"h-project-files\">把對話變成專案資料\u003c/h2>\u003cp class=\"desc\">跨工作階段的依據應是版本、規格與測試，不只是聊天記憶。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">文件\u003c/th>\u003cth scope=\"col\">建議內容\u003c/th>\u003cth scope=\"col\">注意事項\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>README.md\u003c/td>\u003ctd>環境、安裝、啟動、測試、建置、資料位置\u003c/td>\u003ctd>依乾淨環境實際驗證，不只貼理想命令\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SPEC.md\u003c/td>\u003ctd>目的、範圍、欄位、規則、驗收、非目標\u003c/td>\u003ctd>規格變更需核准並同步測試\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AI 專案指示\u003c/td>\u003ctd>測試命令、命名慣例、不可任意修改項目\u003c/td>\u003ctd>簡短、具體，不當作安全防線\u003c/td>\u003c/tr>\u003ctr>\u003ctd>.env.example\u003c/td>\u003ctd>環境變數名稱及無效示例\u003c/td>\u003ctd>不含真實密鑰；.env 也不是自動安全\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tests/\u003c/td>\u003ctd>正常、錯誤、邊界、權限與重複操作案例\u003c/td>\u003ctd>重點預期值由人確認\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交接摘要／任務記錄\u003c/td>\u003ctd>目前版本、決策、未完成、已知限制\u003c/td>\u003ctd>不把失敗嘗試遺失，避免重走死路\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Codex 可使用 AGENTS.md；Claude Code 有 CLAUDE.md，並依版本與設定支援 AGENTS.md。指示檔的實際載入範圍要確認。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://developers.openai.com/cookbook/articles/codex_exec_plans\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAI：AGENTS.md 與執行計畫 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://code.claude.com/docs/en/memory\" target=\"_blank\" rel=\"noopener noreferrer\">Claude Code：專案指示與記憶 ↗\u003c/a>\u003c/p>\u003cdiv class=\"codebox\">\u003cdiv class=\"codebar\">\u003cspan>專案指示內容示例\u003c/span>\u003cbutton class=\"copy-btn\" type=\"button\">複製內容\u003c/button>\u003c/div>\u003cpre>\u003ccode># 專案協作規則（示例，命令須按專案實際設定）\n- 使用台灣繁體中文回覆，保留既有程式命名。\n- 先閱讀 SPEC.md、README.md 與相關測試。\n- 不修改正式資料、不自行部署或推送。\n- 本次只改核准範圍，必要重構先提出。\n- 不新增套件、變更資料表或公開 API，除非先核准。\n- 不刪除、跳過測試來掩蓋失敗。\n- 完成時列實際命令、結果與未測項目。\n- 敏感檔案以工具／OS 權限另行阻擋，不靠此文件保護。\n\n# 命令索引\n請從本專案 README 的「開發與測試」章節取得已核對命令。\n若命令不存在或失敗，回報，不自行捏造通過。\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"callout info\">\u003cstrong>不要把記憶檔寫成大百科\u003c/strong>\u003cp>固定規則放指示；多步驟工作流程放可重用的 Skill 或文件；特定模組知識另外分檔。避免不同工具的規則彼此矛盾。\u003c/p>\u003c/aside>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://code.claude.com/docs/en/best-practices.md\" target=\"_blank\" rel=\"noopener noreferrer\">Claude Code：最佳實踐 ↗\u003c/a>\u003c/p>\u003c/section>\u003csection id=\"example\" aria-labelledby=\"h-example\">\u003cdiv class=\"section-index\">Guide / 15\u003c/div>\u003ch2 id=\"h-example\">完整案例：訂單 CSV 驗證\u003c/h2>\u003cp class=\"desc\">以下為教學規格示例，欄位與限制需要你確認後才可用於正式作業。\u003c/p>\u003ch3>把任務縮成可交付版本\u003c/h3>\u003cp>目的：在資料進入工單前先找出缺欄、非法尺寸與重複識別碼。本次只驗證與匯出，不寫 ERP、不自動報價、不覆寫來源。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">欄位（示例）\u003c/th>\u003cth scope=\"col\">規則（示例）\u003c/th>\u003cth scope=\"col\">還需要確認\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>order_id\u003c/td>\u003ctd>必填，視為文字以保留前導零；檔案內不得重複\u003c/td>\u003ctd>大小寫、前後空白及跨檔案重複如何處理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>customer_code\u003c/td>\u003ctd>必填，視為代碼，不自行推測客戶\u003c/td>\u003ctd>是否驗證代碼存在；缺代碼能否人工補\u003c/td>\u003c/tr>\u003ctr>\u003ctd>width_mm／height_mm\u003c/td>\u003ctd>正數；不把空白或無法解析值轉為 0\u003c/td>\u003ctd>小數精度、上限、是否為成品／含出血尺寸\u003c/td>\u003c/tr>\u003ctr>\u003ctd>quantity\u003c/td>\u003ctd>正整數；不能默認忽略非法符號\u003c/td>\u003ctd>枚／張／卷／組，是否可千分位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>material_code\u003c/td>\u003ctd>保留原碼；未知值不猜測\u003c/td>\u003ctd>材料字典來源、版本與停用規則\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>先定義三種輸出\u003c/h3>\u003cul>\u003cli>\u003cstrong>摘要：\u003c/strong>原始資料筆數、通過筆數、失敗筆數。定義是否排除標題與全空白列。\u003c/li>\u003cli>\u003cstrong>逐欄錯誤：\u003c/strong>來源列號、欄位、原值、原因；一列可包含多個欄位錯誤。\u003c/li>\u003cli>\u003cstrong>匯出：\u003c/strong>保留識別碼與原列號；約定 UTF-8 或 UTF-8 BOM、欄位順序及危險內容處理。\u003c/li>\u003c/ul>\u003cp>CSV 重新由試算表開啟時，使用者輸入的公式起始字元可能需要安全處理；應事先定義匯出策略，不默默改動原始資料。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/07-Injection/21-CSV_Injection/\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：CSV 公式注入 ↗\u003c/a>\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">測試情境\u003c/th>\u003cth scope=\"col\">預期結果（示例）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>有效資料\u003c/td>\u003ctd>通過，字串代碼與前導零保留\u003c/td>\u003c/tr>\u003ctr>\u003ctd>必要欄缺失\u003c/td>\u003ctd>整檔拒絕並指出欄名，不默默套用預設\u003c/td>\u003c/tr>\u003ctr>\u003ctd>負尺寸或零數量\u003c/td>\u003ctd>列為錯誤，指出欄位與原值\u003c/td>\u003c/tr>\u003ctr>\u003ctd>數量為小數\u003c/td>\u003ctd>拒絕，不自動四捨五入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>重複 order_id\u003c/td>\u003ctd>標出相關列，不自動覆蓋前一筆\u003c/td>\u003c/tr>\u003ctr>\u003ctd>僅標題或空檔\u003c/td>\u003ctd>明確顯示無資料／格式錯誤，不當機\u003c/td>\u003c/tr>\u003ctr>\u003ctd>無法解碼或破損 CSV\u003c/td>\u003ctd>顯示可理解錯誤，不擅自更改來源檔\u003c/td>\u003c/tr>\u003ctr>\u003ctd>匯出後重新檢查\u003c/td>\u003ctd>欄位順序、編碼、筆數與錯誤內容符合規格\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout info\">\u003cstrong>列號必須先約定\u003c/strong>\u003cp>建議保留讀取器對應的來源紀錄位置。CSV 欄位可能含換行，因此「第幾筆紀錄」不必然等於「文字檔第幾行」。避免畫面與匯出指向不同位置。\u003c/p>\u003c/aside>\u003ch3>建議開發順序\u003c/h3>\u003col>\u003cli>先完成純驗證函式與固定輸入輸出的測試。\u003c/li>\u003cli>再加入讀檔、格式錯誤與匯出。\u003c/li>\u003cli>最後才加操作介面，測試重複匯入及清除狀態。\u003c/li>\u003cli>以去識別化的實際檔案試用，更新規格與限制。\u003c/li>\u003c/ol>\u003c/section>\u003csection id=\"testing\" aria-labelledby=\"h-testing\">\u003cdiv class=\"section-index\">Guide / 16\u003c/div>\u003ch2 id=\"h-testing\">驗收不只看能不能啟動\u003c/h2>\u003cp class=\"desc\">測試、型別檢查、安全掃描與人工操作各自覆蓋不同風險。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">層次\u003c/th>\u003cth scope=\"col\">檢查什麼\u003c/th>\u003cth scope=\"col\">例子\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>安裝與建置\u003c/td>\u003ctd>乾淨環境可重現\u003c/td>\u003ctd>依 README 安裝，不依賴開發者私有設定\u003c/td>\u003c/tr>\u003ctr>\u003ctd>靜態／型別檢查\u003c/td>\u003ctd>語法、型別及工具可抓的問題\u003c/td>\u003ctd>TypeScript 不用 any 一路繞過檢查\u003c/td>\u003c/tr>\u003ctr>\u003ctd>單元測試\u003c/td>\u003ctd>單一規則的正常與邊界行為\u003c/td>\u003ctd>缺值、零、負值、小數與極端輸入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>整合測試\u003c/td>\u003ctd>模組、資料庫與 API 配合\u003c/td>\u003ctd>儲存失敗不能回傳成功\u003c/td>\u003c/tr>\u003ctr>\u003ctd>端到端測試\u003c/td>\u003ctd>真實操作路徑\u003c/td>\u003ctd>匯入→顯示錯誤→下載→重新核對\u003c/td>\u003c/tr>\u003ctr>\u003ctd>權限與安全\u003c/td>\u003ctd>越權、洩密與不可信輸入\u003c/td>\u003ctd>客戶 A 不能查到客戶 B 的訂單\u003c/td>\u003c/tr>\u003ctr>\u003ctd>復原與重試\u003c/td>\u003ctd>重複、故障、備份與還原\u003c/td>\u003ctd>同一請求重送不重複建單\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>GitHub 官方提醒審查 AI 程式中的虛構 API、可疑依賴及遭跳過的測試，並先執行自動檢查。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://docs.github.com/en/copilot/tutorials/review-ai-generated-code\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub：審查 AI 生成程式 ↗\u003c/a>\u003c/p>\u003cdiv class=\"codebox\">\u003cdiv class=\"codebar\">\u003cspan>要求 AI 提供的驗證證據\u003c/span>\u003cbutton class=\"copy-btn\" type=\"button\">複製內容\u003c/button>\u003c/div>\u003cpre>\u003ccode>交付驗證紀錄（請按實際結果填寫）\n- 專案版本／commit：\n- 執行環境與重要版本：\n- 實際命令：\n- 結束狀態與輸出摘要：\n- 通過／失敗的案例：\n- 本次未執行項目與原因：\n- 人工試用項目與觀察：\n- 規格仍有疑問的地方：\n- 已知限制與後續處理：\u003c/code>\u003c/pre>\u003c/div>\u003caside class=\"callout warn\">\u003cstrong>失敗本身不是壞事，掩蓋失敗才危險\u003c/strong>\u003cp>環境缺資料庫、沒有瀏覽器或無法安裝套件時，應列為未驗證；不可只用語法檢查就宣稱整套流程正確。\u003c/p>\u003c/aside>\u003c/section>\u003csection id=\"git\" aria-labelledby=\"h-git\">\u003cdiv class=\"section-index\">Guide / 17\u003c/div>\u003ch2 id=\"h-git\">版本控制與修壞時的處理\u003c/h2>\u003cp class=\"desc\">先保護既有工作，才能安心讓 AI 小步修改。\u003c/p>\u003cp>建議把 Git 當成每次合作的基本安全網：確認當前狀態、保留基準、限定分支、看差異，再提交。初學者可使用圖形化 Git 介面，不必先背所有命令。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">時機\u003c/th>\u003cth scope=\"col\">建議動作\u003c/th>\u003cth scope=\"col\">避免事項\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>交辦前\u003c/td>\u003ctd>檢查目前分支與未提交檔案；保留需要的工作\u003c/td>\u003ctd>不知道狀態就讓 AI 清理目錄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>實作中\u003c/td>\u003ctd>一次一項，發現無關改動即暫停確認\u003c/td>\u003ctd>讓不同 Agent 同時改同檔而無協調\u003c/td>\u003c/tr>\u003ctr>\u003ctd>完成後\u003c/td>\u003ctd>審閱 diff、測試、更新文件，再提交\u003c/td>\u003ctd>只看執行畫面就接受所有變更\u003c/td>\u003c/tr>\u003ctr>\u003ctd>連續修錯無效\u003c/td>\u003ctd>停止新增修改，保存失敗版本與證據，整理最小重現\u003c/td>\u003ctd>反覆說「再修」造成更大範圍變動\u003c/td>\u003c/tr>\u003ctr>\u003ctd>需要回復\u003c/td>\u003ctd>先列將失去哪些異動，經確認後用合適方式復原\u003c/td>\u003ctd>未確認就 reset --hard、clean 或強制推送\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout warn\">\u003cstrong>不要把危險命令當成預設除錯步驟\u003c/strong>\u003cp>刪除資料、還原工作樹、重建資料庫與覆寫分支都可能不可逆。要求 AI 先說明影響、備份與替代方法，必要時交由熟悉維運的人執行。\u003c/p>\u003c/aside>\u003ch3>重新開一段對話時\u003c/h3>\u003cp>提供版本、目標、已完成、失敗嘗試與下一步；要求先讀文件和相關測試，再列缺漏資訊。不要把整段聊天無選擇地塞進新上下文。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://code.claude.com/docs/en/memory\" target=\"_blank\" rel=\"noopener noreferrer\">Claude Code：專案指示與記憶 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://docs.github.com/en/copilot/tutorials/review-ai-generated-code\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub：審查 AI 生成程式 ↗\u003c/a>\u003c/p>\u003c/section>\u003csection id=\"security\" aria-labelledby=\"h-security\">\u003cdiv class=\"section-index\">Guide / 18\u003c/div>\u003ch2 id=\"h-security\">權限、安全與正式資料\u003c/h2>\u003cp class=\"desc\">提示詞能引導行為，真正的限制必須在工具與系統上執行。\u003c/p>\u003cp>沙箱控制可寫入路徑與網路等邊界；核准政策控制何時需停下請求同意。兩者應搭配，而不是只寫一句「不要亂動」。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://openai.com/index/running-codex-safely/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAI：Codex 的安全執行 ↗\u003c/a>\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">風險\u003c/th>\u003cth scope=\"col\">建議防護\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>密鑰或個資外洩\u003c/td>\u003ctd>只提供必要檔案；遮蔽樣本；受限帳號；檢查日誌與雲端資料政策\u003c/td>\u003c/tr>\u003ctr>\u003ctd>不可信套件\u003c/td>\u003ctd>核對真實套件、發布者、用途、版本、授權與依賴；不盲目安裝\u003c/td>\u003c/tr>\u003ctr>\u003ctd>外部內容夾帶指令\u003c/td>\u003ctd>文件、issue、網頁、MCP 回傳只當資料；不讓其取得操作權\u003c/td>\u003c/tr>\u003ctr>\u003ctd>工具權限過大\u003c/td>\u003ctd>限制目錄、網路、資料庫帳號與可用工具；分開開發／正式環境\u003c/td>\u003c/tr>\u003ctr>\u003ctd>破壞性操作\u003c/td>\u003ctd>顯示完整參數、影響及回復計畫，明確人工核准\u003c/td>\u003c/tr>\u003ctr>\u003ctd>改動安全設定\u003c/td>\u003ctd>將規則、CI、權限與部署設定納入審查，不讓 AI 自動放寬限制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>只靠 UI 或提示判斷授權\u003c/td>\u003ctd>後端依使用者與資源驗證，不接受模型自行判定能做什麼\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>OWASP 建議驗證工具輸入、限制權限，並為敏感或破壞性操作加入人工核准。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/Secure_Coding_with_AI_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：AI 協作開發安全 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/MCP_Security_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：MCP 權限與工具安全 ↗\u003c/a>\u003c/p>\u003ch3>LINE 與 ERP 的建議邊界\u003c/h3>\u003cdiv class=\"flow\">\u003cspan>客戶輸入\u003c/span>\u003cb>→\u003c/b>\u003cspan>AI 候選欄位\u003c/span>\u003cb>→\u003c/b>\u003cspan>程式驗證\u003c/span>\u003cb>→\u003c/b>\u003cspan>人工核准\u003c/span>\u003cb>→\u003c/b>\u003cspan>受控寫入\u003c/span>\u003c/div>\u003cul>\u003cli>正式金額、稅率、尺寸單位、庫存及狀態轉換，建議放在固定且可測試的程式規則中。\u003c/li>\u003cli>建單需考慮交易、重複請求、紀錄與回復，不只測一次成功。\u003c/li>\u003cli>先使用測試帳號及唯讀查詢；不把正式資料庫管理權限交給通用 Agent。\u003c/li>\u003c/ul>\u003cp>LINE Webhook 應在處理前驗證簽章；驗證必須使用未被修改的原始請求內容。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://developers.line.biz/en/docs/messaging-api/receiving-messages/\" target=\"_blank\" rel=\"noopener noreferrer\">LINE：接收 Webhook ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://developers.line.biz/en/docs/messaging-api/verify-webhook-signature/\" target=\"_blank\" rel=\"noopener noreferrer\">LINE：Webhook 簽章驗證 ↗\u003c/a>\u003c/p>\u003caside class=\"callout warn\">\u003cstrong>AI 是候選資料的助手，不是授權系統\u003c/strong>\u003cp>即使模型回傳「已獲核准」，後端仍須從可信來源確認核准人、權限、操作內容與有效範圍。\u003c/p>\u003c/aside>\u003c/section>\u003csection id=\"offline\" aria-labelledby=\"h-offline\">\u003cdiv class=\"section-index\">Guide / 19\u003c/div>\u003ch2 id=\"h-offline\">本機與離線要分開看\u003c/h2>\u003cp class=\"desc\">工具在本機、模型在本機、成品能離線，是三件不同的事。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">要求\u003c/th>\u003cth scope=\"col\">要驗證什麼\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>開發 AI 離線\u003c/td>\u003ctd>推理與補全是否使用本機模型；擴充、索引或遙測有無外連\u003c/td>\u003c/tr>\u003ctr>\u003ctd>成品離線\u003c/td>\u003ctd>字型、CDN、登入、API、套件與必要資源是否依賴網路\u003c/td>\u003c/tr>\u003ctr>\u003ctd>資料本機\u003c/td>\u003ctd>保存路徑、權限、備份、加密與匯出位置\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可重新安裝\u003c/td>\u003ctd>模型、套件、安裝檔及相容版本是否已有可用副本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>展場／內網可靠\u003c/td>\u003ctd>重新啟動、斷網、故障與備援流程是否實測\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Continue 的官方離線流程包含安裝擴充、停用遙測及設定本機模型，不是只安裝編輯器就完成。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://docs.continue.dev/guides/running-continue-without-internet\" target=\"_blank\" rel=\"noopener noreferrer\">Continue：離線設定 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://docs.continue.dev/customize/model-providers/top-level/ollama\" target=\"_blank\" rel=\"noopener noreferrer\">Continue：Ollama 模型設定 ↗\u003c/a>\u003c/p>\u003ch3>建議的斷網驗收\u003c/h3>\u003col>\u003cli>先備妥模型、依賴、字型與前端資源。\u003c/li>\u003cli>實際斷網，重新啟動程式，不只沿用既有快取。\u003c/li>\u003cli>跑主要流程、錯誤案例及匯出。\u003c/li>\u003cli>確認資料不遺失，備份可還原，使用者知道如何恢復。\u003c/li>\u003c/ol>\u003caside class=\"callout info\">\u003cstrong>本機模型仍需實測\u003c/strong>\u003cp>模型大小、量化、上下文與工具呼叫能力都會影響體驗；本頁不提供沒有實機測量的速度或記憶體保證。\u003c/p>\u003c/aside>\u003c/section>\u003csection id=\"cost\" aria-labelledby=\"h-cost\">\u003cdiv class=\"section-index\">Guide / 20\u003c/div>\u003ch2 id=\"h-cost\">費用與交付方式\u003c/h2>\u003cp class=\"desc\">不要只看 AI 月費；真正成本包括審查、主機、部署與維護。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">成本／交付\u003c/th>\u003cth scope=\"col\">確認內容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>聊天／程式工具訂閱\u003c/td>\u003ctd>可用模式、模型、額度、超額與組織政策\u003c/td>\u003c/tr>\u003ctr>\u003ctd>產品模型 API\u003c/td>\u003ctd>按實際資料量與測試用量估算；分開開發與正式金鑰\u003c/td>\u003c/tr>\u003ctr>\u003ctd>主機與資料\u003c/td>\u003ctd>儲存、資料庫、流量、日誌、備份與監控\u003c/td>\u003c/tr>\u003ctr>\u003ctd>本機方案\u003c/td>\u003ctd>硬體、電力、模型管理、更新與故障處理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>人工成本\u003c/td>\u003ctd>需求整理、審查、修錯、資安與交接\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交付內容\u003c/td>\u003ctd>程式碼、設定範本、依賴版本、操作與維護文件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>桌面／手機發佈\u003c/td>\u003ctd>簽章、建置平台、更新通道與上架條件\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>OpenAI 的 ChatGPT 與 API 採分開計費；符合條件方案可能有需另行申領的 API 額度，仍須核對適用條件。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://help.openai.com/en/articles/9039756-billing-settings-in-chatgpt-vs-platform\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAI：ChatGPT 與 API 分開計費 ↗\u003c/a> \u003cspan aria-hidden=\"true\">／\u003c/span> \u003ca href=\"https://help.openai.com/articles/20001626\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAI：符合條件方案的 API 額度 ↗\u003c/a>\u003c/p>\u003caside class=\"callout info\">\u003cstrong>可編輯，不等於可維護\u003c/strong>\u003cp>要求交付能從乾淨環境安裝的完整專案，不只一張截圖、一段貼文或只能在特定雲端工作區運作的展示。\u003c/p>\u003c/aside>\u003c/section>\u003csection id=\"learning\" aria-labelledby=\"h-learning\">\u003cdiv class=\"section-index\">Guide / 21\u003c/div>\u003ch2 id=\"h-learning\">與 AI 協作仍要懂什麼\u003c/h2>\u003cp class=\"desc\">不用先精通所有語言，但要能判斷工作是否真的完成。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">最低需要掌握\u003c/th>\u003cth scope=\"col\">為什麼重要\u003c/th>\u003cth scope=\"col\">可用練習\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>檔案、路徑、終端與環境\u003c/td>\u003ctd>知道 AI 改了哪裡，命令在哪個資料夾執行\u003c/td>\u003ctd>依 README 重新啟動一次\u003c/td>\u003c/tr>\u003ctr>\u003ctd>資料型別與基本控制流程\u003c/td>\u003ctd>看懂資料如何被驗證、轉換與忽略\u003c/td>\u003ctd>要求 AI 逐步解釋一筆資料的流向\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HTTP／API／JSON\u003c/td>\u003ctd>理解前端、後端與 ERP 的界面\u003c/td>\u003ctd>用測試資料讀一次請求與回應\u003c/td>\u003c/tr>\u003ctr>\u003ctd>資料庫與權限概念\u003c/td>\u003ctd>知道何時保存、重複或越權\u003c/td>\u003ctd>設計客戶 A 不能看到 B 的測試\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Git 與差異檢視\u003c/td>\u003ctd>保留基準、追蹤改動與回復\u003c/td>\u003ctd>看懂一次只做小功能的 diff\u003c/td>\u003c/tr>\u003ctr>\u003ctd>測試與錯誤紀錄\u003c/td>\u003ctd>辨識已驗證與未驗證\u003c/td>\u003ctd>重現錯誤並比對修正前後\u003c/td>\u003c/tr>\u003ctr>\u003ctd>密鑰與依賴安全\u003c/td>\u003ctd>避免把權限和資料一併交出去\u003c/td>\u003ctd>檢查 .env.example、忽略檔與套件來源\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>用 AI 學習的好問題\u003c/h3>\u003cul>\u003cli>請用一筆測試資料，逐步解釋它從輸入到輸出的路徑。\u003c/li>\u003cli>如果欄位缺失、API 失敗或連按兩次，程式會怎麼做？\u003c/li>\u003cli>這次修改哪些是需求必須，哪些只是你的建議？\u003c/li>\u003cli>如果拿掉這個框架／套件，最簡替代方法是什麼？\u003c/li>\u003cli>哪些地方尚未驗證？正式使用前還需要誰確認？\u003c/li>\u003c/ul>\u003caside class=\"callout info\">\u003cstrong>學習目標\u003c/strong>\u003cp>做到能說明、能執行、能測試、能回復、能交接；不是只追求讓 AI 一次產生更多程式碼。\u003c/p>\u003c/aside>\u003c/section>\u003csection id=\"checklist\" aria-labelledby=\"h-checklist\">\u003cdiv class=\"section-index\">Guide / 22\u003c/div>\u003ch2 id=\"h-checklist\">可勾選的交付清單\u003c/h2>\u003cp class=\"desc\">勾選只保留於當次頁面；可下載進度 JSON，再用此頁匯入，不上傳到伺服器。\u003c/p>\u003cdiv class=\"widget\">\u003cdiv class=\"check-status\">\u003cstrong id=\"check-count\">0 / 12 已確認\u003c/strong>\u003cprogress id=\"check-progress\" value=\"0\" max=\"12\" aria-label=\"清單完成進度\">\u003c/progress>\u003c/div>\u003cdiv class=\"checklist\">\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c0\">\u003cspan>\u003csmall>啟動前\u003c/small>已寫清目的、使用者、平台與本次不做項目\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c1\">\u003cspan>\u003csmall>啟動前\u003c/small>重要欄位、單位、業務規則與驗收已由人確認\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c2\">\u003cspan>\u003csmall>啟動前\u003c/small>已保留基準版本，正式資料與密鑰不在測試上下文\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c3\">\u003cspan>\u003csmall>實作中\u003c/small>先核准計畫，再讓 AI 修改；只改本次必要範圍\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c4\">\u003cspan>\u003csmall>實作中\u003c/small>新套件、資料表、API 變更與付費操作均經確認\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c5\">\u003cspan>\u003csmall>實作中\u003c/small>未以刪除、跳過或弱化測試掩蓋失敗\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c6\">\u003cspan>\u003csmall>交付前\u003c/small>實際執行建置、測試與重要人工操作\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c7\">\u003cspan>\u003csmall>交付前\u003c/small>已審閱差異、權限與敏感資訊，標明未驗證項目\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c8\">\u003cspan>\u003csmall>交付前\u003c/small>README、設定範本與交接摘要可用\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c9\">\u003cspan>\u003csmall>正式前\u003c/small>備份／還原、重試、核准及回復方案已確認\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c10\">\u003cspan>\u003csmall>正式前\u003c/small>正式金鑰與帳號採最小權限，部署有明確核准\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput type=\"checkbox\" class=\"task-check\" data-key=\"c11\">\u003cspan>\u003csmall>正式前\u003c/small>維護人、資料位置、費用與更新方式已交接\u003c/span>\u003c/label>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"export-checks\" type=\"button\">下載清單進度\u003c/button>\u003cbutton id=\"import-checks\" type=\"button\">匯入進度 JSON\u003c/button>\u003cbutton id=\"reset-checks\" type=\"button\">清除勾選\u003c/button>\u003cinput type=\"file\" id=\"check-file\" accept=\"application/json,.json\" hidden>\u003c/div>\u003cp class=\"fine\">勾選完成不代表已自動檢測；每項仍由人確認。檔案只存勾選狀態，不存需求產生器內容。\u003c/p>\u003c/div>\u003c/section>\u003csection id=\"glossary\" aria-labelledby=\"h-glossary\">\u003cdiv class=\"section-index\">Guide / 23\u003c/div>\u003ch2 id=\"h-glossary\">名詞與使用說明\u003c/h2>\u003cp class=\"desc\">遇到不熟悉的名稱，先確認它解決的問題，再決定是否需要。\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"比較表，可水平捲動\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">名詞\u003c/th>\u003cth scope=\"col\">簡單說明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MVP\u003c/td>\u003ctd>最小可行版本：先完成一條有用且可驗收的工作流程\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IDE\u003c/td>\u003ctd>整合開發環境：編輯程式、查錯、執行與檢視專案的工作區\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CLI\u003c/td>\u003ctd>命令列介面：透過終端機輸入命令操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Agent\u003c/td>\u003ctd>可使用工具執行任務的 AI；實際能力與權限取決於環境\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Context／上下文\u003c/td>\u003ctd>本次模型取得的資訊；不應假設它永久記住整個專案\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API\u003c/td>\u003ctd>系統之間約定的呼叫介面，包含欄位、驗證、錯誤與權限\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Diff\u003c/td>\u003ctd>兩個版本之間的修改差異，審查時應看實際變更\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Regression／回歸測試\u003c/td>\u003ctd>確認新修改沒有破壞原本已正常的功能\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sandbox／沙箱\u003c/td>\u003ctd>限制程式可接觸的路徑、命令或網路等執行邊界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MCP\u003c/td>\u003ctd>讓 AI 工具連接外部資料及能力的介面協定；不等於安全授權\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Skill／技能\u003c/td>\u003ctd>可重用的任務指示與資源；是否支援、如何載入依工具而異\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAG\u003c/td>\u003ctd>先檢索資料再提供模型回答；不是每個系統都需要的必備層\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>MCP 工具仍需獨立的輸入驗證、授權與核准，不能因為已連接就視為每次操作都獲同意。\u003c/p>\u003cp class=\"sources\">官方依據：\u003ca href=\"https://cheatsheetseries.owasp.org/cheatsheets/MCP_Security_Cheat_Sheet.html\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：MCP 權限與工具安全 ↗\u003c/a>\u003c/p>\u003caside class=\"callout info\">\u003cstrong>本 HTML 的操作\u003c/strong>\u003cp>直接以瀏覽器開啟即可閱讀。側欄可跳章節，搜尋會篩選章節，範本可複製，列印會自動顯示全文。頁面無外部字型、套件、追蹤或模型呼叫；只有點開官方連結才需要網路。\u003c/p>\u003c/aside>\u003cp class=\"fine\">整理日期：2026-10-31。工具功能、方案與指示檔規則可能改變，正式選購與部署前請核對官方文件。引用以各段官方連結呈現；範本、路線、案例與互動規則是本指南的實務建議，不是官方保證。\u003c/p>\u003c/section>\u003cfooter class=\"page-footer\">AI 協作開發指南 · 實務建議與教學示例\u003cbr>不連接模型、不上傳輸入；需開啟外部文件時才使用網路。\u003c/footer>\u003c/main>\u003c/div>\u003cbutton type=\"button\" class=\"back-top\" id=\"back-top\" aria-label=\"回到頁首\">↑ 頁首\u003c/button>\u003cdiv id=\"toast\" class=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>\n(()=>{'use strict';\nconst $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));\nlet toastTimer;\nfunction toast(msg){$('#toast').textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('#toast').textContent='';},3200)}\nasync function copyText(text){\n if(navigator.clipboard && window.isSecureContext){try{await navigator.clipboard.writeText(text);toast('已複製，可貼到你的 AI 開發工具');return}catch(e){}}\n const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.left='-9999px';document.body.append(area);area.select();\n let ok=false;try{ok=document.execCommand('copy')}catch(e){}area.remove();\n if(ok)toast('已複製，可貼到你的 AI 開發工具');else toast('瀏覽器限制自動複製，請選取文字後手動複製');\n}\nfunction download(name,text,type){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}\n$$('.copy-btn').forEach(b=>b.addEventListener('click',()=>copyText(b.closest('.codebox').querySelector('code').textContent)));\nconst sidebar=$('.sidebar'), shade=$('.mobile-shade');\nfunction closeMenu(){sidebar.classList.remove('open');shade.classList.remove('visible');$('#menu').setAttribute('aria-expanded','false')}\n$('#menu').addEventListener('click',()=>{const open=sidebar.classList.toggle('open');shade.classList.toggle('visible',open);$('#menu').setAttribute('aria-expanded',String(open))});shade.addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});\n$$('.sidebar nav a').forEach(a=>a.addEventListener('click',closeMenu));\n$('#theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').textContent=dark?'淺色':'深色';$('#theme').setAttribute('aria-pressed',String(dark))});\n$('#print').addEventListener('click',()=>window.print());$('#back-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));\nconst secs=$$('main section'),navs=$$('.sidebar nav a');\nconst normalized=secs.map(s=>s.textContent.toLocaleLowerCase());\n$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLocaleLowerCase();let n=0;secs.forEach((s,i)=>{const match=!q||normalized[i].includes(q);s.hidden=!match;navs[i].hidden=!match;if(match)n++});$('#no-results').hidden=n>0;$('#search-status').textContent=q?`${n} 個章節`:`${secs.length} 個章節`;});\n$('#clear-search').addEventListener('click',()=>{$('#search').value='';$('#search').dispatchEvent(new Event('input'));$('#search').focus()});\n$$('.quicknav a').forEach(a=>a.addEventListener('click',()=>{$('#search').value='';$('#search').dispatchEvent(new Event('input'))}));\nif('IntersectionObserver' in window){const obs=new IntersectionObserver(entries=>{entries.forEach(en=>{if(en.isIntersecting){navs.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+en.target.id))}})},{rootMargin:'-12% 0px -65% 0px',threshold:0});secs.forEach(s=>obs.observe(s))}\nfunction progress(){const el=document.documentElement,den=el.scrollHeight-innerHeight;$('.readbar').style.width=(den>0?Math.min(100,Math.max(0,scrollY/den*100)):100)+'%'}window.addEventListener('scroll',progress,{passive:true});window.addEventListener('resize',progress);progress();\nconst paths={data:'語言與框架：先 Python；核心規則先寫成可測試函式，需要畫面再加 Streamlit。\\n最小成果：讀檔 → 驗證 → 錯誤清單 → 匯出。',web:'語言與框架：先 JavaScript 基礎，再用 TypeScript＋Next.js 或既有框架。\\n最小成果：一個表單 → 驗證 → 保存 → 查詢；登入與資料權限依使用者範圍設計。',line:'語言與框架：配合主要系統選 Python 或 TypeScript，不只為 LINE 新增第二套架構。\\n最小成果：驗證 Webhook → 處理測試事件 → 固定回應；再加去重、查詢與錯誤紀錄。',desktop:'語言與框架：若已有 Web 技能，可評估 TypeScript／JavaScript＋Electron；若只是資料工具，先測試瀏覽器介面是否已足夠。\\n最小成果：一個本機工作流程，再驗證目標平台的打包、檔案權限與更新。',windows:'語言與框架：Windows 專用桌面可評估 C#＋.NET／WPF。\\n最小成果：一個表單或檔案操作，再確認裝置、安裝與 Windows 版本需求。',mobile:'語言與框架：可評估 Dart＋Flutter，但先確認是否真的需要上架 App，或響應式網站已可完成。\\n最小成果：一個畫面與一條資料流程，再確認平台 SDK、實機測試與發佈條件。',existing:'語言與框架：先沿用現有語言、資料庫與部署環境。\\n最小成果：先讀程式與測試、定位一個擴充點，再做小範圍變更，不預設重寫。'};\nconst tools={gui:'開發工具建議：先試 Cursor 或 VS Code＋Copilot，透過差異檢視核對修改。',cli:'開發工具建議：先選 Claude Code、Codex 或 Gemini CLI 其中一套，確認工作目錄、命令核准與測試環境。',local:'開發工具建議：可評估 Continue＋Ollama；先確認模型能力、硬體、遙測與所有雲端功能，再實際斷網測試。'};\n$('#recommend').addEventListener('click',()=>{$('#recommend-output').textContent=paths[$('#sel-product').value]+'\\n\\n'+tools[$('#sel-style').value]+'\\n\\n'+($('#sel-risk').checked?'高風險邊界：先使用測試環境與唯讀資料；將業務規則、權限與重複請求處理留在後端；正式寫入前要求明確核准、紀錄及回復方案。':'下一步：先定義輸入、輸出、非目標與驗收，請 AI 提出計畫，確認後才改檔案。')});\nfunction val(id){return $(id).value.trim()||'尚未確認，請先列為待確認事項，不要自行猜測'}\nfunction buildPrompt(){const phases={plan:'先規劃與比較最簡方案，不寫程式、不修改檔案；等待我核准。',implement:'先閱讀相關檔案與測試，列出異動檔案及計畫；確認後才實作。',review:'先唯讀審查目前專案與規格，不修改程式；報告問題需附位置與證據。'};\n$('#prompt-output').value=`【目的】\\n${val('#p-title')}\\n\\n【使用者與平台】\\n${val('#p-users')}\\n\\n【現況與既有技術】\\n${val('#p-current')}\\n\\n【部署與限制】\\n${val('#p-deploy')}\\n\\n【本次必做】\\n${val('#p-do')}\\n\\n【本次不做】\\n${val('#p-not')}\\n\\n【輸入與業務規則】\\n${val('#p-rules')}\\n\\n【驗收條件】\\n${val('#p-tests')}\\n\\n【本次階段】\\n${phases[$('#p-phase').value]}\\n\\n【共同要求】\\n- 使用台灣繁體中文，區分事實、假設、建議與未確認資訊。\\n- 不做無關重構，不擅自新增套件、改資料表或公開 API。\\n- 不使用正式資料或密鑰，不自行部署、推送或新增付費資源。\\n- 不刪除、跳過或弱化測試來取得通過。\\n- 需要高風險操作時，列影響、備份與回復方案，等待核准。\\n- 交付列出異動、實際執行命令與結果、未測項目及已知限制。\\n- 無法實際執行就明列未驗證，不假稱完成。`}\n$('#build-prompt').addEventListener('click',()=>{buildPrompt();toast('已依目前欄位產生指令')});$('#copy-prompt').addEventListener('click',()=>{if(!$('#prompt-output').value)buildPrompt();copyText($('#prompt-output').value)});$('#download-prompt').addEventListener('click',()=>{if(!$('#prompt-output').value)buildPrompt();download('ai-development-task.txt',$('#prompt-output').value,'text/plain;charset=utf-8')});buildPrompt();\nconst checks=$$('.task-check');function updateChecks(){const n=checks.filter(c=>c.checked).length;$('#check-count').textContent=`${n} / ${checks.length} 已確認`;$('#check-progress').value=n}checks.forEach(c=>c.addEventListener('change',updateChecks));\n$('#export-checks').addEventListener('click',()=>download('ai-development-checklist.json',JSON.stringify({format:'ai-development-checklist',version:1,exportedAt:new Date().toISOString(),checks:Object.fromEntries(checks.map(c=>[c.dataset.key,c.checked]))},null,2),'application/json'));\n$('#import-checks').addEventListener('click',()=>$('#check-file').click());$('#check-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>100000)throw Error('檔案太大');const d=JSON.parse(await f.text());if(d.format!=='ai-development-checklist'||d.version!==1||typeof d.checks!=='object'||d.checks===null)throw Error('格式不符合本頁清單');const keys=checks.map(c=>c.dataset.key);if(!keys.every(k=>typeof d.checks[k]==='boolean'))throw Error('清單欄位不完整');checks.forEach(c=>c.checked=d.checks[c.dataset.key]);updateChecks();toast('已匯入清單進度')}catch(err){toast('未匯入：'+err.message)}e.target.value=''});\n$('#reset-checks').addEventListener('click',()=>{if(confirm('清除本次所有勾選？若需要保留，請先下載進度。')){checks.forEach(c=>c.checked=false);updateChecks();toast('已清除勾選')}});\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"title":"程式語言全景指南｜分類・優缺點・實務選型","path":"程式語言全景指南Perplexity/看懂程式語言，從分類到實際選型.html","snippet":"跳到主要內容目錄\u003c/>程式語言全景指南查找語言深色模式列印／PDFCONTENTS / 閱讀目錄01閱讀方式與範圍02基本名詞03功能分類地圖04程式設計典範05型別系統06編譯與執行07記憶體與資源管理08主要語言詳解…","size":151017,"mtime":179 an class=\"brand-mark\" aria-hidden=\"true\">&lt;/&gt;\u003c/span>\u003cspan>程式語言全景指南\u003c/span>\u003c/div>\u003cdiv class=\"tools\">\u003ca class=\"top-link\" href=\"#languages\">查找語言\u003c/a>\u003cbutton id=\"theme-toggle\" type=\"button\" aria-pressed=\"false\">深色模式\u003c/button>\u003cbutton id=\"print-guide\" type=\"button\">列印／PDF\u003c/button>\u003c/div>\u003c/header>\u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv id=\"reading-progress\" class=\"progress-bar\">\u003c/div>\u003c/div>\u003caside id=\"sidebar\" class=\"sidebar\">\u003cdiv class=\"nav-label\">CONTENTS / 閱讀目錄\u003c/div>\u003cnav aria-label=\"章節導覽\">\u003ca href=\"#scope\">\u003cspan class=\"nav-num\">01\u003c/span>\u003cspan>閱讀方式與範圍\u003c/span>\u003c/a>\u003ca href=\"#terms\">\u003cspan class=\"nav-num\">02\u003c/span>\u003cspan>基本名詞\u003c/span>\u003c/a>\u003ca href=\"#map\">\u003cspan class=\"nav-num\">03\u003c/span>\u003cspan>功能分類地圖\u003c/span>\u003c/a>\u003ca href=\"#paradigms\">\u003cspan class=\"nav-num\">04\u003c/span>\u003cspan>程式設計典範\u003c/span>\u003c/a>\u003ca href=\"#types\">\u003cspan class=\"nav-num\">05\u003c/span>\u003cspan>型別系統\u003c/span>\u003c/a>\u003ca href=\"#execution\">\u003cspan class=\"nav-num\">06\u003c/span>\u003cspan>編譯與執行\u003c/span>\u003c/a>\u003ca href=\"#memory\">\u003cspan class=\"nav-num\">07\u003c/span>\u003cspan>記憶體與資源管理\u003c/span>\u003c/a>\u003ca href=\"#languages\">\u003cspan class=\"nav-num\">08\u003c/span>\u003cspan>主要語言詳解\u003c/span>\u003c/a>\u003ca href=\"#sql\">\u003cspan class=\"nav-num\">09\u003c/span>\u003cspan>SQL 與資料設計\u003c/span>\u003c/a>\u003ca href=\"#special\">\u003cspan class=\"nav-num\">10\u003c/span>\u003cspan>GPU、工控與驗證\u003c/span>\u003c/a>\u003ca href=\"#platform\">\u003cspan class=\"nav-num\">11\u003c/span>\u003cspan>平台與應用擴充\u003c/span>\u003c/a>\u003ca href=\"#wasm\">\u003cspan class=\"nav-num\">12\u003c/span>\u003cspan>WebAssembly 與跨語言\u003c/span>\u003c/a>\u003ca href=\"#history\">\u003cspan class=\"nav-num\">13\u003c/span>\u003cspan>歷史與延伸索引\u003c/span>\u003c/a>\u003ca href=\"#myths\">\u003cspan class=\"nav-num\">14\u003c/span>\u003cspan>常見誤解\u003c/span>\u003c/a>\u003ca href=\"#performance\">\u003cspan class=\"nav-num\">15\u003c/span>\u003cspan>效能怎麼評估\u003c/span>\u003c/a>\u003ca href=\"#security\">\u003cspan class=\"nav-num\">16\u003c/span>\u003cspan>安全與可靠性\u003c/span>\u003c/a>\u003ca href=\"#selection\">\u003cspan class=\"nav-num\">17\u003c/span>\u003cspan>依工作選擇語言\u003c/span>\u003c/a>\u003ca href=\"#printing\">\u003cspan class=\"nav-num\">18\u003c/span>\u003cspan>印刷 AI 與 ERP 架構\u003c/span>\u003c/a>\u003ca href=\"#examples\">\u003cspan class=\"nav-num\">19\u003c/span>\u003cspan>概念程式範例\u003c/span>\u003c/a>\u003ca href=\"#roadmap\">\u003cspan class=\"nav-num\">20\u003c/span>\u003cspan>建議學習順序\u003c/span>\u003c/a>\u003ca href=\"#checklist\">\u003cspan class=\"nav-num\">21\u003c/span>\u003cspan>選型檢查清單\u003c/span>\u003c/a>\u003ca href=\"#glossary\">\u003cspan class=\"nav-num\">22\u003c/span>\u003cspan>重要名詞速查\u003c/span>\u003c/a>\u003ca href=\"#using\">\u003cspan class=\"nav-num\">23\u003c/span>\u003cspan>文件操作與限制\u003c/span>\u003c/a>\u003c/nav>\u003cdiv class=\"nav-footer\">繁體中文・實務導向\u003cbr>單檔離線閱讀\u003cbr>整理日期 2026.10.31\u003cbr>來源連結需連網\u003c/div>\u003c/aside>\u003cdiv id=\"overlay\" class=\"overlay\" aria-hidden=\"true\">\u003c/div>\u003cmain id=\"content\" class=\"main\">\u003cheader class=\"hero\">\u003cdiv class=\"eyebrow\">Programming Languages · Field Guide\u003c/div>\u003ch1>看懂程式語言，\u003cbr>\u003cspan>從分類到實際選型。\u003c/span>\u003c/h1>\u003cp class=\"intro\">不只認識語言名稱，更理解它們解決什麼問題、優缺點從何而來，以及如何為 AI、Web、ERP、印刷自動化與設備整合做出可維護的選擇。\u003c/p>\u003cdiv class=\"hero-tags\">\u003cspan>功能與典範\u003c/span>\u003cspan>型別與記憶體\u003c/span>\u003cspan>語言優缺點\u003c/span>\u003cspan>安全與效能\u003c/span>\u003cspan>產業架構\u003c/span>\u003c/div>\u003cdiv class=\"hero-bottom\">\u003cspan>\u003cb>23\u003c/b>個主題章節\u003c/span>\u003cspan>\u003cb>42\u003c/b>個語言／技術詳解項目\u003c/span>\u003cspan>含歷史與專用語言延伸索引\u003c/span>\u003c/div>\u003c/header>\u003cp class=\"print-only\">離線 HTML 指南｜整理日期：2026-10-31｜來源超連結保留於對應段落。頁數由瀏覽器與列印設定決定。\u003c/p>\u003cnoscript>\u003cdiv class=\"callout warn\">\u003cstrong>JavaScript 未啟用\u003c/strong>\u003cp>全文仍可閱讀。語言篩選、主題切換、複製與勾選保存需啟用 JavaScript；可使用瀏覽器的搜尋與列印功能。\u003c/p>\u003c/div>\u003c/noscript>\u003csection class=\"chapter\" id=\"scope\" aria-labelledby=\"heading-scope\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">01\u003c/span>\u003cdiv>\u003ch2 id=\"heading-scope\">閱讀方式與範圍\u003c/h2>\u003cp class=\"lead\">先建立地圖，再深入真正需要的語言。\u003c/p>\u003c/div>\u003c/header>\u003cp>世界上沒有一個完全一致、永遠封閉的「所有程式語言」名單：歷史語言、研究語言、方言、專用語言與新工具持續擴充範圍。PLDB 專案自述收錄超過 5,000 種程式語言；本指南採主要語言詳解、完整分類及延伸索引，而非宣稱逐一介紹了全部語言。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://github.com/Programming-Language-DataBase/pldb\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PLDB 語言資料庫\">PLDB 語言資料庫 ↗\u003c/a>\u003c/span>\u003c/p>\u003caside class=\"callout tip\">\u003cstrong>這份文件怎麼使用\u003c/strong>\u003cp>先讀「基本名詞 → 分類 → 型別／執行／記憶體」，再利用語言搜尋找目標。最後閱讀實務選型、印刷 AI 架構、學習順序與檢查清單。\u003c/p>\u003c/aside>\u003cdiv class=\"grid3\">\u003cdiv class=\"mini\">\u003cb>知識層\u003c/b>\u003cp>理解用途、典範、型別、執行環境與資源管理。\u003c/p>\u003c/div>\u003cdiv class=\"mini\">\u003cb>語言層\u003c/b>\u003cp>逐項比較定位、優點、成本、必學概念與案例。\u003c/p>\u003c/div>\u003cdiv class=\"mini\">\u003cb>工程層\u003c/b>\u003cp>把語言選擇放回資料、整合、安全與部署需求中。\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"fine\">整理日期：2026-10-31。本文不提供版本排名、職缺排名、實測速度或保證年限。語言特性以連結的官方文件為主；案例與選型建議為本指南的工程判斷。官方文件可能更新，導入前需再次確認指定版本。\u003c/p>\u003c/section>\u003csection class=\"chapter\" id=\"terms\" aria-labelledby=\"heading-terms\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">02\u003c/span>\u003cdiv>\u003ch2 id=\"heading-terms\">基本名詞\u003c/h2>\u003cp class=\"lead\">避免把語言、框架、執行環境和資料格式放在同一層比較。\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"類別、代表例子、負責的事情\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">類別\u003c/th>\u003cth scope=\"col\">代表例子\u003c/th>\u003cth scope=\"col\">負責的事情\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>程式語言\u003c/td>\u003ctd>Python、JavaScript、C#、Rust\u003c/td>\u003ctd>表達資料、運算、流程與程式行為。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.python.org/3/tutorial/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Python 官方教學\">Python 官方教學 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN JavaScript 型別\">MDN JavaScript 型別 ↗\u003c/a>\u003ca class=\"src\" href=\"https://doc.rust-lang.org/beta/book/ch04-01-what-is-ownership.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Rust 所有權\">Rust 所有權 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>標記／文件結構\u003c/td>\u003ctd>HTML、XML\u003c/td>\u003ctd>描述結構；與一般用途語言的程式行為不同。CSS 可對 HTML／XML 文件描述呈現。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/Web/CSS\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN CSS\">MDN CSS ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>樣式語言\u003c/td>\u003ctd>CSS\u003c/td>\u003ctd>描述畫面、版面與列印呈現，不是後端商業規則。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/Web/CSS\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN CSS\">MDN CSS ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>查詢語言\u003c/td>\u003ctd>SQL\u003c/td>\u003ctd>建立、操作及查詢資料，並使用資料庫提供的交易能力。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.postgresql.org/docs/current/sql.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PostgreSQL SQL 文件\">PostgreSQL SQL 文件 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>設定語言\u003c/td>\u003ctd>HCL\u003c/td>\u003ctd>用於結構化設定，實際能力由宿主工具決定。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://github.com/hashicorp/hcl/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"HCL 官方專案\">HCL 官方專案 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>執行環境\u003c/td>\u003ctd>JVM、Python 直譯器等\u003c/td>\u003ctd>提供執行程式所需服務；語言與執行環境不能畫上等號。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://dev.java/learn/jvm/core-tools/java/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Java 啟動與執行環境\">Java 啟動與執行環境 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.python.org/3/tutorial/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Python 官方教學\">Python 官方教學 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>編譯目標\u003c/td>\u003ctd>WebAssembly\u003c/td>\u003ctd>讓來源語言編譯成相容環境可載入的模組。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN WebAssembly 概念\">MDN WebAssembly 概念 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>產業交換格式\u003c/td>\u003ctd>JDF、XJDF\u003c/td>\u003ctd>在印刷系統之間交換工作與生產資訊，不是 Python 的替代品。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.cip4.org/Print-Automation-Overview/articles/jobtickets\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CIP4 JDF 工單說明\">CIP4 JDF 工單說明 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.cip4.org/glossary/XJDF\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CIP4 XJDF\">CIP4 XJDF ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout tip\">\u003cstrong>語言只是一部分\u003c/strong>\u003cp>「使用 Python」仍無法回答：資料放哪裡、怎麼登入、如何部署、如何重試、如何接 ERP、誰來維護。選型時應一起比較語言、函式庫、資料庫、執行環境與營運方式。\u003c/p>\u003c/aside>\u003c/section>\u003csection class=\"chapter\" id=\"map\" aria-labelledby=\"heading-map\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">03\u003c/span>\u003cdiv>\u003ch2 id=\"heading-map\">功能分類地圖\u003c/h2>\u003cp class=\"lead\">同一語言可以跨多個領域；常見用途不等於只能做這件事。\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"功能領域、主要工作、可評估的語言與方向\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">功能領域\u003c/th>\u003cth scope=\"col\">主要工作\u003c/th>\u003cth scope=\"col\">可評估的語言與方向\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Web 與使用介面\u003c/td>\u003ctd>表單、核稿、互動與操作畫面\u003c/td>\u003ctd>JavaScript／TypeScript，配合 HTML 與 CSS。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN JavaScript 型別\">MDN JavaScript 型別 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.typescriptlang.org/docs/handbook/typescript-from-scratch\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TypeScript 官方說明\">TypeScript 官方說明 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/Web/CSS\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN CSS\">MDN CSS ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>企業商業系統\u003c/td>\u003ctd>訂單、交易、權限與整合\u003c/td>\u003ctd>Java、C#；SAP 平台另有 ABAP。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://dev.java/learn/jvm/core-tools/java/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Java 啟動與執行環境\">Java 啟動與執行環境 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.learn.microsoft.com/en-sg/dotnet/csharp/tour-of-csharp/what-you-can-build\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C# 應用範圍\">C# 應用範圍 ↗\u003c/a>\u003ca class=\"src\" href=\"https://help.sap.com/doc/abapdocu_latest_index_htm/latest/en-US/ABENABAP_OVERVIEW.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SAP ABAP 語言\">SAP ABAP 語言 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>腳本與流程自動化\u003c/td>\u003ctd>檔案、轉換、管理與工具串接\u003c/td>\u003ctd>Python、Bash、PowerShell、Perl。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.python.org/3/tutorial/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Python 官方教學\">Python 官方教學 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.gnu.org/software/bash/manual/html_node/Shell-Syntax.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Bash 語法\">Bash 語法 ↗\u003c/a>\u003ca class=\"src\" href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_pipelines?view=powershell-7.5\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PowerShell 管線\">PowerShell 管線 ↗\u003c/a>\u003ca class=\"src\" href=\"https://perldoc.perl.org/perlintro\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Perl 官方入門\">Perl 官方入門 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>系統與資源控制\u003c/td>\u003ctd>底層介面、記憶體及受限環境\u003c/td>\u003ctd>C、C++、Rust、Zig。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.cppreference.com/c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C 語言參考\">C 語言參考 ↗\u003c/a>\u003ca class=\"src\" href=\"https://cppreference.com/cpp/memory\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C++ 記憶體管理\">C++ 記憶體管理 ↗\u003c/a>\u003ca class=\"src\" href=\"https://doc.rust-lang.org/beta/book/ch04-01-what-is-ownership.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Rust 所有權\">Rust 所有權 ↗\u003c/a>\u003ca class=\"src\" href=\"https://ziglang.org/documentation/master/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Zig 官方語言參考\">Zig 官方語言參考 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>統計與科學計算\u003c/td>\u003ctd>統計、矩陣、數值模擬\u003c/td>\u003ctd>R、Julia、Fortran、MATLAB／Octave。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://cloud.r-project.org/doc/manuals/r-patched/R-lang.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"R 語言定義\">R 語言定義 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.julialang.org/en/v1.9/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Julia 語言文件\">Julia 語言文件 ↗\u003c/a>\u003ca class=\"src\" href=\"https://fortran-lang.org/packages/numerical/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Fortran 數值套件\">Fortran 數值套件 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.octave.org/doxygen/stable/index.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"GNU Octave 官方說明\">GNU Octave 官方說明 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>分散式與多工作服務\u003c/td>\u003ctd>訊息、工作協作與容錯\u003c/td>\u003ctd>Go、Elixir／Erlang 生態、Scala。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://go.dev/doc/diagnostics\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go 診斷工具\">Go 診斷工具 ↗\u003c/a>\u003ca class=\"src\" href=\"https://elixir-lang.org/learning/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Elixir 官方學習資源\">Elixir 官方學習資源 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.scala-lang.org/tour/tour-of-scala.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Scala 官方導覽\">Scala 官方導覽 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>資料與交易\u003c/td>\u003ctd>模型、查詢與一致性\u003c/td>\u003ctd>SQL 與資料庫的特定擴充。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.postgresql.org/docs/current/sql.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PostgreSQL SQL 文件\">PostgreSQL SQL 文件 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GPU 與平行運算\u003c/td>\u003ctd>GPU 核心、圖形與計算\u003c/td>\u003ctd>CUDA 支援的語言、WGSL。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CUDA 程式設計模型\">CUDA 程式設計模型 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.w3.org/TR/WGSL/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"W3C WGSL 規格\">W3C WGSL 規格 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>工業控制\u003c/td>\u003ctd>機台程序與 PLC\u003c/td>\u003ctd>ST、LD、FBD；SFC 用來組織程序。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.plcopen.org/standards/logic/iec-61131-3/status-iec-61131-3-standard/\" target=\"_blank\" rel=\"noope
