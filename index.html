ner noreferrer\" title=\"PLCopen 第四版狀態\">PLCopen 第四版狀態 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>高可靠性\u003c/td>\u003ctd>契約、檢查與形式驗證\u003c/td>\u003ctd>Ada、SPARK。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://learn.adacore.com/booklets/adacore-technologies-for-airborne-software/chapters/tools.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Ada 與安全關鍵軟體\">Ada 與安全關鍵軟體 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.adacore.com/spark2014-docs/html/ug/en/introduction.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SPARK 官方介紹\">SPARK 官方介紹 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>應用內擴充\u003c/td>\u003ctd>現有軟體的自動化\u003c/td>\u003ctd>Lua、Adobe 腳本與 C++ 外掛。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.lua.org/manual/5.4/manual.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Lua 語言參考\">Lua 語言參考 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.adobe.com/illustrator/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Adobe Illustrator 開發\">Adobe Illustrator 開發 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection class=\"chapter\" id=\"paradigms\" aria-labelledby=\"heading-paradigms\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">04\u003c/span>\u003cdiv>\u003ch2 id=\"heading-paradigms\">程式設計典範\u003c/h2>\u003cp class=\"lead\">典範是思考問題的方法，不是互斥的語言陣營。\u003c/p>\u003c/div>\u003c/header>\u003cp>Scala 結合物件導向與函數式；F# 同時支援函數式、物件導向及命令式。因此，不能只給每種語言貼一張標籤。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.scala-lang.org/tour/tour-of-scala.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Scala 官方導覽\">Scala 官方導覽 ↗\u003c/a>\u003ca class=\"src\" href=\"https://learn.microsoft.com/en-us/dotnet/fsharp/language-reference/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"F# 語言參考\">F# 語言參考 ↗\u003c/a>\u003c/span>\u003c/p>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"典範、思考方式、價值、常見代價\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">典範\u003c/th>\u003cth scope=\"col\">思考方式\u003c/th>\u003cth scope=\"col\">價值\u003c/th>\u003cth scope=\"col\">常見代價\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>命令式\u003c/td>\u003ctd>寫出依序執行的動作\u003c/td>\u003ctd>容易對應操作與處理步驟\u003c/td>\u003ctd>要管理狀態與順序\u003c/td>\u003c/tr>\u003ctr>\u003ctd>程序式\u003c/td>\u003ctd>以函式／程序拆工作\u003c/td>\u003ctd>便於重用及分段測試\u003c/td>\u003ctd>仍需清楚模組與資料責任\u003c/td>\u003c/tr>\u003ctr>\u003ctd>物件導向\u003c/td>\u003ctd>封裝資料與行為\u003c/td>\u003ctd>適合表達領域角色與介面\u003c/td>\u003ctd>避免過深繼承與無意義類別\u003c/td>\u003c/tr>\u003ctr>\u003ctd>函數式\u003c/td>\u003ctd>以函數、組合及不可變資料為核心\u003c/td>\u003ctd>有助推理資料轉換與隔離副作用\u003c/td>\u003ctd>需學會狀態及副作用的處理方式\u003c/td>\u003c/tr>\u003ctr>\u003ctd>宣告式\u003c/td>\u003ctd>描述希望成立的結果\u003c/td>\u003ctd>能用較高層次表達需求\u003c/td>\u003ctd>仍需理解執行系統與成本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>邏輯／約束式\u003c/td>\u003ctd>描述關係與限制\u003c/td>\u003ctd>適合搜尋、推論與可行解\u003c/td>\u003ctd>領域、終止與搜尋空間很重要\u003c/td>\u003c/tr>\u003ctr>\u003ctd>多典範\u003c/td>\u003ctd>依問題混合方式\u003c/td>\u003ctd>選擇合適的表達方式\u003c/td>\u003ctd>團隊應有一致規範\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"fine\">上表為概念整理；函數式概念可參閱 F# 教學，邏輯與約束式可參閱 SWI-Prolog 文件。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://learn.microsoft.com/en-us/dotnet/fsharp/tutorials/functional-programming-concepts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"F# 函數式觀念\">F# 函數式觀念 ↗\u003c/a>\u003ca class=\"src\" href=\"https://swish.swi-prolog.org/pldoc/man?section=clp\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Prolog 約束程式設計\">Prolog 約束程式設計 ↗\u003c/a>\u003c/span>\u003c/p>\u003caside class=\"callout tip\">\u003cstrong>用工單來理解\u003c/strong>\u003cp>程序式：先檢查資料、再計算、再寫入。物件導向：定義工單及其允許行為。函數式：把報價計算寫成輸入固定、結果可驗證的函數。約束式：描述機台、材料與交期限制，再求解可行排程。這是教學類比，不是要求只用單一典範。\u003c/p>\u003c/aside>\u003c/section>\u003csection class=\"chapter\" id=\"types\" aria-labelledby=\"heading-types\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">05\u003c/span>\u003cdiv>\u003ch2 id=\"heading-types\">型別系統\u003c/h2>\u003cp class=\"lead\">型別、型別推論與執行時驗證，是不同的事。\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"概念、意義、例子與提醒\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">概念\u003c/th>\u003cth scope=\"col\">意義\u003c/th>\u003cth scope=\"col\">例子與提醒\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>靜態型別\u003c/td>\u003ctd>執行前分析型別關係\u003c/td>\u003ctd>Scala、Kotlin、Swift 等具備相關能力。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.scala-lang.org/tour/tour-of-scala.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Scala 官方導覽\">Scala 官方導覽 ↗\u003c/a>\u003ca class=\"src\" href=\"https://kotlinlang.org/docs/null-safety.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Kotlin 空值安全\">Kotlin 空值安全 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Swift 基礎\">Swift 基礎 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>動態型別\u003c/td>\u003ctd>型別行為主要在執行時處理\u003c/td>\u003ctd>Python、JavaScript、PHP。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.python.org/3.12/library/typing.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Python 型別註記\">Python 型別註記 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN JavaScript 型別\">MDN JavaScript 型別 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.php.net/manual/en/language.types.intro.php\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PHP 型別說明\">PHP 型別說明 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>型別推論\u003c/td>\u003ctd>不必每次手寫型別\u003c/td>\u003ctd>Haskell、Scala、Swift 可推導部分型別；沒寫不代表動態型別。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.haskell.org/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Haskell 官方介紹\">Haskell 官方介紹 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.scala-lang.org/tour/tour-of-scala.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Scala 官方導覽\">Scala 官方導覽 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Swift 基礎\">Swift 基礎 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>可空型別\u003c/td>\u003ctd>表達值可能不存在\u003c/td>\u003ctd>Kotlin、Swift Optional、Dart 的相關能力，細節不完全相同。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://kotlinlang.org/docs/null-safety.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Kotlin 空值安全\">Kotlin 空值安全 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Swift 基礎\">Swift 基礎 ↗\u003c/a>\u003ca class=\"src\" href=\"https://dart.dev/language/variables\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Dart 變數與空值安全\">Dart 變數與空值安全 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>型別註記\u003c/td>\u003ctd>提供工具分析的資訊\u003c/td>\u003ctd>Python 的註記預設不強制檢查。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.python.org/3.12/library/typing.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Python 型別註記\">Python 型別註記 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>型別擦除\u003c/td>\u003ctd>型別資訊不保留為執行時驗證\u003c/td>\u003ctd>TypeScript 不會自動檢查 API 回傳資料。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.typescriptlang.org/docs/handbook/typescript-from-scratch\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TypeScript 官方說明\">TypeScript 官方說明 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout tip\">\u003cstrong>三層檢查不可混為一談\u003c/strong>\u003cp>第一層：型別分析，例如數量是否當作數字使用。第二層：執行時驗證，例如 API 的 quantity 是否真是數字。第三層：商業規則，例如最低印量、材料單位與允許交期。\u003c/p>\u003c/aside>\u003cp>「強／弱型別」容易因定義不同而混淆。比較時應改問：哪些隱式轉換允許？何時發現錯誤？能否繞過檢查？JavaScript 的隱式轉換與動態型別應分別理解。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN JavaScript 型別\">MDN JavaScript 型別 ↗\u003c/a>\u003c/span>\u003c/p>\u003c/section>\u003csection class=\"chapter\" id=\"execution\" aria-labelledby=\"heading-execution\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">06\u003c/span>\u003cdiv>\u003ch2 id=\"heading-execution\">編譯與執行\u003c/h2>\u003cp class=\"lead\">語言、實作、編譯目標及部署模式，要一起看。\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"方式、基本概念、工程上需要評估\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">方式\u003c/th>\u003cth scope=\"col\">基本概念\u003c/th>\u003cth scope=\"col\">工程上需要評估\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>事先編譯 AOT\u003c/td>\u003ctd>執行前產生目標程式碼\u003c/td>\u003ctd>目標平台、建置及發行流程\u003c/td>\u003c/tr>\u003ctr>\u003ctd>即時編譯 JIT\u003c/td>\u003ctd>執行時編譯或最佳化\u003c/td>\u003ctd>啟動、暖機與長時間執行的差異\u003c/td>\u003c/tr>\u003ctr>\u003ctd>直譯／互動執行\u003c/td>\u003ctd>由語言實作提供執行與互動\u003c/td>\u003ctd>環境、相依套件與版本\u003c/td>\u003c/tr>\u003ctr>\u003ctd>轉成另一語言\u003c/td>\u003ctd>以別種語言作為輸出\u003c/td>\u003ctd>來源與輸出之間的除錯及工具鏈\u003c/td>\u003c/tr>\u003ctr>\u003ctd>中介格式／位元組碼\u003c/td>\u003ctd>交給相容環境載入\u003c/td>\u003ctd>格式、宿主介面與功能支援\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>例如 TypeScript 會移除型別並產生 JavaScript；Julia 使用型別推論及 JIT；WebAssembly 通常是來源語言的編譯目標。它們說明了「編譯式／直譯式」不足以概括所有部署方式。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.typescriptlang.org/docs/handbook/typescript-from-scratch\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TypeScript 官方說明\">TypeScript 官方說明 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.julialang.org/en/v1.9/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Julia 語言文件\">Julia 語言文件 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN WebAssembly 概念\">MDN WebAssembly 概念 ↗\u003c/a>\u003c/span>\u003c/p>\u003caside class=\"callout tip\">\u003cstrong>離線運作不是語言自動決定\u003c/strong>\u003cp>離線能力取決於應用是否依賴雲端 API、驗證服務、外部字型、遠端資料與套件。本 HTML 的閱讀與互動不依賴外部套件；來源連結仍需網路。\u003c/p>\u003c/aside>\u003c/section>\u003csection class=\"chapter\" id=\"memory\" aria-labelledby=\"heading-memory\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">07\u003c/span>\u003cdiv>\u003ch2 id=\"heading-memory\">記憶體與資源管理\u003c/h2>\u003cp class=\"lead\">記憶體安全、資源釋放與商業正確性不能畫上等號。\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"模型、代表方向、優點、需承擔的成本\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">模型\u003c/th>\u003cth scope=\"col\">代表方向\u003c/th>\u003cth scope=\"col\">優點\u003c/th>\u003cth scope=\"col\">需承擔的成本\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>手動／明確管理\u003c/td>\u003ctd>C、Zig\u003c/td>\u003ctd>可選擇配置與釋放策略\u003c/td>\u003ctd>正確性需由開發者與工具把關。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://cppreference.com/c/memory\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C 動態記憶體\">C 動態記憶體 ↗\u003c/a>\u003ca class=\"src\" href=\"https://ziglang.org/documentation/master/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Zig 官方語言參考\">Zig 官方語言參考 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RAII 與智慧指標\u003c/td>\u003ctd>現代 C++\u003c/td>\u003ctd>以生命週期管理資源\u003c/td>\u003ctd>仍需理解所有權、參照與生命週期。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://isocpp.org/wiki/faq/exceptions\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C++ RAII 說明\">C++ RAII 說明 ↗\u003c/a>\u003ca class=\"src\" href=\"https://cppreference.com/cpp/memory\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C++ 記憶體管理\">C++ 記憶體管理 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>所有權與借用\u003c/td>\u003ctd>Rust\u003c/td>\u003ctd>編譯期間檢查多項規則\u003c/td>\u003ctd>資料關係需要符合所有權模型。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://doc.rust-lang.org/beta/book/ch04-01-what-is-ownership.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Rust 所有權\">Rust 所有權 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>垃圾回收 GC\u003c/td>\u003ctd>Go 等\u003c/td>\u003ctd>回收不再使用的記憶體\u003c/td>\u003ctd>CPU、記憶體及延遲有成本。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://go.dev/doc/gc-guide\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go 垃圾回收指南\">Go 垃圾回收指南 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>自動參照計數 ARC\u003c/td>\u003ctd>Swift 類別實例\u003c/td>\u003ctd>追蹤參照並自動清理\u003c/td>\u003ctd>強參照循環等仍需處理。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/automaticreferencecounting/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Swift ARC\">Swift ARC ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout tip\">\u003cstrong>資源不只有記憶體\u003c/strong>\u003cp>檔案、資料庫連線、鎖、背景工作與網路連線，都需要明確結束及錯誤處理。自動記憶體管理，不代表程式永遠不會累積資源或工作。\u003c/p>\u003c/aside>\u003c/section>\u003csection class=\"chapter\" id=\"languages\" aria-labelledby=\"heading-languages\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">08\u003c/span>\u003cdiv>\u003ch2 id=\"heading-languages\">主要語言詳解\u003c/h2>\u003cp class=\"lead\">逐項閱讀定位、優點、代價、必學概念及實際案例。\u003c/p>\u003c/div>\u003c/header>\u003caside class=\"callout tip\">\u003cstrong>比較口徑\u003c/strong>\u003cp>「優點」與「限制」不是絕對排名。「應用示例」是教學與工程情境，不代表實測結果或官方推薦。組合卡片會標明語言、平台與技術方向的區別。\u003c/p>\u003c/aside>\u003cdiv class=\"filterbox\">\u003clabel for=\"language-search\">搜尋語言、用途或概念\u003c/label>\u003cinput id=\"language-search\" type=\"search\" placeholder=\"例如：Python、工單、空值、GPU、交易…\" autocomplete=\"off\">\u003cdiv class=\"chips\" role=\"group\" aria-label=\"語言分類\">\u003cbutton type=\"button\" class=\"chip selected\" data-filter=\"全部\" aria-pressed=\"true\">全部\u003c/button>\u003cbutton type=\"button\" class=\"chip \" data-filter=\"自動化與後端\" aria-pressed=\"false\">自動化與後端\u003c/button>\u003cbutton type=\"button\" class=\"chip \" data-filter=\"Web 與企業\" aria-pressed=\"false\">Web 與企業\u003c/button>\u003cbutton type=\"button\" class=\"chip \" data-filter=\"系統與底層\" aria-pressed=\"false\">系統與底層\u003c/button>\u003cbutton type=\"button\" class=\"chip \" data-filter=\"手機與跨平台\" aria-pressed=\"false\">手機與跨平台\u003c/button>\u003cbutton type=\"button\" class=\"chip \" data-filter=\"資料與科學\" aria-pressed=\"false\">資料與科學\u003c/button>\u003cbutton type=\"button\" class=\"chip \" data-filter=\"腳本與平台\" aria-pressed=\"false\">腳本與平台\u003c/button>\u003cbutton type=\"button\" class=\"chip \" data-filter=\"函數式與規則\" aria-pressed=\"false\">函數式與規則\u003c/button>\u003cbutton type=\"button\" class=\"chip \" data-filter=\"GPU 與工控\" aria-pressed=\"false\">GPU 與工控\u003c/button>\u003c/div>\u003cp id=\"result-count\" role=\"status\" aria-live=\"polite\">\u003c/p>\u003c/div>\u003cdiv class=\"language-grid\">\u003carticle class=\"language-card\" id=\"lang-0\" data-category=\"自動化與後端\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">自動化與後端\u003c/span>\u003ch3>Python\u003c/h3>\u003cp class=\"tagline\">快速把工作流程變成程式\u003c/p>\u003c/div>\u003c/header>\u003cp>通用、動態型別；適合腳本、互動操作與快速應用開發。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>語法簡潔，容易把步驟、資料轉換及工具串接寫清楚；能把大型工作拆成可重用模組。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>型別註記預設不強制執行；環境與套件版本需管理。運算密集工作應量測底層函式庫，而非只看 Python 名稱。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>虛擬環境、套件鎖定、例外、型別分析、測試、API 與部署。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>把 Excel 詢價資料整理成標準欄位，再產生待確認的工單草稿。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要把臨時腳本直接視為可多人操作的正式交易系統。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.python.org/3/tutorial/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Python 官方教學\">Python 官方教學 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.python.org/3.12/library/typing.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Python 型別註記\">Python 型別註記 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-1\" data-category=\"Web 與企業\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">Web 與企業\u003c/span>\u003ch3>JavaScript\u003c/h3>\u003cp class=\"tagline\">理解網頁互動的基礎\u003c/p>\u003c/div>\u003c/header>\u003cp>動態型別，具有物件與函數等能力；是理解 Web 互動的重要起點。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>表達互動與非同步流程直接，可與網頁結構及樣式合作。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>隱式型別轉換容易造成誤解；事件與非同步順序需要明確設計。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>作用域、閉包、物件、Promise、async/await、事件、HTTP、資料驗證。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>建立核稿介面，顯示檔案資訊並送出客戶確認結果。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要把前端欄位限制當成後端安全驗證。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN JavaScript 型別\">MDN JavaScript 型別 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-2\" data-category=\"Web 與企業\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">Web 與企業\u003c/span>\u003ch3>TypeScript\u003c/h3>\u003cp class=\"tagline\">讓資料契約更清楚\u003c/p>\u003c/div>\u003c/header>\u003cp>在 JavaScript 基礎上增加靜態型別分析；型別不是執行時驗證。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可描述 API、表單、狀態與資料結構，改善跨模組協作及重構。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>型別會被擦除；過度使用 any 或不實的型別斷言，會繞過原本想要的保護。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>JavaScript 基礎、介面、聯集型別、泛型、unknown、型別縮小、執行時驗證。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>以不同型別描述草稿工單、已核准工單與生產快照。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要認為 as Order 會自動檢查 API 資料。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.typescriptlang.org/docs/handbook/typescript-from-scratch\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TypeScript 官方說明\">TypeScript 官方說明 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-3\" data-category=\"Web 與企業\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">Web 與企業\u003c/span>\u003ch3>Java\u003c/h3>\u003cp class=\"tagline\">以既有企業生態建立服務\u003c/p>\u003c/div>\u003c/header>\u003cp>具備靜態型別與物件導向能力，通常透過 Java 執行環境啟動。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合在既有 Java 程式資產、工具與人員能力上持續建置。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>必須理解 JDK、建置、相依套件、執行環境與所採用的服務架構。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>類別、介面、泛型、例外、集合、併發、測試、建置與觀測。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>為已有 Java 系統的公司擴充訂單 API 與資料同步服務。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要因為加入 AI，就先決定重寫穩定的 Java 核心。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://dev.java/learn/jvm/core-tools/java/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Java 啟動與執行環境\">Java 啟動與執行環境 ↗\u003c/a>\u003ca class=\"src\" href=\"https://learn.microsoft.com/zh-tw/dotnet/csharp/tour-of-csharp/tips-for-java-developers\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C# 與 Java\">C# 與 Java ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-4\" data-category=\"Web 與企業\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">Web 與企業\u003c/span>\u003ch3>C#\u003c/h3>\u003cp class=\"tagline\">用 .NET 建構多種應用\u003c/p>\u003c/div>\u003c/header>\u003cp>靜態型別語言，處於 .NET 生態，可用於 Web、桌面及其他應用方向。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>同一生態能涵蓋多種工作負載；適合結合既有 .NET 元件與企業整合。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>仍須選擇與理解 UI、資料存取、非同步及部署框架，不是只學語法。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>class／struct／record、介面、泛型、非同步、資料存取、測試與部署。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>主後端負責權限、工單與交易，Python 服務處理 AI 文件擷取。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要把 C# 等同於只能做 Windows 桌面程式。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.learn.microsoft.com/en-sg/dotnet/csharp/tour-of-csharp/what-you-can-build\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C# 應用範圍\">C# 應用範圍 ↗\u003c/a>\u003ca class=\"src\" href=\"https://learn.microsoft.com/zh-tw/dotnet/csharp/tour-of-csharp/tips-for-java-developers\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C# 與 Java\">C# 與 Java ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-5\" data-category=\"自動化與後端\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">自動化與後端\u003c/span>\u003ch3>Go\u003c/h3>\u003cp class=\"tagline\">服務、工具與多工作協作\u003c/p>\u003c/div>\u003c/header>\u003cp>具備 goroutine、垃圾回收及官方診斷工具的語言與工具鏈。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合評估 API、資料代理及長時間執行的服務；診斷工具有助分析資源使用。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>GC 有資源成本；goroutine 若沒有結束、取消與限制，仍會造成問題。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>錯誤處理、goroutine、同步、context、取消、工作上限、測試與 profiling。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>在工廠端收集設備資料，斷線後恢復傳送並提供健康檢查。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要因為容易啟動工作，就無限制增加併發。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://go.dev/doc/diagnostics\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go 診斷工具\">Go 診斷工具 ↗\u003c/a>\u003ca class=\"src\" href=\"https://go.dev/doc/gc-guide\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go 垃圾回收指南\">Go 垃圾回收指南 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-6\" data-category=\"Web 與企業\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">Web 與企業\u003c/span>\u003ch3>PHP\u003c/h3>\u003cp class=\"tagline\">伺服器端 Web 的候選\u003c/p>\u003c/div>\u003c/header>\u003cp>可建立伺服器應用，也能執行命令列工作；型別主要在執行時處理。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合評估既有網站、後台及內容型應用的擴充。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>不同年代程式風格差異可能很大，需規範、測試及安全設定。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>HTTP、表單、資料庫、權限、依賴管理、測試與版本。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>在既有 PHP 網站增加詢價與訂單查詢，不必先重做整個網站。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要用語言名稱替代程式品質、版本與安全檢查。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.php.net/manual/en/features.php\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PHP 官方功能文件\">PHP 官方功能文件 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.php.net/manual/en/language.types.intro.php\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PHP 型別說明\">PHP 型別說明 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.php.net/manual/en/security.intro.php\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PHP 安全文件\">PHP 安全文件 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-7\" data-category=\"Web 與企業\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">Web 與企業\u003c/span>\u003ch3>Ruby\u003c/h3>\u003cp class=\"tagline\">重視表達與開發者體驗\u003c/p>\u003c/div>\u003c/header>\u003cp>通用、物件導向語言；常與 Ruby on Rails 應用生態一同評估。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可用有表達力的語法描述資料與應用行為。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>彈性需要團隊約定；應避免過度隱含的寫法使維護者難以追蹤。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>物件、區塊、例外、套件、測試及所用框架慣例。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估以成熟既有 Ruby 系統延伸商業流程。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要把框架自動產生的功能當成不需要理解的黑箱。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.britannica.com/technology/Ruby-programming-language\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Ruby 語言介紹\">Ruby 語言介紹 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-8\" data-category=\"系統與底層\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">系統與底層\u003c/span>\u003ch3>C\u003c/h3>\u003cp class=\"tagline\">直接理解記憶體與資料表示\u003c/p>\u003c/div>\u003c/header>\u003cp>提供指標、結構、記憶體及底層介面的控制。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合精確處理資料布局、受限資源與既有 C 介面。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>配置、釋放、越界與同步等正確性，需要開發者及工具嚴格把關。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>指標、陣列、字串、結構、生命週期、編譯、連結與偵錯。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>讀懂設備 SDK 或現存底層函式庫的介面。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：語法核心相對小，不代表正式工程容易。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.cppreference.com/c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C 語言參考\">C 語言參考 ↗\u003c/a>\u003ca class=\"src\" href=\"https://cppreference.com/c/memory\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C 動態記憶體\">C 動態記憶體 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-9\" data-category=\"系統與底層\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">系統與底層\u003c/span>\u003ch3>C++\u003c/h3>\u003cp class=\"tagline\">高階抽象與資源控制並存\u003c/p>\u003c/div>\u003c/header>\u003cp>具有類別、泛型與廣泛函式庫的系統語言。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>RAII、容器與智慧指標能把資源清理整合到物件生命週期。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>語言範圍大；生命週期、移動、模板、建置與 ABI 相容性皆有成本。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>RAII、智慧指標、容器、參照、泛型、編譯／連結、偵錯與測試。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>製作 Illustrator 深度外掛或使用既有高效能底層函式庫。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要把現代 C++ 簡化成到處手寫 new／delete。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://en.cppreference.com/w/Main_Page.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C++ 參考\">C++ 參考 ↗\u003c/a>\u003ca class=\"src\" href=\"https://isocpp.org/wiki/faq/exceptions\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C++ RAII 說明\">C++ RAII 說明 ↗\u003c/a>\u003ca class=\"src\" href=\"https://cppreference.com/cpp/memory\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C++ 記憶體管理\">C++ 記憶體管理 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.adobe.com/illustrator/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Adobe Illustrator 開發\">Adobe Illustrator 開發 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-10\" data-category=\"系統與底層\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">系統與底層\u003c/span>\u003ch3>Rust\u003c/h3>\u003cp class=\"tagline\">把所有權規則交給編譯器檢查\u003c/p>\u003c/div>\u003c/header>\u003cp>以所有權、移動與借用管理記憶體，不依賴一般垃圾回收模型。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可在編譯期間拒絕多種不合法的記憶體使用方式。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>資料共享與生命週期需依所有權模型設計，入門與結構調整成本不可忽視。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>所有權、借用、生命週期、Result／Option、trait、測試與介面邊界。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估需要長期維護、資源可控的檔案解析器與工具。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：記憶體安全不保證權限、稅額或生產規格正確。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://doc.rust-lang.org/beta/book/ch04-01-what-is-ownership.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Rust 所有權\">Rust 所有權 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-11\" data-category=\"系統與底層\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">系統與底層\u003c/span>\u003ch3>Zig\u003c/h3>\u003cp class=\"tagline\">明確控制配置與程式行為\u003c/p>\u003c/div>\u003c/header>\u003cp>通用語言與工具鏈；記憶體配置通常明確傳入配置器。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>能清楚表達資源配置策略，適合評估不同資源限制的環境。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>沒有與 Rust 相同的所有權保證；需自行管理記憶體正確性，並查驗工具鏈版本。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>配置器、指標、切片、錯誤處理、編譯期運算與 C 互通。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>開發需要控制配置策略的小型底層元件。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：採用前應確認所需函式庫、版本穩定性與維護方案。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://ziglang.org/documentation/master/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Zig 官方語言參考\">Zig 官方語言參考 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-12\" data-category=\"手機與跨平台\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">手機與跨平台\u003c/span>\u003ch3>Swift\u003c/h3>\u003cp class=\"tagline\">型別、Optional 與 ARC\u003c/p>\u003c/div>\u003c/header>\u003cp>具備型別安全、Optional 與自動參照計數等能力。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>能明確表達值可能不存在，並以 ARC 管理類別實例的記憶體。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>強制解包仍可能失敗；強參照循環等問題需設計者處理。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>Optional、值與參照、ARC、錯誤處理、非同步與目標平台 SDK。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>若確有原生平台需求，評估開發現場工作或客戶端應用。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要因為有 ARC，就忽略物件之間的持有關係。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Swift 基礎\">Swift 基礎 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/automaticreferencecounting/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Swift ARC\">Swift ARC ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-13\" data-category=\"手機與跨平台\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">手機與跨平台\u003c/span>\u003ch3>Kotlin\u003c/h3>\u003cp class=\"tagline\">可空型別與 Java 互通\u003c/p>\u003c/div>\u003c/header>\u003cp>靜態型別語言，將可空性納入型別系統，並重視 Java 互通。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>能提早檢查多項空值使用問題；可沿用 Java 程式資產。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>!!、初始化及 Java 平台型別等情況仍可能出現空值錯誤。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>可空型別、資料模型、集合、非同步、Java 互通與目標平台。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>在已有 Java 資源的專案評估新功能與平台端程式。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不能把「空值安全」解讀成完全不可能有 NullPointerException。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://kotlinlang.org/docs/null-safety.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Kotlin 空值安全\">Kotlin 空值安全 ↗\u003c/a>\u003ca class=\"src\" href=\"https://kotlinlang.org/docs/java-interop.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Kotlin 與 Java\">Kotlin 與 Java ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-14\" data-category=\"手機與跨平台\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">手機與跨平台\u003c/span>\u003ch3>Dart\u003c/h3>\u003cp class=\"tagline\">具備健全型別與空值安全\u003c/p>\u003c/div>\u003c/header>\u003cp>提供型別及空值安全，常與使用它的 UI 框架一起評估。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>能提早發現多種不合法的空值存取。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>語言保證不能取代平台能力與外掛相容性驗證。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>型別、空值、Future、Stream、非同步、平台橋接與打包。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估需要多平台 UI 的內部作業 App。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不一定需要獨立 App；先確認 Web 是否已滿足需求。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://dart.dev/language/variables\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Dart 變數與空值安全\">Dart 變數與空值安全 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-15\" data-category=\"資料與科學\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">資料與科學\u003c/span>\u003ch3>SQL\u003c/h3>\u003cp class=\"tagline\">資料模型、交易與查詢的核心\u003c/p>\u003c/div>\u003c/header>\u003cp>查詢與資料操作語言；不同資料庫有不同擴充與執行細節。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可在資料庫層表達結構、約束、交易及集合式資料操作。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>語法寫得出來，不代表查詢有效率或併發行為正確。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>主外鍵、JOIN、聚合、交易、索引、鎖定、遷移與執行計畫。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>追查訂單、材料、工單版本與生產狀態的關聯。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要把所有資料塞進一張表，或以換語言取代索引分析。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.postgresql.org/docs/current/sql.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PostgreSQL SQL 文件\">PostgreSQL SQL 文件 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-16\" data-category=\"資料與科學\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">資料與科學\u003c/span>\u003ch3>R\u003c/h3>\u003cp class=\"tagline\">統計與圖形導向\u003c/p>\u003c/div>\u003c/header>\u003cp>用於統計計算與圖形的語言及環境。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合以分析工作為核心，組合統計方法、資料操作與視覺化。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>分析腳本與多人交易系統的需求不同，正式服務需另外規劃。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>資料型別、表格處理、統計假設、套件版本、重現性與結果驗證。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>分析報廢率、交期偏差與製程品質，但需先確認資料定義。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：分析有相關性，不代表已證明因果。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://cloud.r-project.org/doc/manuals/r-patched/R-lang.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"R 語言定義\">R 語言定義 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-17\" data-category=\"資料與科學\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">資料與科學\u003c/span>\u003ch3>Julia\u003c/h3>\u003cp class=\"tagline\">數學模型與多重分派\u003c/p>\u003c/div>\u003c/header>\u003cp>結合型別推論、JIT 及多重分派的數值運算方向語言。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可針對參數型別組合定義行為，讓不同數學資料使用一致的操作。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>編譯、型別與實作方式會影響結果；不能只看語法推定效能。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>多重分派、型別、陣列、數值穩定性、編譯成本與 profiling。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估專門的排程數學模型或工程模擬工具。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：沒有明確數學工作負載時，不必為追求新語言而增加技術棧。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.julialang.org/en/v1.9/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Julia 語言文件\">Julia 語言文件 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-18\" data-category=\"資料與科學\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">資料與科學\u003c/span>\u003ch3>Fortran\u003c/h3>\u003cp class=\"tagline\">現存科學計算資產的重要語言\u003c/p>\u003c/div>\u003c/header>\u003cp>具有線性代數、最佳化與大型科學應用套件的語言。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合延用經驗證的數值函式庫與既有科學程式。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>價值取決於科學工作負載與現存程式資產，不是一般 Web 預設選擇。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>陣列、數值精度、模組、編譯器、函式庫互通與重現性。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>接手既有數值程式時，先驗證介面與結果，再決定是否包裝。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：年代早不等於沒有實際用途。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://fortran-lang.org/packages/numerical/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Fortran 數值套件\">Fortran 數值套件 ↗\u003c/a>\u003ca class=\"src\" href=\"https://fortran-lang.org/packages/scientific/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Fortran 科學應用\">Fortran 科學應用 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-19\" data-category=\"資料與科學\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">資料與科學\u003c/span>\u003ch3>MATLAB\u003c/h3>\u003cp class=\"tagline\">語言、工程產品與工具箱生態\u003c/p>\u003c/div>\u003c/header>\u003cp>應將 MATLAB 語言及其商業產品、工具箱一併評估。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>若既有工程流程依賴相關工具箱，能延續現有模型與工作方法。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>主產品、工具箱與部署所需授權需分別確認；不能只比語法。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>矩陣、數值分析、工具箱、版本、授權及模型交付方式。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估已有工程計算或訊號處理流程的擴充。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要假設購買主程式就包含所有工具箱。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.mathworks.com/products.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MathWorks 產品\">MathWorks 產品 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.mathworks.com/store/products/standard/annual/ML\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MATLAB 授權資訊\">MATLAB 授權資訊 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-20\" data-category=\"資料與科學\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">資料與科學\u003c/span>\u003ch3>GNU Octave\u003c/h3>\u003cp class=\"tagline\">以數值計算與相近語法為主\u003c/p>\u003c/div>\u003c/header>\u003cp>高階數值計算語言，語法與 MATLAB 大致相容。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可處理矩陣、方程與圖形等工作，適合評估既有數值腳本的可攜性。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>大致相容不代表所有語法、工具箱及行為都可直接替換。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>矩陣、數值方法、套件、相容性測試與輸出比對。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>以真實測試資料檢查既有腳本能否改在 Octave 執行。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要省略精度、邊界條件與工具箱相容性測試。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.octave.org/doxygen/stable/index.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"GNU Octave 官方說明\">GNU Octave 官方說明 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-21\" data-category=\"自動化與後端\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">自動化與後端\u003c/span>\u003ch3>Bash\u003c/h3>\u003cp class=\"tagline\">組合命令列工具\u003c/p>\u003c/div>\u003c/header>\u003cp>Shell 語言，負責指令、展開、重新導向與流程編排。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合串接既有 CLI、批次檔案工作及部署步驟。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>空白、特殊字元、引號與錯誤狀態常是風險；複雜資料流程應評估其他工具。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>引號、參數、路徑、退出碼、管線、權限及可攜性。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>整理每日檔案、呼叫備份指令並檢查執行結果。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要把不可信輸入直接拼進命令字串。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.gnu.org/software/bash/manual/html_node/Shell-Syntax.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Bash 語法\">Bash 語法 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.gnu.org/software/bash/manual/html_node/Quoting.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Bash 引號\">Bash 引號 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-22\" data-category=\"自動化與後端\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">自動化與後端\u003c/span>\u003ch3>PowerShell\u003c/h3>\u003cp class=\"tagline\">以物件管線做自動化\u003c/p>\u003c/div>\u003c/header>\u003cp>管線可以傳遞物件，不應只把它當成文字命令列。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合以屬性、篩選及物件操作完成管理工作。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>需理解物件型別、參數繫結與錯誤處理；不同環境仍要驗證模組相容性。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>物件、管線、cmdlet、CSV／JSON、錯誤處理與權限。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>整理檔案清單、匯出 CSV 或自動檢查工作站狀態。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：與 Bash 的資料流不同，不能只逐字替換指令。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_pipelines?view=powershell-7.5\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PowerShell 管線\">PowerShell 管線 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-23\" data-category=\"自動化與後端\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">自動化與後端\u003c/span>\u003ch3>Perl\u003c/h3>\u003cp class=\"tagline\">文字擷取與既有腳本維護\u003c/p>\u003c/div>\u003c/header>\u003cp>具備文字處理、正規表示式及多種程式設計能力。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合文字擷取、格式轉換、報表及現存腳本延伸。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>可寫法多，需要統一風格；隱含規則過多會提高交接成本。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>正規表示式、文字編碼、資料結構、模組與測試。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>接手長期使用的文字轉檔流程，先補測試再修改。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要在不了解舊規則的情況下直接重寫。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://perldoc.perl.org/perlintro\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Perl 官方入門\">Perl 官方入門 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-24\" data-category=\"腳本與平台\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">腳本與平台\u003c/span>\u003ch3>Lua\u003c/h3>\u003cp class=\"tagline\">讓宿主應用能被擴充\u003c/p>\u003c/div>\u003c/header>\u003cp>輕量且可嵌入的語言，由宿主程式提供可用的介面。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>宿主能呼叫 Lua，也能向 Lua 註冊功能，便於開放應用內自動化。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>可操作範圍取決於宿主，不能假設每個 Lua 環境都有同樣函式。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>table、函式、宿主 API、錯誤、資料傳遞與版本。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>在提供 Lua API 的設備或應用內撰寫自訂邏輯。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：先找宿主文件，再查一般 Lua 語法。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.lua.org/manual/5.4/manual.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Lua 語言參考\">Lua 語言參考 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-25\" data-category=\"腳本與平台\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">腳本與平台\u003c/span>\u003ch3>AppleScript\u003c/h3>\u003cp class=\"tagline\">支援軟體中的桌面自動化\u003c/p>\u003c/div>\u003c/header>\u003cp>是 Illustrator 官方列出的腳本選項之一；實際能力取決於應用介面。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>在適合的宿主環境可串接應用操作。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>跨平台與版本限制需確認；UI 操作與正式 API 的可靠性不同。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>應用字典、權限、宿主物件、錯誤處理與版本相容性。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估 macOS 上現存 Adobe 操作流程的自動化。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要把只能靠畫面點擊的流程視為與正式資料 API 同樣可靠。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.adobe.com/illustrator/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Adobe Illustrator 開發\">Adobe Illustrator 開發 ↗\u003c/a>\u003ca class=\"src\" href=\"https://helpx.adobe.com/illustrator/desktop/automate-visualize-data/automate-actions/install-and-run-scripts.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Illustrator 腳本支援\">Illustrator 腳本支援 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-26\" data-category=\"腳本與平台\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">腳本與平台\u003c/span>\u003ch3>ExtendScript／Adobe JavaScript\u003c/h3>\u003cp class=\"tagline\">直接自動化 Illustrator 文件\u003c/p>\u003c/div>\u003c/header>\u003cp>Adobe 應用的腳本環境；語言能力與物件模型須依宿主確認。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>能在應用內執行重複文件操作，通常比立刻開發外掛更容易驗證。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>不是一般瀏覽器環境；語法、API 與版本皆不能直接假設相同。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>文件、圖層、文字、物件選取、儲存匯出、單位與錯誤恢復。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>批次修改可變資料、整理圖層或產生文件輸出。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：先在副本執行，並記錄版本與輸出結果。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://helpx.adobe.com/illustrator/desktop/automate-visualize-data/automate-actions/install-and-run-scripts.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Illustrator 腳本支援\">Illustrator 腳本支援 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.adobe.com/illustrator/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Adobe Illustrator 開發\">Adobe Illustrator 開發 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-27\" data-category=\"函數式與規則\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">函數式與規則\u003c/span>\u003ch3>F#\u003c/h3>\u003cp class=\"tagline\">在 .NET 使用函數式建模\u003c/p>\u003c/div>\u003c/header>\u003cp>支援函數式、物件導向與命令式的多典範語言。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可將型別化資料、函數組合與 .NET 互通結合。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>團隊需熟悉模式比對、不可變資料及領域建模方式。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>函數、聯集型別、模式比對、模組、組合與 .NET 介面。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>把報價規則拆成可測試的純函數與明確的資料狀態。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不必為了函數式而把所有簡單工作寫成過深抽象。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://learn.microsoft.com/en-us/dotnet/fsharp/language-reference/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"F# 語言參考\">F# 語言參考 ↗\u003c/a>\u003ca class=\"src\" href=\"https://learn.microsoft.com/en-us/dotnet/fsharp/tutorials/functional-programming-concepts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"F# 函數式觀念\">F# 函數式觀念 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-28\" data-category=\"函數式與規則\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">函數式與規則\u003c/span>\u003ch3>Scala\u003c/h3>\u003cp class=\"tagline\">物件導向與函數式並用\u003c/p>\u003c/div>\u003c/header>\u003cp>靜態型別、多典範語言，結合物件導向與函數式。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>能以型別與抽象清楚表達複雜資料關係。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>語言選項多；抽象層次及工具鏈需有團隊規範。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>型別、模式比對、函數、集合、泛型與平台互通。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>在既有 Scala 或相容平台資產下擴充服務。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要讓同一團隊各自採取完全不同的語言風格。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.scala-lang.org/tour/tour-of-scala.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Scala 官方導覽\">Scala 官方導覽 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-29\" data-category=\"函數式與規則\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">函數式與規則\u003c/span>\u003ch3>Haskell\u003c/h3>\u003cp class=\"tagline\">純函數、型別與惰性求值\u003c/p>\u003c/div>\u003c/header>\u003cp>純函數式、靜態型別，具備型別推論及惰性求值。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>有助於分清資料轉換與副作用，讓邏輯更容易推理。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>I/O、惰性、狀態及錯誤模型需要新的思考方式。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>代數資料型別、型別類別、模式比對、惰性、I/O 與測試。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>學習如何將報價計算與外部資料讀寫分離。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：編譯通過不代表不存在執行錯誤或錯誤需求。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.haskell.org/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Haskell 官方介紹\">Haskell 官方介紹 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.haskell.org/onlinereport/haskell2010/haskellch1.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Haskell 語言報告\">Haskell 語言報告 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-30\" data-category=\"函數式與規則\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">函數式與規則\u003c/span>\u003ch3>OCaml\u003c/h3>\u003cp class=\"tagline\">型別化資料與不可變設計\u003c/p>\u003c/div>\u003c/header>\u003cp>重視靜態型別與不可變資料，也可用於 Web 工作。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合需要清楚資料模型及型別檢查的應用。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>應確認所需函式庫、部署與團隊的長期維護能力。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>資料型別、模式比對、模組、錯誤與測試。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估資料解析、規則或需要清晰模型的元件。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要在生態未驗證前只因語言優雅就承諾交期。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://ocaml.org/docs/is-ocaml-web-yet\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"OCaml Web 開發說明\">OCaml Web 開發說明 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-31\" data-category=\"函數式與規則\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">函數式與規則\u003c/span>\u003ch3>Clojure\u003c/h3>\u003cp class=\"tagline\">以資料與組合描述系統\u003c/p>\u003c/div>\u003c/header>\u003cp>動態語言；spec 可用於描述資料規格並支援驗證與測試。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>有助把資料形狀、規格與行為組合起來。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>規格描述不等於全面靜態型別保證；仍需確定何時實際驗證。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>資料結構、函數、不可變性、spec、驗證與平台互通。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估以資料驅動的規則與整合流程。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：避免把動態資料的彈性變成沒有資料契約。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://clojure.org/about/spec\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Clojure spec\">Clojure spec ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-32\" data-category=\"函數式與規則\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">函數式與規則\u003c/span>\u003ch3>Elixir／Erlang 生態\u003c/h3>\u003cp class=\"tagline\">程序、訊息與容錯思考\u003c/p>\u003c/div>\u003c/header>\u003cp>Elixir 建立在 Erlang VM 與 OTP 生態上；兩者是不同語言。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>值得評估大量獨立工作、訊息協作及故障隔離需求。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>需理解程序、訊息、監督與分散式故障，不是只學語法。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>OTP、程序、訊息、工作生命週期、恢復與觀測。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估需要持續連線與工作隔離的服務。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：大量連線能力不等於每種 CPU 密集運算都適合。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://elixir-lang.org/learning/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Elixir 官方學習資源\">Elixir 官方學習資源 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-33\" data-category=\"函數式與規則\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">函數式與規則\u003c/span>\u003ch3>Prolog／CLP\u003c/h3>\u003cp class=\"tagline\">描述關係、規則與限制\u003c/p>\u003c/div>\u003c/header>\u003cp>Prolog 是邏輯語言；CLP 是約束邏輯程式設計方向，不是另一個單一品牌語言。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可用約束傳播縮小搜尋空間，適合明確限制的可行解問題。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>搜尋順序、領域、終止與問題規模需驗證。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>關係、統一、回溯、規則、有限領域、約束與搜尋策略。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>把機台、工序先後及材料限制整理成排程模型。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：先整理限制與目標，別先指定語言再硬套問題。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.swi-prolog.org/GetStarted.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SWI-Prolog 入門\">SWI-Prolog 入門 ↗\u003c/a>\u003ca class=\"src\" href=\"https://swish.swi-prolog.org/pldoc/man?section=clp\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Prolog 約束程式設計\">Prolog 約束程式設計 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-34\" data-category=\"腳本與平台\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">腳本與平台\u003c/span>\u003ch3>ABAP\u003c/h3>\u003cp class=\"tagline\">SAP 商業應用與擴充\u003c/p>\u003c/div>\u003c/header>\u003cp>SAP 的商業應用語言，整合平台資料與開發能力。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可在 SAP 權限、資料及商業模型中建立擴充。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>語言版本與可使用物件受平台限制，不能只看一般語法。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>資料字典、商業物件、交易、正式 API、擴充規範與版本。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>替現有 SAP 流程增加必要的商業功能。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不能把通用新系統的需求直接等同於需要 ABAP。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://help.sap.com/doc/abapdocu_latest_index_htm/latest/en-US/ABENABAP_OVERVIEW.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SAP ABAP 語言\">SAP ABAP 語言 ↗\u003c/a>\u003ca class=\"src\" href=\"https://learning.sap.com/courses/basic-abap-programming/understanding-the-basics-of-abap_c0e5346f-a136-4b9f-a167-9031eca12932\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"ABAP 語言版本\">ABAP 語言版本 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-35\" data-category=\"系統與底層\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">系統與底層\u003c/span>\u003ch3>Ada\u003c/h3>\u003cp class=\"tagline\">重視可靠性與規格\u003c/p>\u003c/div>\u003c/header>\u003cp>具備強型別、檢查、並行及即時系統相關能力。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>適合評估需要清楚規格、契約及產業保證的工作。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>工具、執行環境、驗證程序與團隊能力都需一起規劃。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>型別、契約、任務、執行時檢查、規格與測試。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>了解安全關鍵產業為何重視可分析性與可追溯性。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：語言特性不能代替整套安全工程程序。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://learn.adacore.com/booklets/adacore-technologies-for-airborne-software/chapters/tools.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Ada 與安全關鍵軟體\">Ada 與安全關鍵軟體 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-36\" data-category=\"系統與底層\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">系統與底層\u003c/span>\u003ch3>SPARK\u003c/h3>\u003cp class=\"tagline\">以契約進行形式分析\u003c/p>\u003c/div>\u003c/header>\u003cp>基於 Ada，限制部分難以驗證的功能，並擴充契約及證明能力。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可分析資料流，並針對明確性質進行形式驗證。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>證明只涵蓋指定性質與假設；工具與規格本身也需要管理。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>前後置條件、迴圈不變量、證明義務、假設與測試邊界。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>借用其思想，明確描述工單放行必須滿足的限制。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：形式驗證不是對所有實際問題的無條件保證。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.adacore.com/spark2014-docs/html/ug/en/introduction.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SPARK 官方介紹\">SPARK 官方介紹 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-37\" data-category=\"GPU 與工控\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">GPU 與工控\u003c/span>\u003ch3>CUDA C／C++\u003c/h3>\u003cp class=\"tagline\">把可平行部分交給 GPU\u003c/p>\u003c/div>\u003c/header>\u003cp>CUDA 是平台與程式設計模型；CUDA C／C++ 是以 C／C++ 擴充描述 GPU 程式的方向。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>CPU 與 GPU 可分工，對適合的平行工作可評估專門核心。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>資料搬移、記憶體、執行緒配置與同步都可能成為成本；需符合硬體與工具鏈要求。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>host／device、kernel、資料傳輸、記憶體階層、同步與 profiling。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>實測確認影像或推論運算瓶頸後，再評估自訂 GPU kernel。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不要把 CUDA 當成任何品牌 GPU 都可直接執行的通用承諾。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CUDA 程式設計模型\">CUDA 程式設計模型 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.nvidia.com/blog/easy-introduction-cuda-c-and-c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CUDA C／C++ 入門\">CUDA C／C++ 入門 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-38\" data-category=\"GPU 與工控\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">GPU 與工控\u003c/span>\u003ch3>WGSL\u003c/h3>\u003cp class=\"tagline\">WebGPU 使用的 GPU 語言\u003c/p>\u003c/div>\u003c/header>\u003cp>WebGPU Shading Language，用於描述 GPU 上執行的 shader。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>在 WebGPU 模型中表達 GPU 工作。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>需理解 pipeline、資源綁定與記憶體布局；不能當作一般 UI 語言。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>shader、入口函數、工作群組、資源、型別與記憶體配置。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估符合平台支援條件的瀏覽器 GPU 工作。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：語言支援、瀏覽器支援與硬體限制是不同層。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.w3.org/TR/WGSL/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"W3C WGSL 規格\">W3C WGSL 規格 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-39\" data-category=\"GPU 與工控\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">GPU 與工控\u003c/span>\u003ch3>Structured Text，ST\u003c/h3>\u003cp class=\"tagline\">PLC 的文字式控制語言\u003c/p>\u003c/div>\u003c/header>\u003cp>IEC 61131-3 第四版列出的文字式語言。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>以文字表達條件、運算與控制邏輯，便於評估較複雜的程序。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>實際任務、時序、I/O 及可用功能依控制器平台確認。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>掃描／任務模型、狀態、I/O、計時、互鎖、測試與安全停機。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>設備供應商允許的情況下，建立可驗證的機台程序。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：上層 AI 不應繞過正式安全互鎖。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.plcopen.org/standards/logic/iec-61131-3/status-iec-61131-3-standard/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PLCopen 第四版狀態\">PLCopen 第四版狀態 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.plcopen.org/standards/logic/iec-61131-3/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PLCopen 相容性問答\">PLCopen 相容性問答 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-40\" data-category=\"GPU 與工控\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">GPU 與工控\u003c/span>\u003ch3>LD／FBD／SFC\u003c/h3>\u003cp class=\"tagline\">圖形控制與程序組織\u003c/p>\u003c/div>\u003c/header>\u003cp>LD、FBD 是圖形語言；SFC 用於組織程式與功能區塊，不宜全部當成同一種語法。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>圖形有助表達接點邏輯、功能連接或程序步驟。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>相同標準不保證廠商間完整專案可直接互換；版本需查驗。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>狀態、訊號流、轉移條件、故障、安全狀態與廠商工具。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>與設備商共同盤點現有 PLC 專案及可開放介面。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：舊資料可能列出 IL，應以實際標準版次與廠商支援判定。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.plcopen.org/standards/logic/iec-61131-3/status-iec-61131-3-standard/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PLCopen 第四版狀態\">PLCopen 第四版狀態 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.plcopen.org/standards/logic/iec-61131-3/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PLCopen 相容性問答\">PLCopen 相容性問答 ↗\u003c/a>\u003c/span>\u003c/article>\u003carticle class=\"language-card\" id=\"lang-41\" data-category=\"腳本與平台\">\u003cheader>\u003cdiv>\u003cspan class=\"badge\">腳本與平台\u003c/span>\u003ch3>WebAssembly，Wasm\u003c/h3>\u003cp class=\"tagline\">跨語言的編譯目標\u003c/p>\u003c/div>\u003c/header>\u003cp>低階位元組碼與編譯目標，通常由 C、C++、Rust 等來源語言產生。\u003c/p>\u003cdl>\u003cdt class=\"positive\">優點與價值\u003c/dt>\u003cdd>可將既有運算元件帶入相容環境，並與 JavaScript 協作。\u003c/dd>\u003cdt class=\"negative\">限制與代價\u003c/dt>\u003cdd>宿主 API、資料傳遞、初始化及相容性需驗證；不是自動 GPU 加速。\u003c/dd>\u003cdt>必須了解\u003c/dt>\u003cdd>模組、線性記憶體、來源工具鏈、宿主介面與部署。\u003c/dd>\u003cdt>應用示例\u003c/dt>\u003cdd>評估在瀏覽器中使用已有的運算或解析函式庫。\u003c/dd>\u003c/dl>\u003cdiv class=\"card-warning\">提醒：不是取代所有 JavaScript，也不是只要編譯就能存取所有系統能力。\u003c/div>\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN WebAssembly 概念\">MDN WebAssembly 概念 ↗\u003c/a>\u003ca class=\"src\" href=\"https://web.dev/articles/what-is-webassembly\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"WebAssembly 與執行環境\">WebAssembly 與執行環境 ↗\u003c/a>\u003c/span>\u003c/article>\u003c/div>\u003cp id=\"no-results\" hidden>沒有符合條件的項目。請清除關鍵字，或改選「全部」。\u003c/p>\u003c/section>\u003csection class=\"chapter\" id=\"sql\" aria-labelledby=\"heading-sql\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">09\u003c/span>\u003cdiv>\u003ch2 id=\"heading-sql\">SQL 與資料設計\u003c/h2>\u003cp class=\"lead\">企業軟體不是只有畫面；正確資料與一致性才是核心。\u003c/p>\u003c/div>\u003c/header>\u003cp>PostgreSQL 的 SQL 文件涵蓋建表、資料操作、型別、函式、調校與併發控制。因此只學 SELECT，還不足以處理完整的商業系統。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.postgresql.org/docs/current/sql.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PostgreSQL SQL 文件\">PostgreSQL SQL 文件 ↗\u003c/a>\u003c/span>\u003c/p>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"必學部分、要回答的問題、工單系統中的意義\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">必學部分\u003c/th>\u003cth scope=\"col\">要回答的問題\u003c/th>\u003cth scope=\"col\">工單系統中的意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>資料建模\u003c/td>\u003ctd>哪些資料是獨立實體？關係是什麼？\u003c/td>\u003ctd>客戶、產品、訂單、材料、稿件版本與工序分開定義\u003c/td>\u003c/tr>\u003ctr>\u003ctd>資料約束\u003c/td>\u003ctd>哪些狀態永遠不得成立？\u003c/td>\u003ctd>必要欄位、唯一識別與有效關聯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>查詢\u003c/td>\u003ctd>如何連接、分組與彙總？\u003c/td>\u003ctd>追查交期、材料、產量及異常\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交易\u003c/td>\u003ctd>哪些修改必須一起成功或一起撤回？\u003c/td>\u003ctd>避免只寫入一半的正式資料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>併發\u003c/td>\u003ctd>同時操作時誰能修改什麼？\u003c/td>\u003ctd>庫存、預約、排程與核准\u003c/td>\u003c/tr>\u003ctr>\u003ctd>索引與調校\u003c/td>\u003ctd>資料如何取得？是否掃描太多？\u003c/td>\u003ctd>先檢查查詢，再決定是否需要架構更動\u003c/td>\u003c/tr>\u003ctr>\u003ctd>遷移與版本\u003c/td>\u003ctd>修改結構如何不破壞既有資料？\u003c/td>\u003ctd>可回溯的資料庫更新流程\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout tip\">\u003cstrong>資料與交易的工程建議\u003c/strong>\u003cp>金額、長度、面積、重量與數量要記錄單位及精度。跨系統需定義哪一方是權威來源。重試與重複請求要可識別，避免重複建單。具體型別、交易與鎖定行為，需查所選資料庫文件。\u003c/p>\u003c/aside>\u003cp>\u003cb>SQL 的價值：\u003c/b>把資料結構與操作放在資料庫層處理；\u003cb>主要代價：\u003c/b>必須理解資料模型、執行成本及不同產品的擴充差異。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.postgresql.org/docs/current/sql.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PostgreSQL SQL 文件\">PostgreSQL SQL 文件 ↗\u003c/a>\u003c/span>\u003c/p>\u003c/section>\u003csection class=\"chapter\" id=\"special\" aria-labelledby=\"heading-special\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">10\u003c/span>\u003cdiv>\u003ch2 id=\"heading-special\">GPU、工控與驗證\u003c/h2>\u003cp class=\"lead\">專用領域應從執行模型與標準理解，不要只記名稱。\u003c/p>\u003c/div>\u003c/header>\u003ch3>GPU：先理解 CPU／GPU 分工\u003c/h3>\u003cp>CUDA 模型區分 host 與 device；CPU 負責啟動工作與處理協作，GPU 執行 kernel。資料搬移、記憶體與同步，都屬於需要設計的部分。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CUDA 程式設計模型\">CUDA 程式設計模型 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.nvidia.com/blog/easy-introduction-cuda-c-and-c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CUDA C／C++ 入門\">CUDA C／C++ 入門 ↗\u003c/a>\u003c/span>\u003c/p>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"技術、正確定位、不要混淆\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">技術\u003c/th>\u003cth scope=\"col\">正確定位\u003c/th>\u003cth scope=\"col\">不要混淆\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CUDA\u003c/td>\u003ctd>平台與程式設計模型\u003c/td>\u003ctd>不是單一獨立語言的同義詞。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CUDA 程式設計模型\">CUDA 程式設計模型 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CUDA C／C++\u003c/td>\u003ctd>C／C++ 的 GPU 開發方向\u003c/td>\u003ctd>host 程式與 GPU kernel 的執行模型不同。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.nvidia.com/blog/easy-introduction-cuda-c-and-c\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CUDA C／C++ 入門\">CUDA C／C++ 入門 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>WGSL\u003c/td>\u003ctd>WebGPU 的 shader 語言\u003c/td>\u003ctd>不能當成一般 UI 或後端語言。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.w3.org/TR/WGSL/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"W3C WGSL 規格\">W3C WGSL 規格 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wasm\u003c/td>\u003ctd>低階編譯目標\u003c/td>\u003ctd>編成 Wasm 不代表自動跑在 GPU。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN WebAssembly 概念\">MDN WebAssembly 概念 ↗\u003c/a>\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>PLC：標準版本與廠商支援要分開\u003c/h3>\u003cp>PLCopen 的標準狀態頁指出 IEC 61131-3 第四版於 2025 年 5 月發布，列出 ST、LD、FBD，以及用來組織程式的 SFC。較舊介紹可能仍列出 IL，應依版次與控制器實際支援判斷。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.plcopen.org/standards/logic/iec-61131-3/status-iec-61131-3-standard/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PLCopen 第四版狀態\">PLCopen 第四版狀態 ↗\u003c/a>\u003c/span>\u003c/p>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"方向、表達方式、設計時要檢查\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">方向\u003c/th>\u003cth scope=\"col\">表達方式\u003c/th>\u003cth scope=\"col\">設計時要檢查\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ST\u003c/td>\u003ctd>文字、條件、運算與程序\u003c/td>\u003ctd>任務、時序、I/O、狀態與錯誤處理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>LD\u003c/td>\u003ctd>梯形圖形邏輯\u003c/td>\u003ctd>接點、保持狀態、互鎖與故障條件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FBD\u003c/td>\u003ctd>功能區塊與訊號連接\u003c/td>\u003ctd>訊號流、區塊狀態與執行順序\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SFC\u003c/td>\u003ctd>步驟與轉移的組織結構\u003c/td>\u003ctd>初始、轉移、例外與安全停止\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>即使遵循相同標準，也不能保證廠商間的完整專案可直接移植；工具、資料及功能差異仍須驗證。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.plcopen.org/standards/logic/iec-61131-3/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PLCopen 相容性問答\">PLCopen 相容性問答 ↗\u003c/a>\u003c/span>\u003c/p>\u003ch3>Ada／SPARK：把性質寫清楚\u003c/h3>\u003cp>Ada 提供多種檢查與契約相關能力；SPARK 基於 Ada 進行限制及擴充，支援資料流分析與形式驗證。證明針對明確性質及假設，不能解讀成所有實際行為都無條件正確。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://learn.adacore.com/booklets/adacore-technologies-for-airborne-software/chapters/tools.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Ada 與安全關鍵軟體\">Ada 與安全關鍵軟體 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.adacore.com/spark2014-docs/html/ug/en/introduction.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SPARK 官方介紹\">SPARK 官方介紹 ↗\u003c/a>\u003c/span>\u003c/p>\u003caside class=\"callout tip\">\u003cstrong>一般企業系統也能借用的思想\u003c/strong>\u003cp>把「能否放行」寫成可測試的條件：材料已確認、稿件版本已核准、卷向有效、必要欄位完整、操作人有權限。這是工程原則，不表示每個 ERP 都需要完整形式驗證工具。\u003c/p>\u003c/aside>\u003c/section>\u003csection class=\"chapter\" id=\"platform\" aria-labelledby=\"heading-platform\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">11\u003c/span>\u003cdiv>\u003ch2 id=\"heading-platform\">平台與應用擴充\u003c/h2>\u003cp class=\"lead\">有時語言價值來自平台，不在於是否能開發一切。\u003c/p>\u003c/div>\u003c/header>\u003ch3>Adobe Illustrator 的三個層次\u003c/h3>\u003cp>Adobe 官方列出 HTML／CSS／JavaScript 面板、應用腳本及 C++ 外掛等方向；實際採用需查版本與宿主 API。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.adobe.com/illustrator/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Adobe Illustrator 開發\">Adobe Illustrator 開發 ↗\u003c/a>\u003ca class=\"src\" href=\"https://helpx.adobe.com/illustrator/desktop/automate-visualize-data/automate-actions/install-and-run-scripts.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Illustrator 腳本支援\">Illustrator 腳本支援 ↗\u003c/a>\u003c/span>\u003c/p>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"需求、建議先評估、要驗證的項目\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">需求\u003c/th>\u003cth scope=\"col\">建議先評估\u003c/th>\u003cth scope=\"col\">要驗證的項目\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>重複修改文件\u003c/td>\u003ctd>腳本\u003c/td>\u003ctd>文件副本、單位、字型、色彩、存檔及失敗恢復\u003c/td>\u003c/tr>\u003ctr>\u003ctd>需要使用者操作介面\u003c/td>\u003ctd>面板／應用擴充\u003c/td>\u003ctd>登入、權限、宿主版本、資料與文件同步\u003c/td>\u003c/tr>\u003ctr>\u003ctd>深度能力或腳本不足\u003c/td>\u003ctd>C++ 外掛\u003c/td>\u003ctd>SDK、作業系統、版本、建置與維護成本\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout tip\">\u003cstrong>不要直接搬用瀏覽器程式\u003c/strong>\u003cp>ExtendScript／Adobe JavaScript 與一般瀏覽器的宿主不同。請先確認可用語法、物件模型與 API，再選擇範例或工具。\u003c/p>\u003c/aside>\u003ch3>SAP 與 ABAP\u003c/h3>\u003cp>ABAP 用於 SAP 商業應用，整合資料庫存取與平台能力；不同語言版本對可用功能與物件存取有不同限制。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://help.sap.com/doc/abapdocu_latest_index_htm/latest/en-US/ABENABAP_OVERVIEW.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SAP ABAP 語言\">SAP ABAP 語言 ↗\u003c/a>\u003ca class=\"src\" href=\"https://learning.sap.com/courses/basic-abap-programming/understanding-the-basics-of-abap_c0e5346f-a136-4b9f-a167-9031eca12932\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"ABAP 語言版本\">ABAP 語言版本 ↗\u003c/a>\u003c/span>\u003c/p>\u003cul>\u003cli>先確認正式擴充機制與 API，再判斷是否需要平台內程式。\u003c/li>\u003cli>評估授權、版本、測試與升級相容性。\u003c/li>\u003cli>不要以外部聊天或 AI 程式直接修改交易資料，取代正式商業流程。\u003c/li>\u003c/ul>\u003ch3>JDF／XJDF 是交換格式\u003c/h3>\u003cp>JDF 用於自動化生產環境的資訊交換；XJDF 強調應用之間交換資訊，並假設各應用有自己的內部資料模型。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.cip4.org/Print-Automation-Overview/articles/jobtickets\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CIP4 JDF 工單說明\">CIP4 JDF 工單說明 ↗\u003c/a>\u003ca class=\"src\" href=\"https://www.cip4.org/glossary/XJDF\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CIP4 XJDF\">CIP4 XJDF ↗\u003c/a>\u003c/span>\u003c/p>\u003caside class=\"callout tip\">\u003cstrong>XML 能輸出，不代表整合已完成\u003c/strong>\u003cp>還需確認支援的規格、欄位與工序語意、識別碼、版本、回應、錯誤處理及設備端實作。程式語言負責功能；內部模型保存狀態；交換規格定義系統間的資料。\u003c/p>\u003c/aside>\u003c/section>\u003csection class=\"chapter\" id=\"wasm\" aria-labelledby=\"heading-wasm\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">12\u003c/span>\u003cdiv>\u003ch2 id=\"heading-wasm\">WebAssembly 與跨語言\u003c/h2>\u003cp class=\"lead\">理解「編譯目標」比把它當成新網頁語言更準確。\u003c/p>\u003c/div>\u003c/header>\u003cp>Wasm 通常由其他語言產生，並設計為與 JavaScript 協作；它也能在瀏覽器以外的執行環境使用，但宿主能力與介面需另外確認。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN WebAssembly 概念\">MDN WebAssembly 概念 ↗\u003c/a>\u003ca class=\"src\" href=\"https://web.dev/articles/what-is-webassembly\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"WebAssembly 與執行環境\">WebAssembly 與執行環境 ↗\u003c/a>\u003c/span>\u003c/p>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"可評估情況、檢查問題\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">可評估情況\u003c/th>\u003cth scope=\"col\">檢查問題\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>既有底層函式庫要放進瀏覽器\u003c/td>\u003ctd>能否編譯？是否依賴原生作業系統功能？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>前端有較重的運算模組\u003c/td>\u003ctd>資料傳遞、下載、初始化與計算成本是否合理？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>希望多平台共用邏輯\u003c/td>\u003ctd>各宿主支援哪些介面？如何測試一致性？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>需要受限制的執行環境\u003c/td>\u003ctd>權限與資源上限如何設定？\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout tip\">\u003cstrong>跨語言也有成本\u003c/strong>\u003cp>請把資料表示、錯誤傳遞、型別對應、記憶體邊界及版本一起納入設計。混用更多語言，不必然讓整體更快或更容易維護。\u003c/p>\u003c/aside>\u003c/section>\u003csection class=\"chapter\" id=\"history\" aria-labelledby=\"heading-history\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">13\u003c/span>\u003cdiv>\u003ch2 id=\"heading-history\">歷史與延伸索引\u003c/h2>\u003cp class=\"lead\">以家族與設計問題研究，不必一次背完每一種語法。\u003c/p>\u003c/div>\u003c/header>\u003cp>本節保留前文的歷史、研究與專用語言延伸方向。它是閱讀索引，不是對各語言目前工具鏈、支援程度或商業成熟度的認證；更完整名稱可查 PLDB。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://github.com/Programming-Language-DataBase/pldb\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PLDB 語言資料庫\">PLDB 語言資料庫 ↗\u003c/a>\u003c/span>\u003c/p>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"延伸方向、可進一步查閱、建議研究的問題\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">延伸方向\u003c/th>\u003cth scope=\"col\">可進一步查閱\u003c/th>\u003cth scope=\"col\">建議研究的問題\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>商業與主機系統\u003c/td>\u003ctd>COBOL、RPG\u003c/td>\u003ctd>有哪些仍需維護的業務規則、資料與介面？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>結構化與教學\u003c/td>\u003ctd>Pascal、BASIC 及後繼語言\u003c/td>\u003ctd>如何影響流程拆解、教學與桌面開發？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>物件與訊息\u003c/td>\u003ctd>Smalltalk、Objective-C\u003c/td>\u003ctd>物件模型、訊息與執行環境如何結合？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lisp 家族\u003c/td>\u003ctd>Common Lisp、Scheme、Racket、Clojure\u003c/td>\u003ctd>程式與資料的表示、巨集及擴充機制？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ML 家族\u003c/td>\u003ctd>Standard ML、OCaml、F#\u003c/td>\u003ctd>型別推論、資料型別與模式比對如何使用？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>硬體描述\u003c/td>\u003ctd>Verilog、SystemVerilog、VHDL\u003c/td>\u003ctd>描述軟體指令，還是硬體結構與時序？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>陣列導向\u003c/td>\u003ctd>APL、J、K\u003c/td>\u003ctd>陣列操作如何改變資料計算表達？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>堆疊式方向\u003c/td>\u003ctd>Forth、PostScript\u003c/td>\u003ctd>堆疊運算如何影響寫法與執行？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>教育與視覺化\u003c/td>\u003ctd>Logo、Scratch\u003c/td>\u003ctd>如何讓初學者看懂流程、狀態與事件？\u003c/td>\u003c/tr>\u003ctr>\u003ctd>研究、實驗與趣味語言\u003c/td>\u003ctd>各種極簡與實驗語言\u003c/td>\u003ctd>在解決實務問題，還是在測試語言設計？\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout tip\">\u003cstrong>接手舊系統的判斷\u003c/strong>\u003cp>先盤點業務規則、資料與介面，再決定保留、包裝、逐步替換或重寫。語言年代本身不是重寫理由；沒有測試與規格的重寫，可能只是把未知風險換一種語法。\u003c/p>\u003c/aside>\u003c/section>\u003csection class=\"chapter\" id=\"myths\" aria-labelledby=\"heading-myths\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">14\u003c/span>\u003cdiv>\u003ch2 id=\"heading-myths\">常見誤解\u003c/h2>\u003cp class=\"lead\">學會區分「工具提供的保護」和「系統仍須負責的事情」。\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"誤解、正確理解、實務影響\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">誤解\u003c/th>\u003cth scope=\"col\">正確理解\u003c/th>\u003cth scope=\"col\">實務影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Java 是 JavaScript 的另一版本\u003c/td>\u003ctd>兩者有不同語言與執行模型。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://dev.java/learn/jvm/core-tools/java/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Java 啟動與執行環境\">Java 啟動與執行環境 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN JavaScript 型別\">MDN JavaScript 型別 ↗\u003c/a>\u003c/span>\u003c/td>\u003ctd>名稱相近不代表學習內容相同\u003c/td>\u003c/tr>\u003ctr>\u003ctd>型別寫出來，API 就安全\u003c/td>\u003ctd>TypeScript 型別不會自動產生執行時資料驗證。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.typescriptlang.org/docs/handbook/typescript-from-scratch\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"TypeScript 官方說明\">TypeScript 官方說明 ↗\u003c/a>\u003c/span>\u003c/td>\u003ctd>外部輸入需真正檢查\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Python 註記會自動拒絕錯誤值\u003c/td>\u003ctd>預設不強制函式或變數型別註記。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://docs.python.org/3.12/library/typing.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Python 型別註記\">Python 型別註記 ↗\u003c/a>\u003c/span>\u003c/td>\u003ctd>搭配型別分析、測試及驗證\u003c/td>\u003c/tr>\u003ctr>\u003ctd>有 GC 就不會有資源問題\u003c/td>\u003ctd>GC 仍有成本，執行狀態需要診斷。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://go.dev/doc/gc-guide\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go 垃圾回收指南\">Go 垃圾回收指南 ↗\u003c/a>\u003ca class=\"src\" href=\"https://go.dev/doc/diagnostics\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go 診斷工具\">Go 診斷工具 ↗\u003c/a>\u003c/span>\u003c/td>\u003ctd>檢查快取、工作、連線與記憶體\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C++ 全都手動釋放\u003c/td>\u003ctd>現代 C++ 可用 RAII 與智慧指標。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://isocpp.org/wiki/faq/exceptions\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C++ RAII 說明\">C++ RAII 說明 ↗\u003c/a>\u003ca class=\"src\" href=\"https://cppreference.com/cpp/memory\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"C++ 記憶體管理\">C++ 記憶體管理 ↗\u003c/a>\u003c/span>\u003c/td>\u003ctd>先學生命週期與所有權\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rust 安全就代表工單正確\u003c/td>\u003ctd>所有權主要處理記憶體使用規則。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://doc.rust-lang.org/beta/book/ch04-01-what-is-ownership.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Rust 所有權\">Rust 所有權 ↗\u003c/a>\u003c/span>\u003c/td>\u003ctd>商業限制仍需建模及測試\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Kotlin 完全不會空值失敗\u003c/td>\u003ctd>!!、初始化及互通等仍有例外。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://kotlinlang.org/docs/null-safety.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Kotlin 空值安全\">Kotlin 空值安全 ↗\u003c/a>\u003c/span>\u003c/td>\u003ctd>了解保證的邊界\u003c/td>\u003c/tr>\u003ctr>\u003ctd>舊語言必定沒價值\u003c/td>\u003ctd>Fortran 仍有科學套件；ABAP 有平台需求。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://fortran-lang.org/packages/numerical/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Fortran 數值套件\">Fortran 數值套件 ↗\u003c/a>\u003ca class=\"src\" href=\"https://help.sap.com/doc/abapdocu_latest_index_htm/latest/en-US/ABENABAP_OVERVIEW.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"SAP ABAP 語言\">SAP ABAP 語言 ↗\u003c/a>\u003c/span>\u003c/td>\u003ctd>看資產與任務，不只看年代\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wasm 就是 GPU 加速\u003c/td>\u003ctd>Wasm 是編譯目標；GPU 有不同模型。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN WebAssembly 概念\">MDN WebAssembly 概念 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"CUDA 程式設計模型\">CUDA 程式設計模型 ↗\u003c/a>\u003c/span>\u003c/td>\u003ctd>先區分執行環境\u003c/td>\u003c/tr>\u003ctr>\u003ctd>同一 PLC 標準就能直接搬專案\u003c/td>\u003ctd>廠商與工具仍有可攜性限制。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://www.plcopen.org/standards/logic/iec-61131-3/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"PLCopen 相容性問答\">PLCopen 相容性問答 ↗\u003c/a>\u003c/span>\u003c/td>\u003ctd>移轉前需實際驗證\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003caside class=\"callout tip\">\u003cstrong>編譯成功，不等於需求正確\u003c/strong>\u003cp>例如交期早於接單日、材料單位混用、錯卷向或錯版，主要是領域規格問題。請將型別、資料驗證、流程條件及人工核准分層設計。\u003c/p>\u003c/aside>\u003c/section>\u003csection class=\"chapter\" id=\"performance\" aria-labelledby=\"heading-performance\">\u003cheader class=\"chapter-head\">\u003cspan class=\"chapter-no\">15\u003c/span>\u003cdiv>\u003ch2 id=\"heading-performance\">效能怎麼評估\u003c/h2>\u003cp class=\"lead\">先找到等待與資源花在哪裡，再決定是否更換技術。\u003c/p>\u003c/div>\u003c/header>\u003cp>本節不提供虛構的語言速度排行榜。Go 官方提供 GC 與執行診斷，Julia 與 Wasm 也有特定編譯／執行模型；這些差異需要在實際工作負載上量測。\u003cspan class=\"sources\">\u003ca class=\"src\" href=\"https://go.dev/doc/diagnostics\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go 診斷工具\">Go 診斷工具 ↗\u003c/a>\u003ca class=\"src\" href=\"https://go.dev/doc/gc-guide\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Go 垃圾回收指南\">Go 垃圾回收指南 ↗\u003c/a>\u003ca class=\"src\" href=\"https://docs.julialang.org/en/v1.9/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"Julia 語言文件\">Julia 語言文件 ↗\u003c/a>\u003ca class=\"src\" href=\"https://developer.mozilla.org/en-US/docs/WebAssembly/Guides/Concepts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"MDN WebAssembly 概念\">MDN WebAssembly 概念 ↗\u003c/a>\u003c/span>\u003c/p>\u003cdiv class=\"table-wrap\" role=\"region\" aria-label=\"症狀、建議優先檢查、避免的誤判\" tabindex=\"0\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">症狀\u003c/th>\u003cth scope=\"col\">建議優先檢查\u003c/th>\u003cth scope=\"col\">避免的誤判\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>查詢慢\u003c/td>\u003ctd>查詢、索引、資料量、鎖與連線\u003c/td>\u003ctd>一定是後端語言太慢\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AI 回答慢\u003c/td>\u003ctd>模型、硬體、輸入長度、排隊與推論設定\u003c/td>\u003ctd>換呼叫 API 的語言就能解決\u003c/td>\u003c/tr>\u003ctr>\u003ctd>處理檔案慢\u003c/td>\u003ctd>I/O、格式、函式庫、批次方式\u003c/td>\u003ctd>某語言所有工作都慢\u003c/td>\u003c/tr>\u003ctr>\u003ctd>多人操作卡頓\u003c/td>\u003ctd>工作上限、連線池、排隊與資源競爭\u003c/td>\u003ctd>把執行緒／工作數加大就好\u003c/td>\u003c/tr>\u003ctr>\u003ctd>啟動慢\u003c/td>\u003ctd>初始化、載入、編譯與部署模式\u003c/td>\u003ctd>長時間執行也一定慢\u003c/td>\u003c/tr>\u003ctr>\u003ctd>記憶體增加\u003c/td>\u003ctd>保留資料、快取、工作及連線未結束\u003c/td>\u003ctd>有 GC 就不可能有問題\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>建議量測\u003c/h3>\u003cul>\u003cli>單次處理時間與同時操作時的延遲。\u003c/li>\u003cli>長時間執行後的記憶體與資源。\u003c/li>\u003cli>啟動、重啟、更新與回滾需要多久
