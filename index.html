sharp/what-you-can-build\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：C# 可開發的應用\">文件：Microsoft：C# 可開發的應用\u003c/a>\u003ca class=\"source\" href=\"https://docs.python.org/3/tutorial/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python 官方教學\">文件：Python 官方教學\u003c/a>\u003ca class=\"source\" href=\"https://www.php.net/manual/en/language.types.intro.php\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PHP：型別介紹\">文件：PHP：型別介紹\u003c/a>\u003ca class=\"source\" href=\"https://www.britannica.com/technology/Ruby-programming-language\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Britannica：Ruby\">文件：Britannica：Ruby\u003c/a>\u003c/td>\n\u003ctd>商業規則與資料一致性怎麼保護？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>腳本與自動化\u003c/td>\n\u003ctd>檔案、系統操作、工具串接\u003c/td>\n\u003ctd>Python、PowerShell、Bash、Perl。\u003ca class=\"source\" href=\"https://docs.python.org/3/tutorial/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python 官方教學\">文件：Python 官方教學\u003c/a>\u003ca class=\"source\" href=\"https://learn.microsoft.com/ro-ro/powershell/scripting/overview?view=powershell-5.1\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：PowerShell 概觀\">文件：Microsoft：PowerShell 概觀\u003c/a>\u003ca class=\"source\" href=\"https://www.gnu.org/software/bash/manual/html_node/Shell-Syntax.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"GNU Bash：Shell 語法\">文件：GNU Bash：Shell 語法\u003c/a>\u003ca class=\"source\" href=\"https://perldoc.perl.org/perlintro\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Perl 官方入門\">文件：Perl 官方入門\u003c/a>\u003c/td>\n\u003ctd>操作的是資料、物件還是外部命令？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系統與底層\u003c/td>\n\u003ctd>資源、記憶體、介面與部署限制\u003c/td>\n\u003ctd>C、C++、Rust、Zig。\u003ca class=\"source\" href=\"https://www.cppreference.com/c\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C 語言參考\">文件：C 語言參考\u003c/a>\u003ca class=\"source\" href=\"https://cppreference.com/cpp/memory\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C++：記憶體管理\">文件：C++：記憶體管理\u003c/a>\u003ca class=\"source\" href=\"https://doc.rust-lang.org/beta/book/ch04-01-what-is-ownership.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Rust：所有權\">文件：Rust：所有權\u003c/a>\u003ca class=\"source\" href=\"https://ziglang.org/documentation/master/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Zig 語言參考\">文件：Zig 語言參考\u003c/a>\u003c/td>\n\u003ctd>是否真的需要低階控制？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料與統計\u003c/td>\n\u003ctd>分析、模型、繪圖與重現\u003c/td>\n\u003ctd>R、Python、Julia。\u003ca class=\"source\" href=\"https://cloud.r-project.org/doc/manuals/r-patched/R-lang.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"R 語言定義\">文件：R 語言定義\u003c/a>\u003ca class=\"source\" href=\"https://docs.python.org/3/tutorial/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python 官方教學\">文件：Python 官方教學\u003c/a>\u003ca class=\"source\" href=\"https://docs.julialang.org/en/v1.9/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Julia 語言說明\">文件：Julia 語言說明\u003c/a>\u003c/td>\n\u003ctd>要交付分析結果，還是長期交易系統？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>科學計算\u003c/td>\n\u003ctd>矩陣、模擬、數值方法\u003c/td>\n\u003ctd>Fortran、Julia、MATLAB／Octave。\u003ca class=\"source\" href=\"https://fortran-lang.org/packages/numerical/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Fortran：數值函式庫\">文件：Fortran：數值函式庫\u003c/a>\u003ca class=\"source\" href=\"https://docs.julialang.org/en/v1.9/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Julia 語言說明\">文件：Julia 語言說明\u003c/a>\u003ca class=\"source\" href=\"https://docs.octave.org/doxygen/stable/index.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"GNU Octave 文件\">文件：GNU Octave 文件\u003c/a>\u003c/td>\n\u003ctd>哪些既有演算法與工具箱不能缺？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>併發與分散式\u003c/td>\n\u003ctd>大量工作、訊息、部分失敗\u003c/td>\n\u003ctd>Go、Elixir、Scala。\u003ca class=\"source\" href=\"https://go.dev/doc/gc-guide\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Go：垃圾回收指南\">文件：Go：垃圾回收指南\u003c/a>\u003ca class=\"source\" href=\"https://elixir-lang.org/learning/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Elixir：學習與 Erlang／OTP\">文件：Elixir：學習與 Erlang／OTP\u003c/a>\u003ca class=\"source\" href=\"https://docs.scala-lang.org/tour/tour-of-scala.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Scala 官方導覽\">文件：Scala 官方導覽\u003c/a>\u003c/td>\n\u003ctd>故障發生時，系統怎麼恢復？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>行動與多平台\u003c/td>\n\u003ctd>UI、裝置能力與發行\u003c/td>\n\u003ctd>Swift、Kotlin、Dart。\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：基礎與型別\">文件：Swift：基礎與型別\u003c/a>\u003ca class=\"source\" href=\"https://kotlinlang.org/docs/null-safety.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Kotlin：空值安全\">文件：Kotlin：空值安全\u003c/a>\u003ca class=\"source\" href=\"https://dart.dev/language/variables\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Dart：變數與空值安全\">文件：Dart：變數與空值安全\u003c/a>\u003c/td>\n\u003ctd>是否需要原生 App，而不是 Web？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料庫\u003c/td>\n\u003ctd>查詢、關聯、交易與併發\u003c/td>\n\u003ctd>SQL 及資料庫程序擴充。\u003ca class=\"source\" href=\"https://www.postgresql.org/docs/current/sql.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PostgreSQL：SQL 語言\">文件：PostgreSQL：SQL 語言\u003c/a>\u003c/td>\n\u003ctd>哪些規則應由資料庫保證？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GPU\u003c/td>\n\u003ctd>大量平行運算與圖形處理\u003c/td>\n\u003ctd>CUDA C++、WGSL。\u003ca class=\"source\" href=\"https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"NVIDIA：CUDA 程式設計模型\">文件：NVIDIA：CUDA 程式設計模型\u003c/a>\u003ca class=\"source\" href=\"https://www.w3.org/TR/2021/WD-WGSL-20210616/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"W3C：WGSL 設計說明\">文件：W3C：WGSL 設計說明\u003c/a>\u003c/td>\n\u003ctd>工作是否適合 GPU，資料搬移成本多少？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工業控制\u003c/td>\n\u003ctd>狀態、訊號、時序與設備程序\u003c/td>\n\u003ctd>ST、LD、FBD、SFC 組織結構。\u003ca class=\"source\" href=\"https://www.plcopen.org/standards/logic/iec-61131-3/status-iec-61131-3-standard/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PLCopen：IEC 61131-3 標準狀態\">文件：PLCopen：IEC 61131-3 標準狀態\u003c/a>\u003c/td>\n\u003ctd>控制器、標準與安全要求是什麼？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>高保證軟體\u003c/td>\n\u003ctd>契約、分析與形式證明\u003c/td>\n\u003ctd>Ada、SPARK。\u003ca class=\"source\" href=\"https://learn.adacore.com/booklets/adacore-technologies-for-airborne-software/chapters/tools.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"AdaCore：高完整性工具與語言\">文件：AdaCore：高完整性工具與語言\u003c/a>\u003ca class=\"source\" href=\"https://docs.adacore.com/spark2014-docs/html/ug/en/introduction.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"SPARK：官方介紹\">文件：SPARK：官方介紹\u003c/a>\u003c/td>\n\u003ctd>需要保證什麼性質、在什麼假設下？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>應用內擴充\u003c/td>\n\u003ctd>增強既有軟體功能\u003c/td>\n\u003ctd>Lua、Adobe 腳本與 C++ 外掛。\u003ca class=\"source\" href=\"https://www.lua.org/manual/5.4/manual.html?pdf-luaL_loadbuffer\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Lua 5.4 參考文件\">文件：Lua 5.4 參考文件\u003c/a>\u003ca class=\"source\" href=\"https://developer.adobe.com/illustrator/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Adobe：Illustrator 開發介面\">文件：Adobe：Illustrator 開發介面\u003c/a>\u003c/td>\n\u003ctd>宿主 API 能做到多少？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003c/section>\u003csection class=\"chapter\" id=\"chapter-04\">\u003ch2 data-number=\"04\">程式設計典範\u003c/h2>\n\u003cp>「典範」是組織程式與思考問題的方法。同一語言可能支援多種方法，像 F# 支援函數式、物件導向與命令式；Lua 也支援多種程式風格。\u003ca class=\"source\" href=\"https://learn.microsoft.com/en-us/dotnet/fsharp/language-reference/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：F# 語言參考\">文件：Microsoft：F# 語言參考\u003c/a>\u003ca class=\"source\" href=\"https://www.lua.org/manual/5.4/manual.html?pdf-luaL_loadbuffer\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Lua 5.4 參考文件\">文件：Lua 5.4 參考文件\u003c/a>\u003c/p>\n\u003cdiv aria-label=\"程式設計典範表格；小螢幕可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>典範\u003c/th>\n\u003cth>思考方式\u003c/th>\n\u003cth>優點\u003c/th>\n\u003cth>風險與學習重點\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>命令式\u003c/td>\n\u003ctd>描述先做什麼、再做什麼\u003c/td>\n\u003ctd>容易對應操作步驟\u003c/td>\n\u003ctd>狀態增多時，修改順序與副作用必須管理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>程序式\u003c/td>\n\u003ctd>把流程分成函式／程序\u003c/td>\n\u003ctd>重用與測試單一工作較直觀\u003c/td>\n\u003ctd>不能把所有規則塞進一支巨大主程式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>物件導向\u003c/td>\n\u003ctd>用物件封裝資料與行為\u003c/td>\n\u003ctd>有助建立責任與介面邊界\u003c/td>\n\u003ctd>避免過深繼承與「什麼都能做」的大物件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>函數式\u003c/td>\n\u003ctd>以函數、不可變資料與組合表達工作\u003c/td>\n\u003ctd>資料轉換較易推理，適合隔離副作用\u003c/td>\n\u003ctd>需要理解狀態、I/O 與非同步如何管理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宣告式\u003c/td>\n\u003ctd>描述想得到什麼結果\u003c/td>\n\u003ctd>更貼近領域規則\u003c/td>\n\u003ctd>仍要了解執行器、查詢器或求解器的行為\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>邏輯／約束式\u003c/td>\n\u003ctd>定義關係、條件與限制\u003c/td>\n\u003ctd>可把搜尋問題轉為規則描述\u003c/td>\n\u003ctd>搜尋空間、終止條件與約束表達很重要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多典範\u003c/td>\n\u003ctd>依問題結合多種表達方式\u003c/td>\n\u003ctd>不必所有工作套用同一模式\u003c/td>\n\u003ctd>團隊需要統一風格，避免複雜度失控\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>上表是工程理解框架；具體語意以各語言規格為準。Haskell 強調純函數、不可變與惰性求值，Scala 則結合物件導向與函數式設計。\u003ca class=\"source\" href=\"https://www.haskell.org/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Haskell 官方說明\">文件：Haskell 官方說明\u003c/a>\u003ca class=\"source\" href=\"https://docs.scala-lang.org/tour/tour-of-scala.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Scala 官方導覽\">文件：Scala 官方導覽\u003c/a>\u003c/p>\n\u003ch3 id=\"chapter-04-sub-1\">用工單理解典範\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>程序式設計示意：\u003c/strong> 收到資料 → 驗證 → 計算 → 儲存 → 通知，各步驟拆成函式。\u003c/li>\n\u003cli>\u003cstrong>物件導向設計示意：\u003c/strong> 讓「工單」透過明確的方法申請放行，而不是任意改寫狀態欄位。\u003c/li>\n\u003cli>\u003cstrong>函數式設計示意：\u003c/strong> 將「依規格計算用料」寫成無外部修改的計算，再由外層處理資料庫。\u003c/li>\n\u003cli>\u003cstrong>宣告式設計示意：\u003c/strong> 用查詢描述「找出已核稿、材料足夠、尚未開工的工單」。\u003c/li>\n\u003cli>\u003cstrong>約束式設計示意：\u003c/strong> 描述工序先後、設備能力及交期，再尋找符合限制的排程。\u003c/li>\n\u003c/ul>\n\u003cp>這些是同一問題的不同建模角度，不是彼此排斥的產品選項。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" id=\"chapter-05\">\u003ch2 data-number=\"05\">型別系統與資料正確性\u003c/h2>\n\u003cp>型別描述資料能代表什麼值、可以進行什麼操作。靜態檢查、動態檢查、型別推論及輸入驗證是不同概念，不能混成一句「有沒有型別」。\u003ca class=\"source\" href=\"https://typing.python.org/en/latest/spec/type-system.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python 型別系統規格\">文件：Python 型別系統規格\u003c/a>\u003ca class=\"source\" href=\"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"TypeScript：Everyday Types\">文件：TypeScript：Everyday Types\u003c/a>\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：基礎與型別\">文件：Swift：基礎與型別\u003c/a>\u003c/p>\n\u003cdiv aria-label=\"型別系統與資料正確性表格；小螢幕可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>意義\u003c/th>\n\u003cth>例子與注意事項\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>靜態型別\u003c/td>\n\u003ctd>執行前檢查型別關係\u003c/td>\n\u003ctd>Scala、Kotlin、Swift；不等於每個變數都必須手寫型別。\u003ca class=\"source\" href=\"https://docs.scala-lang.org/tour/tour-of-scala.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Scala 官方導覽\">文件：Scala 官方導覽\u003c/a>\u003ca class=\"source\" href=\"https://kotlinlang.org/docs/null-safety.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Kotlin：空值安全\">文件：Kotlin：空值安全\u003c/a>\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：基礎與型別\">文件：Swift：基礎與型別\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>動態型別\u003c/td>\n\u003ctd>值與操作的型別主要在執行時處理\u003c/td>\n\u003ctd>Python、JavaScript、PHP。\u003ca class=\"source\" href=\"https://typing.python.org/en/latest/spec/type-system.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python 型別系統規格\">文件：Python 型別系統規格\u003c/a>\u003ca class=\"source\" href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"MDN：JavaScript 型別與資料\">文件：MDN：JavaScript 型別與資料\u003c/a>\u003ca class=\"source\" href=\"https://www.php.net/manual/en/language.types.intro.php\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PHP：型別介紹\">文件：PHP：型別介紹\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>型別推論\u003c/td>\n\u003ctd>工具依程式推導型別\u003c/td>\n\u003ctd>Haskell、Swift、TypeScript 都有推論能力。\u003ca class=\"source\" href=\"https://www.haskell.org/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Haskell 官方說明\">文件：Haskell 官方說明\u003c/a>\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：基礎與型別\">文件：Swift：基礎與型別\u003c/a>\u003ca class=\"source\" href=\"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"TypeScript：Everyday Types\">文件：TypeScript：Everyday Types\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可空型別\u003c/td>\n\u003ctd>明確表達可能沒有值\u003c/td>\n\u003ctd>Kotlin 的 nullability、Swift Optional、Dart 空值安全。\u003ca class=\"source\" href=\"https://kotlinlang.org/docs/null-safety.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Kotlin：空值安全\">文件：Kotlin：空值安全\u003c/a>\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：基礎與型別\">文件：Swift：基礎與型別\u003c/a>\u003ca class=\"source\" href=\"https://dart.dev/language/variables\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Dart：變數與空值安全\">文件：Dart：變數與空值安全\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>型別註記\u003c/td>\n\u003ctd>提供分析工具使用的型別資訊\u003c/td>\n\u003ctd>Python 執行環境預設不強制執行註記。\u003ca class=\"source\" href=\"https://docs.python.org//3.12/library/typing.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python：typing 與執行時註記\">文件：Python：typing 與執行時註記\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>型別擦除\u003c/td>\n\u003ctd>部分資訊不保留到執行時\u003c/td>\n\u003ctd>TypeScript 的註記與型別斷言會移除。\u003ca class=\"source\" href=\"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"TypeScript：Everyday Types\">文件：TypeScript：Everyday Types\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>結構型別\u003c/td>\n\u003ctd>依資料具有的結構判斷相容性\u003c/td>\n\u003ctd>TypeScript 關心值是否具備要求的結構。\u003ca class=\"source\" href=\"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"TypeScript：Everyday Types\">文件：TypeScript：Everyday Types\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>強／弱型別\u003c/td>\n\u003ctd>常被用來談轉型等不同議題\u003c/td>\n\u003ctd>不宜只貼標籤；應問隱式轉換與不合法操作如何處理。\u003ca class=\"source\" href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"MDN：JavaScript 型別與資料\">文件：MDN：JavaScript 型別與資料\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"chapter-05-sub-1\">三層檢查不能省\u003c/h3>\n\u003cdiv class=\"flow\">\u003cdiv>\u003cb>型別檢查\u003c/b>\u003cspan>程式內的資料操作是否相容\u003c/span>\u003c/div>\u003ci>→\u003c/i>\u003cdiv>\u003cb>輸入驗證\u003c/b>\u003cspan>外部內容是否真的符合格式\u003c/span>\u003c/div>\u003ci>→\u003c/i>\u003cdiv>\u003cb>商業規則\u003c/b>\u003cspan>這筆資料在流程上能否成立\u003c/span>\u003c/div>\u003c/div>\n\u003cp>\u003cstrong>設計案例：\u003c/strong> \u003ccode>quantity: number\u003c/code> 不保證它是正整數，不保證已換算單位，也不保證符合最低訂購量。型別檢查只能處理其模型能表達的部分；TypeScript 的 \u003ccode>as\u003c/code> 更不會建立執行時檢查。\u003ca class=\"source\" href=\"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"TypeScript：Everyday Types\">文件：TypeScript：Everyday Types\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">// 教學片段：型別斷言不會驗證外部資料。\ntype Order = { quantity: number };\nconst order = externalData as Order;\n\n// 若 externalData 實際內容錯誤，上面的 as 不會替你拒絕它。\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"chapter-05-sub-2\">Python 註記的邊界\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\"># 教學片段：註記提供工具分析，不是自動的執行時規則。\ndef accept_quantity(quantity: int) -&gt; int:\n    return quantity\n\u003c/code>\u003c/pre>\n\u003cp>上例未加入執行時驗證。Python 官方文件說明，函式與變數註記預設不由執行環境強制驗證；正式系統應另設輸入與商業規則檢查。\u003ca class=\"source\" href=\"https://docs.python.org//3.12/library/typing.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python：typing 與執行時註記\">文件：Python：typing 與執行時註記\u003c/a>\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" id=\"chapter-06\">\u003ch2 data-number=\"06\">編譯與執行方式\u003c/h2>\n\u003cp>「編譯式／直譯式」不是把每種語言永久分成兩邊的標籤。應一起看來源語言、編譯器、執行器與發行模式；Julia 的文件就同時談到 JIT 與 AOT 能力，Wasm 引擎也可能把位元組碼編譯成機器碼。\u003ca class=\"source\" href=\"https://docs.julialang.org/en/v1.9/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Julia 語言說明\">文件：Julia 語言說明\u003c/a>\u003ca class=\"source\" href=\"https://web.dev/articles/what-is-webassembly\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"web.dev：WebAssembly\">文件：web.dev：WebAssembly\u003c/a>\u003c/p>\n\u003cdiv aria-label=\"編譯與執行方式表格；小螢幕可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方式\u003c/th>\n\u003cth>基本流程\u003c/th>\n\u003cth>選型時要理解\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>AOT，事先編譯\u003c/td>\n\u003ctd>執行前產生目標程式\u003c/td>\n\u003ctd>建置環境、平台、連結、相容性與發行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JIT，即時編譯\u003c/td>\n\u003ctd>執行期間產生或最佳化程式碼\u003c/td>\n\u003ctd>暖機、啟動、快取及長時間運作表現\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>直譯／互動環境\u003c/td>\n\u003ctd>由語言實作讀取與執行\u003c/td>\n\u003ctd>不必手動編譯不等於完全沒有內部轉換\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原始碼轉換\u003c/td>\n\u003ctd>產生另一種語言程式碼\u003c/td>\n\u003ctd>偵錯與錯誤位置可能跨越兩層\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>位元組碼／中介格式\u003c/td>\n\u003ctd>先轉為中介表示，再由環境執行\u003c/td>\n\u003ctd>執行器版本、支援能力與宿主介面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>混合模式\u003c/td>\n\u003ctd>不同元件使用不同方式\u003c/td>\n\u003ctd>應逐一確認真正瓶頸，而非只看主語言\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"chapter-06-sub-1\">建置到上線的流程\u003c/h3>\n\u003cdiv class=\"flow\">\u003cdiv>\u003cb>原始碼\u003c/b>\u003cspan>規則、資料模型與測試\u003c/span>\u003c/div>\u003ci>→\u003c/i>\u003cdiv>\u003cb>建置／檢查\u003c/b>\u003cspan>依賴、型別、編譯與測試\u003c/span>\u003c/div>\u003ci>→\u003c/i>\u003cdiv>\u003cb>交付物\u003c/b>\u003cspan>可執行檔、套件或映像\u003c/span>\u003c/div>\u003ci>→\u003c/i>\u003cdiv>\u003cb>部署維運\u003c/b>\u003cspan>設定、監控、更新與回滾\u003c/span>\u003c/div>\u003c/div>\n\u003cp>此圖是通用工程流程示意。對客戶現場而言，「能在開發機執行」與「能穩定安裝、重建、更新」是不同的驗收項目。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" id=\"chapter-07\">\u003ch2 data-number=\"07\">記憶體與資源管理\u003c/h2>\n\u003cp>記憶體管理會影響程式設計方式、錯誤型態與資源成本。除了記憶體，檔案、鎖、連線及其他資源也需要正確生命週期；C++ 的 RAII 正是以生命週期管理資源的方法之一。\u003ca class=\"source\" href=\"https://isocpp.org/wiki/faq/exceptions\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Standard C++：RAII 與錯誤處理\">文件：Standard C++：RAII 與錯誤處理\u003c/a>\u003c/p>\n\u003cdiv aria-label=\"記憶體與資源管理表格；小螢幕可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模型\u003c/th>\n\u003cth>代表方向\u003c/th>\n\u003cth>優點\u003c/th>\n\u003cth>代價與風險\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>手動配置與釋放\u003c/td>\n\u003ctd>C、Zig\u003c/td>\n\u003ctd>明確控制配置策略\u003c/td>\n\u003ctd>開發者負責生命週期及正確釋放。\u003ca class=\"source\" href=\"https://cppreference.com/c/memory\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C：動態記憶體管理\">文件：C：動態記憶體管理\u003c/a>\u003ca class=\"source\" href=\"https://ziglang.org/documentation/master/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Zig 語言參考\">文件：Zig 語言參考\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAII／智慧指標\u003c/td>\n\u003ctd>現代 C++\u003c/td>\n\u003ctd>用作用域與物件生命週期自動清理資源\u003c/td>\n\u003ctd>仍需理解所有權、參照與物件生命週期。\u003ca class=\"source\" href=\"https://isocpp.org/wiki/faq/exceptions\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Standard C++：RAII 與錯誤處理\">文件：Standard C++：RAII 與錯誤處理\u003c/a>\u003ca class=\"source\" href=\"https://cppreference.com/cpp/memory\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C++：記憶體管理\">文件：C++：記憶體管理\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>所有權與借用\u003c/td>\n\u003ctd>Rust\u003c/td>\n\u003ctd>編譯器檢查多種資源與生命週期規則\u003c/td>\n\u003ctd>資料關係需要配合模型設計。\u003ca class=\"source\" href=\"https://doc.rust-lang.org/beta/book/ch04-01-what-is-ownership.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Rust：所有權\">文件：Rust：所有權\u003c/a>\u003ca class=\"source\" href=\"https://dev-doc.rust-lang.org/stable/nomicon/ownership.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Rustonomicon：所有權與參照\">文件：Rustonomicon：所有權與參照\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>垃圾回收 GC\u003c/td>\n\u003ctd>Go 等\u003c/td>\n\u003ctd>自動回收不再需要的記憶體\u003c/td>\n\u003ctd>仍有 CPU、記憶體與延遲成本。\u003ca class=\"source\" href=\"https://go.dev/doc/gc-guide\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Go：垃圾回收指南\">文件：Go：垃圾回收指南\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自動參照計數 ARC\u003c/td>\n\u003ctd>Swift 類別實例\u003c/td>\n\u003ctd>追蹤參照並管理物件釋放\u003c/td>\n\u003ctd>強參照循環仍需處理。\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/automaticreferencecounting/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：ARC\">文件：Swift：ARC\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"chapter-07-sub-1\">需要記住的四件事\u003c/h3>\n\u003cul>\n\u003cli>有 GC，不代表可以無限制保留資料或啟動背景工作；應觀察資源使用與回收成本。\u003ca class=\"source\" href=\"https://go.dev/doc/gc-guide\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Go：垃圾回收指南\">文件：Go：垃圾回收指南\u003c/a>\u003ca class=\"source\" href=\"https://go.dev/doc/diagnostics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Go：診斷工具\">文件：Go：診斷工具\u003c/a>\u003c/li>\n\u003cli>有 ARC，不代表不會留下互相強參照的物件；Swift 文件提供弱參照與無主參照等機制。\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/automaticreferencecounting/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：ARC\">文件：Swift：ARC\u003c/a>\u003c/li>\n\u003cli>現代 C++ 不應簡化成「所有資源都直接手動 delete」；RAII 與智慧指標是重要工具。\u003ca class=\"source\" href=\"https://isocpp.org/wiki/faq/exceptions\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Standard C++：RAII 與錯誤處理\">文件：Standard C++：RAII 與錯誤處理\u003c/a>\u003ca class=\"source\" href=\"https://cppreference.com/cpp/memory\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C++：記憶體管理\">文件：C++：記憶體管理\u003c/a>\u003c/li>\n\u003cli>Rust 的記憶體規則不是商業規格檢查；驗證卷向、版次及權限仍屬應用設計工作。\u003c/li>\n\u003c/ul>\n\u003c/section>\u003csection class=\"chapter\" id=\"chapter-08\">\u003ch2 data-number=\"08\">主力語言詳細卡片\u003c/h2>\n\u003cp>下列卡片把前述主要語言整合為同一閱讀格式。\u003cstrong>優點與限制是選型提醒，不是普及率、性能或就業排名。\u003c/strong> 點選用途可篩選；卡片可折疊，但列印時會自動完整顯示。\u003c/p>\n\u003cdiv class=\"catalog-tools\">\u003clabel>搜尋語言或特色\u003cinput autocomplete=\"off\" id=\"langSearch\" placeholder=\"例如：Rust、AI、型別、記憶體\" type=\"search\"/>\u003c/label>\u003clabel>用途篩選\u003cselect id=\"langCategory\">\u003coption value=\"all\">全部用途\u003c/option>\u003coption value=\"web\">Web／商業應用\u003c/option>\u003coption value=\"ai\">AI／資料分析\u003c/option>\u003coption value=\"system\">系統／效能\u003c/option>\u003coption value=\"mobile\">行動／跨平台\u003c/option>\u003coption value=\"script\">腳本／自動化\u003c/option>\u003coption value=\"functional\">函數式／併發\u003c/option>\u003coption value=\"enterprise\">企業平台／高保證\u003c/option>\u003c/select>\u003c/label>\u003cspan aria-live=\"polite\" id=\"langCount\">\u003c/span>\u003c/div>\n\u003cdiv class=\"language-grid\">\u003cdetails class=\"language-card\" data-category=\"web ai script\" id=\"language-1\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">01\u003c/span>\u003cspan>\u003cstrong>Python\u003c/strong>\u003csmall>快速開發・流程自動化\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">通用動態語言，官方教學強調可讀語法與腳本／快速開發用途。\u003ca class=\"source\" href=\"https://docs.python.org/3/tutorial/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python 官方教學\">文件：Python 官方教學\u003c/a>\u003ca class=\"source\" href=\"https://typing.python.org/en/latest/spec/type-system.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python 型別系統規格\">文件：Python 型別系統規格\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>容易把資料與流程表達為小型可測函式；適合先驗證需求、整合檔案及服務。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>型別註記預設不強制執行；環境、依賴與資料驗證需要額外治理。\u003ca class=\"source\" href=\"https://docs.python.org//3.12/library/typing.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python：typing 與執行時註記\">文件：Python：typing 與執行時註記\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>虛擬環境、套件鎖定、例外、型別工具、測試、API 與部署。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議評估 AI 應用流程、Excel／檔案處理、內部工具與後端。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>做一支讀取詢價表、拒絕缺少尺寸／數量、輸出標準化結果的工具。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://docs.python.org/3/tutorial/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python 官方教學\">文件：Python 官方教學\u003c/a>\u003ca class=\"source\" href=\"https://docs.python.org//3.12/library/typing.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Python：typing 與執行時註記\">文件：Python：typing 與執行時註記\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"web script\" id=\"language-2\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">02\u003c/span>\u003cspan>\u003cstrong>JavaScript\u003c/strong>\u003csmall>瀏覽器互動・動態型別\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">動態型別語言，存在特定隱式轉型規則；需理解值與操作的實際行為。\u003ca class=\"source\" href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"MDN：JavaScript 型別與資料\">文件：MDN：JavaScript 型別與資料\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>適合表達畫面事件與互動；可用於小型腳本及 JavaScript 生態中的應用。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>型別轉換、作用域與非同步容易造成誤判；正式資料仍需驗證。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>let／const、物件、作用域、Promise、async／await、事件與錯誤。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議用於 Web 操作介面；大型專案再比較 TypeScript 的價值。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>做一個工單表單，顯示欄位錯誤，但仍把後端驗證列為必要工作。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Data_structures\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"MDN：JavaScript 型別與資料\">文件：MDN：JavaScript 型別與資料\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"web\" id=\"language-3\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">03\u003c/span>\u003cspan>\u003cstrong>TypeScript\u003c/strong>\u003csmall>資料契約・大型維護\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">在 JavaScript 上提供型別分析；型別註記與斷言不產生對應執行時驗證。\u003ca class=\"source\" href=\"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"TypeScript：Everyday Types\">文件：TypeScript：Everyday Types\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可用介面、聯集與泛型表達資料契約；對多人協作與重構有實務價值。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>濫用 any 或 as 會繞過有用的檢查；編譯通過不保證外部資料可靠。\u003ca class=\"source\" href=\"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"TypeScript：Everyday Types\">文件：TypeScript：Everyday Types\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>先學 JavaScript；再學 narrowing、unknown、strict、泛型與執行時驗證。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議評估多畫面、多角色、多 API 的長期商業系統。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>定義工單狀態的聯集型別，並另寫驗證外部請求的函式。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"TypeScript：Everyday Types\">文件：TypeScript：Everyday Types\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"web enterprise\" id=\"language-4\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">04\u003c/span>\u003cspan>\u003cstrong>Java\u003c/strong>\u003csmall>企業應用・執行環境\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">Java 應用由 Java 啟動器載入指定類別並執行進入點；語言與執行環境需分開理解。\u003ca class=\"source\" href=\"https://dev.java/learn/jvm/core-tools/java/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Java：應用啟動器\">文件：Java：應用啟動器\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>既有團隊與系統已使用 Java 時，可以延續平台資產及領域能力。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>仍需學建置、依賴、框架、資源與執行器診斷，不能只學 class 語法。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>型別、介面、泛型、例外、執行環境、建置工具與測試。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議優先評估既有 Java 企業後端及整合專案。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>把工單建立做成可測試服務，區分領域規則與資料存取。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://dev.java/learn/jvm/core-tools/java/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Java：應用啟動器\">文件：Java：應用啟動器\u003c/a>\u003ca class=\"source\" href=\"https://learn.microsoft.com/zh-tw/dotnet/csharp/tour-of-csharp/tips-for-java-developers\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：Java 與 C# 開發比較\">文件：Microsoft：Java 與 C# 開發比較\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"web enterprise\" id=\"language-5\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">05\u003c/span>\u003cspan>\u003cstrong>C#\u003c/strong>\u003csmall>多工作負載・.NET\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">.NET 語言，官方列出 Web、桌面、雲端、遊戲與 AI 等應用工作負載。\u003ca class=\"source\" href=\"https://www.learn.microsoft.com/en-sg/dotnet/csharp/tour-of-csharp/what-you-can-build\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：C# 可開發的應用\">文件：Microsoft：C# 可開發的應用\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>同一平台可承接多種應用；既有 .NET 客戶可優先評估延續。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>各種 UI、服務與部署框架仍有各自限制；語言相同不代表跨平台功能完全相同。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>類別／record／struct、泛型、非同步、例外、資料存取與測試。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議評估企業主後端、交易規則與既有 .NET 整合。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>做可測試的報價服務，並把資料庫與外部通知放在清楚介面後面。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.learn.microsoft.com/en-sg/dotnet/csharp/tour-of-csharp/what-you-can-build\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：C# 可開發的應用\">文件：Microsoft：C# 可開發的應用\u003c/a>\u003ca class=\"source\" href=\"https://learn.microsoft.com/zh-tw/dotnet/csharp/tour-of-csharp/tips-for-java-developers\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：Java 與 C# 開發比較\">文件：Microsoft：Java 與 C# 開發比較\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"web script\" id=\"language-6\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">06\u003c/span>\u003cspan>\u003cstrong>PHP\u003c/strong>\u003csmall>伺服器網站・動態資料\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">常用於 Web 的通用語言；變數型別可由執行時決定。\u003ca class=\"source\" href=\"https://www.php.net/manual/en/language.types.intro.php\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PHP：型別介紹\">文件：PHP：型別介紹\u003c/a>\u003ca class=\"source\" href=\"https://www.php.net/manual/en/features.php\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PHP：功能\">文件：PHP：功能\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可建構伺服器應用，也可處理檔案、命令與網路工作。\u003ca class=\"source\" href=\"https://www.php.net/manual/en/security.intro.php\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PHP：安全介紹\">文件：PHP：安全介紹\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>需要一致風格、版本治理、型別及安全檢查；舊程式寫法不能直接當新設計範本。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>HTTP、表單、資料庫、權限、依賴、測試與安全設定。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>已有 PHP 團隊、網站或應用資產時，建議先檢視延伸成本。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>建立安全的查單介面，明確限制使用者只能查自己的資料。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.php.net/manual/en/language.types.intro.php\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PHP：型別介紹\">文件：PHP：型別介紹\u003c/a>\u003ca class=\"source\" href=\"https://www.php.net/manual/en/features.php\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PHP：功能\">文件：PHP：功能\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"web script\" id=\"language-7\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">07\u003c/span>\u003cspan>\u003cstrong>Ruby\u003c/strong>\u003csmall>物件導向・表達力\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">通用且完整物件導向的語言，以開發者友善的設計受到關注。\u003ca class=\"source\" href=\"https://www.britannica.com/technology/Ruby-programming-language\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Britannica：Ruby\">文件：Britannica：Ruby\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可用清楚的語法描述行為與領域流程；適合重視可讀性的應用設計。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>靈活寫法需要團隊規範；框架慣例、測試與執行環境仍要管理。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>物件、區塊、例外、套件、測試及採用框架的慣例。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議在已有 Ruby 資產或熟悉工具的團隊中評估商業 Web 開發。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>把詢價確認規則寫成小型物件，使用測試描述可接受與拒絕的案例。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.britannica.com/technology/Ruby-programming-language\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Britannica：Ruby\">文件：Britannica：Ruby\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"web system functional\" id=\"language-8\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">08\u003c/span>\u003cspan>\u003cstrong>Go\u003c/strong>\u003csmall>服務工具・併發診斷\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">執行環境含 goroutine 與 GC；官方提供工作、記憶體與追蹤診斷工具。\u003ca class=\"source\" href=\"https://go.dev/doc/gc-guide\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Go：垃圾回收指南\">文件：Go：垃圾回收指南\u003c/a>\u003ca class=\"source\" href=\"https://go.dev/doc/diagnostics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Go：診斷工具\">文件：Go：診斷工具\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可評估長時間執行服務、同步代理與命令列工具。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>GC 有成本；工作阻塞、未結束任務與資源使用仍需觀察。\u003ca class=\"source\" href=\"https://go.dev/doc/gc-guide\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Go：垃圾回收指南\">文件：Go：垃圾回收指南\u003c/a>\u003ca class=\"source\" href=\"https://go.dev/doc/diagnostics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Go：診斷工具\">文件：Go：診斷工具\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>goroutine、同步、取消、逾時、錯誤、測試與效能量測。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議在需要部署工具、設備代理或網路服務時做小型驗證。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>建立有限制併發數、可取消且有重試紀錄的檔案同步工具。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://go.dev/doc/gc-guide\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Go：垃圾回收指南\">文件：Go：垃圾回收指南\u003c/a>\u003ca class=\"source\" href=\"https://go.dev/doc/diagnostics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Go：診斷工具\">文件：Go：診斷工具\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"system\" id=\"language-9\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">09\u003c/span>\u003cspan>\u003cstrong>C\u003c/strong>\u003csmall>記憶體・底層介面\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">提供指標、資料表示與動態記憶體等能力，需直接理解資源使用。\u003ca class=\"source\" href=\"https://www.cppreference.com/c\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C 語言參考\">文件：C 語言參考\u003c/a>\u003ca class=\"source\" href=\"https://cppreference.com/c/memory\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C：動態記憶體管理\">文件：C：動態記憶體管理\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>能明確控制資料布局與資源；有助學習程式與機器的關係。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>配置、生命週期、字串與邊界錯誤需嚴格管理；語法少不等於工程簡單。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>指標、陣列、字串、結構、配置／釋放、編譯與連結。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議評估有明確底層、嵌入式或既有 C 介面要求的元件。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>撰寫有邊界檢查的檔案讀取工具，逐項說明誰擁有與釋放資源。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.cppreference.com/c\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C 語言參考\">文件：C 語言參考\u003c/a>\u003ca class=\"source\" href=\"https://cppreference.com/c/memory\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C：動態記憶體管理\">文件：C：動態記憶體管理\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"system\" id=\"language-10\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">10\u003c/span>\u003cspan>\u003cstrong>C++\u003c/strong>\u003csmall>高階抽象・RAII\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">現代 C++ 有容器、智慧指標與 RAII；不是所有資源都應手動 new／delete。\u003ca class=\"source\" href=\"https://cppreference.com/cpp/memory\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C++：記憶體管理\">文件：C++：記憶體管理\u003c/a>\u003ca class=\"source\" href=\"https://isocpp.org/wiki/faq/exceptions\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Standard C++：RAII 與錯誤處理\">文件：Standard C++：RAII 與錯誤處理\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可同時使用抽象與精細資源管理；Adobe 也提供 Illustrator C++ 外掛方向。\u003ca class=\"source\" href=\"https://developer.adobe.com/illustrator/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Adobe：Illustrator 開發介面\">文件：Adobe：Illustrator 開發介面\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>語言與建置範圍大，生命週期、參照、泛型與相容性需深入理解。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>RAII、智慧指標、容器、參照、移動、泛型、建置與偵錯。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議在底層工具、既有函式庫或深度外掛有具體需求時採用。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>先包裝一個資源為 RAII 物件，驗證失敗路徑也會正確釋放。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://cppreference.com/cpp/memory\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"C++：記憶體管理\">文件：C++：記憶體管理\u003c/a>\u003ca class=\"source\" href=\"https://isocpp.org/wiki/faq/exceptions\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Standard C++：RAII 與錯誤處理\">文件：Standard C++：RAII 與錯誤處理\u003c/a>\u003ca class=\"source\" href=\"https://developer.adobe.com/illustrator/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Adobe：Illustrator 開發介面\">文件：Adobe：Illustrator 開發介面\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"system\" id=\"language-11\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">11\u003c/span>\u003cspan>\u003cstrong>Rust\u003c/strong>\u003csmall>所有權・資源安全\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">以所有權、借用及生命週期規則管理資源；編譯器檢查多種使用關係。\u003ca class=\"source\" href=\"https://doc.rust-lang.org/beta/book/ch04-01-what-is-ownership.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Rust：所有權\">文件：Rust：所有權\u003c/a>\u003ca class=\"source\" href=\"https://dev-doc.rust-lang.org/stable/nomicon/ownership.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Rustonomicon：所有權與參照\">文件：Rustonomicon：所有權與參照\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>不依賴 GC 的所有權模型適合重視資源與可靠性的元件。\u003ca class=\"source\" href=\"https://doc.rust-lang.org/beta/book/ch04-01-what-is-ownership.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Rust：所有權\">文件：Rust：所有權\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>資料結構與共享方式要配合模型；仍需處理商業邏輯、權限與外部介面風險。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>ownership、move、borrow、lifetime、Result、錯誤與測試。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議評估需要長期維護的解析器、工具與資源敏感元件。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>建立只讀取且檢查輸入的解析器，分清楚資料擁有者與借用者。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://doc.rust-lang.org/beta/book/ch04-01-what-is-ownership.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Rust：所有權\">文件：Rust：所有權\u003c/a>\u003ca class=\"source\" href=\"https://dev-doc.rust-lang.org/stable/nomicon/ownership.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Rustonomicon：所有權與參照\">文件：Rustonomicon：所有權與參照\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"system\" id=\"language-12\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">12\u003c/span>\u003cspan>\u003cstrong>Zig\u003c/strong>\u003csmall>明確配置・工具鏈\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">通用語言與工具鏈，記憶體配置策略通常需要明確傳入。\u003ca class=\"source\" href=\"https://ziglang.org/documentation/master/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Zig 語言參考\">文件：Zig 語言參考\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可明確表達資源與配置器，適合受限環境的工程評估。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>不等同 Rust 的借用安全模型；工具鏈版本及函式庫需求要核對。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>配置器、指標、切片、錯誤處理及編譯期運算。\u003ca class=\"source\" href=\"https://ziglang.org/documentation/master/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Zig 語言參考\">文件：Zig 語言參考\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>有底層需求且願意管理工具鏈時，先做小型驗證。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>以明確配置器完成資料讀取，測試配置失敗時的處理。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://ziglang.org/documentation/master/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Zig 語言參考\">文件：Zig 語言參考\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"mobile system\" id=\"language-13\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">13\u003c/span>\u003cspan>\u003cstrong>Swift\u003c/strong>\u003csmall>Optional・ARC\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">提供型別安全、Optional、ARC 與記憶體存取規則。\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：基礎與型別\">文件：Swift：基礎與型別\u003c/a>\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/automaticreferencecounting/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：ARC\">文件：Swift：ARC\u003c/a>\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/memorysafety/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：記憶體安全\">文件：Swift：記憶體安全\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>能清楚表達值是否存在，以及值與參照的生命週期。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>強制解包及強參照循環仍會造成問題；應理解實際平台 SDK。\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：基礎與型別\">文件：Swift：基礎與型別\u003c/a>\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/automaticreferencecounting/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：ARC\">文件：Swift：ARC\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>Optional、值／參照、ARC、錯誤與平台工具。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議依目標裝置、原生 UI 與 SDK 需求評估。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>做離線草稿資料模型，讓缺值與讀取失敗有明確結果。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/thebasics\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：基礎與型別\">文件：Swift：基礎與型別\u003c/a>\u003ca class=\"source\" href=\"https://docs.swift.org/latest/documentation/the-swift-programming-language/automaticreferencecounting/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Swift：ARC\">文件：Swift：ARC\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"mobile web\" id=\"language-14\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">14\u003c/span>\u003cspan>\u003cstrong>Kotlin\u003c/strong>\u003csmall>可空型別・Java 互通\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">用型別表示可空性，並設計與 Java 互通。\u003ca class=\"source\" href=\"https://kotlinlang.org/docs/null-safety.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Kotlin：空值安全\">文件：Kotlin：空值安全\u003c/a>\u003ca class=\"source\" href=\"https://kotlinlang.org/docs/java-interop.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Kotlin：Java 互通\">文件：Kotlin：Java 互通\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可利用既有 Java 能力，同時明確處理缺值。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>!!、初始化與 Java 平台型別等邊界仍可能產生錯誤。\u003ca class=\"source\" href=\"https://kotlinlang.org/docs/null-safety.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Kotlin：空值安全\">文件：Kotlin：空值安全\u003c/a>\u003ca class=\"source\" href=\"https://kotlinlang.org/docs/java-interop.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Kotlin：Java 互通\">文件：Kotlin：Java 互通\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>可空型別、資料模型、錯誤、非同步與平台互通。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議依行動平台或既有 JVM 系統需求評估。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>從含缺值的 Java／外部資料產生明確、可驗證的內部模型。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://kotlinlang.org/docs/null-safety.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Kotlin：空值安全\">文件：Kotlin：空值安全\u003c/a>\u003ca class=\"source\" href=\"https://kotlinlang.org/docs/java-interop.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Kotlin：Java 互通\">文件：Kotlin：Java 互通\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"mobile web\" id=\"language-15\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">15\u003c/span>\u003cspan>\u003cstrong>Dart\u003c/strong>\u003csmall>健全型別・空值安全\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">具備健全型別與空值安全，讓不合法的空值存取可被提早發現。\u003ca class=\"source\" href=\"https://dart.dev/language/variables\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Dart：變數與空值安全\">文件：Dart：變數與空值安全\u003c/a>\u003ca class=\"source\" href=\"https://dart.dev/blog/dart-and-the-performance-benefits-of-sound-types\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Dart：健全型別與效能\">文件：Dart：健全型別與效能\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可明確描述必要、可選與缺值資料，搭配所選 UI 工具評估。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>語言與 UI 框架是不同層；平台能力、打包與套件仍需確認。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>型別、空值、非同步、錯誤及目標平台差異。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>有跨平台 UI 計畫時，連同框架及裝置要求驗證。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>建構工單資料模型，區分未填寫與具有合法內容的欄位。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://dart.dev/language/variables\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Dart：變數與空值安全\">文件：Dart：變數與空值安全\u003c/a>\u003ca class=\"source\" href=\"https://dart.dev/blog/dart-and-the-performance-benefits-of-sound-types\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Dart：健全型別與效能\">文件：Dart：健全型別與效能\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"ai\" id=\"language-16\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">16\u003c/span>\u003cspan>\u003cstrong>R\u003c/strong>\u003csmall>統計・圖形分析\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">統計計算與圖形環境，提供語言、繪圖與其他語言介面。\u003ca class=\"source\" href=\"https://cloud.r-project.org/doc/manuals/r-patched/R-lang.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"R 語言定義\">文件：R 語言定義\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>適合評估統計方法、資料探索及分析報告。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>分析工具不能直接取代所有交易系統工作；重現與版本仍需規劃。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>資料結構、缺值、統計假設、視覺化、套件與重現。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議在統計與分析為主要交付內容時評估。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>分析實際報廢資料，先檢查定義與缺值，再做分組統計。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://cloud.r-project.org/doc/manuals/r-patched/R-lang.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"R 語言定義\">文件：R 語言定義\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"ai system\" id=\"language-17\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">17\u003c/span>\u003cspan>\u003cstrong>Julia\u003c/strong>\u003csmall>多重分派・數值模型\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">型別推論、JIT 及多重分派為核心；按參數型別組合選擇方法。\u003ca class=\"source\" href=\"https://docs.julialang.org/en/v1.9/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Julia 語言說明\">文件：Julia 語言說明\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可用一致操作表達不同數學資料與數值行為。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>仍需理解型別、暖機與量測，不是改用語言就保證最佳化。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>多重分派、型別、配置、效能分析與套件。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議用實際數學模型及資料驗證適用性。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>把同一成本模型對不同材料型別定義方法，再比較可讀性與測試。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://docs.julialang.org/en/v1.9/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Julia 語言說明\">文件：Julia 語言說明\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"ai system\" id=\"language-18\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">18\u003c/span>\u003cspan>\u003cstrong>Fortran\u003c/strong>\u003csmall>科學計算・數值資產\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">現有生態包含線性代數、最佳化與科學模擬工具。\u003ca class=\"source\" href=\"https://fortran-lang.org/packages/numerical/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Fortran：數值函式庫\">文件：Fortran：數值函式庫\u003c/a>\u003ca class=\"source\" href=\"https://fortran-lang.org/packages/scientific/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Fortran：科學應用\">文件：Fortran：科學應用\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>能利用既有演算法與驗證過的程式資產。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>是否採用應由數學需求、工具及既有程式決定，不宜只看年代。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>陣列、精度、數值誤差、編譯與跨語言介面。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議評估科學工作與既有數值系統維護。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>為既有計算建立固定輸入及容差測試，再評估是否需包裝介面。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://fortran-lang.org/packages/numerical/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Fortran：數值函式庫\">文件：Fortran：數值函式庫\u003c/a>\u003ca class=\"source\" href=\"https://fortran-lang.org/packages/scientific/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Fortran：科學應用\">文件：Fortran：科學應用\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"ai\" id=\"language-19\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">19\u003c/span>\u003cspan>\u003cstrong>MATLAB\u003c/strong>\u003csmall>工程產品・工具箱\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">工程運算產品及工具箱環境；語言與商業產品需一起評估。\u003ca class=\"source\" href=\"https://www.mathworks.com/products.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"MathWorks：產品\">文件：MathWorks：產品\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>若現有工作依賴特定產品與工具箱，可保留既有方法與流程。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>授權、工具箱及部署可能有不同成本與限制，須按實際方案核對。\u003ca class=\"source\" href=\"https://www.mathworks.com/store/products/standard/perpetual/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"MathWorks：MATLAB 授權\">文件：MathWorks：MATLAB 授權\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>矩陣、數值方法、檔案、工具箱與部署授權。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議由既有工程工作及必備工具反向判斷。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>列出真正用到的工具箱與交付方式，確認接收端需要哪些授權。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.mathworks.com/products.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"MathWorks：產品\">文件：MathWorks：產品\u003c/a>\u003ca class=\"source\" href=\"https://www.mathworks.com/store/products/standard/perpetual/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"MathWorks：MATLAB 授權\">文件：MathWorks：MATLAB 授權\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"ai\" id=\"language-20\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">20\u003c/span>\u003cspan>\u003cstrong>GNU Octave\u003c/strong>\u003csmall>數值計算・相容性評估\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">主要用於數值計算，語法與 MATLAB 大致相容。\u003ca class=\"source\" href=\"https://docs.octave.org/doxygen/stable/index.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"GNU Octave 文件\">文件：GNU Octave 文件\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可處理矩陣、方程及數值問題，並評估既有腳本的移植。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>大致相容不等於全部工具箱、檔案與行為完全相同。\u003ca class=\"source\" href=\"https://docs.octave.org/doxygen/stable/index.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"GNU Octave 文件\">文件：GNU Octave 文件\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>矩陣、函式、圖形、套件及結果誤差驗證。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>需要評估數值腳本替代或教學環境時，可做實際測試。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>用同一組輸入比對既有腳本結果、誤差及缺少功能。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://docs.octave.org/doxygen/stable/index.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"GNU Octave 文件\">文件：GNU Octave 文件\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"web ai enterprise\" id=\"language-21\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">21\u003c/span>\u003cspan>\u003cstrong>SQL\u003c/strong>\u003csmall>資料模型・交易\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">資料庫語言範圍包含資料定義、操作、查詢、型別及併發控制。\u003ca class=\"source\" href=\"https://www.postgresql.org/docs/current/sql.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PostgreSQL：SQL 語言\">文件：PostgreSQL：SQL 語言\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可把資料規則集中到資料庫層，支援一致性與查詢需求。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>資料庫方言、隔離、鎖定與查詢成本需理解，不能只會 SELECT。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>建模、JOIN、聚合、索引、交易、約束、遷移與備份。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>訂單、ERP、工單與報表系統建議列為核心技能。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>設計客戶、訂單與明細關係，測試重複編號與交易失敗。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.postgresql.org/docs/current/sql.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"PostgreSQL：SQL 語言\">文件：PostgreSQL：SQL 語言\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"script system\" id=\"language-22\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">22\u003c/span>\u003cspan>\u003cstrong>Bash\u003c/strong>\u003csmall>命令編排・引號展開\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">Shell 解析會處理單字、運算子、引號與展開。\u003ca class=\"source\" href=\"https://www.gnu.org/software/bash/manual/html_node/Shell-Syntax.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"GNU Bash：Shell 語法\">文件：GNU Bash：Shell 語法\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>適合把成熟命令列工具組合成小型可重複流程。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>特殊字元、空白、路徑與結束狀態需仔細處理。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>引號、參數、重新導向、管線、錯誤與安全路徑。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>建議用於明確的命令編排；複雜資料模型可另選通用語言。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>用含空白與中文的檔名測試備份流程，確認失敗不會刪除原檔。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.gnu.org/software/bash/manual/html_node/Shell-Syntax.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"GNU Bash：Shell 語法\">文件：GNU Bash：Shell 語法\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"script system\" id=\"language-23\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">23\u003c/span>\u003cspan>\u003cstrong>PowerShell\u003c/strong>\u003csmall>物件管線・管理自動化\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">管線可以傳遞 .NET 物件，而不是只傳文字。\u003ca class=\"source\" href=\"https://learn.microsoft.com/ro-ro/powershell/scripting/overview?view=powershell-5.1\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：PowerShell 概觀\">文件：Microsoft：PowerShell 概觀\u003c/a>\u003ca class=\"source\" href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_pipelines?view=powershell-7.5\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：PowerShell 管線\">文件：Microsoft：PowerShell 管線\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可依物件屬性篩選與轉換，適合系統及結構資料工作。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>版本、平台、參數繫結與錯誤行為要驗證。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>物件、cmdlet、管線、錯誤、JSON／CSV 與版本。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>有系統管理及既有 PowerShell 工具時，建議優先評估。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>讀取 CSV 並驗證欄位，以物件輸出檢查結果而非拼接字串。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://learn.microsoft.com/ro-ro/powershell/scripting/overview?view=powershell-5.1\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：PowerShell 概觀\">文件：Microsoft：PowerShell 概觀\u003c/a>\u003ca class=\"source\" href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_pipelines?view=powershell-7.5\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：PowerShell 管線\">文件：Microsoft：PowerShell 管線\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"script\" id=\"language-24\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">24\u003c/span>\u003cspan>\u003cstrong>Perl\u003c/strong>\u003csmall>文字處理・既有腳本\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">提供文字處理、程序式與物件導向能力及模組。\u003ca class=\"source\" href=\"https://perldoc.perl.org/perlintro\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Perl 官方入門\">文件：Perl 官方入門\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>正規表示式及文字擷取適合規則明確的轉換工作。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>彈性語法需要一致規範與測試，避免只有原作者能維護。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>文字、正規表示式、資料結構、模組與測試。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>接手既有 Perl 自動化或大量文字工作時評估。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>將既有日誌格式轉為結構資料，針對缺欄位與異常行建立測試。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://perldoc.perl.org/perlintro\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Perl 官方入門\">文件：Perl 官方入門\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"script\" id=\"language-25\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">25\u003c/span>\u003cspan>\u003cstrong>Lua\u003c/strong>\u003csmall>嵌入式腳本・宿主介面\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">可嵌入宿主程式；宿主可呼叫 Lua，並向 Lua 提供函式。\u003ca class=\"source\" href=\"https://www.lua.org/manual/5.4/manual.html?pdf-luaL_loadbuffer\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Lua 5.4 參考文件\">文件：Lua 5.4 參考文件\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>適合在既有應用中提供可擴充的規則與腳本能力。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>能做什麼取決於宿主公開什麼；權限與資源需由宿主控制。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>table、函式、宿主 API、錯誤及執行邊界。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>應用本身已支援 Lua 時，優先研究其宿主文件。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>為規則腳本列出允許 API，避免直接開放不必要的檔案或命令操作。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.lua.org/manual/5.4/manual.html?pdf-luaL_loadbuffer\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Lua 5.4 參考文件\">文件：Lua 5.4 參考文件\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"functional web enterprise\" id=\"language-26\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">26\u003c/span>\u003cspan>\u003cstrong>F#\u003c/strong>\u003csmall>型別化函數式・.NET\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">支援函數式、物件導向與命令式，執行於 .NET。\u003ca class=\"source\" href=\"https://learn.microsoft.com/en-us/dotnet/fsharp/language-reference/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：F# 語言參考\">文件：Microsoft：F# 語言參考\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可用函數與型別描述轉換，同時與 .NET 生態互通。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>需要學模式比對與資料模型；仍要治理 I/O 與應用邊界。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>不可變資料、函數組合、模式比對、型別及 .NET。\u003ca class=\"source\" href=\"https://learn.microsoft.com/en-us/dotnet/fsharp/tutorials/functional-programming-concepts\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：F# 函數式觀念\">文件：Microsoft：F# 函數式觀念\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>已使用 .NET，且想改善規則建模時可評估。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>把報價規則分成純函數與外部資料讀取兩層。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://learn.microsoft.com/en-us/dotnet/fsharp/language-reference/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：F# 語言參考\">文件：Microsoft：F# 語言參考\u003c/a>\u003ca class=\"source\" href=\"https://learn.microsoft.com/en-us/dotnet/fsharp/tutorials/functional-programming-concepts\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Microsoft：F# 函數式觀念\">文件：Microsoft：F# 函數式觀念\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"functional web\" id=\"language-27\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">27\u003c/span>\u003cspan>\u003cstrong>Scala\u003c/strong>\u003csmall>多典範・型別抽象\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">結合物件導向與函數式的多典範語言，重視型別與平台互通。\u003ca class=\"source\" href=\"https://docs.scala-lang.org/tour/tour-of-scala.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Scala 官方導覽\">文件：Scala 官方導覽\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可用多種抽象方式描述資料處理與服務。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>語言選項豐富，需要限制抽象深度與團隊寫法。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>型別、泛型、函數、模式比對及平台工具。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>已有相關平台及團隊能力時，建議用實際模組驗證。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>定義明確的資料轉換管線，讓每一步可單獨測試。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://docs.scala-lang.org/tour/tour-of-scala.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Scala 官方導覽\">文件：Scala 官方導覽\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"functional ai\" id=\"language-28\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">28\u003c/span>\u003cspan>\u003cstrong>Haskell\u003c/strong>\u003csmall>純函數・惰性求值\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">純函數式、靜態型別、推論、不可變與惰性求值。\u003ca class=\"source\" href=\"https://www.haskell.org/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Haskell 官方說明\">文件：Haskell 官方說明\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>有助推理資料轉換，並用明確模型管理副作用。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>惰性、I/O 與型別需要不同思考；有合法型別也可能出現執行錯誤。\u003ca class=\"source\" href=\"https://www.haskell.org/onlinereport/haskell2010/haskellch1.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Haskell 2010：介紹與 I/O\">文件：Haskell 2010：介紹與 I/O\u003c/a>\u003ca class=\"source\" href=\"https://www.haskell.org/tutorial/goodies.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Haskell：值與型別\">文件：Haskell：值與型別\u003c/a>\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>函數、型別、求值方式、I/O 與副作用邊界。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>學習函數式觀念或有明確建模需要時評估。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>把一組規格轉換規則寫成純函數，列出輸入與結果案例。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.haskell.org/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Haskell 官方說明\">文件：Haskell 官方說明\u003c/a>\u003ca class=\"source\" href=\"https://www.haskell.org/onlinereport/haskell2010/haskellch1.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Haskell 2010：介紹與 I/O\">文件：Haskell 2010：介紹與 I/O\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"functional system\" id=\"language-29\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">29\u003c/span>\u003cspan>\u003cstrong>OCaml\u003c/strong>\u003csmall>靜態型別・資料建模\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">強調靜態型別與不可變資料，也有 Web 開發方向。\u003ca class=\"source\" href=\"https://ocaml.org/docs/is-ocaml-web-yet\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"OCaml：型別與 Web 方向\">文件：OCaml：型別與 Web 方向\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>適合評估需要清楚型別與資料轉換的工作。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>採用前需確認應用套件、部署及團隊維護能力。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>資料型別、模式比對、模組與套件工具。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>有具體工具或建模需求時，先做小型完整交付驗證。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>用明確狀態型別描述一個流程，避免任意字串狀態。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://ocaml.org/docs/is-ocaml-web-yet\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"OCaml：型別與 Web 方向\">文件：OCaml：型別與 Web 方向\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"functional web\" id=\"language-30\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">30\u003c/span>\u003cspan>\u003cstrong>Clojure\u003c/strong>\u003csmall>資料組合・spec\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">動態資料取向，spec 可描述資料規格並支援驗證與測試。\u003ca class=\"source\" href=\"https://clojure.org/about/spec\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Clojure：spec 規格與驗證\">文件：Clojure：spec 規格與驗證\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>以資料與組合表達問題，可將規格明確化。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>動態規格不是全面靜態型別保證；資料邊界仍需規劃。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>資料結構、函數、不可變、spec 與執行環境。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>已有 Clojure 經驗或偏重資料建模時評估。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>為外部訂單資料定義規格，測試缺欄位及錯誤型別。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://clojure.org/about/spec\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Clojure：spec 規格與驗證\">文件：Clojure：spec 規格與驗證\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"functional web\" id=\"language-31\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">31\u003c/span>\u003cspan>\u003cstrong>Elixir\u003c/strong>\u003csmall>訊息・容錯・OTP\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">建立在 Erlang VM／OTP 生態上的語言，需學函數式與併發模型。\u003ca class=\"source\" href=\"https://elixir-lang.org/learning/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Elixir：學習與 Erlang／OTP\">文件：Elixir：學習與 Erlang／OTP\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可評估訊息、獨立工作與部分故障的系統。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>故障模型、程序與監督責任需要設計，並非把工作丟出去即可。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>程序、訊息、OTP、監督與分散式假設。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>系統重點是工作協作與容錯時，用實際流量驗證。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>模擬一個背景工作失敗，驗證恢復不會造成重複交易。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://elixir-lang.org/learning/\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"Elixir：學習與 Erlang／OTP\">文件：Elixir：學習與 Erlang／OTP\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"functional ai\" id=\"language-32\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">32\u003c/span>\u003cspan>\u003cstrong>Prolog\u003c/strong>\u003csmall>關係規則・約束搜尋\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">以關係、查詢與搜尋思考；約束邏輯可利用條件縮小搜尋範圍。\u003ca class=\"source\" href=\"https://www.swi-prolog.org/GetStarted.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"SWI-Prolog 官方入門\">文件：SWI-Prolog 官方入門\u003c/a>\u003ca class=\"source\" href=\"https://swish.swi-prolog.org/pldoc/man?section=clp\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"SWI-Prolog：約束邏輯\">文件：SWI-Prolog：約束邏輯\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可清楚描述某些推論與約束問題。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>搜尋行為、限制與終止條件必須理解；不應先選語言才補需求。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>關係、合一、查詢、搜尋與所用約束領域。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>規則推論與排程原型可納入評估，也可由其他應用呼叫求解器。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>先定義工序先後與機台限制，再找出一個可行排程。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://www.swi-prolog.org/GetStarted.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"SWI-Prolog 官方入門\">文件：SWI-Prolog 官方入門\u003c/a>\u003ca class=\"source\" href=\"https://swish.swi-prolog.org/pldoc/man?section=clp\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"SWI-Prolog：約束邏輯\">文件：SWI-Prolog：約束邏輯\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"enterprise\" id=\"language-33\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">33\u003c/span>\u003cspan>\u003cstrong>ABAP\u003c/strong>\u003csmall>SAP 商業應用\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">SAP 商業應用語言，整合資料庫與平台能力；語言模式限制不同。\u003ca class=\"source\" href=\"https://help.sap.com/doc/abapdocu_latest_index_htm/latest/en-US/ABENABAP_OVERVIEW.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"SAP：ABAP 語言概觀\">文件：SAP：ABAP 語言概觀\u003c/a>\u003ca class=\"source\" href=\"https://learning.sap.com/courses/basic-abap-programming/understanding-the-basics-of-abap_c0e5346f-a136-4b9f-a167-9031eca12932\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"SAP：ABAP 基礎與語言模式\">文件：SAP：ABAP 基礎與語言模式\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>能沿用平台資料、權限及服務模型。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>離不開平台規範；版本、語言模式與允許 API 需核對。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>平台資料、商業物件、交易、API 及擴充規則。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>工作就是 SAP 維護與擴充時具有直接價值。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>釐清自訂功能能否透過正式擴充，而非直接改寫底層資料。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://help.sap.com/doc/abapdocu_latest_index_htm/latest/en-US/ABENABAP_OVERVIEW.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"SAP：ABAP 語言概觀\">文件：SAP：ABAP 語言概觀\u003c/a>\u003ca class=\"source\" href=\"https://learning.sap.com/courses/basic-abap-programming/understanding-the-basics-of-abap_c0e5346f-a136-4b9f-a167-9031eca12932\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"SAP：ABAP 基礎與語言模式\">文件：SAP：ABAP 基礎與語言模式\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"enterprise system\" id=\"language-34\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">34\u003c/span>\u003cspan>\u003cstrong>Ada\u003c/strong>\u003csmall>可靠性・契約\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">高完整性工具生態中的語言，包含可靠性與即時軟體相關能力。\u003ca class=\"source\" href=\"https://learn.adacore.com/booklets/adacore-technologies-for-airborne-software/chapters/tools.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"AdaCore：高完整性工具與語言\">文件：AdaCore：高完整性工具與語言\u003c/a>\u003c/p>\u003cdl>\u003cdiv>\u003cdt>優點\u003c/dt>\u003cdd>可利用顯式型別、契約與檢查表達重要限制。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>限制與風險\u003c/dt>\u003cdd>需要理解語言、執行環境及產業要求，不能只比語法短長。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>需要了解\u003c/dt>\u003cdd>型別、契約、資源、並行、工具及驗證方法。\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>選型建議\u003c/dt>\u003cdd>有高可靠性或既有 Ada 系統時進行評估。\u003c/dd>\u003c/div>\u003c/dl>\u003cdiv class=\"exercise\">\u003cb>練習提案\u003c/b>\u003cp>把重要輸入與結果限制寫成清楚契約，並設計反例測試。\u003c/p>\u003c/div>\u003cdiv class=\"card-sources\">\u003ca class=\"source\" href=\"https://learn.adacore.com/booklets/adacore-technologies-for-airborne-software/chapters/tools.html\" rel=\"noopener noreferrer\" target=\"_blank\" title=\"AdaCore：高完整性工具與語言\">文件：AdaCore：高完整性工具與語言\u003c/a>\u003c/div>\u003c/div>\u003c/details>\u003cdetails class=\"language-card\" data-category=\"enterprise system\" id=\"language-35\" open=\"\">\u003csummary>\u003cspan class=\"card-number\">35\u003c/span>\u003cspan>\u003cstrong>SPARK\u003c/strong>\u003csmall>形式分析・可證明性\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\" class=\"chevron\">⌄\u003c/span>\u003c/summary>\u003cdiv class=\"card-body\">\u003cp class=\"card-desc\">以 Ada 為基礎，限制不利驗證的部分並加入契約分析。\u003ca class=\"source\" href=\"https://docs.adacore.com/spark2014-docs/html/ug/en/introduction.html\" rel=\"noopener noref
