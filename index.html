le}.code-box pre{color:#111!important;font-size:8.5pt;line-height:1.7;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}.check-panel{background:white;border:0;padding:0}.check-fields{grid-template-columns:1fr 1fr}.check-fields input{border:none;padding:0;background:transparent}.check-panel textarea{border:1px solid #ddd;min-height:80px}.check-meter{font-size:10pt}.check-item{font-size:9pt;break-inside:avoid}.check-item input{appearance:auto}.check-panel .small,#storageStatus{display:none}.check-panel label{font-size:9pt}.meter{display:none}.chapter details{break-inside:avoid;border-color:#ddd}.chapter details p{font-size:9pt}.flow span{background:#eee}.chapter.print-only{display:block!important}#checkFile{display:none!important}.builder-section-note{display:block}.hero a{text-decoration:none}footer{font-size:8pt}.chapter a{color:#174f60}.chapter.print-only textarea{font-size:9pt}#section-23>p{display:none}}\n@media(max-width:800px){.top-actions{flex-shrink:0}.top-actions button{white-space:nowrap}}@media(max-width:440px){.brand>span:last-child{display:none}}\n\u003c/style>\u003c/head>\n\u003cbody id=\"top\">\u003ca class=\"skip\" href=\"#mainContent\">跳到主要內容\u003c/a>\u003cdiv id=\"readingProgress\" aria-hidden=\"true\">\u003c/div>\n\u003cheader class=\"topbar\">\u003cdiv class=\"brand\">\u003cspan>AI\u003c/span> / CODE HANDOFF \u003cspan style=\"color:#8da0ac;font-weight:400\">實作指南\u003c/span>\u003c/div>\u003cdiv class=\"top-actions\">\u003ca href=\"#section-13\">首次分析指令\u003c/a>\u003cbutton type=\"button\" id=\"downloadPrompts\" class=\"export-all\">下載全部範本\u003c/button>\u003cbutton type=\"button\" id=\"printPage\">列印／另存 PDF\u003c/button>\u003cbutton type=\"button\" id=\"menuToggle\" class=\"menu-btn\" aria-controls=\"sidebar\" aria-expanded=\"false\">目錄\u003c/button>\u003c/div>\u003c/header>\n\u003cdiv class=\"mobile-scrim\" id=\"scrim\">\u003c/div>\u003cdiv class=\"layout\">\u003caside class=\"sidebar\" id=\"sidebar\" aria-label=\"章節導覽\">\u003cdiv class=\"side-title\">FIELD GUIDE / CONTENTS\u003c/div>\u003clabel class=\"search-label\" for=\"sectionSearch\">\u003cspan class=\"small\">搜尋章節內容\u003c/span>\u003cinput type=\"search\" id=\"sectionSearch\" placeholder=\"例如：排錯、migration、權限\" autocomplete=\"off\">\u003c/label>\u003cdiv id=\"searchCount\" class=\"search-count\" role=\"status\">\u003c/div>\u003cbutton id=\"clearSearch\" type=\"button\" style=\"font-size:11px;padding:3px 10px;margin-bottom:12px\">清除篩選\u003c/button>\u003cnav class=\"toc\">\u003ca href=\"#section-01\">\u003cspan>01\u003c/span>使用這份指南\u003c/a>\u003ca href=\"#section-02\">\u003cspan>02\u003c/span>交付標準與四種需求\u003c/a>\u003ca href=\"#section-03\">\u003cspan>03\u003c/span>交接檔案配置\u003c/a>\u003ca href=\"#section-04\">\u003cspan>04\u003c/span>安全準備專案\u003c/a>\u003ca href=\"#section-05\">\u003cspan>05\u003c/span>分階段分析流程\u003c/a>\u003ca href=\"#section-06\">\u003cspan>06\u003c/span>一頁總覽與上手\u003c/a>\u003ca href=\"#section-07\">\u003cspan>07\u003c/span>架構地圖與證據\u003c/a>\u003ca href=\"#section-08\">\u003cspan>08\u003c/span>功能與程式追蹤\u003c/a>\u003ca href=\"#section-09\">\u003cspan>09\u003c/span>資料、API 與設定\u003c/a>\u003ca href=\"#section-10\">\u003cspan>10\u003c/span>排錯手冊的寫法\u003c/a>\u003ca href=\"#section-11\">\u003cspan>11\u003c/span>常見症狀查找方向\u003c/a>\u003ca href=\"#section-12\">\u003cspan>12\u003c/span>擴充功能先做計畫\u003c/a>\u003ca href=\"#section-13\">\u003cspan>13\u003c/span>首次分析總指令\u003c/a>\u003ca href=\"#section-14\">\u003cspan>14\u003c/span>深入單項功能指令\u003c/a>\u003ca href=\"#section-15\">\u003cspan>15\u003c/span>故障資料與診斷指令\u003c/a>\u003ca href=\"#section-16\">\u003cspan>16\u003c/span>新增功能規劃指令\u003c/a>\u003ca href=\"#section-17\">\u003cspan>17\u003c/span>修改完成交接指令\u003c/a>\u003ca href=\"#section-18\">\u003cspan>18\u003c/span>AI 工作規則與版本\u003c/a>\u003ca href=\"#section-19\">\u003cspan>19\u003c/span>可套用的文件骨架\u003c/a>\u003ca href=\"#section-20\">\u003cspan>20\u003c/span>訂單整合的示意案例\u003c/a>\u003ca href=\"#section-21\">\u003cspan>21\u003c/span>人工驗收與實測問題\u003c/a>\u003ca href=\"#section-22\">\u003cspan>22\u003c/span>快速上手與規模調整\u003c/a>\u003ca href=\"#section-23\">\u003cspan>23\u003c/span>工作指令組合器\u003c/a>\u003ca href=\"#section-24\">\u003cspan>24\u003c/span>常見疑問與使用限制\u003c/a>\u003c/nav>\u003cdiv class=\"sidebar-note\">繁體中文・單檔離線版\u003cbr>版本 1.0 · 2026-10-31\u003cbr>本頁是通用教材，未分析特定專案。\u003c/div>\u003c/aside>\n\u003cmain id=\"mainContent\">\u003cdiv class=\"hero\">\u003cdiv class=\"eyebrow\">FROM AI-GENERATED CODE TO MAINTAINABLE SOFTWARE\u003c/div>\u003ch1>讓 AI 說清楚程式\u003cbr>\u003csmall>功能理解、故障排除與後續擴充\u003c/small>\u003c/h1>\u003cp>不只是看懂程式碼，而是建立有來源、有流程、有驗證狀態的交接資料，讓人與下一個 AI 都能快速接手。\u003c/p>\u003cdiv class=\"tags\">\u003cspan>完整工作流程\u003c/span>\u003cspan>可直接貼用指令\u003c/span>\u003cspan>文件骨架\u003c/span>\u003cspan>人工驗收工具\u003c/span>\u003cspan>離線可讀\u003c/span>\u003c/div>\u003cdiv class=\"hero-bottom\">\u003cspan>24 個章節 · 原創工作範本＋官方方法依據\u003c/span>\u003ca href=\"#section-13\">從首次分析指令開始 →\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"quick-cards\">\u003ca class=\"quick-card\" href=\"#section-03\">\u003cstrong>建立交接包\u003c/strong>\u003cspan>文件配置與最低要求\u003c/span>\u003c/a>\u003ca class=\"quick-card\" href=\"#section-10\">\u003cstrong>遇到問題怎麼查\u003c/strong>\u003cspan>症狀、證據、判斷分支\u003c/span>\u003c/a>\u003ca class=\"quick-card\" href=\"#section-12\">\u003cstrong>新功能怎麼加\u003c/strong>\u003cspan>影響分析與安全修改\u003c/span>\u003c/a>\u003c/div>\n\u003cdiv id=\"noResults\" class=\"no-results\" role=\"status\">沒有符合的章節。請縮短關鍵字，或按「清除篩選」。\u003c/div>\n\u003csection class=\"chapter\" data-title=\"使用這份指南\" id=\"section-01\">\u003ch2>使用這份指南\u003c/h2>\n\u003cp>\u003cstrong>讓 AI 寫程式只是第一步；讓人能理解、操作、排錯、擴充與接手，才是完整交付。\u003c/strong> 建議把需求從「解釋一下程式碼」改成「依實際程式建立可驗證的交接包」，並要求每個重要說明能找到對應的檔案與符號。\u003c/p>\n\u003cp>本指南整合前面的通用做法、交接文件配置、分析流程、故障排除、擴充規劃、可直接貼給 AI 的指令與人工驗收方法。內容是通用工作設計，\u003cstrong>尚未讀取或驗證你的任何特定專案\u003c/strong>；範例架構、檔案名稱與案例都不是對現有程式的判定。\u003c/p>\n\u003cdiv class=\"callout success\">\u003cstrong>第一次使用，照這條路線：\u003c/strong>先看「交接檔案配置」與「安全準備專案」→ 複製「首次分析總指令」給 AI → 先拿盤點結果 → 核對一條主要流程 → 再做排錯與擴充文件。不要一開始就要求 AI 邊分析邊重寫。\u003c/div>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你現在的情況\u003c/th>\n\u003cth>建議先做\u003c/th>\n\u003cth>本指南對應內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>程式能用，但看不懂\u003c/td>\n\u003ctd>產生一頁總覽、程式地圖、功能追蹤表\u003c/td>\n\u003ctd>快速理解、架構與功能章節\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>程式壞了，不知道從何查\u003c/td>\n\u003ctd>提供重現步驟、環境、錯誤與最近變更\u003c/td>\n\u003ctd>排錯手冊、診斷指令\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想加新功能\u003c/td>\n\u003ctd>先取得影響分析與驗收條件\u003c/td>\n\u003ctd>擴充規劃、擴充指令\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想交給另一個 AI 或工程師\u003c/td>\n\u003ctd>文件標示版本，補齊定位、測試證據與缺口\u003c/td>\n\u003ctd>完成交接、AI 工作規則\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>程式只有一個檔案\u003c/td>\n\u003ctd>先把必要內容合併在 README\u003c/td>\n\u003ctd>文件配置、專案規模調整\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>本頁功能：\u003c/strong>章節導覽、全文關鍵字篩選、指令複製、工作指令組合器、人工檢查表、檢查紀錄匯出／匯入、列印／另存 PDF。所有主要內容與互動程式都包含在這一個 HTML 內，不需安裝套件或架設伺服器。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"交付標準與四種需求\" id=\"section-02\">\u003ch2>交付標準與四種需求\u003c/h2>\n\u003cp>不要把「逐行加註解」當成整體文件的替代品。建議先解釋使用者任務與運作流程，再對複雜演算法、業務規則及高風險區域做深入說明；普通語法不必逐行翻譯。\u003c/p>\n\u003cp>Diátaxis 將文件區分為學習教學、操作指南、技術參考與概念說明。這份指南沿用「不同問題需要不同形式」的思路，而不是把所有內容混成一篇超長說明。\u003ca class=\"source\" href=\"https://diataxis.fr/application/\" rel=\"noopener noreferrer\" target=\"_blank\">官方依據：Diátaxis\u003c/a>\u003c/p>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>要解決的需求\u003c/th>\n\u003cth>文件應回答\u003c/th>\n\u003cth>不夠好的答案\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>學會第一次使用\u003c/td>\n\u003ctd>如何設定、操作並得到第一個成功結果？\u003c/td>\n\u003ctd>只列安裝套件名稱\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完成具體任務\u003c/td>\n\u003ctd>如何新增、修改、匯出、部署或排錯？\u003c/td>\n\u003ctd>只說「修改相關設定」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查技術細節\u003c/td>\n\u003ctd>API、欄位、錯誤、環境參數與相依版本是什麼？\u003c/td>\n\u003ctd>沒有型別、限制與對應位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>理解為什麼\u003c/td>\n\u003ctd>為何這樣拆模組？有哪些已知取捨與限制？\u003c/td>\n\u003ctd>把 AI 猜測寫成原作者設計理由\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>建議交付標準是：\u003cstrong>第一次接手的人能找到入口、跑完一條主要流程、知道失敗時下一步查什麼，也知道加功能前要先檢查哪些相依處。\u003c/strong> 不要求每個讀者立刻理解所有底層實作。\u003c/p>\n\u003ch3>好說明與壞說明\u003c/h3>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>主題\u003c/th>\n\u003cth>太籠統的說明\u003c/th>\n\u003cth>建議要求的說明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>模組介紹\u003c/td>\n\u003ctd>這是處理資料的模組\u003c/td>\n\u003ctd>處理哪一類資料、誰呼叫它、讀寫什麼、失敗如何回報\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>功能追蹤\u003c/td>\n\u003ctd>按鈕會呼叫 API\u003c/td>\n\u003ctd>指出按鈕事件、請求入口、核心函式、資料變化與回應處理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>排錯\u003c/td>\n\u003ctd>檢查權限與網路\u003c/td>\n\u003ctd>在哪裡看什麼證據、正常應是什麼、結果 A/B 各查哪裡\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>擴充\u003c/td>\n\u003ctd>加一個欄位即可\u003c/td>\n\u003ctd>哪些介面、驗證、資料表、舊資料、匯出與測試一起受影響\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>測試\u003c/td>\n\u003ctd>已完成測試\u003c/td>\n\u003ctd>用了哪個版本與環境、執行哪條指令、成功／失敗／未測各是什麼\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"交接檔案配置\" id=\"section-03\">\u003ch2>交接檔案配置\u003c/h2>\n\u003cp>以下檔名是建議配置，不是所有工具強制要求。小工具可以合併；網站、手機 App、LINE Bot 或 ERP 整合再依複雜度拆開。\u003cstrong>先確保內容可用，不要為了漂亮目錄建立大量空文件。\u003c/strong>\u003c/p>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-1\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-1\">\u003ccode class=\"language-text\">project/\n├── README.md                  # 專案入口、快速上手、文件索引\n├── AGENTS.md                  # 支援此檔案的 AI 工具之工作規則\n├── CHANGELOG.md                # 各版本重要變動\n├── .env.example               # 安全設定範例，沒有真實機密\n├── docs/\n│   ├── FEATURES.md            # 功能、操作、權限與限制\n│   ├── ARCHITECTURE.md        # 架構、程式地圖、主要流程\n│   ├── DATA-AND-API.md         # 資料模型、API、外部整合\n│   ├── RUNBOOK.md             # 啟停、部署、維運、故障排除\n│   ├── EXTENDING.md           # 擴充位置、規則、相容性\n│   ├── TESTING.md             # 測試、驗收、已知缺口\n│   └── decisions/             # 有證據的設計決策與取捨\n├── src/                       # 示意：實際目錄依專案\n└── tests/                     # 示意：實際目錄依專案\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件\u003c/th>\n\u003cth>最少要說明什麼\u003c/th>\n\u003cth>如何驗收\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>README\u003c/td>\n\u003ctd>用途、不做什麼、安裝、啟動、第一次操作、成功判準\u003c/td>\n\u003ctd>依文件能走完主要流程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FEATURES\u003c/td>\n\u003ctd>功能入口、操作、權限、輸入輸出、限制、失敗回饋\u003c/td>\n\u003ctd>與畫面、命令或實際功能核對\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ARCHITECTURE\u003c/td>\n\u003ctd>系統邊界、入口、模組、相依、資料流與部署\u003c/td>\n\u003ctd>路徑與呼叫關係找得到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DATA-AND-API\u003c/td>\n\u003ctd>schema、狀態、API、錯誤、環境參數與外部契約\u003c/td>\n\u003ctd>與 migration、路由、設定核對\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RUNBOOK\u003c/td>\n\u003ctd>啟停、日誌、診斷、修復、驗證、備份與復原\u003c/td>\n\u003ctd>在測試環境演練可重現故障\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>EXTENDING\u003c/td>\n\u003ctd>擴充點、不可破壞規則、影響分析、相容性\u003c/td>\n\u003ctd>對小需求提出具體修改清單\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TESTING\u003c/td>\n\u003ctd>指令、環境、案例、結果與缺口\u003c/td>\n\u003ctd>與實際輸出一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>decisions\u003c/td>\n\u003ctd>決策背景、選項、選擇、取捨與來源\u003c/td>\n\u003ctd>找得到當時決策或負責人確認\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"callout\">\u003cstrong>最小起步：\u003c/strong>先完成 README、ARCHITECTURE、RUNBOOK、EXTENDING 四份；功能、資料、測試先放進這四份。使用程式代理工具時，再加一份精簡工作規則。\u003c/div>\n\u003ch3>文件與 SDD 的關係\u003c/h3>\n\u003cp>可把 SDD（軟體設計文件）當成需求、設計與約束的主索引，再連結到功能、架構、介面、排錯及測試文件。建議另外標明「已核准需求」與「由程式反向整理的現況」：程式現在怎麼做，不代表那就是正確需求，也不能證明當初為何這樣設計。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"安全準備專案\" id=\"section-04\">\u003ch2>安全準備專案\u003c/h2>\n\u003ch3>給 AI 的材料\u003c/h3>\n\u003cp>建議提供原始碼、目錄清單、依賴清單與鎖定檔、建置設定、測試、資料庫 schema／migration、安全設定範例，以及已知的操作流程。涉及畫面行為時可提供不含個資的截圖，但截圖不能代替後端與資料流程證據。\u003c/p>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>建議提供\u003c/th>\n\u003cth>提供前處理\u003c/th>\n\u003cth>通常不必一開始提供\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>原始碼與專案目錄\u003c/td>\n\u003ctd>檢查硬編碼金鑰、測試資料與內部資訊\u003c/td>\n\u003ctd>node_modules、venv、套件快取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>package／依賴與鎖定檔\u003c/td>\n\u003ctd>保留版本資訊，移除私有認證資訊\u003c/td>\n\u003ctd>編譯產物、完整安裝目錄\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>schema、migration、去識別測試資料\u003c/td>\n\u003ctd>不含正式客戶記錄或憑證\u003c/td>\n\u003ctd>正式資料庫完整備份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>.env.example、設定規格\u003c/td>\n\u003ctd>只留參數名稱與不具機密的範例值\u003c/td>\n\u003ctd>真實 .env、私鑰、登入權杖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>錯誤紀錄、重現步驟\u003c/td>\n\u003ctd>遮罩憑證、個資、敏感檔案路徑\u003c/td>\n\u003ctd>大量未篩選的正式原始日誌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>舊文件、需求與已知限制\u003c/td>\n\u003ctd>保留日期、版本與來源\u003c/td>\n\u003ctd>無法判斷版本的大量聊天拼貼\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>這不是絕對排除清單：如果問題與編譯、安裝或產物有關，再補上必要且已檢查的資料。壓縮檔包含程式，不代表 AI 已讀完；仍要取得實際閱讀清單。\u003c/p>\n\u003ch3>機密與權限\u003c/h3>\n\u003cp>OWASP 指出，日誌中的密碼、資料庫連線資訊、金鑰與敏感個資應避免直接記錄或需採取保護。交給 AI 的紀錄同樣應先檢查與去識別。\u003ca class=\"source\" href=\"https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html\" rel=\"noopener noreferrer\" target=\"_blank\">官方依據：OWASP 日誌安全\u003c/a>\u003c/p>\n\u003cdiv class=\"callout danger\">\u003cstrong>先用副本或獨立分支，且從唯讀分析開始。\u003c/strong>安裝依賴可能執行腳本；測試可能接觸資料庫、寄信或呼叫外部服務。任何執行動作都先說明環境與副作用；正式資料異動、刪除、部署與對外操作保留人工核准。\u003c/div>\n\u003cp>雲端 AI 處理與本機檔案儲存是兩件事。本頁離線可讀，不代表你之後使用的 AI 模型也在本機執行；敏感專案需另行確認供應商、帳號政策、工具傳輸範圍與資料使用規範。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"分階段分析流程\" id=\"section-05\">\u003ch2>分階段分析流程\u003c/h2>\n\u003cp>建議把工作切成六道關卡，每階段交付可核對的結果，不讓 AI 一次宣稱「已全面理解、已全部完成」。\u003c/p>\n\u003cdiv aria-label=\"建議分析流程\" class=\"flow\">\u003cspan>唯讀盤點\u003c/span>\u003cb>→\u003c/b>\u003cspan>確認範圍\u003c/span>\u003cb>→\u003c/b>\u003cspan>追蹤主流程\u003c/span>\u003cb>→\u003c/b>\u003cspan>產生交接文件\u003c/span>\u003cb>→\u003c/b>\u003cspan>人工與測試核對\u003c/span>\u003cb>→\u003c/b>\u003cspan>版本化維護\u003c/span>\u003c/div>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>階段\u003c/th>\n\u003cth>AI 工作\u003c/th>\n\u003cth>你要核對的事\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>唯讀盤點\u003c/td>\n\u003ctd>列版本、目錄、技術、入口、依賴、已讀與未讀範圍\u003c/td>\n\u003ctd>專案是否正確？有沒有遺漏子專案？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>確認範圍\u003c/td>\n\u003ctd>提出閱讀計畫、主要功能與文件清單\u003c/td>\n\u003ctd>哪些最重要？有哪些錯誤假設？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>追蹤主流程\u003c/td>\n\u003ctd>從操作入口追到結果與資料變化\u003c/td>\n\u003ctd>路徑、函式與資料流是否真實？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>產生文件\u003c/td>\n\u003ctd>總覽、功能、架構、排錯、擴充與測試\u003c/td>\n\u003ctd>有沒有把建議當現況？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>驗證\u003c/td>\n\u003ctd>核准後執行安全的檢查與測試\u003c/td>\n\u003ctd>未測是否有標明？失敗是否有保留？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>維護\u003c/td>\n\u003ctd>變更同步更新文件與交接紀錄\u003c/td>\n\u003ctd>文件與哪個版本對齊？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3>大專案怎麼讀\u003c/h3>\n\u003cp>先讓 AI 建索引，再按主要流程分批讀取：入口與路由 → 核心業務 → 資料存取 → 外部整合 → 測試與部署。要求它記錄目前已理解與尚未覆蓋的模組，下一回合接著讀，不要每回合重新做泛泛總結。\u003c/p>\n\u003cp>工具讀不到某個子資料夾、壓縮檔或私有依賴時，先補資料或縮小結論範圍。不要要求 AI 以推測補齊，再把推測寫進正式規格。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"一頁總覽與上手\" id=\"section-06\">\u003ch2>一頁總覽與上手\u003c/h2>\n\u003cp>建議 README 前半部先讓接手者回答八個問題。實際啟動指令必須由專案內容確認，不要套用通用的 npm、Python 或 Docker 指令就宣稱可用。\u003c/p>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>問題\u003c/th>\n\u003cth>要求的答案\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>這是什麼？\u003c/td>\n\u003ctd>一句話用途、使用者、適用情境\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能做什麼？\u003c/td>\n\u003ctd>主要功能與完成狀態\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不做什麼？\u003c/td>\n\u003ctd>明確排除範圍、目前限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用什麼技術？\u003c/td>\n\u003ctd>語言、框架、資料庫、平台與版本依據\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>怎麼啟動？\u003c/td>\n\u003ctd>前置條件、工作目錄、設定、指令、成功判準\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第一次怎麼操作？\u003c/td>\n\u003ctd>一條安全的範例流程與預期結果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>失敗先查哪裡？\u003c/td>\n\u003ctd>第一個診斷入口、日誌與 runbook 連結\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>詳細資料在哪？\u003c/td>\n\u003ctd>功能、架構、資料、測試、擴充文件索引\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>建議快速上手使用測試帳號與去識別資料，不在文件中嵌入真實密碼。必要權限應說清楚，但帳號憑證由既有安全管道提供。\u003c/p>\n\u003ch3>指令的標準寫法\u003c/h3>\n\u003cp>每條安裝、啟動、診斷與測試指令都要求列出：\u003cstrong>適用作業系統、版本、工作目錄、前置條件、執行方式、正常結果、常見錯誤、副作用與驗證狀態\u003c/strong>。沒有環境可執行，就寫「尚未執行，待指定環境驗證」。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"架構地圖與證據\" id=\"section-07\">\u003ch2>架構地圖與證據\u003c/h2>\n\u003cp>C4 用系統情境、應用與資料儲存、元件及程式等層級說明結構，且不要求每個專案都畫到最細。先畫能幫助理解的層次即可。\u003ca class=\"source\" href=\"https://c4model.com/diagrams.html\" rel=\"noopener noreferrer\" target=\"_blank\">官方依據：C4 圖層級\u003c/a>\u003c/p>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>視角\u003c/th>\n\u003cth>建議說清楚\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>系統邊界\u003c/td>\n\u003ctd>使用者、目標系統、外部服務、責任邊界\u003c/td>\n\u003ctd>先看全貌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>應用與儲存\u003c/td>\n\u003ctd>前端、後端、資料儲存與溝通方式\u003c/td>\n\u003ctd>分辨功能在哪一層\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>關鍵元件\u003c/td>\n\u003ctd>核心模組的責任、相依、入口與出口\u003c/td>\n\u003ctd>找出修改位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>執行流程\u003c/td>\n\u003ctd>一次操作按時間順序經過哪些地方\u003c/td>\n\u003ctd>追蹤成功與失敗路徑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>部署環境\u003c/td>\n\u003ctd>本機、測試、正式的實際位置、設定與差異\u003c/td>\n\u003ctd>避免查錯環境\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>名詞提醒：\u003c/strong>C4 的 container 是應用程式或資料儲存，不應直接等同 Docker 容器。部署細節也應另外交代。\u003ca class=\"source\" href=\"https://c4model.com/diagrams/container\" rel=\"noopener noreferrer\" target=\"_blank\">官方依據：C4 Container\u003c/a>\u003c/p>\n\u003ch3>四種證據狀態\u003c/h3>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>標記\u003c/th>\n\u003cth>代表什麼\u003c/th>\n\u003cth>不能延伸宣稱什麼\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>程式證據已確認\u003c/td>\n\u003ctd>找到實際檔案、函式、設定或測試\u003c/td>\n\u003ctd>不代表在所有環境都能成功\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>執行已驗證\u003c/td>\n\u003ctd>指定版本與環境有執行結果\u003c/td>\n\u003ctd>不代表未測案例也通過\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>待確認\u003c/td>\n\u003ctd>業務意圖、外部環境或證據不足\u003c/td>\n\u003ctd>不可包裝成確定事實\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>建議新增\u003c/td>\n\u003ctd>提出的改善或擴充\u003c/td>\n\u003ctd>不是目前已有功能\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>另把功能完成度區分「已實作、部分實作、占位／模擬、僅規劃」。畫面有按鈕，不代表後端已完成；有 API 呼叫，不代表外部服務現在可用。\u003c/p>\n\u003cp>建議每份文件列出分析日期、版本或 commit、已讀範圍與未確認事項。定位使用「版本／commit＋相對檔案路徑＋符號名稱」，行號只當輔助，且不可編造。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"功能與程式追蹤\" id=\"section-08\">\u003ch2>功能與程式追蹤\u003c/h2>\n\u003cp>不要只依資料夾介紹程式，要先選一條使用者流程，從入口追到資料結果。以下為訂單系統的\u003cstrong>假設示意\u003c/strong>，不是實際專案架構。\u003c/p>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-2\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-2\">\u003ccode class=\"language-text\">使用者送出訂單\n→ 介面處理輸入與基本檢查\n→ 後端驗證身份與權限\n→ 業務規則驗證\n→ 寫入資料庫／交易提交\n→ 回傳訂單編號\n→ 後續通知（若專案有此設計）\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>每一步都追問：誰呼叫？傳什麼資料？在哪裡處理？改了什麼狀態？失敗如何回應？是否可以重試？建議特別分清主操作與後續通知是否同一交易，以及成功後回應遺失時如何避免重複操作。\u003c/p>\n\u003ch3>功能追蹤表欄位\u003c/h3>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>欄位\u003c/th>\n\u003cth>AI 應填入的內容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>功能名稱與完成度\u003c/td>\n\u003ctd>使用者名稱、已實作或未完成的範圍\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>使用者入口\u003c/td>\n\u003ctd>畫面、按鈕、命令、路由、事件或排程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>核心程式\u003c/td>\n\u003ctd>相對路徑、函式／類別／元件名稱\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>輸入與規則\u003c/td>\n\u003ctd>必填、型別、格式、權限、狀態條件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料與外部服務\u003c/td>\n\u003ctd>表格、檔案、狀態、快取、外部 API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功輸出\u003c/td>\n\u003ctd>畫面、回傳值、資料變化、通知與副作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>失敗處理\u003c/td>\n\u003ctd>哪裡失敗、如何回應、有無補償與重試\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>測試證據\u003c/td>\n\u003ctd>對應測試位置、執行結果與缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3>不必逐行講解的界線\u003c/h3>\n\u003cp>建議深入解釋：特殊業務規則、複雜演算法、非直觀限制、狀態轉換、交易邊界、權限與重試。普通資料賦值、框架樣板或可直接讀懂的程式，簡述責任即可；把時間放在「為什麼重要、錯了會怎樣、修改要注意什麼」。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"資料、API 與設定\" id=\"section-09\">\u003ch2>資料、API 與設定\u003c/h2>\n\u003cp>新增功能常不只是改畫面，因此建議另外把資料與介面契約寫清楚。沒有證據的欄位用途、預設值或限制一律標示待確認。\u003c/p>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>類別\u003c/th>\n\u003cth>建議欄位\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>資料模型\u003c/td>\n\u003ctd>名稱、主鍵、型別、可空、預設、唯一限制、關聯、索引\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>狀態流程\u003c/td>\n\u003ctd>可用狀態、允許轉換、誰可轉換、失敗與取消\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API\u003c/td>\n\u003ctd>方法／路徑或事件、身份驗證、權限、輸入、輸出、錯誤\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部整合\u003c/td>\n\u003ctd>服務目的、契約、時間限制、額度、重試與去重方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>設定\u003c/td>\n\u003ctd>名稱、用途、必填、預設、環境、機密屬性、變更生效方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>migration\u003c/td>\n\u003ctd>對應版本、變更內容、舊資料處理、部署順序與復原限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料保存\u003c/td>\n\u003ctd>寫入位置、備份、還原與保留規則；沒有既定政策就待確認\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3>設定清單範本\u003c/h3>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-3\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-3\">\u003ccode class=\"language-text\">設定名稱：\n用途與讀取位置：\n適用環境：\n必填或選填：\n預設值與依據：\n是否屬於機密：\n由誰透過什麼安全管道提供：\n變更後需重啟或重新部署嗎：\n如何確認有生效（不可輸出機密值）：\n缺少或格式錯誤時的行為：\n實際驗證狀態：\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>建議不要在文件中寫入真正的密碼或連線字串。以參數名稱、用途與安全取得方式代替；診斷輸出也避免「印出全部環境變數」這種容易洩漏的方式。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"排錯手冊的寫法\" id=\"section-10\">\u003ch2>排錯手冊的寫法\u003c/h2>\n\u003cp>Google SRE 的排錯方法強調由觀察提出假設，再以證據或受控測試驗證；測試本身也可能有副作用。因此，排錯文件應有判斷分支與風險說明，不是看見症狀就直接認定原因。\u003ca class=\"source\" href=\"https://sre.google/sre-book/effective-troubleshooting/\" rel=\"noopener noreferrer\" target=\"_blank\">官方依據：Google SRE\u003c/a>\u003c/p>\n\u003cdiv class=\"callout danger\">\u003cstrong>嚴重事故先限制損害。\u003c/strong>可能持續造成資料錯誤、重複建單或對外操作時，先考慮經核准的暫停與隔離，保留證據，再深入調查。不要為了「蒐集完整資訊」而放任損害擴大。\u003c/div>\n\u003ch3>一個故障項目的完整格式\u003c/h3>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-4\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-4\">\u003ccode class=\"language-text\">故障名稱：\n適用版本與環境：\n\n1. 症狀\n   看到什麼？預期是什麼？何時開始？能否重現？\n\n2. 影響與保護\n   影響哪些功能與資料？是否持續受損？\n   需保留什麼證據？有無核准的暫停或隔離方式？\n\n3. 先蒐集的資料\n   時間與時區、版本、環境、重現步驟、錯誤全文、\n   去識別日誌、最近修改、請求識別碼（若有）。\n\n4. 檢查步驟與分支\n   工作目錄、環境、權限、方法、正常結果、副作用。\n   結果 A → 支持／排除什麼 → 下一步。\n   結果 B → 支持／排除什麼 → 下一步。\n\n5. 修復\n   分開列：臨時緩解、根本修正、修改範圍與風險。\n\n6. 驗證\n   重做原始失敗操作，檢查結果、資料與相依功能。\n   分清通過、失敗、未執行與未涵蓋。\n\n7. 復原與預防\n   程式、設定、資料、外部副作用如何分開處理？\n   需補哪些測試、監控、診斷能力與文件？\n\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>先蒐集什麼\u003c/h3>\n\u003cp>建議保留完整錯誤文字，不只截最後一行；記錄最近一次成功時間、第一次失敗時間與最近部署。外部服務問題可記錄請求識別碼、回應狀態與耗時，但不要包含憑證或敏感請求內容。\u003c/p>\n\u003ch3>每次只驗證一個清楚假設\u003c/h3>\n\u003cp>建議先問「如果原因是 A，會看到什麼；如果不是，會看到什麼」，再做最低風險的檢查。一次同時改介面、後端、資料庫和版本，即使症狀消失，也很難知道是哪一項修正有效。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"常見症狀查找方向\" id=\"section-11\">\u003ch2>常見症狀查找方向\u003c/h2>\n\u003cp>下表是通用查找順序，\u003cstrong>不是已確認的故障原因\u003c/strong>。只有符合實際技術與環境的項目，才應放入你的專案手冊。\u003c/p>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症狀\u003c/th>\n\u003cth>先查\u003c/th>\n\u003cth>再查\u003c/th>\n\u003cth>避免直接做\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>無法啟動\u003c/td>\n\u003ctd>啟動指令、版本、錯誤全文\u003c/td>\n\u003ctd>依賴、設定、服務占用、外部連線\u003c/td>\n\u003ctd>一次升級所有套件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按下操作沒反應\u003c/td>\n\u003ctd>事件是否觸發、本機／介面錯誤\u003c/td>\n\u003ctd>請求是否送出、後端是否收到、回應是否處理\u003c/td>\n\u003ctd>同時亂改多層程式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料沒儲存\u003c/td>\n\u003ctd>操作回應、驗證錯誤\u003c/td>\n\u003ctd>寫入紀錄、交易提交、環境與資料庫是否正確\u003c/td>\n\u003ctd>清空資料重試\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料重複建立\u003c/td>\n\u003ctd>重送、重複點擊、事件重複\u003c/td>\n\u003ctd>重試、唯一限制、冪等處理\u003c/td>\n\u003ctd>不確認結果就重送正式操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API 失敗\u003c/td>\n\u003ctd>回應狀態、時間、請求識別碼\u003c/td>\n\u003ctd>身份驗證、權限、契約、逾時與網路\u003c/td>\n\u003ctd>關閉驗證或放大所有權限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部服務逾時\u003c/td>\n\u003ctd>是否只有該服務、何時開始\u003c/td>\n\u003ctd>服務狀態、額度、網路、重試策略\u003c/td>\n\u003ctd>無上限立即重試\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>更新後才出錯\u003c/td>\n\u003ctd>新舊版本、設定與部署差異\u003c/td>\n\u003ctd>migration、相依版本、契約、快取\u003c/td>\n\u003ctd>只回退程式就假設資料恢復\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>開發正常、正式失敗\u003c/td>\n\u003ctd>執行版本、環境與設定差異\u003c/td>\n\u003ctd>資料、權限、網路、資源、外部服務\u003c/td>\n\u003ctd>複製正式機密給 AI 分析\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3>沒有日誌怎麼辦\u003c/h3>\n\u003cp>要求 AI 明確列「目前沒有／未找到」，再提出最小診斷能力建議，例如必要的錯誤分類、請求識別碼與安全的狀態紀錄。不要假設專案一定存在某個 log 檔、健康檢查端點或管理頁。\u003c/p>\n\u003ch3>不能靠猜測的地方\u003c/h3>\n\u003cp>「可能是網路」只能作為假設；需要指出何種證據能支持或排除。錯誤訊息是線索，不必然是根本原因；修復後仍需重做原操作並檢查資料，而不只是看到畫面沒有報錯。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"擴充功能先做計畫\" id=\"section-12\">\u003ch2>擴充功能先做計畫\u003c/h2>\n\u003cp>新增功能前，先沿「操作介面 → API／事件 → 業務規則 → 資料 → 外部整合 → 測試 → 部署」做影響分析。與需求無關的層次可以註明不適用，不必為了完整而大幅改寫。\u003c/p>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>檢查面向\u003c/th>\n\u003cth>AI 先回答的問題\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>需求與非目標\u003c/td>\n\u003ctd>解決誰的什麼問題？本次明確不處理什麼？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>驗收\u003c/td>\n\u003ctd>成功、失敗、權限與邊界條件如何判定？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>擴充位置\u003c/td>\n\u003ctd>可以沿用哪個模組？為什麼選這裡？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>修改範圍\u003c/td>\n\u003ctd>新增、修改、刪除哪些檔案？理由與相依是什麼？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>相容性\u003c/td>\n\u003ctd>舊畫面、舊 API、舊資料、既有呼叫方會怎樣？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料變更\u003c/td>\n\u003ctd>加欄位、索引或 migration？舊資料如何處理？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>安全與權限\u003c/td>\n\u003ctd>是否新增讀取、寫入、匯出或傳送能力？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>非功能需求\u003c/td>\n\u003ctd>效能、費用、併發、離線與可維護性是否受影響？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部副作用\u003c/td>\n\u003ctd>是否建立單據、付款、寄信、發 LINE 或改第三方資料？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>測試\u003c/td>\n\u003ctd>需新增什麼案例？哪些舊流程要回歸？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>部署\u003c/td>\n\u003ctd>依賴、設定、資料與程式的先後順序是什麼？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>復原\u003c/td>\n\u003ctd>失敗後能回復哪些內容？哪些不可逆或需要補償？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3>四種復原要分開\u003c/h3>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>類型\u003c/th>\n\u003cth>要求說清楚\u003c/th>\n\u003cth>不可直接假設\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>程式碼回退\u003c/td>\n\u003ctd>可回到哪版、是否仍能讀新資料\u003c/td>\n\u003ctd>舊程式一定相容新 schema\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>設定復原\u003c/td>\n\u003ctd>設定版本、憑證與生效條件\u003c/td>\n\u003ctd>回退程式就會恢復設定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>資料復原\u003c/td>\n\u003ctd>備份、還原方法、演練、復原期間的新增資料\u003c/td>\n\u003ctd>migration 都能安全反向執行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部補償\u003c/td>\n\u003ctd>對外建單、付款、訊息的處理與人工核准\u003c/td>\n\u003ctd>發出的訊息或付款能靠回退程式取消\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"callout\">\u003cstrong>建議採取最小修改：\u003c/strong>先核准需求與計畫，再實作小步變更；不要在增加一個按鈕的同時，順便重寫身份驗證、資料層與整個框架。\u003c/div>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"首次分析總指令\" id=\"section-13\">\u003ch2>首次分析總指令\u003c/h2>\n\u003cp>先把專案放在 AI 可讀取的範圍，或上傳已檢查的壓縮檔。這段是通用工作規格，不是特定工具的內建命令。\u003cstrong>先執行盤點階段，確認後再進入詳細文件。\u003c/strong>\u003c/p>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-5\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-5\">\u003ccode class=\"language-text\">請擔任「程式接手工程師、技術文件作者與維護顧問」。\n\n目標：讓沒有參與原始開發的人，能快速理解這個專案、\n依文件操作與排錯，並知道如何安全新增功能。\n請使用繁體中文，先講白話概念，再補必要技術細節。\n\n【目前權限】\n目前只允許讀取與分析。\n不要修改原始碼、既有文件、測試、依賴、設定或資料。\n不要安裝套件、執行腳本、啟動服務、連正式環境或呼叫外部 API。\n若需要執行任何指令，先說明用途、副作用、權限與執行環境，等核准。\n文件先以草稿交付；取得同意後才能寫入指定位置。\n\n【分析原則】\n1. 以實際程式碼與設定為依據，不只憑檔名、註解或舊聊天推測。\n2. 列出已讀、略過、無法讀取範圍；專案太大時分階段分析。\n3. 區分已實作、部分實作、占位／模擬、僅規劃功能。\n4. 區分程式證據已確認、執行已驗證、待確認與建議新增。\n5. 不知道的設計理由或業務意圖，標示待確認，不代替作者編造。\n6. 找不到入口、測試、日誌、API 或設定時，明確說未找到。\n7. 文件與程式不一致時列出差異，不自行認定哪一邊才是正確需求。\n8. 不顯示密碼、權杖、私鑰、正式連線字串與客戶個資。\n9. 未執行的檢查不得寫成通過；部分通過不得寫成全部完成。\n\n【先交付第一階段】\nA. 專案目錄與技術盤點。\nB. 目前分析版本或 commit；無法取得時明確註記。\nC. 程式入口、主要模組、外部依賴與資料儲存。\nD. 建議優先追蹤的三條主要操作流程。\nE. 尚缺資料、閱讀計畫與預計產生的文件清單。\n完成後先停下，等待確認，再繼續詳細分析。\n\n【後續詳細文件的要求】\nA. 快速上手：用途、使用者、能做與不能做、首次操作、成功判準。\nB. 功能手冊：每項功能的操作、權限、輸入輸出、限制與失敗回饋。\nC. 架構地圖：模組責任、啟動流程、關鍵資料流、實際部署。\nD. 功能追蹤表：功能 → 入口 → 核心程式 → 資料 → 外部服務 → 測試。\nE. 資料與介面：schema、狀態、API、設定、整合與版本限制。\nF. 排錯手冊：症狀、蒐證、檢查步驟、預期結果、分支判斷、\n   修復、驗證、復原、預防；先列低風險檢查。\nG. 擴充指南：功能放哪裡、影響哪些層、不可破壞規則、\n   相容性、migration、測試、部署、復原。\nH. 測試與限制：實際執行結果、未執行原因、已知問題、測試缺口。\n\n【定位與表達】\n每個重要結論附「相對檔案路徑＋函式／類別／元件名稱」，\n可確認時補行號；不要編造定位。\n先一頁總覽再提供模組細節，不要只做逐行翻譯。\n圖中區分現有系統與建議架構；不能畫圖時提供文字流程。\n每份文件記錄分析版本、範圍、驗證狀態與待確認事項。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"深入單項功能指令\" id=\"section-14\">\u003ch2>深入單項功能指令\u003c/h2>\n\u003cp>當總覽已完成，再一次深入一個功能。這樣比較容易核對來源，也能避免 AI 把模組逐檔介紹一遍，卻沒有說清楚真正的使用者流程。\u003c/p>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-6\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-6\">\u003ccode class=\"language-text\">請只深入分析我接下來指定的功能，\n暫時不要修改任何檔案或執行指令。\n\n請依序說明：\n1. 使用者如何觸發，前置條件與權限是什麼。\n2. 從入口到結果的實際呼叫流程。\n3. 每一步的檔案路徑、符號名稱、輸入輸出與資料變化。\n4. 成功、失敗、取消、重複操作與邊界條件的處理。\n5. 哪些是程式證據，哪些需要執行才能確認。\n6. 對應測試、缺口與最小驗證方案。\n7. 未來修改此功能時，哪些相依功能必須一起檢查。\n\n先用非原作者能理解的文字解釋，再補程式細節。\n沒有證據的業務意圖標示待確認；\n不要根據目前行為自行認定正確需求。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>更短的日常追問\u003c/h3>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-7\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-7\">\u003ccode class=\"language-text\">請不要只說「修改相關程式」。\n請指出：實際相對路徑、函式或元件、修改原因、\n輸入輸出的差異、受影響功能、驗證步驟與復原限制。\n不知道或未執行的部分，請明確標示。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"故障資料與診斷指令\" id=\"section-15\">\u003ch2>故障資料與診斷指令\u003c/h2>\n\u003cp>先填寫故障資料。沒有的欄位寫「未知」，不要為了填完整而猜測；貼日誌前先去除憑證與個資。\u003c/p>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-8\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-8\">\u003ccode class=\"language-text\">問題描述：\n預期結果：\n實際結果與錯誤全文：\n重現步驟：\n作業系統、執行環境與程式版本：\n發生時間與時區：\n最近一次成功時間（若知道）：\n最近修改、部署或設定變更：\n已嘗試的方法與結果：\n相關去識別日誌／畫面／請求識別碼：\n影響範圍與是否持續造成損害：\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>資料不足時，先讓 AI 列出「最少需要補什麼」，不用先要求唯一答案。接著貼下面的工作指令。\u003c/p>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-9\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-9\">\u003ccode class=\"language-text\">請協助診斷我提供的問題，先不要改程式、資料或執行指令。\n\n請輸出：\n1. 已知事實、影響範圍與尚缺證據。\n2. 是否需要先限制損害或暫停操作；任何動作都須等核准。\n3. 依目前證據排序的原因假設，說明支持與反對證據；\n   不要用沒有依據的精確機率，不把假設寫成已確定原因。\n4. 優先從低風險、資訊價值高的檢查開始。\n5. 每步列環境、工作目錄、權限、方法、預期結果、判斷分支、副作用。\n6. 區分臨時緩解與根本修正，優先提出最小修改方案。\n7. 提出原問題重現、修正驗證與相關功能回歸測試。\n8. 說明失敗時程式、設定、資料與外部副作用如何分別處理。\n\n不要建議關閉安全驗證、放大所有權限、清空資料，\n或未確認結果就重送會建單、付款、發訊息的操作。\n不存在的工具、日誌或檢查端點不得編造；\n未執行的指令與檢查，必須標示待驗證。\n先交診斷計畫，等待確認。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"新增功能規劃指令\" id=\"section-16\">\u003ch2>新增功能規劃指令\u003c/h2>\n\u003cp>先用自然語言描述新功能、使用者、成功條件、限制與不能改變的既有行為。不清楚時可以先請 AI 協助整理問題，但不要讓它自行決定高風險業務規則。\u003c/p>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-10\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-10\">\u003ccode class=\"language-text\">請依現有專案規則分析我提出的新功能，先不要寫程式或執行指令。\n\n先閱讀專案總覽、架構、擴充規則與相關原始碼，\n列出實際已讀範圍與分析版本。\n\n請先交付：\n1. 需求理解、非目標與必須確認的歧義。\n2. 可驗收的成功、失敗、權限與邊界案例。\n3. 建議擴充位置與原因，優先沿用現有模組，不做無關重構。\n4. 新增與修改檔案清單，逐項說明作用與相依關係。\n5. UI、API、業務規則、資料與外部服務的影響。\n6. 舊資料、舊介面與既有操作的相容性。\n7. 若涉及 migration，說明備份、測試、部署順序與復原限制。\n8. 安全、效能、費用與外部副作用風險。\n9. 測試計畫、分階段實作計畫與文件更新清單。\n10. 哪些步驟需要核准或額外權限。\n\n計畫核准後，只實作核准範圍。\n完成後交付差異說明、測試證據、未完成項目、文件更新與復原方式。\n不要刪除或跳過失敗測試來宣稱完成，\n不要以大幅重寫替代小功能修改。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"修改完成交接指令\" id=\"section-17\">\u003ch2>修改完成交接指令\u003c/h2>\n\u003cp>建議每次修改後都要求同一套交接紀錄，尤其是換 AI、換對話或換工程師之前。交付紀錄應能看出「改了什麼、驗證到哪裡、還剩什麼風險」。\u003c/p>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-11\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-11\">\u003ccode class=\"language-text\">請針對本次已完成的變更製作交接紀錄。\n不要為了整理交接而額外修改原始碼或執行指令。\n\n請列出：\n1. 修改前後的使用者行為差異。\n2. 新增、修改與刪除的檔案及各自原因。\n3. 設定、依賴、API、資料結構與外部整合的變動。\n4. 實際執行的檢查：指令、環境、結果與證據位置。\n5. 沒有執行、失敗或仍待確認的項目。\n6. 已更新及尚未更新的文件；若不需更新請說明原因。\n7. 部署順序、驗收步驟、復原限制及殘留風險。\n8. 給下一位工程師或下一個 AI 的接手摘要。\n\n不要使用「全部完成、完全安全、可直接正式上線」\n等超出實際驗證範圍的結論。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>接手摘要應包含\u003c/h3>\n\u003cp>建議控制在能快速閱讀的篇幅，連回詳細文件：專案版本、完成範圍、重要規則、目前問題、未測項目、下一步及需要核准的操作。不必把整個原始碼再貼一次，也不能只留聊天摘要而沒有實際文件與版本定位。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"AI 工作規則與版本\" id=\"section-18\">\u003ch2>AI 工作規則與版本\u003c/h2>\n\u003cp>Codex 可使用 AGENTS.md 作為持續的專案指引。GitHub Copilot 的儲存庫指令常放在 .github/copilot-instructions.md；不同功能與介面對指令檔的支援有所差異，使用前確認當前文件。\u003ca class=\"source\" href=\"https://openai.com/index/introducing-codex/\" rel=\"noopener noreferrer\" target=\"_blank\">官方：Codex\u003c/a> \u003ca class=\"source\" href=\"https://docs.github.com/en/copilot/concepts/prompting-and-context/custom-instructions\" rel=\"noopener noreferrer\" target=\"_blank\">官方：Copilot\u003c/a> \u003ca class=\"source\" href=\"https://docs.github.com/en/copilot/reference/custom-instructions-support\" rel=\"noopener noreferrer\" target=\"_blank\">支援範圍\u003c/a>\u003c/p>\n\u003cp>建議維護一份主要規則，再依工具配置入口；不要假設所有 AI 都會讀同一檔名。新對話開始，讓 AI 回報已讀規則、文件版本與未讀範圍。規則要簡短，詳細規格用連結導向文件。\u003c/p>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-12\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-12\">\u003ccode class=\"language-markdown\"># 專案協作規則\n\n- 先閱讀 README、架構文件、擴充規則與本次相關原始碼。\n- 使用繁體中文；列出分析版本與實際閱讀範圍。\n- 區分程式現況、已核准需求、待確認事項與改善建議。\n- 不編造檔案、API、業務規則、原因或測試結果。\n- 修改前交影響檔案、相容性、測試、風險與復原計畫。\n- 不做無關重構，不擅自更換架構、依賴或刪除既有功能。\n- 執行指令先確認權限與副作用；正式資料、對外操作需人工核准。\n- 不輸出、提交或在日誌中加入金鑰、密碼與敏感資料。\n- 功能變更同步檢查功能、架構、排錯、擴充與測試文件。\n- 影響不明或規格衝突時，先停止相關修改並列出問題。\n- 不得刪除或跳過失敗測試偽造通過；未執行不得宣稱已驗證。\n- 完成交付修改清單、行為差異、測試證據、文件差異與剩餘風險。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cstrong>規則檔不是安全邊界。\u003c/strong>「請勿刪資料」不能代替真正的唯讀權限。仍要搭配隔離環境、最低權限、差異審閱、備份演練與人工核准。\u003c/div>\n\u003ch3>文件同步建議\u003c/h3>\n\u003cp>每次功能變更檢查 FEATURES；流程或模組改動檢查 ARCHITECTURE；資料與契約變更檢查 DATA-AND-API；新故障檢查 RUNBOOK；擴充規則改動檢查 EXTENDING；測試變動檢查 TESTING。若不需更新，交代為什麼，避免為了「同步」反覆抄寫同樣內容。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"可套用的文件骨架\" id=\"section-19\">\u003ch2>可套用的文件骨架\u003c/h2>\n\u003cp>以下為可編輯的空白範本，\u003cstrong>不是已完成的專案文件\u003c/strong>。複製後填入實際證據；未取得的資訊寫「待確認」，不必硬填數字、路徑或成功結果。\u003c/p>\n\u003ch3>README 範本\u003c/h3>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-13\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-13\">\u003ccode class=\"language-markdown\"># 專案名稱\n\n## 分析與版本\n- 文件日期：\n- 對應版本／commit：\n- 分析範圍、未讀範圍：\n- 程式確認／執行驗證／待確認事項：\n\n## 用途與邊界\n- 使用者與用途：\n- 主要功能及完成度：\n- 非目標、限制與已知問題：\n\n## 快速上手\n- 支援平台與版本依據：\n- 前置條件、權限、設定：\n- 安裝與啟動（環境、目錄、指令、副作用）：\n- 第一次安全操作與預期結果：\n- 目前驗證狀態：\n\n## 文件索引\n- 功能與操作：\n- 架構、流程與程式地圖：\n- 資料、API 與設定：\n- 排錯、測試、擴充與復原：\n\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>架構與功能範本\u003c/h3>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-14\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-14\">\u003ccode class=\"language-markdown\"># 架構與程式地圖\n\n## 文件版本與分析範圍\n## 系統用途、邊界與外部依賴\n## 執行環境與部署差異\n## 技術清單及版本來源\n## 真正的啟動入口\n## 主要模組：責任、相依、輸入、輸出\n## 主要操作的成功、失敗與取消流程\n## 功能追蹤表：入口、核心位置、資料、外部服務、測試\n## 權限、狀態、交易與重試規則\n## 有來源的設計決策與取捨\n## 已知限制、未讀範圍與待確認事項\n\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>RUNBOOK 範本\u003c/h3>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-15\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-15\">\u003ccode class=\"language-markdown\"># 操作、維運與故障排除\n\n## 適用版本、環境與權限\n## 啟動、停止、部署與成功判準\n## 設定、資料與日誌位置（不可含機密）\n## 事故時先保護什麼、如何保留證據\n## 各項故障\n- 症狀與影響：\n- 需蒐集的去識別資訊：\n- 原因假設與證據：\n- 檢查步驟、預期結果、判斷分支與副作用：\n- 臨時緩解、根本修正：\n- 原問題驗證與回歸：\n- 程式、設定、資料與外部副作用的復原：\n- 預防措施、測試與文件更新：\n\n## 備份、還原與演練證據\n## 沒有的診斷能力與待確認事項\n\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>EXTENDING 範本\u003c/h3>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-16\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-16\">\u003ccode class=\"language-markdown\"># 擴充與安全修改指南\n\n## 適用版本與不可破壞的既有行為\n## 各類功能應放入的模組與實際擴充點\n## 修改前：需求、非目標、驗收與影響分析\n## 命名、分層、介面與依賴規則\n## 權限、安全、資料與外部副作用\n## API／資料相容性與 migration\n## 測試、回歸與完成條件\n## 分階段實作、部署與核准關卡\n## 程式回退、設定復原、資料復原與補償限制\n## 修改後文件與接手摘要\n\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>測試紀錄範本\u003c/h3>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-17\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-17\">\u003ccode class=\"language-text\">對應版本／commit：\n測試日期與環境：\n測試範圍與安全前提：\n實際指令或人工操作：\n成功判準：\n實際結果：通過／失敗／未執行\n輸出或證據位置：\n未執行原因：\n未涵蓋案例與風險：\n需要補充的下一步：\n\u003c/code>\u003c/pre>\u003c/div>\n\u003ch3>設計決策範本\u003c/h3>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-18\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-18\">\u003ccode class=\"language-text\">決策名稱與日期：\n狀態：提案／已核准／已被取代／待確認\n背景與限制：\n考慮過的選項：\n實際決策與確認來源：\n取捨、影響與代價：\n受影響模組與版本：\n何種情況下需要重新評估：\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>不要把「AI 認為這樣比較好」追溯成「原作者當時就是這樣決定」。無歷史資料時，可以建立新的提案，但須分清提案與既有決策。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"訂單整合的示意案例\" id=\"section-20\">\u003ch2>訂單整合的示意案例\u003c/h2>\n\u003cp>以下是印刷／標籤訂單系統的\u003cstrong>假設案例\u003c/strong>，用來示範文件深度，不代表你的系統已有這些功能或採用此架構。實際檔案與函式一律需由程式核對。\u003c/p>\n\u003ch3>案例一：了解建立訂單\u003c/h3>\n\u003cdiv class=\"code-box\">\u003cdiv class=\"code-toolbar\">\u003cspan>文字範本 · 可複製\u003c/span>\u003cbutton class=\"copy-btn\" data-copy=\"code-19\" type=\"button\">複製\u003c/button>\u003c/div>\u003cpre id=\"code-19\">\u003ccode class=\"language-text\">客戶從網頁或 LINE 提出需求\n→ 中台接收與驗證（若有）\n→ 整理品名、尺寸、材料、數量與交期\n→ 業務規則與權限檢查\n→ 人工確認必要項目（依實際流程）\n→ 寫入訂單／串接 ERP（若有）\n→ 回傳結果與通知\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>建議文件說明：AI 是產生建議還是能正式建單？哪一步需人工確認？價格由哪裡決定？訂單與 ERP 的編號如何對照？哪個資料才是正式來源？這些規則不能由 AI 憑常識代填。\u003c/p>\n\u003ch3>案例二：客戶收到失敗，但資料已建立\u003c/h3>\n\u003cp>這是診斷假設，不是確定原因。建議先查原操作是否已提交成功，再查回應或通知是否失敗；若未確認就重新建單，可能產生重複資料。排錯手冊要交代如何以既有識別資訊查詢結果；如果目前沒有去重或追蹤能力，就標為缺口。\u003c/p>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>要求\u003c/th>\n\u003cth>太淺的回答\u003c/th>\n\u003cth>期望深度\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>判斷成功\u003c/td>\n\u003ctd>客戶有收到通知就成功\u003c/td>\n\u003ctd>分開驗證正式資料、ERP 結果與通知狀態\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>找程式\u003c/td>\n\u003ctd>去後端看\u003c/td>\n\u003ctd>指出實際接收入口、業務函式、資料存取與外部呼叫\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>處理逾時\u003c/td>\n\u003ctd>再送一次\u003c/td>\n\u003ctd>先確認是否已提交、是否具冪等性，再決定安全重試\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>補文件\u003c/td>\n\u003ctd>加一行注意事項\u003c/td>\n\u003ctd>補症狀、查詢方式、分支、人工處理、測試與缺口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3>案例三：新增 Excel 匯出\u003c/h3>\n\u003cp>不能只要求「寫一個匯出函式」。建議先確認誰可匯出、匯出哪些訂單、欄位與排序、敏感內容、大量資料處理、檔案內容安全與失敗回饋，再決定要修改哪些程式。\u003c/p>\n\u003cp>若沒有真實程式可分析，AI 應先給「待核對的影響面向」，不能編造現有 OrderService 或資料表名稱。核准計畫後，再提供最小修改、測試證據與相關文件更新。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"人工驗收與實測問題\" id=\"section-21\">\u003ch2>人工驗收與實測問題\u003c/h2>\n\u003cp>GitHub 的 AI 程式審查指南要求執行測試與靜態分析，也提醒注意刪除或跳過測試的情況。可把這個原則延伸到交接驗收：有漂亮文件，不等於程式已被驗證。\u003ca class=\"source\" href=\"https://docs.github.com/en/enterprise-cloud@latest/copilot/tutorials/review-ai-generated-code\" rel=\"noopener noreferrer\" target=\"_blank\">官方依據：審查 AI 程式碼\u003c/a>\u003c/p>\n\u003ch3>用五個問題檢查\u003c/h3>\n\u003col>\n\u003cli>這個程式最重要的三個功能，入口與核心程式分別在哪裡？\u003c/li>\n\u003cli>完成一次主要操作後，哪些資料會變動？如何確認真的成功？\u003c/li>\n\u003cli>操作失敗時第一步查什麼？不同結果分別怎麼做？\u003c/li>\n\u003cli>新增一個欄位或小功能，哪些地方要改、哪些流程要重測？\u003c/li>\n\u003cli>更新失敗時，程式、設定、資料與對外操作各如何復原？\u003c/li>\n\u003c/ol>\n\u003cp>至少人工核對一題的原始碼與操作結果。如果仍只得到「檢查設定、修改相關程式、重新測試」，就要求具體位置、證據與步驟，不要只叫 AI 再寫長一點。\u003c/p>\n\u003ch3>人工檢查表\u003c/h3>\n\u003cp>此處僅供人工確認，\u003cstrong>不會掃描電腦、檢查原始碼、執行測試或評估真實安全程度\u003c/strong>。勾選數不是品質分數；請依實際證據勾選。狀態嘗試儲存在本機瀏覽器，可能受私密模式、file:// 行為或瀏覽器政策影響；需要保存請匯出紀錄。\u003c/p>\n\u003cdiv class=\"check-panel\">\u003cdiv class=\"check-fields\">\u003clabel>專案名稱\u003cinput id=\"checkProject\" maxlength=\"160\" placeholder=\"選填，不要填機密\"/>\u003c/label>\u003clabel>文件／程式版本\u003cinput id=\"checkVersion\" maxlength=\"160\" placeholder=\"例如：版本或 commit\"/>\u003c/label>\u003c/div>\u003cp class=\"small\">僅上方兩欄、下方備註與勾選狀態會嘗試保存在此瀏覽器；不是共用資料庫。\u003c/p>\u003cdiv class=\"check-meter\">\u003cstrong id=\"checkCount\">已人工確認 0 / 18 項\u003c/strong>\u003cspan>不是程式品質或安全分數\u003c/span>\u003c/div>\u003cdiv class=\"meter\">\u003cdiv id=\"checkBar\">\u003c/div>\u003c/div>\u003cdiv id=\"checkItems\">\u003ch4>用途與範圍\u003c/h4>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c01\" id=\"check-1\" type=\"checkbox\"/>\u003cspan>一頁總覽能說清楚用途、使用者、主要功能與限制。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c02\" id=\"check-2\" type=\"checkbox\"/>\u003cspan>已實作、部分實作、占位／模擬與規劃功能分開。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c03\" id=\"check-3\" type=\"checkbox\"/>\u003cspan>分析版本、已讀範圍與未讀範圍明確。\u003c/span>\u003c/label>\u003ch4>程式與流程\u003c/h4>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c04\" id=\"check-4\" type=\"checkbox\"/>\u003cspan>能找到真正的啟動入口與主要模組。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c05\" id=\"check-5\" type=\"checkbox\"/>\u003cspan>至少一條主要流程能追到資料結果。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c06\" id=\"check-6\" type=\"checkbox\"/>\u003cspan>重要功能有實際路徑與符號定位。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c07\" id=\"check-7\" type=\"checkbox\"/>\u003cspan>沒有證據的設計理由與業務意圖標示待確認。\u003c/span>\u003c/label>\u003ch4>操作與排錯\u003c/h4>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c08\" id=\"check-8\" type=\"checkbox\"/>\u003cspan>安裝、啟動與診斷有環境、目錄、權限與副作用說明。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c09\" id=\"check-9\" type=\"checkbox\"/>\u003cspan>故障手冊包含預期結果與判斷分支。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c10\" id=\"check-10\" type=\"checkbox\"/>\u003cspan>日誌與診斷工具確實存在，沒有的列為缺口。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c11\" id=\"check-11\" type=\"checkbox\"/>\u003cspan>排錯先保護資料與證據，不盲目重送有副作用操作。\u003c/span>\u003c/label>\u003ch4>擴充與復原\u003c/h4>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c12\" id=\"check-12\" type=\"checkbox\"/>\u003cspan>擴充位置、修改範圍與不可破壞規則明確。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c13\" id=\"check-13\" type=\"checkbox\"/>\u003cspan>舊介面、舊資料與 migration 的影響已分析。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c14\" id=\"check-14\" type=\"checkbox\"/>\u003cspan>程式、設定、資料及外部副作用的復原分開。\u003c/span>\u003c/label>\u003ch4>測試與交付\u003c/h4>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c15\" id=\"check-15\" type=\"checkbox\"/>\u003cspan>通過、失敗、未執行及未涵蓋項目分開。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c16\" id=\"check-16\" type=\"checkbox\"/>\u003cspan>測試有版本、環境、實際步驟與證據。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c17\" id=\"check-17\" type=\"checkbox\"/>\u003cspan>文件與功能變更同步，且留有接手摘要。\u003c/span>\u003c/label>\u003clabel class=\"check-item\">\u003cinput data-check-id=\"c18\" id=\"check-18\" type=\"checkbox\"/>\u003cspan>無真實憑證與未去識別個資；重要操作有核准。\u003c/span>\u003c/label>\u003c/div>\u003clabel class=\"note-label\">驗收備註（請勿填入機密）\u003ctextarea id=\"checkNotes\" maxlength=\"12000\" placeholder=\"記錄證據位置、未確認事項與負責人。\" rows=\"4\">\u003c/textarea>\u003c/label>\u003cdiv class=\"button-row\">\u003cbutton id=\"exportChecks\" type=\"button\">匯出檢查紀錄 JSON\u003c/button>\u003cbutton id=\"importChecks\" type=\"button\">匯入檢查紀錄\u003c/button>\u003cbutton class=\"subtle danger-text\" id=\"resetChecks\" type=\"button\">重設本頁紀錄\u003c/button>\u003cinput accept=\".json,application/json\" hidden=\"\" id=\"checkFile\" type=\"file\"/>\u003c/div>\u003cp class=\"small\" id=\"storageStatus\" role=\"status\">\u003c/p>\u003c/div>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"快速上手與規模調整\" id=\"section-22\">\u003ch2>快速上手與規模調整\u003c/h2>\n\u003cp>以下時間是閱讀與整理目標，不是各種規模專案都能達成的承諾。先讓人知道全貌，再能跑流程，最後逐步深入維護。\u003c/p>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>階段\u003c/th>\n\u003cth>建議目標\u003c/th>\n\u003cth>需要的成果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>先看全貌\u003c/td>\n\u003ctd>約 5 分鐘知道用途與邊界\u003c/td>\n\u003ctd>一頁總覽、主要功能、簡圖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>再跑流程\u003c/td>\n\u003ctd>約 15 分鐘找到主要入口與操作路徑\u003c/td>\n\u003ctd>快速上手、成功判準、功能追蹤表\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>再學維護\u003c/td>\n\u003ctd>約 30–60 分鐘理解一項故障與一項擴充\u003c/td>\n\u003ctd>一份可操作 runbook、一份影響分析\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持續更新\u003c/td>\n\u003ctd>每次變更一起核對\u003c/td>\n\u003ctd>程式差異、測試證據、文件更新、接手摘要\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cdiv aria-label=\"資料表，可左右捲動\" class=\"table-wrap\" role=\"region\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>專案類型\u003c/th>\n\u003cth>優先文件\u003c/th>\n\u003cth>特別檢查\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>單檔腳本／本機小工具\u003c/td>\n\u003ctd>一份 README 可先涵蓋所有必要內容\u003c/td>\n\u003ctd>輸入輸出、覆寫風險、路徑、編碼與失敗恢復\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>網站／後台\u003c/td>\n\u003ctd>README、架構、API／資料、runbook\u003c/td>\n\u003ctd>權限、前後端契約、環境、資料與部署\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手機／桌面 App\u003c/td>\n\u003ctd>操作、架構、建置與測試\u003c/td>\n\u003ctd>平台版本、權限、生命週期、儲存與裝置測試\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LINE Bot／外部整合\u003c/td>\n\u003ctd>流程、外部契約、排錯與擴充\u003c/td>\n\u003ctd>事件驗證、重試、去重、額度、對外副作用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ERP／正式業務系統\u003c/td>\n\u003ctd>另加資料、核准、備份與復原\u003c/td>\n\u003ctd>正式來源、權限、交易、金額規則、可追溯性\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3>一次不要要求全部重做\u003c/h3>\n\u003cp>建議第一輪只拿「入口、主流程、缺口」；第二輪深入一項功能；第三輪做一個可重現的排錯項目；第四輪用小需求驗證擴充指南。等這四項確實有用，再增加自動化文件檢查或持續整合。\u003c/p>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"工作指令組合器\" id=\"section-23\">\u003ch2>工作指令組合器\u003c/h2>\n\u003cp>此工具只在本頁組合文字，不會讀取專案、不會連接 AI，也不會執行命令。輸入內容不會由本頁傳送到伺服器；\u003cstrong>請勿填入金鑰、密碼或個資\u003c/strong>。預設不儲存表單內容，關閉或重載頁面可能清空。\u003c/p>\n\u003cp>填入少量背景，選擇任務，再產生可複製的工作指令。程式細節仍須由接收指令的 AI 讀取實際專案確認。\u003c/p>\n\u003cdiv class=\"builder\">\u003cdiv class=\"builder-grid\">\u003clabel>任務\u003cselect id=\"taskType\">\u003coption value=\"overview\">首次分析與完整交接\u003c/option>\u003coption value=\"feature\">深入一項功能\u003c/option>\u003coption value=\"debug\">診斷故障\u003c/option>\u003coption value=\"extend\">規劃新增功能\u003c/option>\u003coption value=\"handoff\">修改完成後交接\u003c/option>\u003c/select>\u003c/label>\u003clabel>專案／平台\u003cinput id=\"projectInput\" maxlength=\"200\" placeholder=\"例如：訂單後台、條碼 App\"/>\u003c/label>\u003c/div>\u003clabel>功能、問題或本次變更\u003ctextarea id=\"taskInput\" maxlength=\"12000\" placeholder=\"描述真實情況；不知道的寫未知。\" rows=\"4\">\u003c/textarea>\u003c/label>\u003clabel>不能改變的既有行為／操作限制\u003ctextarea id=\"limitsInput\" maxlength=\"6000\" placeholder=\"例如：不能刪除掃描紀錄、不連正式資料庫。\" rows=\"3\">\u003c/textarea>\u003c/label>\u003cdiv class=\"button-row\">\u003cbutton class=\"primary\" id=\"buildPrompt\" type=\"button\">產生工作指令\u003c/button>\u003cbutton id=\"copyBuilt\" type=\"button\">複製產生的指令\u003c/button>\u003cbutton id=\"downloadBuilt\" type=\"button\">下載 TXT\u003c/button>\u003c/div>\u003clabel>產生結果\u003ctextarea id=\"builtPrompt\" placeholder=\"按「產生工作指令」後顯示；本頁不會連接 AI。\" readonly=\"\" rows=\"17\">\u003c/textarea>\u003c/label>\u003c/div>\n\u003c/section>\u003csection class=\"chapter\" data-title=\"常見疑問與使用限制\" id=\"section-24\">\u003ch2>常見疑問與使用限制\u003c/h2>\n\u003cdetails>\u003csummary>一定要把整個專案一次丟給 AI 嗎？\u003c/summary>\u003cp>不一定。建議先給目錄、主要設定與入口，再沿主流程讀取。能上傳整個專案也仍要取得已讀／未讀清單。只給片段時，結論必須限制在片段，不能宣稱完整理解系統。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>逐行註解越多，越容易維護嗎？\u003c/summary>\u003cp>本指南不建議以註解數量驗收。優先解釋責任、資料流、業務規則、風險與取捨，對非直觀實作再深入。重述語法但沒有說明功能與流程，對接手幫助有限。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>可以直接要求 AI 邊分析邊修好嗎？\u003c/summary>\u003cp>建議先唯讀分析、再核准最小修改。否則容易混合整理、重構與修復，也不容易核對原始行為。事故需要緊急緩解時，仍先確認影響、授權與復原方式。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>AI 說已完成測試，怎麼確認？\u003c/summary>\u003cp>要求版本、環境、實際指令、結果與證據位置；人工測試要有步驟與判準。沒有執行的檢查只能寫待驗證，不能用產生測試程式替代真正執行結果。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>換另一個 AI，提供文件就夠了嗎？\u003c/summary>\u003cp>文件是入口，不是程式的替代品。建議同時提供對齊版本的原始碼與測試；讓新 AI 回報已讀範圍，先核對重要流程，再修改。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>AGENTS.md 放進去就會自動限制 AI 權限嗎？\u003c/summary>\u003cp>不會。它是工作指引，不是存取控制。是否自動讀取依工具與範圍而定；能否寫入、連網、部署或接觸資料，需要工具與環境實際限制。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>本頁可以完全離線使用嗎？\u003c/summary>\u003cp>內容、導覽、篩選、複製後備方案、指令組合器與檢查表都不依賴外部套件。官方來源連結需要網路；使用另一個 AI 是否需網路，由該工具決定。剪貼簿或瀏覽器儲存若被限制，可手動複製並匯出紀錄。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>如何另存 PDF 或交給同事？\u003c/summary>\u003cp>使用頁面上方「列印／另存 PDF」，列印版會恢復完整章節並展開補充說明。需要保留互動功能時直接交付 HTML；檢查表紀錄則另行匯出 JSON。列印版面會受瀏覽器、字型與紙張設定影響。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>檢查表可以當成資安稽核或正式驗證報告嗎？\u003c/summary>\u003cp>不可以。這是人工記錄工具，沒有自動檢查能力，也不能證明程式安全、資料可恢復或測試已通過。正式驗證仍需對應環境、證據、責任人與組織流程。\u003c/p>\u003c/details>\n\u003cdiv class=\"callout\">\u003cstrong>使用界線：\u003c/strong>本頁是通用教材與範本，不是已完成的系統審查。先讓 AI 對真實程式提出有定位、有版本、有驗證狀態的文件，再由人核對與核准重要操作。\u003c/div>\n\u003c/section>\n\u003cnoscript>\u003cdiv class=\"callout danger\">目前 JavaScript 未啟用。正文與官方連結仍可閱讀，但搜尋、複製、指令組合器與檢查紀錄功能無法使用。可手動選取文字複製。\u003c/div>\u003c/noscript>\n\u003cfooter>AI 程式交接實作指南 · v1.0 · 2026-10-31\u003cbr>內容與範本為通用建議；重要操作仍需依實際程式、環境與權限核對。本頁沒有遠端分析、資料庫或 AI 連線功能。\u003c/footer>\u003c/main>\u003c/div>\n\u003ca class=\"back-top\" href=\"#top\" aria-label=\"回到頁面頂端\">回頂端 ↑\u003c/a>\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\u003cdialog id=\"copyDialog\" style=\"width:min(700px,90vw);border:1px solid #b8cbd1;border-radius:12px;padding:24px\">\u003ch3 style=\"margin-top:0\">手動複製\u003c/h3>\u003cp>請選取下方文字，使用 Ctrl+C 或 Command+C 複製。\u003c/p>\u003ctextarea id=\"manualCopy\" rows=\"16\" readonly>\u003c/textarea>\u003cbutton id=\"closeCopy\" type=\"button\" style=\"margin-top:12px\">關閉\u003c/button>\u003c/dialog>\n\u003cscript>\n'use strict';\nconst PROMPTS={\"overview\": \"請擔任「程式接手工程師、技術文件作者與維護顧問」。\\n\\n目標：讓沒有參與原始開發的人，能快速理解這個專案、\\n依文件操作與排錯，並知道如何安全新增功能。\\n請使用繁體中文，先講白話概念，再補必要技術細節。\\n\\n【目前權限】\\n目前只允許讀取與分析。\\n不要修改原始碼、既有文件、測試、依賴、設定或資料。\\n不要安裝套件、執行腳本、啟動服務、連正式環境或呼叫外部 API。\\n若需要執行任何指令，先說明用途、副作用、權限與執行環境，等核准。\\n文件先以草稿交付；取得同意後才能寫入指定位置。\\n\\n【分析原則】\\n1. 以實際程式碼與設定為依據，不只憑檔名、註解或舊聊天推測。\\n2. 列出已讀、略過、無法讀取範圍；專案太大時分階段分析。\\n3. 區分已實作、部分實作、占位／模擬、僅規劃功能。\\n4. 區分程式證據已確認、執行已驗證、待確認與建議新增。\\n5. 不知道的設計理由或業務意圖，標示待確認，不代替作者編造。\\n6. 找不到入口、測試、日誌、API 或設定時，明確說未找到。\\n7. 文件與程式不一致時列出差異，不自行認定哪一邊才是正確需求。\\n8. 不顯示密碼、權杖、私鑰、正式連線字串與客戶個資。\\n9. 未執行的檢查不得寫成通過；部分通過不得寫成全部完成。\\n\\n【先交付第一階段】\\nA. 專案目錄與技術盤點。\\nB. 目前分析版本或 commit；無法取得時明確註記。\\nC. 程式入口、主要模組、外部依賴與資料儲存。\\nD. 建議優先追蹤的三條主要操作流程。\\nE. 尚缺資料、閱讀計畫與預計產生的文件清單。\\n完成後先停下，等待確認，再繼續詳細分析。\\n\\n【後續詳細文件的要求】\\nA. 快速上手：用途、使用者、能做與不能做、首次操作、成功判準。\\nB. 功能手冊：每項功能的操作、權限、輸入輸出、限制與失敗回饋。\\nC. 架構地圖：模組責任、啟動流程、關鍵資料流、實際部署。\\nD. 功能追蹤表：功能 → 入口 → 核心程式 → 資料 → 外部服務 → 測試。\\nE. 資料與介面：schema、狀態、API、設定、整合與版本限制。\\nF. 排錯手冊：症狀、蒐證、檢查步驟、預期結果、分支判斷、\\n   修復、驗證、復原、預防；先列低風險檢查。\\nG. 擴充指南：功能放哪裡、影響哪些層、不可破壞規則、\\n   相容性、migration、測試、部署、復原。\\nH. 測試與限制：實際執行結果、未執行原因、已知問題、測試缺口。\\n\\n【定位與表達】\\n每個重要結論附「相對檔案路徑＋函式／類別／元件名稱」，\\n可確認時補行號；不要編造定位。\\n先一頁總覽再提供模組細節，不要只做逐行翻譯。\\n圖中區分現有系統與建議架構；不能畫圖時提供文字流程。\\n每份文件記錄分析版本、範圍、驗證狀態與待確認事項。\", \"feature\": \"請只深入分析我接下來指定的功能，\\n暫時不要修改任何檔案或執行指令。\\n\\n請依序說明：\\n1. 使用者如何觸發，前置條件與權限是什麼。\\n2. 從入口到結果的實際呼叫流程。\\n3. 每一步的檔案路徑、符號名稱、輸入輸出與資料變化。\\n4. 成功、失敗、取消、重複操作與邊界條件的處理。\\n5. 哪些是程式證據，哪些需要執行才能確認。\\n6. 對應測試、缺口與最小驗證方案。\\n7. 未來修改此功能時，哪些相依功能必須一起檢查。\\n\\n先用非原作者能理解的文字解釋，再補程式細節。\\n沒有證據的業務意圖標示待確認；\\n不要根據目前行為自行認定正確需求。\", \"debug\": \"請協助診斷我提供的問題，先不要改程式、資料或執行指令。\\n\\n請輸出：\\n1. 已知事實、影響範圍與尚缺證據。\\n2. 是否需要先限制損害或暫停操作；任何動作都須等核准。\\n3. 依目前證據排序的原因假設，說明支持與反對證據；\\n   不要用沒有依據的精確機率，不把假設寫成已確定原因。\\n4. 優先從低風險、資訊價值高的檢查開始。\\n5. 每步列環境、工作目錄、權限、方法、預期結果、判斷分支、副作用。\\n6. 區分臨時緩解與根本修正，優先提出最小修改方案。\\n7. 提出原問題重現、修正驗證與相關功能回歸測試。\\n8. 說明失敗時程式、設定、資料與外部副作用如何分別處理。\\n\\n不要建議關閉安全驗證、放大所有權限、清空資料，\\n或未確認結果就重送會建單、付款、發訊息的操作。\\n不存在的工具、日誌或檢查端點不得編造；\\n未執行的指令與檢查，必須標示待驗證。\\n先交診斷計畫，等待確認。\", \"extend\": \"請依現有專案規則分析我提出的新功能，先不要寫程式或執行指令。\\n\\n先閱讀專案總覽、架構、擴充規則與相關原始碼，\\n列出實際已讀範圍與分析版本。\\n\\n請先交付：\\n1. 需求理解、非目標與必須確認的歧義。\\n2. 可驗收的成功、失敗、權限與邊界案例。\\n3. 建議擴充位置與原因，優先沿用現有模組，不做無關重構。\\n4. 新增與修改檔案清單，逐項說明作用與相依關係。\\n5. UI、API、業務規則、資料與外部服務的影響。\\n6. 舊資料、舊介面與既有操作的相容性。\\n7. 若涉及 migration，說明備份、測試、部署順序與復原限制。\\n8. 安全、效能、費用與外部副作用風險。\\n9. 測試計畫、分階段實作計畫與文件更新清單。\\n10. 哪些步驟需要核准或額外權限。\\n\\n計畫核准後，只實作核准範圍。\\n完成後交付差異說明、測試證據、未完成項目、文件更新與復原方式。\\n不要刪除或跳過失敗測試來宣稱完成，\\n不要以大幅重寫替代小功能修改。\", \"handoff\": \"請針對本次已完成的變更製作交接紀錄。\\n不要為了整理交接而額外修改原始碼或執行指令。\\n\\n請列出：\\n1. 修改前後的使用者行為差異。\\n2. 新增、修改與刪除的檔案及各自原因。\\n3. 設定、依賴、API、資料結構與外部整合的變動。\\n4. 實際執行的檢查：指令、環境、結果與證據位置。\\n5. 沒有執行、失敗或仍待確認的項目。\\n6. 已更新及尚未更新的文件；若不需更新請說明原因。\\n7. 部署順序、驗收步驟、復原限制及殘留風險。\\n8. 給下一位工程師或下一個 AI 的接手摘要。\\n\\n不要使用「全部完成、完全安全、可直接正式上線」\\n等超出實際驗證範圍的結論。\", \"rules\": \"# 專案協作規則\\n\\n- 先閱讀 README、架構文件、擴充規則與本次相關原始碼。\\n- 使用繁體中文；列出分析版本與實際閱讀範圍。\\n- 區分程式現況、已核准需求、待確認事項與改善建議。\\n- 不編造檔案、API、業務規則、原因或測試結果。\\n- 修改前交影響檔案、相容性、測試、風險與復原計畫。\\n- 不做無關重構，不擅自更換架構、依賴或刪除既有功能。\\n- 執行指令先確認權限與副作用；正式資料、對外操作需人工核准。\\n- 不輸出、提交或在日誌中加入金鑰、密碼與敏感資料。\\n- 功能變更同步檢查功能、架構、排錯、擴充與測試文件。\\n- 影響不明或規格衝突時，先停止相關修改並列出問題。\\n- 不得刪除或跳過失敗測試偽造通過；未執行不得宣稱已驗證。\\n- 完成交付修改清單、行為差異、測試證據、文件差異與剩餘風險。\"};\nconst CHECKS=[[\"用途與範圍\", \"一頁總覽能說清楚用途、使用者、主要功能與限制。\"], [\"用途與範圍\", \"已實作、部分實作、占位／模擬與規劃功能分開。\"], [\"用途與範圍\", \"分析版本、已讀範圍與未讀範圍明確。\"], [\"程式與流程\", \"能找到真正的啟動入口與主要模組。\"], [\"程式與流程\", \"至少一條主要流程能追到資料結果。\"], [\"程式與流程\", \"重要功能有實際路徑與符號定位。\"], [\"程式與流程\", \"沒有證據的設計理由與業務意圖標示待確認。\"], [\"操作與排錯\", \"安裝、啟動與診斷有環境、目錄、權限與副作用說明。\"], [\"操作與排錯\", \"故障手冊包含預期結果與判斷分支。\"], [\"操作與排錯\", \"日誌與診斷工具確實存在，沒有的列為缺口。\"], [\"操作與排錯\", \"排錯先保護資料與證據，不盲目重送有副作用操作。\"], [\"擴充與復原\", \"擴充位置、修改範圍與不可破壞規則明確。\"], [\"擴充與復原\", \"舊介面、舊資料與 migration 的影響已分析。\"], [\"擴充與復原\", \"程式、設定、資料及外部副作用的復原分開。\"], [\"測試與交付\", \"通過、失敗、未執行及未涵蓋項目分開。\"], [\"測試與交付\", \"測試有版本、環境、實際步驟與證據。\"], [\"測試與交付\", \"文件與功能變更同步，且留有接手摘要。\"], [\"測試與交付\", \"無真實憑證與未去識別個資；重要操作有核准。\"]];\nconst $=id=>document.getElementById(id);\nconst chapters=[...document.querySelectorAll('section.chapter')];\nconst navLinks=[...document.querySelectorAll('.toc a')];\nlet toastTimer;\nfunction toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200)}\nasync function copyText(text){\n if(!text.trim()){toast('尚未產生內容，請先產生工作指令。');return false}\n try{if(!navigator.clipboard||!window.isSecureContext)throw Error('fallback');await navigator.clipboard.writeText(text);toast('已複製，可貼到你的 AI 工具。');return true}\n catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:10px;top:10px;width:2px;height:2px;opacity:0;';document.body.append(ta);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();if(ok){toast('已複製，可貼到你的 AI 工具。');return true}const dlg=$('copyDialog');$('manualCopy').value=text;dlg.showModal();setTimeout(()=>$('manualCopy').select(),30);toast('瀏覽器限制剪貼簿，請在視窗內手動複製。');return false}\n}\ndocument.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',async()=>{const ok=await copyText($(btn.dataset.copy).textContent);if(ok){btn.textContent='已複製';setTimeout(()=>btn.textContent='複製',1600)}}));\n$('closeCopy').onclick=()=>$('copyDialog').close();\nfunction download(name,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}\n$('downloadPrompts').addEventListener('click',()=>{let text='# AI 程式理解、排錯與擴充指令集\\n\\n通用範本；不是已分析的專案。先提供去除機密的程式與設定。\\n';chapters.forEach(sec=>{const codes=sec.querySelectorAll('pre');if(codes.length){text+='\\n## '+sec.dataset.title+'\\n';codes.forEach(pre=>text+='\\n```text\\n'+pre.textContent.trim()+'\\n```\\n')}});download('AI程式交接-指令與文件範本.md',text,'text/markdown;charset=utf-8');toast('指令與文件範本已下載。')});\nconst searchIndex=new Map(chapters.map(sec=>[sec.id,sec.textContent.toLocaleLowerCase()]));\nfunction filterSections(){const raw=$('sectionSearch').value.trim().toLocaleLowerCase();const words=raw.split(/\\s+/).filter(Boolean);let n=0;chapters.forEach(sec=>{const yes=words.every(w=>searchIndex.get(sec.id).includes(w));sec.hidden=!yes;if(yes)n++;const link=navLinks.find(a=>a.hash==='#'+sec.id);if(link)link.hidden=!yes});$('searchCount').textContent=words.length?`找到 ${n} / ${chapters.length} 個章節（以整章篩選）`:`共 ${chapters.length} 個章節 · 關鍵字以整章篩選`;$('noResults').classList.toggle('visible',n===0)}\n$('sectionSearch').addEventListener('input',filterSections);$('clearSearch').addEventListener('click',()=>{$('sectionSearch').value='';filterSections();$('sectionSearch').focus()});filterSections();\nfunction closeMenu(){$('sidebar').classList.remove('open');$('scrim').classList.remove('open');document.body.classList.remove('menu-open');$('menuToggle').setAttribute('aria-expanded','false')}\n$('menuToggle').addEventListener('click',()=>{const open=!$('sidebar').classList.contains('open');$('sidebar').classList.toggle('open',open);$('scrim').classList.toggle('open',open);document.body.classList.toggle('menu-open',open);$('menuToggle').setAttribute('aria-expanded',String(open))});$('scrim').onclick=closeMenu;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});\nnavLinks.forEach(a=>a.addEventListener('click',closeMenu));\ndocument.querySelectorAll('a[href^=\"#\"]').forEach(a=>a.addEventListener('click',()=>{const target=document.getElementById(a.hash.slice(1));if(target&&target.hidden){$('sectionSearch').value='';filterSections()}}));\nfunction revealHash(){const id=location.hash.slice(1);const target=document.getElementById(id);if(target&&target.hidden){$('sectionSearch').value='';filterSections()}}window.addEventListener('hashchange',revealHash);revealHash();\nif('IntersectionObserver'in window){const obs=new IntersectionObserver(entries=>{const seen=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(seen.length){navLinks.forEach(a=>a.classList.toggle('active',a.hash==='#'+seen[0].target.id))}},{rootMargin:'-75px 0px -65% 0px',threshold:0});chapters.forEach(sec=>obs.observe(sec))}\nwindow.addEventListener('scroll',()=>{const range=document.documentElement.scrollHeight-innerHeight;$('readingProgress').style.width=(range>0?scrollY/range*100:0)+'%'},{passive:true});\nlet printDetails=[];function preparePrint(){printDetails=[...document.querySelectorAll('details')].map(el=>[el,el.open]);printDetails.forEach(([el])=>el.open=true)}function restorePrint(){printDetails.forEach(([el,open])=>el.open=open);printDetails=[]}window.addEventListener('beforeprint',preparePrint);window.addEventListener('afterprint',restorePrint);$('printPage').onclick=()=>window.print();\nconst STORAGE_KEY='ai-code-handoff-guide-v1';const boxes=[...document.querySelectorAll('[data-check-id]')];let storageAvailable=true;\nfunction state(){const values={};boxes.forEach(b=>values[b.dataset.checkId]=b.checked);return{schemaVersion:1,guideVersion:'1.0',project:$('checkProject').value,version:$('checkVersion').value,notes:$('checkNotes').value,checks:values}}\nfunction updateCounts(){const n=boxes.filter(b=>b.checked).length;$('checkCount').textContent=`已人工確認 ${n} / ${boxes.length} 項`;$('checkBar').style.width=n/boxes.length*100+'%'}\nfunction apply(data){$('checkProject').value=typeof data.project==='string'?data.project.slice(0,160):'';$('checkVersion').value=typeof data.version==='string'?data.version.slice(0,160):'';$('checkNotes').value=typeof data.notes==='string'?data.notes.slice(0,12000):'';boxes.forEach(b=>b.checked=data.checks?.[b.dataset.checkId]===true);updateCounts()}\nfunction persist(){updateCounts();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state()));storageAvailable=true;$('storageStatus').textContent='已嘗試儲存在此瀏覽器。重要紀錄請另外匯出；不會上傳到伺服器。'}catch(e){storageAvailable=false;$('storageStatus').textContent='此瀏覽器不允許本機儲存；目前狀態只在本頁，請匯出紀錄保存。'}}\ntry{const saved=localStorage.getItem(STORAGE_KEY);if(saved){const d=JSON.parse(saved);if(d.schemaVersion===1)apply(d)}$('storageStatus').textContent='檢查表使用本機瀏覽器儲存；請匯出重要紀錄，以免清除瀏覽器資料後遺失。'}catch(e){storageAvailable=false;$('storageStatus').textContent='本機紀錄不可用或格式無法讀取；請使用匯出功能保存。'}updateCounts();\nboxes.forEach(b=>b.addEventListener('change',persist));['checkProject','checkVersion','checkNotes'].forEach(id=>$(id).addEventListener('input',persist));\n$('exportChecks').onclick=()=>{const d=state();d.exportedAt=new Date().toISOString();d.notice='人工紀錄，不是自動掃描或正式品質／資安驗證';d.items=CHECKS.map((item,i)=>({id:'c'+String(i+1).padStart(2,'0'),group:item[0],text:item[1],confirmed:d.checks['c'+String(i+1).padStart(2,'0')]}));download('AI程式交接-人工檢查紀錄.json',JSON.stringify(d,null,2),'application/json;charset=utf-8');toast('人工檢查紀錄已匯出。')};\n$('importChecks').onclick=()=>$('checkFile').click();$('checkFile').onchange=async()=>{const f=$('checkFile').files[0];if(!f)return;try{if(f.size>200000)throw Error('檔案過大，請使用本頁匯出的紀錄。');const d=JSON.parse(await f.text());if(d.schemaVersion!==1||!d.checks||typeof d.checks!=='object'||Array.isArray(d.checks))throw Error('格式不符，僅接受本頁匯出的紀錄。');for(const id of Object.keys(d.checks)){if(!boxes.some(b=>b.dataset.checkId===id)||typeof d.checks[id]!=='boolean')throw Error('檢查項目格式不符。')}for(const field of ['project','version','notes']){if(field in d&&typeof d[field]!=='string')throw Error('文字欄位格式不符。')}if(!confirm('匯入會覆蓋目前的勾選與備註。若需要保留，請先匯出。確定匯入？'))return;apply(d);persist();toast('已匯入人工檢查紀錄，請核對是否對應目前專案版本。')}catch(e){toast('無法匯入：'+e.message)}finally{$('checkFile').value=''}};\n$('resetChecks').onclick=()=>{if(!confirm('只會清除本頁的專案名稱、版本、備註與勾選紀錄，不影響任何程式。確定重設？'))return;apply({checks:{}});persist();toast('本頁人工紀錄已重設。')};\nfunction generatePrompt(){const type=$('taskType').value;const project=$('projectInput').value.trim();const task=$('taskInput').value.trim();const limits=$('limitsInput').value.trim();const intro=`【本次背景資料：請核對，不是已驗證結論】\\n專案／平台：${project||'尚未指定，請先從提供的專案確認'}\\n\\n任務或問題：\\n${task||'尚未指定，請先盤點或提出必要確認問題'}\\n\\n不可變更行為與限制：\\n${limits||'尚未指定；預設只讀分析，不改檔、不執行指令、不連正式環境'}\\n\\n`;return intro+PROMPTS[type]}\n$('buildPrompt').onclick=()=>{$('builtPrompt').value=generatePrompt();toast('已組合工作指令；尚未呼叫任何 AI。')};$('copyBuilt').onclick=()=>copyText($('builtPrompt').value);$('downloadBuilt').onclick=()=>{if(!$('builtPrompt').value.trim()){toast('請先產生工作指令。');return}download('AI程式交接-本次工作指令.txt',$('builtPrompt').value);toast('工作指令已下載。')};\nwindow.addEventListener('resize',()=>{if(innerWidth>800)closeMenu()});\n\u003c/script>\u003c/body>\u003c/html>"},{"title":"AI 免費資源實用指南｜25 項詳細比較","path":"AI 免費資源實用指南Perplexity/AI 免費資源實用指南.html","snippet":"PRACTICAL AI RESOURCE GUIDEAI 免費資源實用指南25 項資源的功能定位、免費範圍、優點、缺點、成本與落地提醒。以印刷／標籤產業、LINE、ERP、文件知識庫及離線展示為應用情境。25 項完整說…","size":80759,"mtime":1793449946466,"html":"\u003c!doctype html>\u003chtml lang=\"zh-Hant\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"description\" content=\"25 項 AI 免費資源詳細說明、優缺點、成本與印刷業應用參考\">\u003ctitle>AI 免費資源實用指南｜25 項詳細比較\u003c/title>\u003cstyle>\n:root{--bg:#f4f7fb;--panel:#fff;--text:#18243b;--muted:#627087;--line:#dce4ef;--brand:#175cba;--soft:#eaf2ff;--green:#16816b;--orange:#a86416}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.8 system-ui,-apple-system,\"Noto Sans TC\",\"Microsoft JhengHei\",sans-serif}body.dark{--bg:#101725;--panel:#192438;--text:#e3ebf6;--muted:#afbdd0;--line:#344359;--brand:#83b7ff;--soft:#233850;--green:#73d6ba;--orange:#ffc480}a{color:var(--brand);text-underline-offset:4px}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid #ecab37;outline-offset:3px}.wrap{max-width:1240px;margin:auto;padding:0 26px}header{background:linear-gradient(120deg,#102e5b,#1768b2);color:white;padding:58px 0 48px}.eyebrow{letter-spacing:3px;font-size:12px;color:#bcdcff}h1{font-size:clamp(30px,5vw,48px);line-height:1.3;margin:12px 0 18px}header p{max-width:850px;color:#e1ebfa}header .tags{display:flex;gap:10px;flex-wrap:wrap}.tag{padding:5px 13px;border:1px solid #ffffff45;border-radius:30px;font-size:13px}.topnav{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;padd  class=\"wrap\">\n\u003csection id=\"overview\">\u003cdiv class=\"notice\">\u003ch2>資訊範圍與版本提醒\u003c/h2>\u003cp>本頁依前述對話內容整理，整理日期：2026-10-31。這是內容整編，不是本頁製作時重新逐項查核的方案報告。所列額度、價格與授權敘述僅作查核線索，正式使用前應回到官方頁面核對。\u003c/p>\u003cp>免費使用、免費額度、開源程式、模型下載及允許商用是不同條件。應用建議與優缺點包含導入分析，並非所有工具的實機測試結論。\u003c/p>\u003cp>本 HTML 可離線閱讀與搜尋；官方連結、模型下載、雲端服務仍需要網路。勾選清單與篩選僅存在目前頁面，不會上傳或永久保存。\u003c/p>\u003c/div>\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cstrong>25\u003c/strong>\u003cspan>資源／入口\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cstrong>6\u003c/strong>\u003cspan>功能分類\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cstrong>6\u003c/strong>\u003cspan>應用建議組合\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cstrong>10\u003c/strong>\u003cspan>導入評估項目\u003c/span>\u003c/div>\u003c/div>\u003ch2>先看懂「免費」的差異\u003c/h2>\u003cdiv class=\"legend\">\u003cdiv class=\"box\">\u003ch3>免費額度\u003c/h3>\u003cp>限模型、用量或功能。要看請求頻率、Token、音訊時數與重試如何計算；不要視為正式服務承諾。\u003c/p>\u003c/div>\u003cdiv class=\"box\">\u003ch3>免費軟體／開源\u003c/h3>\u003cp>軟體費不等於總成本。模型授權、電腦、GPU、備份及維護應另外盤點。\u003c/p>\u003c/div>\u003cdiv class=\"box\">\u003ch3>免費資料／教材\u003c/h3>\u003cp>下載和閱讀不代表可任意商用、再散布或取得免費實作算力；需逐項查看使用條件。\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"resources\">\u003ch2>資源詳細說明\u003c/h2>\u003cp class=\"subtitle\">每張卡片包含功能、免費範圍、優缺點、成本、產業應用與實作提醒；點標題可收合。\u003c/p>\u003cdiv class=\"toolbar\">\u003cdiv class=\"tools\">\u003cinput id=\"search\" type=\"search\" aria-label=\"搜尋資源\" placeholder=\"搜尋名稱、用途、成本、離線、語音、RAG…\">\u003cselect id=\"category\" aria-label=\"分類篩選\">\u003coption value=\"\">全部分類\u003c/option>\u003coption>雲端 API\u003c/option>\u003coption>模型與資料\u003c/option>\u003coption>本機與文件\u003c/option>\u003coption>算力與展示\u003c/option>\u003coption>課程與教材\u003c/option>\u003coption>資訊追蹤\u003c/option>\u003c/select>\u003cbutton id=\"reset\" type=\"button\">清除篩選\u003c/button>\u003cbutton id=\"expand\" type=\"button\">全部展開\u003c/button>\u003cbutton id=\"collapse\" type=\"button\">全部收合\u003c/button>\u003c/div>\u003cp id=\"result\" class=\"result\" aria-live=\"polite\">顯示全部 25 項\u003c/p>\u003c/div>\u003cdiv class=\"grid\">\u003carticle class=\"resource\" data-category=\"雲端 API\" data-search=\"NVIDIA Build／NIM 雲端 API https://build.nvidia.com/nvidia 模型測試與 GPU 推論部署 提供聊天、文件解析、向量嵌入與檢索重排序等模型探索入口。Build 偏向模型體驗與端點測試；NIM 則是部署推論微服務的另一層工具。 指定端點可供開發與測試；實際資格、頻率與正式營運條件依官方規則。 可集中比較不同任務的模型；文件、Embedding、Reranker 能分開測試；適合建立 RAG 概念驗證。 測試端點不能視為正式服務承諾；自架涉及 GPU 相容性與維運；模型權重和部署元件授權須分開確認。 正式端點、GPU、主機與企業支援可能產生成本。 以去識別化規格書測試解析，再比較檢索與重排序前後的答案。 先確認輸出的尺寸、單位、表格欄位與來源頁面，不讓模型直接決定報價。\">\u003cdetails open>\u003csummary>\u003cspan class=\"num\">01\u003c/span>\u003cspan>\u003csmall>雲端 API\u003c/small>\u003ch3>NVIDIA Build／NIM\u003c/h3>\u003cspan class=\"task\">模型測試與 GPU 推論部署\u003c/span>\u003c/span>\u003cspan class=\"toggle\">＋\u003c/span>\u003c/summary>\u003cdiv class=\"detail-body\">\u003cdl>\u003cdiv class=\"field \">\u003cdt>功能與定位\u003c/dt>\u003cdd>提供聊天、文件解析、向量嵌入與檢索重排序等模型探索入口。Build 偏向模型體驗與端點測試；NIM 則是部署推論微服務的另一層工具。\u003c/dd>\u003c/div>\u003cdiv class=\"field \">\u003cdt>免費範圍\u003c/dt>\u003cdd>指定端點可供開發與測試；實際資格、頻率與正式營運條件依官方規則。\u003c/dd>\u003c/div>\u003cdiv class=\"field positive\">\u003cdt>優點\u003c/dt>\u003cdd>可集中比較不同任務的模型；文件、Embedding、Reranker 能分開測試；適合建立 RAG 概念驗證。\u003c/dd>\u003c/div>\u003cdiv class=\"field negative\">\u003cdt>缺點與限制\u003c/dt>\u003cdd>測試端點不能視為正式服務承諾；自架涉及 GPU 相容性與維運；模型權重和部署元件授權須分開確認。\u003c/dd>\u003c/div>\u003cdiv class=\"field \">\u003cdt>成本來源\u003c/dt>\u003cdd>正式端點、GPU、主機與企業支援可能產生成本。\u003c/dd>\u003c/div>\u003cdiv class=\"field \">\u003cdt>印刷／標籤應用\u003c/dt>\u003cdd>以去識別化規格書測試解析，再比較檢索與重排序前後的答案。\u003c/dd>\u003c/div>\u003cdiv class=\"field \">\u003cdt>實作與安全提醒\u003c/dt>\u003cdd>先確認輸出的尺寸、單位、表格欄位與來源頁面，不讓模型直接決定報價。\u003c/dd>\u003c/div>\u003c/dl>\u003ca class=\"official\" href=\"https://build.nvidia.com/nvidia\" target=\"_blank\" rel=\"noopener noreferrer\">官方入口 ↗\u003c/a>\u003cp class=\"url\">https://build.nvidia.com/nvidia\u003c/p>\u003c/div>\u003c/details>\u003c/article>\u003carticle class=\"resource\" data-cate
