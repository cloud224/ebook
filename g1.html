        \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">1. 一鍵開啟 Android「進階保護 (Advanced Protection)」\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">前往「設定 > 安全性與隱私權 > 進階保護」。強制鎖定 Play Protect、完全封鎖未知 APK 側載與未認證無障礙權限。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">2. 啟用 Gemini AI 防詐與螢幕共享自動遮蔽\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">在 Google 訊息開啟「強化保護模式」偵測慢火詐騙；2026年10月新功能會在螢幕共享時自動塗黑輸入框與付款畫面。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">3. 確認 72 小時閒置自動重啟 (Inactivity Reboot)\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">連續鎖定 72 小時手機自動重開機，使裝置內部資料回歸首次解鎖前的完全加密狀態。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv id=\"os-content-ios\" class=\"space-y-4 hidden\">\n                    \u003cdiv class=\"space-y-3\">\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">1. 將「失竊裝置防護」觸發條件設為「永遠」\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">前往「設定 > Face ID 與密碼 > 失竊裝置防護」。修改帳號密碼強制執行 1 小時安全延遲與生物辨識。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">2. 高風險人士開啟「鎖定模式 (Lockdown Mode)」\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">防範 Pegasus 等傭兵式零點擊間諜軟體。封鎖訊息背景附件解析與複雜網頁語法。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">3. 採用「自訂英數密碼」並開啟 Passkeys\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">取代簡易 6 位數密碼，避免公共場所被窺視解鎖密碼後遭整台掠奪。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"sec-av-test\" class=\"space-y-6 hidden\">\n            \u003cdiv class=\"bg-white rounded-xl shadow-sm border border-slate-200 p-6\">\n                \u003cdiv class=\"border-b border-slate-100 pb-4 mb-6\">\n                    \u003ch2 class=\"text-2xl font-bold text-slate-900 flex items-center gap-2\">\n                        \u003cspan>🧪\u003c/span> 2025–2026 權威防毒軟體評測數據對比\n                    \u003c/h2>\n                    \u003cp class=\"text-sm text-slate-600 mt-1\">資料來源：AV-TEST 2026年10月六個月耐久測試報告與 AV-Comparatives 年度總結。\u003c/p>\n                \u003c/div>\n\n                \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8\">\n                    \u003cdiv class=\"lg:col-span-2\">\n                        \u003ch3 class=\"text-base font-bold text-slate-900 mb-2\">主流防毒軟體綜合能力評分 (滿分 18.0)\u003c/h3>\n                        \u003cdiv class=\"chart-container\">\n                            \u003ccanvas id=\"chart-av\">\u003c/canvas>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"bg-slate-50 p-5 rounded-xl border border-slate-200 flex flex-col justify-between\">\n                        \u003cdiv>\n                            \u003ch4 class=\"font-bold text-slate-900 text-sm mb-2\">評測重點導讀\u003c/h4>\n                            \u003cul class=\"text-xs text-slate-600 space-y-2 leading-relaxed\">\n                                \u003cli>• \u003cstrong>Microsoft Defender (4.18):\u003c/strong> 防護力 6.0、可用性 6.0，但系統效能影響得分 5.7，在檔案複製時負載稍高。\u003c/li>\n                                \u003cli>• \u003cstrong>Bitdefender / ESET:\u003c/strong> 在 AV-Comparatives 15 次定向進階威脅測試 (ATP) 中唯一達成 15/15 完全攔截的品牌。\u003c/li>\n                                \u003cli>• \u003cstrong>Kaspersky:\u003c/strong> 獲得最低誤報金獎（全年僅9次誤報）與惡意軟體防護金獎。\u003c/li>\n                                \u003cli>• \u003cstrong>Avast Free:\u003c/strong> 奪得整體效能影響最低金獎，免費版最佳首選。\u003c/li>\n                            \u003c/ul>\n                        \u003c/div>\n                        \u003cdiv class=\"mt-4 pt-3 border-t border-slate-200 text-xs text-indigo-700 font-medium\">\n                            💡 提示：Win11 開啟智慧應用程式控制 (SAC) 後，第三方防毒會自動進入相容協調模式。\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"sec-dns-line\" class=\"space-y-6 hidden\">\n            \u003cdiv class=\"bg-white rounded-xl shadow-sm border border-slate-200 p-6\">\n                \u003cdiv class=\"border-b border-slate-100 pb-4 mb-6\">\n                    \u003ch2 class=\"text-2xl font-bold text-slate-900 flex items-center gap-2\">\n                        \u003cspan>🌐\u003c/span> 加密 DNS 選擇器與台灣 LINE 帳號防盜\n                    \u003c/h2>\n                    \u003cp class=\"text-sm text-slate-600 mt-1\">打造網路層第一道威脅過濾網，並鞏固台灣在地核心數位身分。\u003c/p>\n                \u003c/div>\n\n                \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 gap-8\">\n                    \u003cdiv class=\"space-y-4\">\n                        \u003ch3 class=\"text-lg font-bold text-slate-900\">第一道防線：安全加密 DNS 選用\u003c/h3>\n                        \u003cp class=\"text-xs text-slate-600\">預設的 Google 8.8.8.8 不過濾惡意網域。改用以下 DNS 可在建立連線前阻斷釣魚網站與木馬 C2 伺服器：\u003c/p>\n                        \n                        \u003cdiv class=\"border rounded-xl p-4 bg-indigo-50/50 border-indigo-200\">\n                            \u003cdiv class=\"flex justify-between items-center mb-1\">\n                                \u003cspan class=\"font-bold text-indigo-950 text-sm\">Quad9 (瑞士非營利)\u003c/span>\n                                \u003cspan class=\"text-xs bg-indigo-600 text-white px-2 py-0.5 rounded\">首選推薦\u003c/span>\n                            \u003c/div>\n                            \u003cdiv class=\"text-xs text-indigo-900 space-y-1\">\n                                \u003cp>• IPv4 位址: \u003ccode class=\"bg-white px-1.5 py-0.5 rounded border border-indigo-200 font-mono\">9.9.9.9\u003c/code>\u003c/p>\n                                \u003cp>• DoT 加密主機名: \u003ccode class=\"bg-white px-1.5 py-0.5 rounded border border-indigo-200 font-mono\">dns.quad9.net\u003c/code>\u003c/p>\n                                \u003cp>• 特色: 整合25+情報源，每日攔截4000萬次惡意查詢，受瑞士嚴格隱私法保護。\u003c/p>\n                            \u003c/div>\n                        \u003c/div>\n\n                        \u003cdiv class=\"border rounded-xl p-4 bg-slate-50 border-slate-200\">\n                            \u003cdiv class=\"flex justify-between items-center mb-1\">\n                                \u003cspan class=\"font-bold text-slate-900 text-sm\">Cloudflare 防毒專用版\u003c/span>\n                                \u003cspan class=\"text-xs bg-slate-600 text-white px-2 py-0.5 rounded\">極速低延遲\u003c/span>\n                            \u003c/div>\n                            \u003cdiv class=\"text-xs text-slate-700 space-y-1\">\n                                \u003cp>• IPv4 位址: \u003ccode class=\"bg-white px-1.5 py-0.5 rounded border border-slate-300 font-mono\">1.1.1.2\u003c/code> (防惡意軟體)\u003c/p>\n                                \u003cp>• 特色: 全球平均查詢延遲僅 11ms，快取效能卓越。\u003c/p>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"space-y-4\">\n                        \u003ch3 class=\"text-lg font-bold text-slate-900\">LINE 帳號防盜 3 大必做設定\u003c/h3>\n                        \u003cp class=\"text-xs text-slate-600\">LINE 為台灣詐騙攻擊重災區，請務必於手機開啟以下設定：\u003c/p>\n\n                        \u003cdiv class=\"space-y-3\">\n                            \u003cdiv class=\"p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs\">\n                                \u003cspan class=\"font-bold text-slate-900 block text-sm\">1. 電話號碼 + Apple/Google 帳號雙重綁定\u003c/span>\n                                \u003cp class=\"text-slate-600 mt-1\">進入「設定 > 我的帳號」，確認綁定本人有效門號與同步帳號，這是奪回帳號的唯一鑰匙。\u003c/p>\n                            \u003c/div>\n                            \u003cdiv class=\"p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs\">\n                                \u003cspan class=\"font-bold text-slate-900 block text-sm\">2. 關閉「允許自其他裝置登入」\u003c/span>\n                                \u003cp class=\"text-slate-600 mt-1\">若平時不使用電腦版，請關閉此開關，並開啟「網頁登入雙重認證」。\u003c/p>\n                            \u003c/div>\n                            \u003cdiv class=\"p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs\">\n                                \u003cspan class=\"font-bold text-slate-900 block text-sm\">3. 絕不外流「LINE 簡訊認證碼」\u003c/span>\n                                \u003cp class=\"text-slate-600 mt-1\">認證碼僅於換機時使用。任何要求輸入簡訊認證碼的網頁或親友訊息皆為詐騙。\u003c/p>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"sec-sop\" class=\"space-y-6 hidden\">\n            \u003cdiv class=\"bg-white rounded-xl shadow-sm border border-slate-200 p-6\">\n                \u003cdiv class=\"border-b border-slate-100 pb-4 mb-6\">\n                    \u003ch2 class=\"text-2xl font-bold text-slate-900 flex items-center gap-2\">\n                        \u003cspan>🚨\u003c/span> 中毒與帳號遭駭緊急應變 SOP\n                    \u003c/h2>\n                    \u003cp class=\"text-sm text-slate-600 mt-1\">發生安全危機時請保持冷靜，選擇當前情境並執行止血標準作業程序。\u003c/p>\n                \u003c/div>\n\n                \u003cdiv class=\"flex flex-wrap gap-2 mb-6\">\n                    \u003cbutton onclick=\"setSopScenario('line')\" id=\"sopbtn-line\" class=\"px-4 py-2 rounded-lg text-sm font-medium bg-rose-600 text-white\">情境 A：LINE 帳號疑似被盜\u003c/button>\n                    \u003cbutton onclick=\"setSopScenario('pc')\" id=\"sopbtn-pc\" class=\"px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200\">情境 B：電腦誤執行惡意指令/感染\u003c/button>\n                    \u003cbutton onclick=\"setSopScenario('phone')\" id=\"sopbtn-phone\" class=\"px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200\">情境 C：手機誤裝惡意 APK / 遭控\u003c/button>\n                \u003c/div>\n\n                \u003cdiv id=\"sop-content-line\" class=\"space-y-4\">\n                    \u003cdiv class=\"p-4 bg-rose-50 border border-rose-200 rounded-xl\">\n                        \u003ch3 class=\"font-bold text-rose-900 text-base mb-2\">LINE 搶回帳號「再次登入」秒救法\u003c/h3>\n                        \u003cp class=\"text-xs text-rose-800 mb-3\">⚠️ 駭客會欺騙您「千萬不要點再次登入」或「刪除 App」，切勿上當！刪除 App 會失去救回帳號的機會。\u003c/p>\n                        \u003col class=\"list-decimal list-inside text-xs text-slate-800 space-y-2 leading-relaxed font-medium\">\n                            \u003cli>\u003cstrong>絕對不要刪除 LINE App：\u003c/strong> 發現帳號異狀或被登出時，直接在原手機開啟 LINE。\u003c/li>\n                            \u003cli>\u003cstrong>點選「再次登入」：\u003c/strong> 通過簡訊驗證或綁定的 Apple/Google 帳號登入，系統會強制踢出盜用者。\u003c/li>\n                            \u003cli>\u003cstrong>立即變更密碼與檢查裝置：\u003c/strong> 前往「設定 > 我的帳號」修改密碼，並於「登入中的裝置」登出可疑連線。\u003c/li>\n                            \u003cli>\u003cstrong>解除可疑連動與收回訊息：\u003c/strong> 清理「連動中的應用程式」，並在聊天室收回駭客發出的詐騙訊息。\u003c/li>\n                        \u003c/ol>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv id=\"sop-content-pc\" class=\"space-y-4 hidden\">\n                    \u003cdiv class=\"p-4 bg-slate-100 border border-slate-300 rounded-xl\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base mb-2\">電腦感染竊資軟體緊急處置 SOP\u003c/h3>\n                        \u003col class=\"list-decimal list-inside text-xs text-slate-800 space-y-2 leading-relaxed font-medium\">\n                            \u003cli>\u003cstrong>立即實體斷網：\u003c/strong> 拔除網路線並關閉 Wi-Fi，阻止木馬外傳搜刮的憑證與 Cookie。\u003c/li>\n                            \u003cli>\u003cstrong>改用「乾淨手機」撤銷 Sessions 並改密碼：\u003c/strong> 切勿在中毒電腦上修改密碼！使用手機登入 Google/Apple/銀行，點選「登出所有裝置」。\u003c/li>\n                            \u003cli>\u003cstrong>Windows 11 雲端重建 (Cloud Rebuild)：\u003c/strong> 前往「設定 > 系統 > 復原 > 重建電腦」，選擇雲端下載乾淨映像檔並「清理所有檔案」重灌。\u003c/li>\n                        \u003c/ol>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv id=\"sop-content-phone\" class=\"space-y-4 hidden\">\n                    \u003cdiv class=\"p-4 bg-slate-100 border border-slate-300 rounded-xl\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base mb-2\">手機遭木馬感染/異常遠端控制 SOP\u003c/h3>\n                        \u003col class=\"list-decimal list-inside text-xs text-slate-800 space-y-2 leading-relaxed font-medium\">\n                            \u003cli>\u003cstrong>立即開啟「飛航模式」：\u003c/strong> 斷開行動網路與 Wi-Fi，切斷駭客遠端控制台與轉帳指令。\u003c/li>\n                            \u003cli>\u003cstrong>撤銷無障礙權限並移除 App：\u003c/strong> 前往「設定 > 無障礙」關閉可疑項目，並強制停止刪除異常 APK。\u003c/li>\n                            \u003cli>\u003cstrong>開啟進階保護與聯繫銀行：\u003c/strong> 若曾進行 NFC 感應或輸入卡號，立即致電銀行掛失卡片並將手機恢復出廠設定。\u003c/li>\n                        \u003c/ol>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n    \u003c/main>\n\n    \u003cfooter class=\"bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800 mt-auto\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 text-center space-y-2\">\n            \u003cp>2026 電腦與手機完整防毒防駭指南 · 單頁互動式應用程式 (SPA)\u003c/p>\n            \u003cp class=\"text-slate-500\">數據參考來源：AV-TEST (2026Q3)、AV-Comparatives (2025/2026)、Recorded Future Insikt Group、KELA Threat Intelligence\u003c/p>\n        \u003c/div>\n    \u003c/footer>\n\n    \u003cscript>\n        var currentTab = 'audio';\n        var synth = window.speechSynthesis;\n        var utterance = null;\n        var isSpeaking = false;\n\n        var fullScriptText = [\n            \"第一章：2026年資安威脅新型態與 ClickFix 社交工程。歡迎收聽 2026 年完整防毒防駭語音摘要。在今年，傳統防毒軟體已無法單靠檔案掃描達成完全安全。駭客攻擊重心已全面轉向社交工程誘騙與竊資軟體。例如熱門的 ClickFix 攻擊，會利用假冒的驗證碼或當機視窗，誘導使用者複製惡意指令並親手貼入電腦的命令提示字元或終端機執行，進而繞過防毒防線並搜刮瀏覽器密碼與登入 Cookie。同時，手機端也出現了感應實體金融卡進行遠端盜刷的 NFC 中繼攻擊。\",\n            \"第二章：電腦端 Windows 11 與 macOS 關鍵系統強化。防禦的第一步是鎖死作業系統的系統級權限。Windows 11 用戶應升級至最新版本，並開啟智慧應用程式控制（Smart App Control）以強制封鎖無數位簽章的未知程式，同時確認啟用預設的管理員保護與記憶體完整性防護。macOS 用戶則應更新至 Tahoe 26.7 或 Golden Gate 27.2，善用系統內建的終端機貼上防護，並嚴防網頁誘導開啟工序指令編寫程式貼上惡意指令的繞過手法。\",\n            \"第三章：防毒軟體評測數據與選購建議。根據 2026 年 AV-TEST 與 AV-Comparatives 權威實驗室測試，Windows 內建的 Microsoft Defender 已具備 100% 的基礎病毒攔截率，但在系統效能佔用上稍高。若需要極低系統負載與無檔案進階攻擊防護，第三方防毒軟體如 Bitdefender、Kaspersky、ESET 與 Norton 均表現優異。在 Mac 平台上，因內建 XProtect 缺乏細部控管，建議頻繁下載外來檔案的使用者加裝高分第三方防毒。\",\n            \"第四章：手機端 Android 進階保護與 iOS 失竊防護。手機防禦重點在於封鎖未知側載與實體防盜。Android 16 用戶應一鍵開啟進階保護（Advanced Protection），系統將全面禁止第三方 APK 側載與未認證的無障礙權限，並啟用 72 小時閒置自動重開機加密與 Gemini AI 來電防詐。iPhone 用戶則應將失竊裝置防護設定為永遠，確保手機遭竊後變更密碼需強制等待一小時安全延遲與 Face ID 驗證。\",\n            \"第五章：加密 DNS、LINE 防盜與中毒緊急 SOP。最後，請將設備 DNS 設定為可攔截惡意網域的 Quad9 9.9.9.9 或 Cloudflare 1.1.1.2，並清理瀏覽器擴充功能。LINE 帳號務必完成電話與雙重帳號綁定。若不幸遇到 LINE 帳號異狀，切記絕對不要刪除 App，只需在原手機點選再次登入即可強制踢出駭客；若電腦誤觸惡意指令，請立即實體斷網，並使用 Windows 11 的雲端重建功能進行乾淨重灌。\"\n        ];\n\n        function switchTab(tabId) {\n            var tabs = ['audio', 'threats', 'os-matrix', 'av-test', 'dns-line', 'sop'];\n            for (var i = 0; i \u003c tabs.length; i++) {\n                var t = tabs[i];\n                var sec = document.getElementById('sec-' + t);\n                var btn = document.getElementById('tab-' + t);\n                if (t === tabId) {\n                    sec.classList.remove('hidden');\n                    btn.classList.add('active-tab');\n                } else {\n                    sec.classList.add('hidden');\n                    btn.classList.remove('active-tab');\n                }\n            }\n            currentTab = tabId;\n            if (tabId === 'threats') { renderThreatChart(); }\n            if (tabId === 'av-test') { renderAvChart(); }\n        }\n\n        function playAudio() {\n            if (!synth) {\n                alert(\"您的瀏覽器不支援語音合成功能。\");\n                return;\n            }\n            if (synth.paused) {\n                synth.resume();\n                updateAudioUI(true, \"語音播放中...\");\n                return;\n            }\n            synth.cancel();\n            var fullText = fullScriptText.join(\" \");\n            utterance = new SpeechSynthesisUtterance(fullText);\n            utterance.lang = 'zh-TW';\n            utterance.rate = parseFloat(document.getElementById('select-rate').value);\n            \n            utterance.onend = function() {\n                updateAudioUI(false, \"播放完畢\");\n                clearScriptHighlights();\n            };\n            \n            utterance.onerror = function() {\n                updateAudioUI(false, \"語音播放錯誤\");\n            };\n\n            synth.speak(utterance);\n            updateAudioUI(true, \"語音摘要播放中...\");\n        }\n\n        function pauseAudio() {\n            if (synth && synth.speaking) {\n                synth.pause();\n                updateAudioUI(false, \"已暫停播放\");\n            }\n        }\n\n        function stopAudio() {\n            if (synth) {\n                synth.cancel();\n                updateAudioUI(false, \"已停止播放\");\n                clearScriptHighlights();\n            }\n        }\n\n        function changeRate() {\n            if (synth && synth.speaking) {\n                stopAudio();\n                playAudio();\n            }\n        }\n\n        function playChapter(chNum) {\n            if (!synth) return;\n            synth.cancel();\n            clearScriptHighlights();\n            \n            var text = fullScriptText[chNum - 1];\n            utterance = new SpeechSynthesisUtterance(text);\n            utterance.lang = 'zh-TW';\n            utterance.rate = parseFloat(document.getElementById('select-rate').value);\n            \n            var targetDiv = document.getElementById('script-ch' + chNum);\n            if (targetDiv) { targetDiv.classList.add('active-script'); }\n\n            utterance.onend = function() {\n                updateAudioUI(false, \"第 \" + chNum + \" 章播放完成\");\n                if (targetDiv) { targetDiv.classList.remove('active-script'); }\n            };\n\n            synth.speak(utterance);\n            updateAudioUI(true, \"正在朗讀第 \" + chNum + \" 章...\");\n        }\n\n        function clearScriptHighlights() {\n            for (var i = 1; i \u003c= 5; i++) {\n                var el = document.getElementById('script-ch' + i);\n                if (el) el.classList.remove('active-script');\n            }\n        }\n\n        function updateAudioUI(speaking, text) {\n            isSpeaking = speaking;\n            document.getElementById('status-text').innerText = text;\n            var dot = document.getElementById('status-dot');\n            if (speaking) {\n                dot.className = \"w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-ping\";\n            } else {\n                dot.className = \"w-2.5 h-2.5 rounded-full bg-slate-400 inline-block\";\n            }\n        }\n\n        function setOsTab(os) {\n            var osList = ['win', 'mac', 'android', 'ios'];\n            for (var i = 0; i \u003c osList.length; i++) {\n                var item = osList[i];\n                var content = document.getElementById('os-content-' + item);\n                var btn = document.getElementById('ostab-' + item);\n                if (item === os) {\n                    content.classList.remove('hidden');\n                    btn.className = \"px-4 py-2 rounded-lg font-medium text-sm bg-indigo-600 text-white\";\n                } else {\n                    content.classList.add('hidden');\n                    btn.className = \"px-4 py-2 rounded-lg font-medium text-sm bg-slate-100 text-slate-700 hover:bg-slate-200\";\n                }\n            }\n        }\n\n        function setSopScenario(sc) {\n            var scList = ['line', 'pc', 'phone'];\n            for (var i = 0; i \u003c scList.length; i++) {\n                var item = scList[i];\n                var content = document.getElementById('sop-content-' + item);\n                var btn = document.getElementById('sopbtn-' + item);\n                if (item === sc) {\n                    content.classList.remove('hidden');\n                    btn.className = \"px-4 py-2 rounded-lg text-sm font-medium bg-rose-600 text-white\";\n                } else {\n                    content.classList.add('hidden');\n                    btn.className = \"px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-700 hover:bg-slate-200\";\n                }\n            }\n        }\n\n        var threatChartInstance = null;\n        function renderThreatChart() {\n            if (threatChartInstance) return;\n            var ctx = document.getElementById('chart-threats').getContext('2d');\n            threatChartInstance = new Chart(ctx, {\n                type: 'bar',\n                data: {\n                    labels: ['ClickFix 社交工程', '憑證/Cookie竊取', 'NFC感應盜刷', '無障礙權限木馬', '零點擊間諜軟體'],\n                    datasets: [{\n                        label: '威脅激增指數與關注度',\n                        data: [92, 88, 76, 81, 65],\n                        backgroundColor: ['#4f46e5', '#818cf8', '#f59e0b', '#ef4444', '#64748b'],\n                        borderRadius: 6\n                    }]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    indexAxis: 'y',\n                    plugins: {\n                        legend: { display: false },\n                        tooltip: {\n                            callbacks: {\n                                label: function(context) { return ' 威脅指數: ' + context.raw + ' / 100'; }\n                            }\n                        }\n                    },\n                    scales: {\n                        x: { max: 100, grid: { color: '#f1f5f9' } },\n                        y: { grid: { display: false } }\n                    }\n                }\n            });\n        }\n\n        var avChartInstance = null;\n        function renderAvChart() {\n            if (avChartInstance) return;\n            var ctx = document.getElementById('chart-av').getContext('2d');\n            avChartInstance = new Chart(ctx, {\n                type: 'bar',\n                data: {\n                    labels: ['MS Defender', 'Bitdefender', 'Kaspersky', 'ESET Security', 'Norton 360', 'Avast Free'],\n                    datasets: [\n                        {\n                            label: '防護力 (滿分6.0)',\n                            data: [6.0, 6.0, 6.0, 6.0, 6.0, 6.0],\n                            backgroundColor: '#4f46e5'\n                        },\n                        {\n                            label: '系統效能 (滿分6.0)',\n                            data: [5.7, 6.0, 6.0, 5.8, 6.0, 6.0],\n                            backgroundColor: '#10b981'\n                        },\n                        {\n                            label: '可用性/低誤報 (滿分6.0)',\n                            data: [6.0, 6.0, 6.0, 6.0, 6.0, 6.0],\n                            backgroundColor: '#f59e0b'\n                        }\n                    ]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    plugins: {\n                        legend: { position: 'bottom' }\n                    },\n                    scales: {\n                        y: { min: 5.0, max: 6.0, grid: { color: '#f1f5f9' } },\n                        x: { grid: { display: false } }\n                    }\n                }\n            });\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>"},{"title":"台灣高精細離線地圖工具開發指南 | 互動式架構與實作導覽","path":"離線台灣詳細地圖工具開發指南/台灣高精細離線地圖工具開發指南.html","snippet":"🇹🇼 台灣高精細離線地圖工具開發指南 開源圖資管線 ‧ 向量渲染引擎 ‧ 離線路由 ‧ 台電電力座標解碼 總覽與生態系 圖磚容量試算 雙軌編譯管線 引擎與路由決策 電力座標與坐標工具 實作檢核表 OSM 台灣區域 P…","size":56717,"mtime":1793440753072,"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-TW\">\n\u003chead>\n    \u003cmeta charset=\"utf-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>台灣高精細離線地圖工具開發指南 | 互動式架構與實作導覽\u003c/title>\n    \u003c!-- Tailwind CSS CDN -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003c!-- Chart.js CDN -->\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/chart.js\">\u003c/script>\n    \u003cstyle>\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');\n        \n        body {\n            font-family: 'Noto Sans TC', 'Inter', sans-serif;\n            background-color: #FAF9F5;\n            color: #1E293B;\n        }\n\n        .chart-container {\n            position: relative;\n            width: 100%;\n            max-width: 650px;\n            margin-left: auto;\n            margin-right: auto;\n            height: 320px;\n            max-height: 380px;\n        }\n\n        @media (min-width: 768px) {\n            .chart-container {\n                height: 360px;\n            }\n        }\n\n        /* Custom Scrollbar for Code/Tables */\n        ::-webkit-scrollbar {\n            width: 6px;\n            height: 6px;\n        }\n        ::-webkit-scrollbar-track {\n            background: #F1F5F9;\n        }\n        ::-webkit-scrollbar-thumb {\n            background: #CBD5E1;\n            border-radius: 4px;\n        }\n        ::-webkit-scrollbar-thumb:hover {\n            background: #94A3B8;\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"min-h-screen flex flex-col antialiased selection:bg-teal-100 selection:text-teal-900\">\n\n    \u003c!-- Chosen Palette: Warm Neutral / Topo Emerald (Background: #FAF9F5, Primary: #1E293B, Accent: #0D9488, Card: #FFFFFF) -->\n    \u003c!-- Application Structure Plan:\n        1. Sticky Navigation & Header: Title, Key Metrics Summary, Tab Control (Overview, Storage Estimator, Pipelines, Routing & Engines, Coordinate Tools, Implementation Checklist).\n        2. Dashboard Hero Banner: 4 Core KPIs highlighting Vector vs Raster tiles size, OSM growth, precision, and zero-network mandate.\n        3. Dynamic Tab 1: Map Ecosystem & License Matrix (Interactive data tables and license compliance guide).\n        4. Dynamic Tab 2: Tile Size & Storage Estimator (Interactive Chart.js comparing Zoom levels 0-18 for PNG vs WebP vs PMTiles/Mapsforge with custom sliders).\n        5. Dynamic Tab 3: Dual Compile Pipelines (Step-by-step Planetiler/PMTiles vs Mapsforge/Rudy Topo flow builder).\n        6. Dynamic Tab 4: Coordinate & Power Grid Decoder (Live offline calculator for Taiwan Power Poles \"電力座標\" and TWD67/97/WGS84 transformation).\n        7. Dynamic Tab 5: Routing & Engine Selection (Spider/Bar comparisons for Valhalla vs BRouter vs GraphHopper and client SDKs).\n        8. Dynamic Tab 6: Interactive Implementation Checklist (Step-by-step engineering checklist with progress tracking).\n    -->\n    \u003c!-- Visualization & Content Choices:\n        - Chart 1: Bar & Line Chart for Zoom Level vs Raster Tile Count & Storage Capacity (Chart.js) -> Enables intuitive comprehension of why raster fails at Zoom 18.\n        - Chart 2: Line Chart for OSM Taiwan PBF Historical Growth (2014-2026) -> Demonstrates map detail expansion.\n        - Chart 3: Radar Chart for Offline Routing Engines (Valhalla vs BRouter vs GraphHopper across Memory, Mobile SDK, Elevation, Performance).\n        - Calculator 1: Power Grid Decoder -> Interactive input decoding G8150 HD78 to TWD67/TWD97/WGS84.\n        - Calculator 2: Coordinate Transformation -> 2-Param vs 4-Param TWD67/97 conversion.\n        - NO SVG or Mermaid JS used; Unicode/Canvas rendering applied.\n    -->\n    \u003c!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->\n\n    \u003c!-- Header Section -->\n    \u003cheader class=\"bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col md:flex-row md:items-center md:justify-between gap-3\">\n            \u003cdiv class=\"flex items-center space-x-3\">\n                \u003cspan class=\"bg-teal-700 text-white p-2 rounded-lg text-lg font-bold shadow-sm\">🇹🇼\u003c/span>\n                \u003cdiv>\n                    \u003ch1 class=\"text-lg font-bold text-slate-900 tracking-tight\">台灣高精細離線地圖工具開發指南\u003c/h1>\n                    \u003cp class=\"text-xs text-slate-500\">開源圖資管線 ‧ 向量渲染引擎 ‧ 離線路由 ‧ 台電電力座標解碼\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            \n            \u003c!-- Main Navigation Tabs -->\n            \u003cnav class=\"flex space-x-1 overflow-x-auto pb-1 md:pb-0 text-xs font-medium text-slate-600 no-scrollbar\">\n                \u003cbutton onclick=\"switchTab('overview')\" id=\"tab-overview\" class=\"tab-btn px-3 py-1.5 rounded-md bg-teal-50 text-teal-800 font-semibold border border-teal-200 transition\">總覽與生態系\u003c/button>\n                \u003cbutton onclick=\"switchTab('estimator')\" id=\"tab-estimator\" class=\"tab-btn px-3 py-1.5 rounded-md hover:bg-slate-100 transition\">圖磚容量試算\u003c/button>\n                \u003cbutton onclick=\"switchTab('pipeline')\" id=\"tab-pipeline\" class=\"tab-btn px-3 py-1.5 rounded-md hover:bg-slate-100 transition\">雙軌編譯管線\u003c/button>\n                \u003cbutton onclick=\"switchTab('engines')\" id=\"tab-engines\" class=\"tab-btn px-3 py-1.5 rounded-md hover:bg-slate-100 transition\">引擎與路由決策\u003c/button>\n                \u003cbutton onclick=\"switchTab('coords')\" id=\"tab-coords\" class=\"tab-btn px-3 py-1.5 rounded-md hover:bg-slate-100 transition\">電力座標與坐標工具\u003c/button>\n                \u003cbutton onclick=\"switchTab('checklist')\" id=\"tab-checklist\" class=\"tab-btn px-3 py-1.5 rounded-md hover:bg-slate-100 transition\">實作檢核表\u003c/button>\n            \u003c/nav>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- Main Body Container -->\n    \u003cmain class=\"flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8\">\n\n        \u003c!-- Top Metrics Highlight Cards -->\n        \u003csection class=\"grid grid-cols-2 lg:grid-cols-4 gap-4\">\n            \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n                \u003cdiv>\n                    \u003cspan class=\"text-xs font-semibold text-slate-400 uppercase tracking-wider\">OSM 台灣區域 PBF\u003c/span>\n                    \u003cdiv class=\"text-2xl font-extrabold text-teal-700 mt-1\">312 ~ 328 \u003cspan class=\"text-sm font-normal text-slate-500\">MB\u003c/span>\u003c/div>\n                \u003c/div>\n                \u003cp class=\"text-xs text-slate-500 mt-2\">包含全台道路、步道、建築外框與 POI，12年成長 18.8 倍\u003c/p>\n            \u003c/div>\n            \n            \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n                \u003cdiv>\n                    \u003cspan class=\"text-xs font-semibold text-slate-400 uppercase tracking-wider\">網格圖磚 Zoom 18 膨脹量\u003c/span>\n                    \u003cdiv class=\"text-2xl font-extrabold text-amber-600 mt-1\">38.9 ~ 64.8 \u003cspan class=\"text-sm font-normal text-slate-500\">GB\u003c/span>\u003c/div>\n                \u003c/div>\n                \u003cp class=\"text-xs text-slate-500 mt-2\">有效陸地 332 萬張圖磚，證明高精細度必須採用向量架構\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n                \u003cdiv>\n                    \u003cspan class=\"text-xs font-semibold text-slate-400 uppercase tracking-wider\">魯地圖三合一向量包\u003c/span>\n                    \u003cdiv class=\"text-2xl font-extrabold text-emerald-700 mt-1\">174 ~ 345 \u003cspan class=\"text-sm font-normal text-slate-500\">MB\u003c/span>\u003c/div>\n                \u003c/div>\n                \u003cp class=\"text-xs text-slate-500 mt-2\">含 20m DTM 等高線、山屋基點與 POIv3，每週定時更新生態系\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between\">\n                \u003cdiv>\n                    \u003cspan class=\"text-xs font-semibold text-slate-400 uppercase tracking-wider\">台電電力座標精度\u003c/span>\n                    \u003cdiv class=\"text-2xl font-extrabold text-indigo-700 mt-1\">10 ~ 1 \u003cspan class=\"text-sm font-normal text-slate-500\">公尺\u003c/span>\u003c/div>\n                \u003c/div>\n                \u003cp class=\"text-xs text-slate-500 mt-2\">基於 TWD67 二度分帶，提供無訊號山區精準救難報案解碼\u003c/p>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 1: OVERVIEW & ECOSYSTEM -->\n        \u003csection id=\"sec-overview\" class=\"tab-content space-y-6\">\n            \u003cdiv class=\"bg-white p-6 rounded-xl border border-slate-200 shadow-sm\">\n                \u003ch2 class=\"text-xl font-bold text-slate-900 mb-2\">台灣開放空間圖資生態系與授權合規隔離\u003c/h2>\n                \u003cp class=\"text-sm text-slate-600 leading-relaxed mb-6\">\n                    本區塊匯集台灣開放空間圖資的核心來源。打造離線地圖需融合 OpenStreetMap 在地社群與政府開放資料（OGDL-v1）。受限於 ODbL 的衍生資料庫條款，工程上宜採「資料源分離編譯、客戶端執行期疊合（Runtime Multi-Source Compositing）」架構，以維護法律合規性。\n                \u003c/p>\n\n                \u003c!-- Data Table -->\n                \u003cdiv class=\"overflow-x-auto border border-slate-200 rounded-lg\">\n                    \u003ctable class=\"w-full text-left text-xs text-slate-700\">\n                        \u003cthead class=\"bg-slate-50 text-slate-900 border-b border-slate-200 font-semibold\">\n                            \u003ctr>\n                                \u003cth class=\"p-3\">圖資名稱與單位\u003c/th>\n                                \u003cth class=\"p-3\">核心內容與特徵\u003c/th>\n                                \u003cth class=\"p-3\">發布格式\u003c/th>\n                                \u003cth class=\"p-3\">原生坐標系\u003c/th>\n                                \u003cth class=\"p-3\">台灣區檔案容量\u003c/th>\n                                \u003cth class=\"p-3\">更新頻率\u003c/th>\n                                \u003cth class=\"p-3\">授權條款\u003c/th>\n                            \u003c/tr>\n                        \u003c/thead>\n                        \u003ctbody class=\"divide-y divide-slate-200 bg-white\">\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-semibold text-teal-800\">OSM 台灣區圖資\u003cbr>\u003cspan class=\"font-normal text-slate-400\">Geofabrik / OSM TW\u003c/span>\u003c/td>\n                                \u003ctd class=\"p-3\">道路、山徑、建築外框、水系、POI\u003c/td>\n                                \u003ctd class=\"p-3\">.osm.pbf / .gpkg / .shp\u003c/td>\n                                \u003ctd class=\"p-3\">WGS84 (EPSG:4326)\u003c/td>\n                                \u003ctd class=\"p-3 font-semibold text-slate-900\">PBF: 312 ~ 328 MB\u003c/td>\n                                \u003ctd class=\"p-3\">每日更新\u003c/td>\n                                \u003ctd class=\"p-3\">\u003cspan class=\"px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-medium\">ODbL\u003c/span>\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-semibold text-teal-800\">內政部 20m DTM\u003cbr>\u003cspan class=\"font-normal text-slate-400\">內政部地政司\u003c/span>\u003c/td>\n                                \u003ctd class=\"p-3\">本島及離島 20m 網格三維坐標 (N,E,H)\u003c/td>\n                                \u003ctd class=\"p-3\">網格檔 / .hgt / 等高線 PBF\u003c/td>\n                                \u003ctd class=\"p-3\">TWD97 (EPSG:3826)\u003c/td>\n                                \u003ctd class=\"p-3 font-semibold text-slate-900\">DEM mix 46 MB (90m 8MB)\u003c/td>\n                                \u003ctd class=\"p-3\">年度更新 (最新 v2026)\u003c/td>\n                                \u003ctd class=\"p-3\">\u003cspan class=\"px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-medium\">OGDL-v1\u003c/span>\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-semibold text-teal-800\">臺灣通用電子地圖離線包\u003cbr>\u003cspan class=\"font-normal text-slate-400\">國土測繪中心 (NLSC)\u003c/span>\u003c/td>\n                                \u003ctd class=\"p-3\">航測國家底圖（套疊與不含等高線兩版）\u003c/td>\n                                \u003ctd class=\"p-3\">.mbtiles (APP用)\u003c/td>\n                                \u003ctd class=\"p-3\">Web Mercator (EPSG:3857)\u003c/td>\n                                \u003ctd class=\"p-3 font-semibold text-slate-900\">含等高線: 780 MB\u003c/td>\n                                \u003ctd class=\"p-3\">不定期 (2026/10)\u003c/td>\n                                \u003ctd class=\"p-3\">\u003cspan class=\"px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-medium\">OGDL-v1\u003c/span>\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-semibold text-teal-800\">魯地圖 (MOI.OSM / Taiwan TOPO)\u003cbr>\u003cspan class=\"font-normal text-slate-400\">Rudy Chung 與開源社群\u003c/span>\u003c/td>\n                                \u003ctd class=\"p-3\">融合 OSM + 內政部 20m 等高線 + 百岳基點\u003c/td>\n                                \u003ctd class=\"p-3\">Mapsforge .map + POIv3\u003c/td>\n                                \u003ctd class=\"p-3\">WGS84 (EPSG:4326)\u003c/td>\n                                \u003ctd class=\"p-3 font-semibold text-slate-900\">傳統 345 MB / 輕量 174 MB\u003c/td>\n                                \u003ctd class=\"p-3\">每週四正式版\u003c/td>\n                                \u003ctd class=\"p-3\">\u003cspan class=\"px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-medium\">ODbL + OGDL-v1\u003c/span>\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-semibold text-teal-800\">林業保育署自然步道與林班地\u003cbr>\u003cspan class=\"font-normal text-slate-400\">農業部林業及自然保育署\u003c/span>\u003c/td>\n                                \u003ctd class=\"p-3\">160 條步道軌跡、國有林林班界線\u003c/td>\n                                \u003ctd class=\"p-3\">.kml / .kmz / .shp / .map\u003c/td>\n                                \u003ctd class=\"p-3\">TWD97 (EPSG:3826)\u003c/td>\n                                \u003ctd class=\"p-3 font-semibold text-slate-900\">依獨立圖層封裝 (\u003c10 MB)\u003c/td>\n                                \u003ctd class=\"p-3\">不定期\u003c/td>\n                                \u003ctd class=\"p-3\">\u003cspan class=\"px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-medium\">OGDL-v1\u003c/span>\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-semibold text-teal-800\">台電電桿座標與防空避難圖資\u003cbr>\u003cspan class=\"font-normal text-slate-400\">台灣電力公司 / 警政署\u003c/span>\u003c/td>\n                                \u003ctd class=\"p-3\">全台電力桿號座標點位、防空避難設施\u003c/td>\n                                \u003ctd class=\"p-3\">.csv (台電) / .pmtiles / .map\u003c/td>\n                                \u003ctd class=\"p-3\">TWD67 (EPSG:3828) / TWD97\u003c/td>\n                                \u003ctd class=\"p-3 font-semibold text-slate-900\">獨立專題點位檔 (~20 MB)\u003c/td>\n                                \u003ctd class=\"p-3\">不定期\u003c/td>\n                                \u003ctd class=\"p-3\">\u003cspan class=\"px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-medium\">OGDL-v1\u003c/span>\u003c/td>\n                            \u003c/tr>\n                        \u003c/tbody>\n                    \u003c/table>\n                \u003c/div>\n\n                \u003c!-- OSM Growth Chart Block -->\n                \u003cdiv class=\"mt-8 border-t border-slate-100 pt-6\">\n                    \u003ch3 class=\"text-base font-bold text-slate-800 mb-2\">OpenStreetMap 台灣區數據歷史成長趨勢 (2014 - 2026)\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-500 mb-4\">隨著全台圖客社群細化建築外框與山區步道，`taiwan-latest.osm.pbf` 檔案大小呈現顯著成長曲線：\u003c/p>\n                    \u003cdiv class=\"chart-container\">\n                        \u003ccanvas id=\"chartOsmGrowth\">\u003c/canvas>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 2: TILE STORAGE ESTIMATOR -->\n        \u003csection id=\"sec-estimator\" class=\"tab-content hidden space-y-6\">\n            \u003cdiv class=\"bg-white p-6 rounded-xl border border-slate-200 shadow-sm\">\n                \u003ch2 class=\"text-xl font-bold text-slate-900 mb-2\">空間圖磚格式對比與台灣離線容量動態試算器\u003c/h2>\n                \u003cp class=\"text-sm text-slate-600 leading-relaxed mb-6\">\n                    本工具計算台灣本島與澎湖陸地範圍（36,197 平方公里加計 1.35 倍海岸線緩衝）在不同縮放層級（Zoom Level）下的網格圖磚張數與磁碟佔用。比較傳統網格圖磚（PNG/WebP）與現代向量圖磚（PMTiles / MBTiles / Mapsforge）的極致空間壓縮差異。\n                \u003c/p>\n\n                \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n                    \u003c!-- Controls -->\n                    \u003cdiv class=\"bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4\">\n                        \u003ch3 class=\"text-sm font-bold text-slate-800 border-b border-slate-200 pb-2\">試算參數設定\u003c/h3>\n                        \n                        \u003cdiv>\n                            \u003clabel class=\"block text-xs font-medium text-slate-700 mb-1\">目標最高縮放層級 (Max Zoom)\u003c/label>\n                            \u003cselect id=\"selectMaxZoom\" onchange=\"updateTileEstimate()\" class=\"w-full text-xs p-2 rounded border border-slate-300 bg-white focus:ring-2 focus:ring-teal-500\">\n                                \u003coption value=\"14\">Zoom 0–14 (縣市與幹線道路)\u003c/option>\n                                \u003coption value=\"15\">Zoom 0–15 (鄉鎮街道與郊山概覽 - NLSC上限)\u003c/option>\n                                \u003coption value=\"16\">Zoom 0–16 (都市社區與主要步道)\u003c/option>\n                                \u003coption value=\"17\">Zoom 0–17 (門牌細節與山區小徑)\u003c/option>\n                                \u003coption value=\"18\" selected>Zoom 0–18 (全精細門牌與山區之字形步道)\u003c/option>\n                            \u003c/select>\n                        \u003c/div>\n\n                        \u003cdiv>\n                            \u003clabel class=\"block text-xs font-medium text-slate-700 mb-1\">單張 PNG 圖磚平均大小 (KB)\u003c/label>\n                            \u003cinput type=\"number\" id=\"inputPngSize\" value=\"20\" onchange=\"updateTileEstimate()\" class=\"w-full text-xs p-2 rounded border border-slate-300 bg-white\">\n                        \u003c/div>\n\n                        \u003cdiv>\n                            \u003clabel class=\"block text-xs font-medium text-slate-700 mb-1\">單張 WebP 圖磚平均大小 (KB)\u003c/label>\n                            \u003cinput type=\"number\" id=\"inputWebpSize\" value=\"12\" onchange=\"updateTileEstimate()\" class=\"w-full text-xs p-2 rounded border border-slate-300 bg-white\">\n                        \u003c/div>\n\n                        \u003cdiv class=\"pt-2 border-t border-slate-200\">\n                            \u003cdiv class=\"text-xs text-slate-500 space-y-1\">\n                                \u003cp>\u003cspan class=\"font-semibold text-slate-700\">向量圖磚封裝 (PMTiles):\u003c/span> 全台約 250~310 MB\u003c/p>\n                                \u003cp>\u003cspan class=\"font-semibold text-slate-700\">Mapsforge 離線檔 (.map):\u003c/span> 全台約 174~298 MB\u003c/p>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003c!-- Chart Output -->\n                    \u003cdiv class=\"lg:col-span-2 space-y-4\">\n                        \u003cdiv class=\"grid grid-cols-2 gap-3 text-center\">\n                            \u003cdiv class=\"bg-amber-50 border border-amber-200 p-3 rounded-lg\">\n                                \u003cspan class=\"text-xs text-amber-800 font-medium\">預估有效陸地圖磚總數\u003c/span>\n                                \u003cdiv id=\"statTileCount\" class=\"text-xl font-bold text-amber-900 mt-1\">3,320,049 張\u003c/div>\n                            \u003c/div>\n                            \u003cdiv class=\"bg-teal-50 border border-teal-200 p-3 rounded-lg\">\n                                \u003cspan class=\"text-xs text-teal-800 font-medium\">向量圖磚節省空間比例\u003c/span>\n                                \u003cdiv id=\"statSavings\" class=\"text-xl font-bold text-teal-900 mt-1\">99.5 %\u003c/div>\n                            \u003c/div>\n                        \u003c/div>\n\n                        \u003cdiv class=\"chart-container\">\n                            \u003ccanvas id=\"chartTileEstimate\">\u003c/canvas>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Format Feature Comparison Matrix -->\n                \u003cdiv class=\"mt-8 border-t border-slate-200 pt-6\">\n                    \u003ch3 class=\"text-base font-bold text-slate-800 mb-3\">三大離線向量封裝格式深度評比\u003c/h3>\n                    \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-4 text-xs\">\n                        \u003cdiv class=\"bg-slate-50 p-4 rounded-lg border border-slate-200\">\n                            \u003cdiv class=\"font-bold text-teal-800 text-sm mb-1\">PMTiles (.pmtiles)\u003c/div>\n                            \u003cp class=\"text-slate-600 mb-2\">雲端最佳化單一封裝檔，支援 HTTP Range 請求與本地直接讀取。\u003c/p>\n                            \u003cul class=\"space-y-1 text-slate-500 list-disc list-inside\">\n                                \u003cli>容量效率極高（比同內容 MBTiles 小 10-15%）\u003c/li>\n                                \u003cli> MapLibre Android 11.7+ 原生支援 \u003ccode class=\"bg-slate-200 px-1\">pmtiles://\u003c/code>\u003c/li>\n                                \u003cli>Web 端可寫入 OPFS 進行完全離線渲染\u003c/li>\n                            \u003c/ul>\n                        \u003c/div>\n                        \u003cdiv class=\"bg-slate-50 p-4 rounded-lg border border-slate-200\">\n                            \u003cdiv class=\"font-bold text-indigo-800 text-sm mb-1\">MBTiles (.mbtiles)\u003c/div>\n                            \u003cp class=\"text-slate-600 mb-2\">基於 SQLite 資料庫封裝 MVT(PBF) 或網格圖磚的成熟格式。\u003c/p>\n                            \u003cul class=\"space-y-1 text-slate-500 list-disc list-inside\">\n                                \u003cli>國土測繪中心 (NLSC) 開放資料發布標準\u003c/li>\n                                \u003cli>Android 無法直接從 assets 存取（須複製至 internal storage）\u003c/li>\n                                \u003cli>讀取延遲低，但 SQLite 頁面快取佔記憶體\u003c/li>\n                            \u003c/ul>\n                        \u003c/div>\n                        \u003cdiv class=\"bg-slate-50 p-4 rounded-lg border border-slate-200\">\n                            \u003cdiv class=\"font-bold text-emerald-800 text-sm mb-1\">Mapsforge Binary (.map)\u003c/div>\n                            \u003cp class=\"text-slate-600 mb-2\">台灣戶外登山界「魯地圖」專用之極致緊湊向量格式。\u003c/p>\n                            \u003cul class=\"space-y-1 text-slate-500 list-disc list-inside\">\n                                \u003cli>全台灣含 20m 等高線僅 174~298 MB\u003c/li>\n                                \u003cli>專為多圖層疊圖 (Multi-maps) 設計\u003c/li>\n                                \u003cli>配合 Mapsforge Classic 或 VTM 引擎渲染\u003c/li>\n                            \u003c/ul>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 3: DUAL COMPILE PIPELINES -->\n        \u003csection id=\"sec-pipeline\" class=\"tab-content hidden space-y-6\">\n            \u003cdiv class=\"bg-white p-6 rounded-xl border border-slate-200 shadow-sm\">\n                \u003ch2 class=\"text-xl font-bold text-slate-900 mb-2\">雙軌圖資編譯與地形高程處理管線\u003c/h2>\n                \u003cp class=\"text-sm text-slate-600 leading-relaxed mb-6\">\n                    建構離線地圖需在伺服器端（Linux/Docker）自動化將原始 `taiwan-latest.osm.pbf` 與內政部 20m DTM 轉製為用戶端檔案。根據應用場景，可選擇「現代 MapLibre 向量管線」或「台灣魯地圖 Mapsforge 復刻管線」。\n                \u003c/p>\n\n                \u003c!-- Pipeline Selector Cards -->\n                \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 gap-6 mb-6\">\n                    \u003c!-- Track 1 -->\n                    \u003cdiv class=\"border-2 border-teal-600 rounded-xl p-5 bg-teal-50/30\">\n                        \u003cdiv class=\"flex justify-between items-center mb-3\">\n                            \u003ch3 class=\"font-bold text-slate-900 text-base\">軌道一：現代跨平台向量管線\u003c/h3>\n                            \u003cspan class=\"text-xs bg-teal-700 text-white px-2 py-0.5 rounded font-semibold\">Planetiler + PMTiles\u003c/span>\n                        \u003c/div>\n                        \u003col class=\"space-y-3 text-xs text-slate-700\">\n                            \u003cli class=\"flex items-start\">\n                                \u003cspan class=\"w-5 h-5 rounded-full bg-teal-700 text-white flex items-center justify-center font-bold mr-2 shrink-0\">1\u003c/span>\n                                \u003cdiv>\u003cstrong class=\"text-slate-900\">Planetiler 向量轉碼：\u003c/strong> 以 Java 引擎直接由 PBF 產製 MVT/PBF，台灣區域約 1-2 分鐘完成，免架設 PostGIS 資料庫。\u003c/div>\n                            \u003c/li>\n                            \u003cli class=\"flex items-start\">\n                                \u003cspan class=\"w-5 h-5 rounded-full bg-teal-700 text-white flex items-center justify-center font-bold mr-2 shrink-0\">2\u003c/span>\n                                \u003cdiv>\u003cstrong class=\"text-slate-900\">PMTiles 單檔打包：\u003c/strong> 使用 \u003ccode class=\"bg-slate-200 px-1\">pmtiles convert\u003c/code> 封裝為單一 \u003ccode class=\"bg-slate-200 px-1\">taiwan.pmtiles\u003c/code>，支援次世代 MLT 格式提升 6 倍壓縮率。\u003c/div>\n                            \u003c/li>\n                            \u003cli class=\"flex items-start\">\n                                \u003cspan class=\"w-5 h-5 rounded-full bg-teal-700 text-white flex items-center justify-center font-bold mr-2 shrink-0\">3\u003c/span>\n                                \u003cdiv>\u003cstrong class=\"text-slate-900\">DEM 高程與動態等高線：\u003c/strong> 將 20m DTM 轉為 Terrain-RGB 或 Terrarium \u003ccode class=\"bg-slate-200 px-1\">raster-dem\u003c/code>，由用戶端透過 \u003ccode class=\"bg-slate-200 px-1\">maplibre-contour\u003c/code> 即時計算陰影與等高線。\u003c/div>\n                            \u003c/li>\n                        \u003c/ol>\n                    \u003c/div>\n\n                    \u003c!-- Track 2 -->\n                    \u003cdiv class=\"border-2 border-emerald-600 rounded-xl p-5 bg-emerald-50/30\">\n                        \u003cdiv class=\"flex justify-between items-center mb-3\">\n                            \u003ch3 class=\"font-bold text-slate-900 text-base\">軌道二：台灣魯地圖復刻管線\u003c/h3>\n                            \u003cspan class=\"text-xs bg-emerald-700 text-white px-2 py-0.5 rounded font-semibold\">Mapsforge + HGT\u003c/span>\n                        \u003c/div>\n                        \u003col class=\"space-y-3 text-xs text-slate-700\">\n                            \u003cli class=\"flex items-start\">\n                                \u003cspan class=\"w-5 h-5 rounded-full bg-emerald-700 text-white flex items-center justify-center font-bold mr-2 shrink-0\">1\u003c/span>\n                                \u003cdiv>\u003cstrong class=\"text-slate-900\">高程檔準備 (DEM mix v2026)：\u003c/strong> 融合內政部地政司 20m DTM 與 JAXA AW3D30 (30m)，產出 46MB \u003ccode class=\"bg-slate-200 px-1\">.hgt\u003c/code> 高程陰影庫。\u003c/div>\n                            \u003c/li>\n                            \u003cli class=\"flex items-start\">\n                                \u003cspan class=\"w-5 h-5 rounded-full bg-emerald-700 text-white flex items-center justify-center font-bold mr-2 shrink-0\">2\u003c/span>\n                                \u003cdiv>\u003cstrong class=\"text-slate-900\">等高線與 OSM 融合：\u003c/strong> 經由 \u003ccode class=\"bg-slate-200 px-1\">phyghtmap\u003c/code> / Rex PBF 產製 20m 間距等高線，結合百岳三角點與邊界修復。\u003c/div>\n                            \u003c/li>\n                            \u003cli class=\"flex items-start\">\n                                \u003cspan class=\"w-5 h-5 rounded-full bg-emerald-700 text-white flex items-center justify-center font-bold mr-2 shrink-0\">3\u003c/span>\n                                \u003cdiv>\u003cstrong class=\"text-slate-900\">docker-make 自動化：\u003c/strong> 執行 Mapsforge Map-Writer 生成 \u003ccode class=\"bg-slate-200 px-1\">.map\u003c/code> 檔 (298MB/168MB) 與 \u003ccode class=\"bg-slate-200 px-1\">POIv3\u003c/code> 搜尋庫 (55MB)。\u003c/div>\n                            \u003c/li>\n                        \u003c/ol>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Code Example for Absolute Path Requirement -->\n                \u003cdiv class=\"bg-slate-900 text-slate-100 p-4 rounded-xl font-mono text-xs overflow-x-auto space-y-2\">\n                    \u003cdiv class=\"text-slate-400 font-sans font-semibold border-b border-slate-700 pb-1 mb-2\">Android 零網路完全離線載入實作 (Kotlin & MapLibre Native)\u003c/div>\n                    \u003cpre>\u003ccode class=\"text-emerald-400\">// 1. MapLibre Android 強制要求 pmtiles:// 使用完整路徑\nval pmtilesPath = \"pmtiles://file://\" + File(context.filesDir, \"taiwan.pmtiles\").absolutePath\n\n// 2. 解決 Android 無法直接從 APK assets 讀取 MBTiles 之限制\nfun copyAssetToInternal(context: Context, fileName: String): File {\n    val outFile = File(context.filesDir, fileName)\n    if (!outFile.exists()) {\n        context.assets.open(fileName).use { input ->\n            outFile.outputStream().use { output -> input.copyTo(output) }\n        }\n    }\n    return outFile\n}\n\n// 3. style.json 本地化配製 (移除任何外部 http/https 網路請求)\nval offlineStyleJson = \"\"\"\n{\n  \"version\": 8,\n  \"glyphs\": \"asset://fonts/{fontstack}/{range}.pbf\",\n  \"sprite\": \"asset://sprites/outdoor_sprite\",\n  \"sources\": {\n    \"taiwan-vector\": {\n      \"type\": \"vector\",\n      \"url\": \"$pmtilesPath\",\n      \"attribution\": \"© OpenStreetMap contributors\"\n    }\n  }\n}\n\"\"\".trimIndent()\u003c/code>\u003c/pre>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 4: ENGINES & ROUTING -->\n        \u003csection id=\"sec-engines\" class=\"tab-content hidden space-y-6\">\n            \u003cdiv class=\"bg-white p-6 rounded-xl border border-slate-200 shadow-sm\">\n                \u003ch2 class=\"text-xl font-bold text-slate-900 mb-2\">渲染引擎選型與離線路徑規劃 (Routing) 評比\u003c/h2>\n                \u003cp class=\"text-sm text-slate-600 leading-relaxed mb-6\">\n                    離線地圖工具需要在無網路山區提供圖形渲染與路線計算。下方雷達圖與分析矩陣對比三大開源離線路由引擎（Valhalla vs BRouter vs GraphHopper），以及 MapLibre Native 與 Mapsforge VTM 渲染引擎之特性。\n                \u003c/p>\n\n                \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-2 gap-6 items-center\">\n                    \u003cdiv>\n                        \u003ch3 class=\"text-base font-bold text-slate-800 mb-2\">離線路徑規劃引擎綜合指標對比\u003c/h3>\n                        \u003cp class=\"text-xs text-slate-500 mb-4\">針對行動端記憶體佔用、坡度權重計算、跨平台 SDK (iOS/Android) 與長途算路能力評分：\u003c/p>\n                        \u003cdiv class=\"chart-container\">\n                            \u003ccanvas id=\"chartRoutingEngine\">\u003c/canvas>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"space-y-3 text-xs\">\n                        \u003cdiv class=\"p-3 bg-teal-50 border-l-4 border-teal-600 rounded-r-lg\">\n                            \u003cdiv class=\"font-bold text-teal-900 text-sm\">Valhalla (C++ 分塊路由引擎)\u003c/div>\n                            \u003cp class=\"text-slate-700 mt-1\">採用地理分塊路由圖磚 (Balder)。透過 \u003ccode class=\"bg-teal-100 px-1\">Rallista/valhalla-mobile\u003c/code> 提供完美 Android/iOS 原生綁定。全台路由圖磚約 140MB，每 60m 抽樣坡度權重，為跨平台最佳首選。\u003c/p>\n                        \u003c/div>\n\n                        \u003cdiv class=\"p-3 bg-emerald-50 border-l-4 border-emerald-600 rounded-r-lg\">\n                            \u003cdiv class=\"font-bold text-emerald-900 text-sm\">BRouter (單車與登山戶外專精)\u003c/div>\n                            \u003cp class=\"text-slate-700 mt-1\">Java 撰寫，為台灣山林日誌、Locus Map 等戶外 App 之核心。支援長途軌跡動態重算與無超時模式，結合 DEM 高程進行登山時間精算。\u003c/p>\n                        \u003c/div>\n\n                        \u003cdiv class=\"p-3 bg-amber-50 border-l-4 border-amber-600 rounded-r-lg\">\n                            \u003cdiv class=\"font-bold text-amber-900 text-sm\">GraphHopper (Java 傳統引擎)\u003c/div>\n                            \u003cp class=\"text-slate-700 mt-1\">需載入 \u003ccode class=\"bg-amber-100 px-1\">graph-cache\u003c/code>。低階手機極易爆發 \u003cstrong class=\"text-amber-900\">OOM (記憶體不足)\u003c/strong>，必須強制設定 \u003ccode class=\"bg-amber-100 px-1\">graph.dataaccess: MMAP\u003c/code>。官方 1.0 版後已移除行動端範例。\u003c/p>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 5: COORDINATE & POWER GRID TOOLS -->\n        \u003csection id=\"sec-coords\" class=\"tab-content hidden space-y-6\">\n            \u003cdiv class=\"bg-white p-6 rounded-xl border border-slate-200 shadow-sm\">\n                \u003ch2 class=\"text-xl font-bold text-slate-900 mb-2\">台灣大地基準轉換與台電電力座標離線雙向解碼器\u003c/h2>\n                \u003cp class=\"text-sm text-slate-600 leading-relaxed mb-4\">\n                    山難搜救實務上，TWD67 與 TWD97/WGS84 二度分帶存在約 \u003cstrong class=\"text-amber-700\">東距 828 公尺、北距 207 公尺\u003c/strong>（直線距離 ~853m）的偏差。本工具內建完全離線的「台電圖號座標（電力座標）」解碼器與坐標系統轉換器。\n                \u003c/p>\n\n                \u003c!-- Interactive Tool 1: Power Pole Decoder -->\n                \u003cdiv class=\"bg-slate-50 p-5 rounded-xl border border-slate-200 mb-6\">\n                    \u003ch3 class=\"text-base font-bold text-teal-800 mb-3 flex items-center\">\n                        \u003cspan class=\"bg-teal-700 text-white w-5 h-5 rounded-full inline-flex items-center justify-center text-xs mr-2\">1\u003c/span>\n                        台電電力座標 (Power Pole Coordinate) 離線即時解碼器\n                    \u003c/h3>\n                    \n                    \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-4 mb-4\">\n                        \u003cdiv class=\"md:col-span-2\">\n                            \u003clabel class=\"block text-xs font-semibold text-slate-700 mb-1\">輸入電線桿/變電箱銘牌座標 (例如: G8150 HD78 或 R1998 EE7912)\u003c/label>\n                            \u003cdiv class=\"flex space-x-2\">\n                                \u003cinput type=\"text\" id=\"inputPowerCode\" value=\"G8150 HD78\" placeholder=\"例如: G8150 HD78\" class=\"flex-1 text-sm p-2.5 rounded border border-slate-300 font-mono font-bold uppercase focus:ring-2 focus:ring-teal-500\">\n                                \u003cbutton onclick=\"runPowerDecoder()\" class=\"bg-teal-700 hover:bg-teal-800 text-white text-xs font-bold px-4 py-2.5 rounded transition\">離線解碼\u003c/button>\n                            \u003c/div>\n                            \u003cspan class=\"text-[11px] text-slate-500 mt-1 block\">支援格式: 標準 9-11 碼 (G PPQQ RS TU [VW]) 或含子圖象限字母 (例如 Q5322A BD04)\u003c/span>\n                        \u003c/div>\n\n                        \u003cdiv class=\"bg-white p-3 rounded border border-slate-200 text-xs space-y-1\">\n                            \u003cdiv class=\"font-bold text-slate-700 border-b pb-1\">大區簡碼快速測試:\u003c/div>\n                            \u003cdiv class=\"flex flex-wrap gap-1 mt-1\">\n                                \u003cbutton onclick=\"setPowerSample('G8150 HD78')\" class=\"bg-slate-100 hover:bg-slate-200 px-1.5 py-0.5 rounded text-slate-700 font-mono\">台中東勢 (G)\u003c/button>\n                                \u003cbutton onclick=\"setPowerSample('B9302 EE21')\" class=\"bg-slate-100 hover:bg-slate-200 px-1.5 py-0.5 rounded text-slate-700 font-mono\">台北文山 (B)\u003c/button>\n                                \u003cbutton onclick=\"setPowerSample('R1998 EE7912')\" class=\"bg-slate-100 hover:bg-slate-200 px-1.5 py-0.5 rounded text-slate-700 font-mono\">台東關山 (R)\u003c/button>\n                                \u003cbutton onclick=\"setPowerSample('X2500 AA00')\" class=\"bg-slate-100 hover:bg-slate-200 px-1.5 py-0.5 rounded text-slate-700 font-mono\">澎湖馬公 (X)\u003c/button>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003c!-- Output Panel -->\n                    \u003cdiv id=\"powerOutputPanel\" class=\"bg-white p-4 rounded-lg border border-slate-300 grid grid-cols-1 md:grid-cols-3 gap-4 text-xs\">\n                        \u003cdiv>\n                            \u003cspan class=\"text-slate-400 font-semibold block\">解碼拆解結構\u003c/span>\n                            \u003cdiv id=\"powerStruct\" class=\"font-mono text-slate-800 font-bold mt-1 text-sm\">G 區 | PP:81 QQ:50 | H D | T:7 U:8\u003c/div>\n                        \u003c/div>\n                        \u003cdiv>\n                            \u003cspan class=\"text-slate-400 font-semibold block\">TWD67 二度分帶坐標 (TM2)\u003c/span>\n                            \u003cdiv id=\"powerTwd67\" class=\"font-mono text-amber-700 font-bold mt-1 text-sm\">X: 235,570 m, Y: 2,675,380 m\u003c/div>\n                        \u003c/div>\n                        \u003cdiv>\n                            \u003cspan class=\"text-slate-400 font-semibold block\">TWD97 / WGS84 轉換坐標\u003c/span>\n                            \u003cdiv id=\"powerTwd97\" class=\"font-mono text-teal-800 font-bold mt-1 text-sm\">X: 236,398 m, Y: 2,675,173 m\u003cbr>\u003cspan class=\"text-xs text-slate-500\">(Lat: 24.184305°, Lng: 120.865421°)\u003c/span>\u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Interactive Tool 2: Coordinate Transformation Calculator -->\n                \u003cdiv class=\"bg-slate-50 p-5 rounded-xl border border-slate-200\">\n                    \u003ch3 class=\"text-base font-bold text-teal-800 mb-3 flex items-center\">\n                        \u003cspan class=\"bg-teal-700 text-white w-5 h-5 rounded-full inline-flex items-center justify-center text-xs mr-2\">2\u003c/span>\n                        TWD67 \u003c--> TWD97 平面坐標轉換計算器 (二參數 vs 四參數)\n                    \u003c/h3>\n\n                    \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-4 text-xs\">\n                        \u003cdiv>\n                            \u003clabel class=\"block font-semibold text-slate-700 mb-1\">TWD67 X 坐標 (東距 Easting, m)\u003c/label>\n                            \u003cinput type=\"number\" id=\"coordX67\" value=\"235570\" oninput=\"calcCoordTransform()\" class=\"w-full p-2 border border-slate-300 rounded font-mono\">\n                        \u003c/div>\n                        \u003cdiv>\n                            \u003clabel class=\"block font-semibold text-slate-700 mb-1\">TWD67 Y 坐標 (北距 Northing, m)\u003c/label>\n                            \u003cinput type=\"number\" id=\"coordY67\" value=\"2675380\" oninput=\"calcCoordTransform()\" class=\"w-full p-2 border border-slate-300 rounded font-mono\">\n                        \u003c/div>\n                        \u003cdiv>\n                            \u003clabel class=\"block font-semibold text-slate-700 mb-1\">轉換演算法模型\u003c/label>\n                            \u003cselect id=\"selectAlgorithm\" onchange=\"calcCoordTransform()\" class=\"w-full p-2 border border-slate-300 rounded bg-white font-medium\">\n                                \u003coption value=\"4param\">二度分帶平面四參數公式 (高精度推薦)\u003c/option>\n                                \u003coption value=\"2param\">野外二參數速算 (+828m, -207m)\u003c/option>\n                            \u003c/select>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"mt-4 p-3 bg-white rounded border border-slate-200 text-xs flex justify-between items-center\">\n                        \u003cdiv>\n                            \u003cspan class=\"text-slate-500\">計算所得 TWD97 坐標：\u003c/span>\n                            \u003cspan id=\"resTwd97\" class=\"font-mono font-bold text-teal-800 text-sm ml-2\">X: 236,398 m, Y: 2,675,173 m\u003c/span>\n                        \u003c/div>\n                        \u003cdiv>\n                            \u003cspan class=\"text-slate-500\">東距偏差: \u003cstrong id=\"resDeltaX\" class=\"text-slate-800\">+828m\u003c/strong> | 北距偏差: \u003cstrong id=\"resDeltaY\" class=\"text-slate-800\">-207m\u003c/strong>\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 6: IMPLEMENTATION CHECKLIST -->\n        \u003csection id=\"sec-checklist\" class=\"tab-content hidden space-y-6\">\n            \u003cdiv class=\"bg-white p-6 rounded-xl border border-slate-200 shadow-sm\">\n                \u003cdiv class=\"flex justify-between items-center mb-4\">\n                    \u003cdiv>\n                        \u003ch2 class=\"text-xl font-bold text-slate-900\">生產環境離線地圖開發檢核清單\u003c/h2>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">依據 9 大步驟逐步落實無網路狀態下的完全可用性：\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"text-right\">\n                        \u003cspan class=\"text-xs text-slate-400 block\">實作完成度\u003c/span>\n                        \u003cspan id=\"checklistProgressText\" class=\"text-lg font-extrabold text-teal-700\">0 / 9 (0%)\u003c/span>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Progress Bar -->\n                \u003cdiv class=\"w-full bg-slate-100 rounded-full h-2.5 mb-6\">\n                    \u003cdiv id=\"checklistProgressBar\" class=\"bg-teal-600 h-2.5 rounded-full transition-all duration-300\" style=\"width: 0%\">\u003c/div>\n                \u003c/div>\n\n                \u003c!-- Checklist Items -->\n                \u003cdiv id=\"checklistContainer\" class=\"space-y-3 text-xs\">\n                    \u003c!-- Dynamic rendering via JS -->\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n    \u003c/main>\n\n    \u003c!-- Footer -->\n    \u003cfooter class=\"bg-white border-t border-slate-200 py-4 mt-auto\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500\">\n            Taiwan Offline Map Developer Guide SPA ‧ 本系統資料庫遵循 ODbL 與政府資料開放授權條款 (OGDL-v1) ‧ 版權所有 © 2026\n        \u003c/div>\n    \u003c/footer>\n\n    \u003c!-- JavaScript Logic Block -->\n    \u003cscript>\n        // --- 1. TAB NAVIGATION LOGIC ---\n        function switchTab(tabId) {\n            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));\n            document.querySelectorAll('.tab-btn').forEach(btn => {\n                btn.classList.remove('bg-teal-50', 'text-teal-800', 'font-semibold', 'border', 'border-teal-200');\n                btn.classList.add('hover:bg-slate-100');\n            });\n\n            document.getElementById('sec-' + tabId).classList.remove('hidden');\n            const activeBtn = document.getElementById('tab-' + tabId);\n            activeBtn.classList.add('bg-teal-50', 'text-teal-800', 'font-semibold', 'border', 'border-teal-200');\n            activeBtn.classList.remove('hover:bg-slate-100');\n        }\n\n        // --- 2. CHART.JS INITIALIZATION ---\n        // Chart 1: OSM Taiwan Historical Growth\n        const ctxOsm = document.getElementById('chartOsmGrowth').getContext('2d');\n        new Chart(ctxOsm, {\n            type: 'line',\n            data: {\n                labels: ['2014/01', '2016/01', '2018/01', '2020/01', '2022/01', '2023/01', '2024/01', '2026/10'],\n                datasets: [{\n                    label: 'taiwan-latest.osm.pbf (MB)',\n                    data: [17.4, 32.1, 54.8, 78.2, 99.5, 114.2, 210.5, 328.0],\n                    borderColor: '#0D9488',\n                    backgroundColor: 'rgba(13, 148, 136, 0.1)',\n                    fill: true,\n                    tension: 0.3,\n                    pointRadius: 4,\n                    pointHoverRadius: 6\n                }]\n            },\n            options: {\n                responsive: true,\n                maintainAspectRatio: false,\n                plugins: {\n                    legend: { display: false },\n                    tooltip: {\n                        callbacks: {\n                            label: function(ctx) { return ` PBF 容量: ${ctx.parsed.y} MB`; }\n                        }\n                    }\n                },\n                scales: {\n                    x: { ticks: { font: { size: 10 } } },\n                    y: { \n                        title: { display: true, text: '容量 (MB)', font: { size: 11 } },\n                        beginAtZero: true\n                    }\n                }\n            }\n        });\n\n        // Chart 2: Dynamic Tile Storage Estimator Chart\n        let tileChart;\n        function initTileChart() {\n            const ctxTile = document.getElementById('chartTileEstimate').getContext('2d');\n            tileChart = new Chart(ctxTile, {\n                type: 'bar',\n                data: {\n                    labels: ['PNG 網格圖磚', 'WebP 網格圖磚', 'PMTiles 向量圖磚', 'Mapsforge 離線包'],\n                    datasets: [{\n                        label: '估算佔用容量 (MB)',\n                        data: [64844.7, 38906.8, 280, 298],\n                        backgroundColor: ['#F59E0B', '#3B82F6', '#0D9488', '#059669']\n                    }]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    plugins: {\n                        legend: { display: false },\n                        tooltip: {\n                            callbacks: {\n                                label: function(ctx) {\n                                    const val = ctx.parsed.y;\n                                    return val >= 1000 ? ` 容量: ${(val/1024).toFixed(2)} GB` : ` 容量: ${val.toFixed(1)} MB`;\n                                }\n                            }\n                        }\n                    },\n                    scales: {\n                        y: {\n                            type: 'logarithmic',\n                            title: { display: true, text: '容量大小 (MB - 對數對比)', font: { size: 11 } }\n                        }\n                    }\n                }\n            });\n        }\n        initTileChart();\n\n        // Tile Estimate Logic\n        const ZOOM_TILES = {\n            14: 12978,\n            15: 51885,\n            16: 207512,\n            17: 830020,\n            18: 3320049\n        };\n\n        function updateTileEstimate() {\n            const maxZoom = parseInt(document.getElementById('selectMaxZoom').value, 10);\n            const pngSizeKb = parseFloat(document.getElementById('inputPngSize').value) || 20;\n            const webpSizeKb = parseFloat(document.getElementById('inputWebpSize').value) || 12;\n\n            const tileCount = ZOOM_TILES[maxZoom];\n            const pngMb = (tileCount * pngSizeKb) / 1024;\n            const webpMb = (tileCount * webpSizeKb) / 1024;\n            const pmtilesMb = 280;\n            const mapsforgeMb = 298;\n\n            document.getElementById('statTileCount').innerText = tileCount.toLocaleString() + ' 張';\n            const savings = ((1 - (pmtilesMb / pngMb)) * 100).toFixed(1);\n            document.getElementById('statSavings').innerText = (savings > 0 ? savings : 0) + ' %';\n\n            tileChart.data.datasets[0].data = [pngMb, webpMb, pmtilesMb, mapsforgeMb];\n            tileChart.update();\n        }\n\n        // Chart 3: Offline Routing Engines Radar\n        const ctxRouting = document.getElementById('chartRoutingEngine').getContext('2d');\n        new Chart(ctxRouting, {\n            type: 'radar',\n            data: {\n                labels: ['低記憶體開銷', 'Android/iOS原生效能', '坡度高程權重', '長途算路能力', '圖磚離線分發'],\n                datasets: [\n                    {\n                        label: 'Valhalla (C++)',\n                        data: [9, 9.5, 9, 8.5, 9.5],\n                        borderColor: '#0D9488',\n                        backgroundColor: 'rgba(13, 148, 136, 0.2)'\n                    },\n                    {\n                        label: 'BRouter (Java)',\n                        data: [8.5, 7.5, 9.5, 9.5, 8],\n                        borderColor: '#059669',\n                        backgroundColor: 'rgba(5, 150, 105, 0.2)'\n                    },\n                    {\n                        label: 'GraphHopper (Java)',\n                        data: [5, 6, 8, 8, 7],\n                        borderColor: '#D97706',\n                        backgroundColor: 'rgba(217, 119, 6, 0.2)'\n                    }\n                ]\n            },\n            options: {\n                responsive: true,\n                maintainAspectRatio: false,\n                scales: {\n                    r: {\n                        angleLines: { color: '#E2E8F0' },\n                        grid: { color: '#E2E8F0' },\n                        pointLabels: { font: { size: 10 } },\n                        suggestedMin: 0,\n                        suggestedMax: 10\n                    }\n                }\n            }\n        });\n\n        // --- 3. POWER GRID COORDINATE DECODER LOGIC ---\n        const GRID_ORIGINS = {\n            'A': {x: 90000, y: 2750000}, 'B': {x: 170000, y: 2750000}, 'C': {x: 250000, y: 2750000},\n            'D': {x: 90000, y: 2700000}, 'E': {x: 170000, y: 2700000}, 'F': {x: 250000, y: 2700000},\n            'G': {x: 170000, y: 2650000}, 'H': {x: 250000, y: 2650000},\n            'J': {x: 90000, y: 2600000}, 'K': {x: 170000, y: 2600000}, 'L': {x: 250000, y: 2600000},\n            'M': {x: 90000, y: 2550000}, 'N': {x: 170000, y: 2550000}, 'O': {x: 250000, y: 2550000},\n            'P': {x: 90000, y: 2500000}, 'Q': {x: 170000, y: 2500000}, 'R': {x: 250000, y: 2500000},\n            'T': {x: 170000, y: 2450000}, 'U': {x: 250000, y: 2450000},\n            'V': {x: 170000, y: 2400000}, 'W': {x: 250000, y: 2400000},\n            'X': {x: 275000, y: 2614000, lon0: 119}, // Penghu N\n            'Y': {x: 275000, y: 2564000, lon0: 119}, // Penghu S\n            'Z': {x: 10000, y: 2675800, lon0: 117},  // Kinmen\n            'S': {x: 10000, y: 2894000, lon0: 117}   // Matsu\n        };\n\n        const R_MAP = {'A':0, 'B':1, 'C':2, 'D':3, 'E':4, 'F':5, 'G':6, 'H':7};\n        const S_MAP = {'A':0, 'B':1, 'C':2, 'D':3, 'E':4};\n\n        function setPowerSample(code) {\n            document.getElementById('inputPowerCode').value = code;\n            runPowerDecoder();\n        }\n\n        function runPowerDecoder() {\n            const raw = document.getElementById('inputPowerCode').value.toUpperCase().replace(/\\s+/g, '');\n            // Pattern: ^([A-Z])(\\d{2})(\\d{2})([A-D])?([A-H])([A-E])(\\d)(\\d)(\\d{2})?$\n            const match = raw.match(/^([A-Z])(\\d{2})(\\d{2})([A-D])?([A-H])([A-E])(\\d)(\\d)(\\d{2})?$/);\n\n            if (!match) {\n                document.getElementById('powerStruct').innerHTML = `\u003cspan class=\"text-rose-600\">格式無效\u003c/span>`;\n                document.getElementById('powerTwd67').innerText = \"請確認格式 (如 G8150 HD78)\";\n                document.getElementById('powerTwd97').innerText = \"-\";\n                return;\n            }\n\n            const [, region, ppStr, qqStr, quad, rChar, sChar, tStr, uStr, vwStr] = match;\n            if (!GRID_ORIGINS[region]) {\n                document.getElementById('powerStruct').innerHTML = `\u003cspan class=\"text-rose-600\">未知區域字母: ${region}\u003c/span>`;\n                return;\n            }\n\n            const origin = GRID_ORIGINS[region];\n            const pp = parseInt(ppStr, 10);\n            const qq = parseInt(qqStr, 10);\n            const rIdx = R_MAP[rChar];\n            const sIdx = S_MAP[sChar];\n            const t = parseInt(tStr, 10);\n            const u = parseInt(uStr, 10);\n            const v = vwStr ? parseInt(vwStr[0], 10) : 0;\n            const w = vwStr ? parseInt(vwStr[1], 10) : 0;\n\n            let x67 = origin.x + (pp * 800) + (rIdx * 100) + (t * 10) + v;\n            let y67 = origin.y + (qq * 500) + (sIdx * 100) + (u * 10) + w;\n\n            if (quad === 'B') x67 += 400;\n            else if (quad === 'C') y67 += 250;\n            else if (quad === 'D') { x67 += 400; y67 += 250; }\n\n            // 4-parameter TWD67 -> TWD97\n            const A = 0.00001549;\n            const B = 0.000006521;\n            const x97 = x67 + 807.8 + (A * x67) + (B * y67);\n            const y97 = y67 - 248.6 + (A * y67) + (B * x67);\n\n            // Approx Lat/Lng for display\n            const lon0 = origin.lon0 || 121;\n            const lat = (y97 / 110900);\n            const lng = lon0 + ((x97 - 250000) / (101500 * Math.cos(lat * Math.PI / 180)));\n\n            document.getElementById('powerStruct').innerHTML = `${region}區大圖 | PP:${pp} QQ:${qq} ${quad?`子圖:${quad}`:''} | ${rChar}${sChar} (100m) | ${t}${u} (10m)`;\n
