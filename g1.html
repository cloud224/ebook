500\">最佳場景:\u003c/span>\n                        \u003cspan class=\"font-semibold text-slate-700\">數據清洗, PyTorch 訓練, 向量演算 API\u003c/span>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Card 3: Rust / Go -->\n                \u003cdiv class=\"lang-card bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:border-brand-500 transition\" data-category=\"systems\">\n                    \u003cdiv class=\"flex justify-between items-start mb-3\">\n                        \u003cdiv class=\"flex items-center space-x-2\">\n                            \u003cspan class=\"text-2xl\">🦀\u003c/span>\n                            \u003cdiv>\n                                \u003ch3 class=\"font-bold text-slate-900\">Rust / Go\u003c/h3>\n                                \u003cspan class=\"text-xs font-semibold px-2 py-0.5 bg-blue-100 text-blue-800 rounded\">AI 準確度：4/5\u003c/span>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cp class=\"text-xs text-slate-600 mb-3\">編譯器檢查極為嚴格（特別是 Rust 所有權機制），讓 AI 根據編譯器報錯反覆修正後，通過編譯幾乎無 Bug。\u003c/p>\n                    \u003cdiv class=\"space-y-1 text-xs\">\n                        \u003cp class=\"text-emerald-700 font-medium\">✓ 優勢：記憶體安全，執行效能頂尖，適合寫微服務或 CLI。\u003c/p>\n                        \u003cp class=\"text-rose-600 font-medium\">✗ 缺點：語法結構嚴謹，初期 AI 來回修改編譯時間較長。\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs\">\n                        \u003cspan class=\"text-slate-500\">最佳場景:\u003c/span>\n                        \u003cspan class=\"font-semibold text-slate-700\">Tauri 桌面後端, 高效能 CLI, API 微服務\u003c/span>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Card 4: Dart (Flutter) -->\n                \u003cdiv class=\"lang-card bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:border-brand-500 transition\" data-category=\"frontend\">\n                    \u003cdiv class=\"flex justify-between items-start mb-3\">\n                        \u003cdiv class=\"flex items-center space-x-2\">\n                            \u003cspan class=\"text-2xl\">🎯\u003c/span>\n                            \u003cdiv>\n                                \u003ch3 class=\"font-bold text-slate-900\">Dart (Flutter)\u003c/h3>\n                                \u003cspan class=\"text-xs font-semibold px-2 py-0.5 bg-amber-100 text-amber-800 rounded\">AI 準確度：3.5/5\u003c/span>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cp class=\"text-xs text-slate-600 mb-3\">單一程式碼庫可同步發佈至 Windows, Mac, iOS 與 Android 四大平台。熱重載（Hot Reload）極快。\u003c/p>\n                    \u003cdiv class=\"space-y-1 text-xs\">\n                        \u003cp class=\"text-emerald-700 font-medium\">✓ 優勢：跨行動端體驗一致，原生渲染效能優異。\u003c/p>\n                        \u003cp class=\"text-rose-600 font-medium\">✗ 缺點：巢狀 UI 括號較深，AI 在修改長檔案時易對錯括號。\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs\">\n                        \u003cspan class=\"text-slate-500\">最佳場景:\u003c/span>\n                        \u003cspan class=\"font-semibold text-slate-700\">跨平台手機 App, 雙平台平板工具\u003c/span>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Card 5: C# / C++ -->\n                \u003cdiv class=\"lang-card bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:border-brand-500 transition\" data-category=\"systems\">\n                    \u003cdiv class=\"flex justify-between items-start mb-3\">\n                        \u003cdiv class=\"flex items-center space-x-2\">\n                            \u003cspan class=\"text-2xl\">⚙️\u003c/span>\n                            \u003cdiv>\n                                \u003ch3 class=\"font-bold text-slate-900\">C# / C++\u003c/h3>\n                                \u003cspan class=\"text-xs font-semibold px-2 py-0.5 bg-blue-100 text-blue-800 rounded\">AI 準確度：4/5\u003c/span>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cp class=\"text-xs text-slate-600 mb-3\">工業設備、遊戲引擎（Unity/Unreal）與底層系統標準語言，企業級物件導向結構固定。\u003c/p>\n                    \u003cdiv class=\"space-y-1 text-xs\">\n                        \u003cp class=\"text-emerald-700 font-medium\">✓ 優勢：深層硬體控制力強，適合工業自動化與圖形運算。\u003c/p>\n                        \u003cp class=\"text-rose-600 font-medium\">✗ 缺點：專案配置檔（CMake, csproj）較複雜，不適合單檔驗證。\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs\">\n                        \u003cspan class=\"text-slate-500\">最佳場景:\u003c/span>\n                        \u003cspan class=\"font-semibold text-slate-700\">工業控制、硬體驅動、遊戲引擎擴充\u003c/span>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Frameworks Comparison Table -->\n            \u003cdiv class=\"bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mt-6\">\n                \u003cdiv class=\"p-5 bg-slate-50 border-b border-slate-200\">\n                    \u003ch3 class=\"font-bold text-slate-900\">跨平台框架與交付形態評估表\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-500 mt-0.5\">依據「交付型態」與 AI 協作效率選擇最適開發框架\u003c/p>\n                \u003c/div>\n                \u003cdiv class=\"overflow-x-auto\">\n                    \u003ctable class=\"w-full text-left border-collapse text-xs\">\n                        \u003cthead>\n                            \u003ctr class=\"bg-slate-100 text-slate-700 font-semibold border-b border-slate-200\">\n                                \u003cth class=\"p-3\">軟體種類\u003c/th>\n                                \u003cth class=\"p-3\">主流框架組合\u003c/th>\n                                \u003cth class=\"p-3\">AI 協作與開發優勢\u003c/th>\n                                \u003cth class=\"p-3\">限制與取捨\u003c/th>\n                                \u003cth class=\"p-3 text-center\">推薦度\u003c/th>\n                            \u003c/tr>\n                        \u003c/thead>\n                        \u003ctbody class=\"divide-y divide-slate-200 text-slate-600\">\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-semibold text-slate-800\">1. 快速視覺與邏輯原型\u003c/td>\n                                \u003ctd class=\"p-3 text-brand-600 font-medium\">Single HTML5 + JS + Tailwind + Three.js\u003c/td>\n                                \u003ctd class=\"p-3\">零環境建置。AI 一次輸出單檔，雙擊直接看 2D/3D 畫面與切換版面/配色。\u003c/td>\n                                \u003ctd class=\"p-3\">無法直接無縫存取本機底層檔案系統，超過 1000 行需拆分。\u003c/td>\n                                \u003ctd class=\"p-3 text-center text-amber-500 font-bold\">⭐⭐⭐⭐⭐\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-semibold text-slate-800\">2. 跨平台桌面軟體 (Win+Mac)\u003c/td>\n                                \u003ctd class=\"p-3 text-brand-600 font-medium\">Electron / Tauri + React + Vite\u003c/td>\n                                \u003ctd class=\"p-3\">直接將確認好的 HTML 原型無痛升級桌面版，支援便攜版（Portable）與安裝版。\u003c/td>\n                                \u003ctd class=\"p-3\">Electron 打包體積約 100MB+；Tauri 體積小但需 Rust 環境。\u003c/td>\n                                \u003ctd class=\"p-3 text-center text-amber-500 font-bold\">⭐⭐⭐⭐⭐\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-semibold text-slate-800\">3. Python 原生桌面工具\u003c/td>\n                                \u003ctd class=\"p-3 text-brand-600 font-medium\">PyQt6 / PySide6 / CustomTkinter\u003c/td>\n                                \u003ctd class=\"p-3\">直接呼叫 Python ezdxf、OpenCV、PyTorch 等底層庫，適合重度運算。\u003c/td>\n                                \u003ctd class=\"p-3\">UI 美觀度與版面動態切換不如 Web 技術；PyInstaller 打包逾 150MB。\u003c/td>\n                                \u003ctd class=\"p-3 text-center text-amber-500 font-bold\">⭐⭐⭐⭐\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-semibold text-slate-800\">4. 本機 AI 推論與 API\u003c/td>\n                                \u003ctd class=\"p-3 text-brand-600 font-medium\">Ollama / vLLM + FastAPI + SQLite\u003c/td>\n                                \u003ctd class=\"p-3\">在 RTX 3060 12GB VRAM 上可順暢執行 7B~14B 模型，完全免費且離線。\u003c/td>\n                                \u003ctd class=\"p-3\">32B 以上模型會爆顯存 (OOM)，大型生成仍建議雲端 AI。\u003c/td>\n                                \u003ctd class=\"p-3 text-center text-amber-500 font-bold\">⭐⭐⭐⭐\u003c/td>\n                            \u003c/tr>\n                        \u003c/tbody>\n                    \u003c/table>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- ================= SECTION 3: PYTHON & AI ENV DEEP-DIVE ================= -->\n        \u003csection id=\"tab-python-env\" class=\"tab-content hidden space-y-6\">\n            \u003c!-- Section Title & Artifact Summary -->\n            \u003cdiv class=\"bg-slate-900 text-white p-6 rounded-xl shadow-md\">\n                \u003cdiv class=\"flex items-center space-x-3 mb-2\">\n                    \u003cspan class=\"text-3xl\">🐍\u003c/span>\n                    \u003ch2 class=\"text-xl font-bold\">Python 與 AI 開發環境全攻略（2026 最新規範）\u003c/h2>\n                \u003c/div>\n                \u003cp class=\"text-slate-300 text-xs md:text-sm leading-relaxed\">\n                    初學者常見的致命錯誤是將所有 AI 框架與套件直接安裝於全域環境。由於不同模型對數值庫有嚴苛要求（如舊版 ComfyUI 依賴 \u003ccode class=\"text-amber-300 bg-slate-800 px-1 rounded\">numpy&lt;2\u003c/code>，而新框架要求 NumPy 2.x），混裝必然引發「相依性地獄」。本章剖析四大操作模式、Anaconda 授權合規變革與最新 Astral uv 工具鏈。\n                \u003c/p>\n            \u003c/div>\n\n            \u003c!-- Anaconda Licensing Warning Box -->\n            \u003cdiv class=\"bg-amber-50 border-l-4 border-amber-500 p-5 rounded-r-xl shadow-sm\">\n                \u003cdiv class=\"flex items-start justify-between\">\n                    \u003cdiv>\n                        \u003ch3 class=\"font-bold text-amber-900 text-base\">⚠️ 重要法律合規警示：Anaconda 授權條款變革\u003c/h3>\n                        \u003cp class=\"text-xs text-amber-800 mt-1 leading-relaxed\">\n                            自 2024 年至 2026 年最新條款，Anaconda 預設頻道（\u003ccode class=\"bg-amber-100 px-1 text-amber-900\">repo.anaconda.com\u003c/code>）對超過 200 人（含員工與約聘）的營利、非營利或政府研究機構強制收取商業授權費（每位使用者 $50/月）。校園雖具備學術豁免，但需每年簽署學術 EULA。為規避法律風險與校園防火牆封鎖，\u003cstrong>強烈建議全面遷移至完全免費的 Miniforge 或 Astral uv\u003c/strong>。\n                        \u003c/p>\n                    \u003c/div>\n                    \u003cspan class=\"text-xs font-bold bg-amber-200 text-amber-900 px-2 py-1 rounded\">合規要求\u003c/span>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Dual Modern Solutions: Miniforge vs Astral uv -->\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n                \u003c!-- Solution 1: Miniforge -->\n                \u003cdiv class=\"bg-white p-5 rounded-xl border border-slate-200 shadow-sm\">\n                    \u003cdiv class=\"flex items-center space-x-2 mb-3\">\n                        \u003cspan class=\"text-2xl\">📦\u003c/span>\n                        \u003cdiv>\n                            \u003ch3 class=\"font-bold text-slate-900\">方案一：Miniforge (Conda + Mamba)\u003c/h3>\n                            \u003cspan class=\"text-xs text-emerald-600 font-semibold\">100% 免費 BSD-3-Clause 授權\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cp class=\"text-xs text-slate-600 mb-3\">\n                        出廠預設唯一綁定免費的 \u003ccode class=\"bg-slate-100 px-1\">conda-forge\u003c/code> 頻道，並內建以 C++ 實作的高速 \u003ccode class=\"bg-slate-100 px-1\">mamba\u003c/code> 引擎。需要安裝非 Python 系統二進制元件（如 CUDA Toolkit 11.8/12.2 或 C++ 工具鏈）時的首選。\n                    \u003c/p>\n                    \u003cdiv class=\"bg-slate-900 text-slate-200 p-3 rounded-lg text-xs font-mono\">\n                        \u003cp class=\"text-slate-400\"># 消除舊版 Anaconda 授權風險指令：\u003c/p>\n                        \u003cp>conda config --add channels conda-forge\u003c/p>\n                        \u003cp>conda config --set channel_priority strict\u003c/p>\n                        \u003cp>conda config --remove channels defaults\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Solution 2: Astral uv -->\n                \u003cdiv class=\"bg-white p-5 rounded-xl border border-slate-200 shadow-sm\">\n                    \u003cdiv class=\"flex items-center space-x-2 mb-3\">\n                        \u003cspan class=\"text-2xl\">⚡\u003c/span>\n                        \u003cdiv>\n                            \u003ch3 class=\"font-bold text-slate-900\">方案二：Astral uv (次世代極速環境管理器)\u003c/h3>\n                            \u003cspan class=\"text-xs text-brand-600 font-semibold\">Rust 撰寫，10x-100x 極速建置\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cp class=\"text-xs text-slate-600 mb-3\">\n                        完全相容傳統 \u003ccode class=\"bg-slate-100 px-1\">venv\u003c/code> 與 \u003ccode class=\"bg-slate-100 px-1\">pip\u003c/code>，內建獨立 Python 版本管理。無須手動安裝多版本 Python，執行指令即可自動下載並建置隔離環境。\n                    \u003c/p>\n                    \u003cdiv class=\"bg-slate-900 text-slate-200 p-3 rounded-lg text-xs font-mono\">\n                        \u003cp class=\"text-slate-400\"># 一行指令建立 Python 3.12 隔離環境：\u003c/p>\n                        \u003cp>uv venv .venv --python 3.12\u003c/p>\n                        \u003cp class=\"text-slate-400 mt-1\"># 安裝套件：\u003c/p>\n                        \u003cp>uv pip install torch torchvision\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Command Matrix Table -->\n            \u003cdiv class=\"bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden\">\n                \u003cdiv class=\"p-4 bg-slate-50 border-b border-slate-200\">\n                    \u003ch3 class=\"font-bold text-slate-900 text-sm\">虛擬環境全生命週期指令對照表\u003c/h3>\n                \u003c/div>\n                \u003cdiv class=\"overflow-x-auto\">\n                    \u003ctable class=\"w-full text-left border-collapse text-xs\">\n                        \u003cthead>\n                            \u003ctr class=\"bg-slate-100 text-slate-700 font-semibold border-b border-slate-200\">\n                                \u003cth class=\"p-3\">操作階段\u003c/th>\n                                \u003cth class=\"p-3\">傳統標準庫 (venv + pip)\u003c/th>\n                                \u003cth class=\"p-3\">Miniforge / Conda\u003c/th>\n                                \u003cth class=\"p-3 text-brand-600\">次世代極速工具 (Astral uv)\u003c/th>\n                            \u003c/tr>\n                        \u003c/thead>\n                        \u003ctbody class=\"divide-y divide-slate-200 text-slate-600 font-mono\">\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-sans font-semibold text-slate-800\">建立環境\u003c/td>\n                                \u003ctd class=\"p-3\">python -m venv .venv\u003c/td>\n                                \u003ctd class=\"p-3\">conda create -n ai_env\u003c/td>\n                                \u003ctd class=\"p-3 text-brand-600 font-bold\">uv venv .venv\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-sans font-semibold text-slate-800\">指定 Python 版本\u003c/td>\n                                \u003ctd class=\"p-3\">需手動安裝該版本\u003c/td>\n                                \u003ctd class=\"p-3\">conda create -n ai_env python=3.11\u003c/td>\n                                \u003ctd class=\"p-3 text-brand-600 font-bold\">uv venv --python 3.12\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-sans font-semibold text-slate-800\">啟用環境 (Win/Linux)\u003c/td>\n                                \u003ctd class=\"p-3\">.venv\\Scripts\\activate\u003c/td>\n                                \u003ctd class=\"p-3\">conda activate ai_env\u003c/td>\n                                \u003ctd class=\"p-3 text-brand-600 font-bold\">source .venv/bin/activate\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-sans font-semibold text-slate-800\">安裝套件\u003c/td>\n                                \u003ctd class=\"p-3\">pip install numpy\u003c/td>\n                                \u003ctd class=\"p-3\">conda install -c conda-forge numpy\u003c/td>\n                                \u003ctd class=\"p-3 text-brand-600 font-bold\">uv pip install numpy\u003c/td>\n                            \u003c/tr>\n                            \u003ctr class=\"hover:bg-slate-50\">\n                                \u003ctd class=\"p-3 font-sans font-semibold text-slate-800\">匯出/重現清單\u003c/td>\n                                \u003ctd class=\"p-3\">pip freeze &gt; req.txt\u003c/td>\n                                \u003ctd class=\"p-3\">conda env export &gt; env.yml\u003c/td>\n                                \u003ctd class=\"p-3 text-brand-600 font-bold\">uv pip freeze &gt; req.txt\u003c/td>\n                            \u003c/tr>\n                        \u003c/tbody>\n                    \u003c/table>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Troubleshooting Matrix Table -->\n            \u003cdiv class=\"bg-white rounded-xl border border-slate-200 shadow-sm p-5\">\n                \u003ch3 class=\"font-bold text-slate-900 text-sm mb-3\">AI 開發常見四大故障排除指南 (Troubleshooting)\u003c/h3>\n                \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 gap-4 text-xs\">\n                    \u003cdiv class=\"p-3 bg-rose-50 border border-rose-200 rounded-lg\">\n                        \u003cp class=\"font-bold text-rose-900\">故障 1：NumPy 2.0 ABI 結構破壞崩潰\u003c/p>\n                        \u003cp class=\"text-slate-600 mt-1\">報錯：\u003ccode class=\"text-rose-800\">A module compiled using NumPy 1.x cannot run in 2.0\u003c/code>\u003c/p>\n                        \u003cp class=\"text-emerald-700 font-semibold mt-2\">解法：舊模型執行 \u003ccode class=\"bg-rose-100 px-1\">pip install \"numpy&lt;2\"\u003c/code> 並重啟 Kernel；新專案升級至 NumPy 2.1+。\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"p-3 bg-amber-50 border border-amber-200 rounded-lg\">\n                        \u003cp class=\"font-bold text-amber-900\">故障 2：PowerShell 阻擋虛擬環境啟動\u003c/p>\n                        \u003cp class=\"text-slate-600 mt-1\">報錯：\u003ccode class=\"text-amber-800\">activate.ps1 因為系統上已停用指令碼執行\u003c/code>\u003c/p>\n                        \u003cp class=\"text-emerald-700 font-semibold mt-2\">解法：PowerShell 執行 \u003ccode class=\"bg-amber-100 px-1\">Set-ExecutionPolicy RemoteSigned\u003c/code> 並輸入 Y。\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"p-3 bg-blue-50 border border-blue-200 rounded-lg\">\n                        \u003cp class=\"font-bold text-blue-900\">故障 3：Windows 原生 TensorFlow GPU 失效\u003c/p>\n                        \u003cp class=\"text-slate-600 mt-1\">原因：TF 2.11+ 徹底移除 Windows 原生 CUDA 支援。\u003c/p>\n                        \u003cp class=\"text-emerald-700 font-semibold mt-2\">解法：改用 PyTorch 原生版；若需新版 TF GPU 則強制啟用 WSL2 (Ubuntu)。\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"p-3 bg-indigo-50 border border-indigo-200 rounded-lg\">\n                        \u003cp class=\"font-bold text-indigo-900\">故障 4：WSL2 下 GPU 偵測回傳空陣列 []\u003c/p>\n                        \u003cp class=\"text-slate-600 mt-1\">原因：pip 安裝之 cuDNN .so 庫路徑未掛載至 LD_LIBRARY_PATH。\u003c/p>\n                        \u003cp class=\"text-emerald-700 font-semibold mt-2\">解法：於 conda activate.d 寫入環境變數設定檔掛載 site-packages/nvidia/cudnn/lib。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- ================= SECTION 4: WORKFLOW & TOOLS ================= -->\n        \u003csection id=\"tab-workflow\" class=\"tab-content hidden space-y-6\">\n            \u003c!-- Intro Paragraph -->\n            \u003cdiv class=\"bg-white p-6 rounded-xl border border-slate-200 shadow-sm\">\n                \u003ch2 class=\"text-xl font-bold text-slate-900 mb-2\">AI 協作開發「四階段流水線」與工具鏈分工\u003c/h2>\n                \u003cp class=\"text-sm text-slate-600 leading-relaxed\">\n                    不需要重複訂閱多個封閉工具，將手頭上的 AI 服務（Claude, Gemini, Perplexity, Copilot）依照專案開發的四個階段精準分工，即可發揮最大效益並防範幻覺。\n                \u003c/p>\n            \u003c/div>\n\n            \u003c!-- 4-Phase Pipeline Grid -->\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4\">\n                \u003c!-- Phase 1 -->\n                \u003cdiv class=\"bg-white p-5 rounded-xl border-t-4 border-t-blue-500 border border-slate-200 shadow-sm\">\n                    \u003cspan class=\"text-xs font-bold text-blue-600 uppercase tracking-wider\">階段一\u003c/span>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base mt-1\">連網技術查證\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-500 mb-3\">工具：Perplexity / Gemini\u003c/p>\n                    \u003cp class=\"text-xs text-slate-600\">決定技術棧前，先連網查證最新官方 API 規範，防止 AI 憑舊記憶編造不存在的函式（幻覺）。\u003c/p>\n                \u003c/div>\n                \u003c!-- Phase 2 -->\n                \u003cdiv class=\"bg-white p-5 rounded-xl border-t-4 border-t-emerald-500 border border-slate-200 shadow-sm\">\n                    \u003cspan class=\"text-xs font-bold text-emerald-600 uppercase tracking-wider\">階段二\u003c/span>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base mt-1\">規格收斂與 HTML 原型\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-500 mb-3\">工具：Claude Web / Gemini\u003c/p>\n                    \u003cp class=\"text-xs text-slate-600\">要求 AI「先列規劃表，禁止直接寫程式」，確認後產出內建多版面與雙擊可預覽的單一 HTML 檔驗證操作手感。\u003c/p>\n                \u003c/div>\n                \u003c!-- Phase 3 -->\n                \u003cdiv class=\"bg-white p-5 rounded-xl border-t-4 border-t-purple-500 border border-slate-200 shadow-sm\">\n                    \u003cspan class=\"text-xs font-bold text-purple-600 uppercase tracking-wider\">階段三\u003c/span>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base mt-1\">多檔案工程重構\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-500 mb-3\">工具：Claude Code (CLI)\u003c/p>\n                    \u003cp class=\"text-xs text-slate-600\">轉入 Electron/React 或 Python 專案，配合根目錄 CLAUDE.md 與 TODO.md，讓 Agent 自動建檔修復。\u003c/p>\n                \u003c/div>\n                \u003c!-- Phase 4 -->\n                \u003cdiv class=\"bg-white p-5 rounded-xl border-t-4 border-t-amber-500 border border-slate-200 shadow-sm\">\n                    \u003cspan class=\"text-xs font-bold text-amber-600 uppercase tracking-wider\">階段四\u003c/span>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base mt-1\">行內補全與微調\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-500 mb-3\">工具：VS Code + Copilot / Cursor\u003c/p>\n                    \u003cp class=\"text-xs text-slate-600\">打開 VS Code 檢視模組，做小範圍參數調整、中文編碼防呆測試與 Git 版本控制提交。\u003c/p>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Code Review & Quality Assurance Ecosystem Taxonomy -->\n            \u003cdiv class=\"bg-white rounded-xl border border-slate-200 shadow-sm p-6 mt-6\">\n                \u003ch3 class=\"font-bold text-slate-900 text-lg mb-4\">AI 程式碼檢測與審查工具四大類別\u003c/h3>\n                \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-6 text-xs\">\n                    \u003c!-- Category 1 -->\n                    \u003cdiv class=\"p-4 bg-slate-50 rounded-xl border border-slate-200\">\n                        \u003cdiv class=\"flex items-center space-x-2 mb-2\">\n                            \u003cspan class=\"text-xl\">🐰\u003c/span>\n                            \u003ch4 class=\"font-bold text-slate-900 text-sm\">1. PR / 儲存庫自動審查\u003c/h4>\n                        \u003c/div>\n                        \u003cp class=\"text-slate-600 mb-2\">在 GitHub Pull Request 提交時理解多檔案 Context，自動進行程式碼審查。\u003c/p>\n                        \u003cul class=\"space-y-1 text-slate-700 font-medium\">\n                            \u003cli>• \u003cstrong>CodeRabbit\u003c/strong>：AST + LLM 結合，提供一鍵 Commit 建議。\u003c/li>\n                            \u003cli>• \u003cstrong>Greptile\u003c/strong>：全專案語意索引，擅長抓跨模組死鎖。\u003c/li>\n                            \u003cli>• \u003cstrong>GitHub Copilot Review\u003c/strong>：原生整合 PR 變更摘要。\u003c/li>\n                        \u003c/ul>\n                    \u003c/div>\n\n                    \u003c!-- Category 2 -->\n                    \u003cdiv class=\"p-4 bg-slate-50 rounded-xl border border-slate-200\">\n                        \u003cdiv class=\"flex items-center space-x-2 mb-2\">\n                            \u003cspan class=\"text-xl\">💻\u003c/span>\n                            \u003ch4 class=\"font-bold text-slate-900 text-sm\">2. IDE 編輯器即時除錯\u003c/h4>\n                        \u003c/div>\n                        \u003cp class=\"text-slate-600 mb-2\">在寫程式或本機測試時讀取終端機報錯（Stack Trace）並自動定位修改。\u003c/p>\n                        \u003cul class=\"space-y-1 text-slate-700 font-medium\">\n                            \u003cli>• \u003cstrong>Cursor (Bugbot / Agent)\u003c/strong>：一鍵讀取 Log 修復檔案。\u003c/li>\n                            \u003cli>• \u003cstrong>Qodo (CodiumAI)\u003c/strong>：邊界測試案例生成與邏輯驗證。\u003c/li>\n                            \u003cli>• \u003cstrong>Claude Code\u003c/strong>：終端機 Agent，反覆測試直到 Pass。\u003c/li>\n                        \u003c/ul>\n                    \u003c/div>\n\n                    \u003c!-- Category 3 -->\n                    \u003cdiv class=\"p-4 bg-slate-50 rounded-xl border border-slate-200\">\n                        \u003cdiv class=\"flex items-center space-x-2 mb-2\">\n                            \u003cspan class=\"text-xl\">🛡️\u003c/span>\n                            \u003ch4 class=\"font-bold text-slate-900 text-sm\">3. 資安弱點與 SAST 掃描\u003c/h4>\n                        \u003c/div>\n                        \u003cp class=\"text-slate-600 mb-2\">針對 SQL Injection、XSS、硬編碼金鑰與開源套件 CVE 漏洞進行深度掃描。\u003c/p>\n                        \u003cul class=\"space-y-1 text-slate-700 font-medium\">\n                            \u003cli>• \u003cstrong>Snyk Code\u003c/strong>：OWASP Top 10 與依賴項即時標記。\u003c/li>\n                            \u003cli>• \u003cstrong>SonarQube / SonarCloud\u003c/strong>：品質門檻 (Quality Gate)。\u003c/li>\n                            \u003cli>• \u003cstrong>CodeAnt AI\u003c/strong>：資安合規性與修復提案。\u003c/li>\n                        \u003c/ul>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- ================= SECTION 5: LOCAL AI CODE INSPECTOR SIMULATOR ================= -->\n        \u003csection id=\"tab-inspector\" class=\"tab-content hidden space-y-6\">\n            \u003c!-- Intro Card -->\n            \u003cdiv class=\"bg-gradient-to-r from-emerald-900 to-slate-900 text-white p-6 rounded-xl shadow-md\">\n                \u003cdiv class=\"flex items-center space-x-3 mb-2\">\n                    \u003cspan class=\"text-3xl\">🛡️\u003c/span>\n                    \u003cdiv>\n                        \u003ch2 class=\"text-xl font-bold\">100% 離線 AI 程式碼檢測引擎實測模擬\u003c/h2>\n                        \u003cp class=\"text-xs text-slate-300 mt-0.5\">基於 Ollama + Qwen2.5-Coder:14b 結構化 JSON 審查架構 (適用於 RTX 3060 12GB VRAM)\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n                \u003cp class=\"text-xs text-slate-300 leading-relaxed\">\n                    商業敏感原始碼禁止上傳至雲端。以下介面模擬本機 Python 工具呼叫 \u003ccode class=\"bg-slate-800 px-1 text-emerald-300 rounded\">127.0.0.1:11434\u003c/code> 的檢測流程。選擇範例檔案後點擊「執行離線 AI 檢測」，即可檢視結構化問題清單與修復建議！\n                \u003c/p>\n            \u003c/div>\n\n            \u003c!-- Benchmark Chart for Local Models -->\n            \u003cdiv class=\"bg-white p-5 rounded-xl border border-slate-200 shadow-sm\">\n                \u003cdiv class=\"flex justify-between items-center mb-3\">\n                    \u003ch3 class=\"font-bold text-slate-900 text-sm\">RTX 3060 (12GB VRAM) 本機模型效能評測\u003c/h3>\n                    \u003cspan class=\"text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold\">Qwen2.5-Coder 系列\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"chart-container\">\n                    \u003ccanvas id=\"chartLocalLLM\">\u003c/canvas>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Inspector Interactive Playground -->\n            \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-12 gap-6\">\n                \u003c!-- Left Control & Code View (7 Cols) -->\n                \u003cdiv class=\"lg:col-span-7 bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4\">\n                    \u003cdiv class=\"flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-200\">\n                        \u003cdiv class=\"flex items-center space-x-2\">\n                            \u003clabel class=\"text-xs font-bold text-slate-700\">載入範例程式碼：\u003c/label>\n                            \u003cselect id=\"sampleSelect\" onchange=\"loadSampleCode()\" class=\"text-xs border border-slate-300 rounded px-2 py-1 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500\">\n                                \u003coption value=\"sql\">範例 1：ERP 工單 SQL 注入漏洞 (Python)\u003c/option>\n                                \u003coption value=\"diecut\">範例 2：包裝刀模出血計算型別錯誤 (JS)\u003c/option>\n                                \u003coption value=\"hardcode\">範例 3：LINE Bot API 金鑰寫死 (Python)\u003c/option>\n                            \u003c/select>\n                        \u003c/div>\n                        \u003cbutton onclick=\"runLocalAnalysis()\" id=\"btnRunScan\" class=\"px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow transition flex items-center space-x-1\">\n                            \u003cspan>🔍 執行離線 AI 檢測\u003c/span>\n                        \u003c/button>\n                    \u003c/div>\n\n                    \u003c!-- Code Display Window -->\n                    \u003cdiv>\n                        \u003cdiv class=\"flex justify-between items-center bg-slate-800 text-slate-300 px-3 py-1.5 rounded-t-lg text-xs font-mono\">\n                            \u003cspan id=\"codeFileName\">erp_workorder_sync.py\u003c/span>\n                            \u003cspan class=\"text-slate-400\">UTF-8\u003c/span>\n                        \u003c/div>\n                        \u003cpre id=\"codeEditor\" class=\"bg-slate-900 text-slate-100 p-4 rounded-b-lg font-mono text-xs overflow-x-auto h-80 leading-relaxed\">\u003c/pre>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Right Findings Panel (5 Cols) -->\n                \u003cdiv class=\"lg:col-span-5 bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between\">\n                    \u003cdiv>\n                        \u003cdiv class=\"flex items-center justify-between pb-3 border-b border-slate-200 mb-3\">\n                            \u003ch3 class=\"font-bold text-slate-900 text-sm\">AI 檢測結果報告\u003c/h3>\n                            \u003cspan id=\"scanStatusBadge\" class=\"text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded\">尚未掃描\u003c/span>\n                        \u003c/div>\n\n                        \u003c!-- Severity Filter Tabs -->\n                        \u003cdiv class=\"flex space-x-2 mb-3\">\n                            \u003cbutton onclick=\"filterFindings('ALL')\" class=\"finding-tab px-2 py-1 text-xs rounded bg-slate-800 text-white font-medium\">全部\u003c/button>\n                            \u003cbutton onclick=\"filterFindings('CRITICAL')\" class=\"finding-tab px-2 py-1 text-xs rounded bg-rose-100 text-rose-800 font-medium\">CRITICAL\u003c/button>\n                            \u003cbutton onclick=\"filterFindings('WARNING')\" class=\"finding-tab px-2 py-1 text-xs rounded bg-amber-100 text-amber-800 font-medium\">WARNING\u003c/button>\n                        \u003c/div>\n\n                        \u003c!-- Findings List Container -->\n                        \u003cdiv id=\"findingsContainer\" class=\"space-y-3 overflow-y-auto max-h-80 pr-1\">\n                            \u003cp class=\"text-xs text-slate-400 text-center py-12\">請點擊上方「執行離線 AI 檢測」按鈕開始模擬分析...\u003c/p>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003c!-- JSON Schema Prompt Preview Footer -->\n                    \u003cdiv class=\"mt-4 pt-3 border-t border-slate-100 text-xs text-slate-400\">\n                        \u003cspan class=\"font-bold text-slate-600\">Ollama API 格式：\u003c/span>\n                        \u003ccode>format: AnalysisReport.model_json_schema()\u003c/code>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- ================= SECTION 6: DECISION TREE WIZARD ================= -->\n        \u003csection id=\"tab-wizard\" class=\"tab-content hidden space-y-6\">\n            \u003c!-- Intro Header -->\n            \u003cdiv class=\"bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-center max-w-2xl mx-auto\">\n                \u003cspan class=\"text-3xl\">🧮\u003c/span>\n                \u003ch2 class=\"text-xl font-bold text-slate-900 mt-2\">專案技術選型決策助手\u003c/h2>\n                \u003cp class=\"text-xs text-slate-500 mt-1\">回答 4 個核心問答，系統將即時試算並為您推薦最佳語言、框架、Python 工具鏈與 CLI 建立腳本。\u003c/p>\n            \u003c/div>\n\n            \u003c!-- Step Wizard Form Container -->\n            \u003cdiv class=\"max-w-3xl mx-auto bg-white rounded-xl border border-slate-200 shadow-md p-6\">\n                \u003c!-- Question 1 -->\n                \u003cdiv id=\"wizard-step-1\" class=\"wizard-step space-y-4\">\n                    \u003cspan class=\"text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded\">問題 1 / 4\u003c/span>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base\">專案的核心導向屬於哪一種？\u003c/h3>\n                    \u003cdiv class=\"grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs\">\n                        \u003cbutton onclick=\"selectWizardStep(1, 'visual')\" class=\"p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 text-left transition\">\n                            \u003cp class=\"font-bold text-slate-800 text-sm mb-1\">🖼️ 視覺互動與介面導向\u003c/p>\n                            \u003cp class=\"text-slate-500\">如 2D/3D 原型、排程看板、管理系統或動態儀表板。\u003c/p>\n                        \u003c/button>\n                        \u003cbutton onclick=\"selectWizardStep(1, 'computation')\" class=\"p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 text-left transition\">\n                            \u003cp class=\"font-bold text-slate-800 text-sm mb-1\">⚙️ 底層數據與運算導向\u003c/p>\n                            \u003cp class=\"text-slate-500\">如 AI 模型訓練、影像批次處理、PDF/CAD 向量解析或資料庫清洗。\u003c/p>\n                        \u003c/button>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Question 2 -->\n                \u003cdiv id=\"wizard-step-2\" class=\"wizard-step hidden space-y-4\">\n                    \u003cspan class=\"text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded\">問題 2 / 4\u003c/span>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base\">最終的交付與執行環境為何？\u003c/h3>\n                    \u003cdiv class=\"grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs\">\n                        \u003cbutton onclick=\"selectWizardStep(2, 'desktop')\" class=\"p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 text-left transition\">\n                            \u003cp class=\"font-bold text-slate-800 text-sm mb-1\">💻 跨平台桌面檔\u003c/p>\n                            \u003cp class=\"text-slate-500\">Win / Mac 免安裝便攜版或安裝檔。\u003c/p>\n                        \u003c/button>\n                        \u003cbutton onclick=\"selectWizardStep(2, 'web')\" class=\"p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 text-left transition\">\n                            \u003cp class=\"font-bold text-slate-800 text-sm mb-1\">🌐 Web 瀏覽器 / 雲端 API\u003c/p>\n                            \u003cp class=\"text-slate-500\">純網頁或微服務網址。\u003c/p>\n                        \u003c/button>\n                        \u003cbutton onclick=\"selectWizardStep(2, 'mobile')\" class=\"p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 text-left transition\">\n                            \u003cp class=\"font-bold text-slate-800 text-sm mb-1\">📱 手機雙平台\u003c/p>\n                            \u003cp class=\"text-slate-500\">iOS 與 Android App。\u003c/p>\n                        \u003c/button>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Question 3 -->\n                \u003cdiv id=\"wizard-step-3\" class=\"wizard-step hidden space-y-4\">\n                    \u003cspan class=\"text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded\">問題 3 / 4\u003c/span>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base\">是否需要在本機硬體跑離線 AI 推論？\u003c/h3>\n                    \u003cdiv class=\"grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs\">\n                        \u003cbutton onclick=\"selectWizardStep(3, 'local_ai')\" class=\"p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 text-left transition\">\n                            \u003cp class=\"font-bold text-slate-800 text-sm mb-1\">🤖 需要 (RTX 3060 12GB 本機離線)\u003c/p>\n                            \u003cp class=\"text-slate-500\">需要 Ollama + 7B/14B 模型私有化推論。\u003c/p>\n                        \u003c/button>\n                        \u003cbutton onclick=\"selectWizardStep(3, 'cloud_ai')\" class=\"p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 text-left transition\">\n                            \u003cp class=\"font-bold text-slate-800 text-sm mb-1\">☁️ 不需要 / 走雲端 API\u003c/p>\n                            \u003cp class=\"text-slate-500\">保持確定性邏輯，呼叫 OpenAI/Claude API。\u003c/p>\n                        \u003c/button>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Question 4 -->\n                \u003cdiv id=\"wizard-step-4\" class=\"wizard-step hidden space-y-4\">\n                    \u003cspan class=\"text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded\">問題 4 / 4\u003c/span>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base\">專案規模與維護預期？\u003c/h3>\n                    \u003cdiv class=\"grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs\">\n                        \u003cbutton onclick=\"selectWizardStep(4, 'small')\" class=\"p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 text-left transition\">\n                            \u003cp class=\"font-bold text-slate-800 text-sm mb-1\">⚡ 快速驗證原型 (&lt; 500 行)\u003c/p>\n                            \u003cp class=\"text-slate-500\">追求幾小時內看見結果，零環境建置。\u003c/p>\n                        \u003c/button>\n                        \u003cbutton onclick=\"selectWizardStep(4, 'large')\" class=\"p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 text-left transition\">\n                            \u003cp class=\"font-bold text-slate-800 text-sm mb-1\">🏗️ 正式專案模組化重構\u003c/p>\n                            \u003cp class=\"text-slate-500\">防止 AI「改 A 壞 B」，強型別與模組拆分。\u003c/p>\n                        \u003c/button>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Wizard Recommendation Output Block -->\n                \u003cdiv id=\"wizard-result\" class=\"hidden space-y-4\">\n                    \u003cdiv class=\"bg-gradient-to-r from-slate-900 to-brand-900 text-white p-5 rounded-xl\">\n                        \u003cspan class=\"text-xs text-brand-300 font-bold uppercase tracking-wider\">🎯 為您試算的最佳技術組合\u003c/span>\n                        \u003ch3 id=\"recTitle\" class=\"text-lg font-bold mt-1\">TypeScript + React + Electron (Astral uv 後端)\u003c/h3>\n                        \u003cp id=\"recDesc\" class=\"text-xs text-slate-300 mt-1\">適合擁有 3D/2D 視覺介面且需打包雙平台便攜版的 AI 專案。\u003c/p>\n                    \u003c/div>\n\n                    \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 gap-4 text-xs\">\n                        \u003cdiv class=\"p-3 bg-slate-50 border border-slate-200 rounded-lg\">\n                            \u003cspan class=\"font-bold text-slate-800\">推薦語言：\u003c/span>\n                            \u003cspan id=\"recLang\" class=\"text-brand-600 font-bold\">TypeScript (前端) + Python 3.12 (後端)\u003c/span>\n                        \u003c/div>\n                        \u003cdiv class=\"p-3 bg-slate-50 border border-slate-200 rounded-lg\">\n                            \u003cspan class=\"font-bold text-slate-800\">Python 環境管理：\u003c/span>\n                            \u003cspan id=\"recEnv\" class=\"text-emerald-600 font-bold\">Astral uv (--python 3.12)\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv>\n                        \u003cp class=\"text-xs font-bold text-slate-700 mb-1\">一鍵啟動指令範例：\u003c/p>\n                        \u003cpre id=\"recCommand\" class=\"bg-slate-900 text-emerald-400 p-3 rounded-lg text-xs font-mono overflow-x-auto\">\u003c/pre>\n                    \u003c/div>\n\n                    \u003cbutton onclick=\"resetWizard()\" class=\"w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition\">\n                        🔄 重新進行測試\n                    \u003c/button>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n    \u003c/main>\n\n    \u003c!-- Footer -->\n    \u003cfooter class=\"bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800 mt-12\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 text-center space-y-2\">\n            \u003cp>AI 驅動軟體開發全景指南 | 繁體中文互動報告 (2026 最新生態系版本)\u003c/p>\n            \u003cp class=\"text-slate-500\">單一 HTML 檔案架構 • Tailwind CSS • Chart.js • 無 SVG / 無 Mermaid 依賴\u003c/p>\n        \u003c/div>\n    \u003c/footer>\n\n    \u003c!-- JavaScript Application Logic -->\n    \u003cscript>\n        // --- 1. Tab Switching Logic ---\n        function switchTab(tabId) {\n            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));\n            document.querySelectorAll('.nav-btn').forEach(btn => {\n                btn.classList.remove('bg-brand-600', 'text-white');\n                btn.classList.add('text-slate-300');\n            });\n\n            const activeTab = document.getElementById(`tab-${tabId}`);\n            if (activeTab) activeTab.classList.remove('hidden');\n\n            const activeNav = document.getElementById(`nav-${tabId}`);\n            if (activeNav && tabId !== 'wizard') {\n                activeNav.classList.add('bg-brand-600', 'text-white');\n                activeNav.classList.remove('text-slate-300');\n            }\n\n            window.scrollTo({ top: 0, behavior: 'smooth' });\n        }\n\n        function toggleMobileMenu() {\n            const menu = document.getElementById('mobile-menu');\n            menu.classList.toggle('hidden');\n        }\n\n        // --- 2. Languages Filtering & Search ---\n        function filterLanguages(category) {\n            document.querySelectorAll('.lang-filter-btn').forEach(btn => {\n                btn.classList.remove('bg-brand-600', 'text-white');\n                btn.classList.add('bg-slate-100', 'text-slate-600');\n            });\n            event.target.classList.add('bg-brand-600', 'text-white');\n\n            const cards = document.querySelectorAll('.lang-card');\n            cards.forEach(card => {\n                if (category === 'all' || card.dataset.category === category) {\n                    card.classList.remove('hidden');\n                } else {\n                    card.classList.add('hidden');\n                }\n            });\n        }\n\n        function searchLanguages() {\n            const query = document.getElementById('langSearch').value.toLowerCase();\n            const cards = document.querySelectorAll('.lang-card');\n            cards.forEach(card => {\n                const text = card.innerText.toLowerCase();\n                if (text.includes(query)) {\n                    card.classList.remove('hidden');\n                } else {\n                    card.classList.add('hidden');\n                }\n            });\n        }\n\n        // --- 3. Chart.js Implementations ---\n        document.addEventListener(\"DOMContentLoaded\", function () {\n            // Chart 1: Language Corpus vs AI Accuracy (Bubble/Scatter simulated)\n            const ctxLang = document.getElementById('chartLanguagePerformance').getContext('2d');\n            new Chart(ctxLang, {\n                type: 'bubble',\n                data: {\n                    datasets: [{\n                        label: '程式語言 AI 表現',\n                        data: [\n                            { x: 95, y: 92, r: 18, lang: 'TypeScript/JS' },\n                            { x: 90, y: 88, r: 16, lang: 'Python' },\n                            { x: 65, y: 82, r: 12, lang: 'Rust' },\n                            { x: 50, y: 65, r: 10, lang: 'Dart/Flutter' },\n                            { x: 75, y: 78, r: 12, lang: 'C# / C++' }\n                        ],\n                        backgroundColor: [\n                            'rgba(37, 99, 235, 0.7)',\n                            'rgba(16, 185, 129, 0.7)',\n                            'rgba(245, 158, 11, 0.7)',\n                            'rgba(239, 68, 68, 0.7)',\n                            'rgba(139, 92, 246, 0.7)'\n                        ]\n                    }]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    plugins: {\n                        tooltip: {\n                            callbacks: {\n                                label: function (ctx) {\n                                    const raw = ctx.raw;\n                                    return `${raw.lang}: 語料規模 ${raw.x}%, AI 準確率 ${raw.y}%`;\n                                }\n                            }\n                        }\n                    },\n                    scales: {\n                        x: {\n                            title: { display: true, text: 'GitHub / 全網公開開源語料規模 (%)', font: { size: 10 } },\n                            min: 30, max: 100\n                        },\n                        y: {\n                            title: { display: true, text: 'AI 生成程式碼一次通過率 (%)', font: { size: 10 } },\n                            min: 50, max: 100\n                        }\n                    }\n                }\n            });\n\n            // Chart 2: Python Env Manager Benchmark\n            const ctxEnv = document.getElementById('chartEnvPerformance').getContext('2d');\n            new Chart(ctxEnv, {\n                type: 'bar',\n                data: {\n                    labels: ['Astral uv', 'Miniforge (Mamba)', 'Conda (Default)', 'pip + venv'],\n                    datasets: [{\n                        label: '相依性解析與安裝耗時 (秒)',\n                        data: [1.2, 8.5, 45.0, 18.2],\n                        backgroundColor: [\n                            'rgba(16, 185, 129, 0.8)',\n                            'rgba(37, 99, 235, 0.8)',\n                            'rgba(239, 68, 68, 0.8)',\n                            'rgba(245, 158, 11, 0.8)'\n                        ]\n                    }]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    plugins: { legend: { display: false } },\n                    scales: {\n                        y: { title: { display: true, text: '時間 (秒 - 越低越好)', font: { size: 10 } } }\n                    }\n                }\n            });\n\n            // Chart 3: Local LLM Performance on RTX 3060 12GB\n            const ctxLocal = document.getElementById('chartLocalLLM').getContext('2d');\n            new Chart(ctxLocal, {\n                type: 'bar',\n                data: {\n                    labels: ['qwen2.5-coder:7b', 'qwen2.5-coder:14b (推薦)', 'qwen2.5-coder:32b'],\n                    datasets: [\n                        {\n                            label: 'VRAM 佔用 (GB)',\n                            data: [4.8, 9.8, 19.5],\n                            backgroundColor: 'rgba(99, 102, 241, 0.8)'\n                        },\n                        {\n                            label: '推論速度 (tok/s)',\n                            data: [62, 32, 6],\n                            backgroundColor: 'rgba(16, 185, 129, 0.8)'\n                        }\n                    ]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    scales: {\n                        y: { title: { display: true, text: '數值 (VRAM以12GB為限)', font: { size: 10 } } }\n                    }\n                }\n            });\n\n            // Initialize Inspector Sample Code\n            loadSampleCode();\n        });\n\n        // --- 4. Inspector Playground Code & Logic ---\n        const sampleCodes = {\n            sql: {\n                fileName: \"erp_workorder_sync.py\",\n                code: `import sqlite3\\n\\ndef sync_workorder(order_id, user_input_status):\\n    # ❌ 漏洞：直接拼接 SQL 字串引發 SQL Injection\\n    conn = sqlite3.connect(\"erp_database.db\")\\n    cursor = conn.cursor()\\n    query = f\"UPDATE work_orders SET status = '{user_input_status}' WHERE id = {order_id}\"\\n    cursor.execute(query)\\n    conn.commit()\\n    print(\"工單狀態更新成功\")`,\n                findings: [\n                    {\n                        line: 7,\n                        severity: \"CRITICAL\",\n                        category: \"SECURITY\",\n                        desc: \"重大 SQL 注入漏洞 (SQL Injection)。直接將 `user_input_status` 拼接至 SQL 指令中。\",\n                        suggest: \"改用參數化查詢 (Parameterized Query)：`cursor.execute('UPDATE work_orders SET status = ? WHERE id = ?', (user_input_status, order_id))`\"\n                    },\n                    {\n                        line: 5,\n                        severity: \"WARNING\",\n                        category: \"BUG\",\n                        desc: \"資料庫連線未設定 `try...finally` 或 `with` 語境管理器，異常時可能洩漏 Handle。\",\n                        suggest: \"使用 `with sqlite3.connect(...) as conn:` 確保自動關閉連線。\"\n                    }\n                ]\n            },\n            diecut: {\n                fileName: \"prepress_diecut_validator.js\",\n                code: `function calculateBleedMargin(width, height, bleed) {\\n    // ❌ 型別錯誤與邊界問題\\n    let totalWidth = width + bleed * 2; \\n    let totalHeight = height + bleed * 2;\\n    \\n    for (let i = 0; i \u003c= 10; i++) {\\n        // 潛在迴圈溢位\\n        console.log(\"計算模組: \" + i);\\n    }\\n    return { w: totalWidth, h: totalHeight };\\n}`,\n                findings: [\n                    {\n                        line: 3,\n                        severity: \"WARNING\",\n                        category: \"BUG\",\n                        desc: \"未進行輸入型別防呆。若 `width` 為字串（如 \\\"100\\\"），加號會變成字串串接而非數值加法。\",\n                        suggest: \"加入數值轉換或型別檢查：`const w = Number(width);`\"\n                    }\n                ]\n            },\n            hardcode: {\n                fileName: \"linebot_webhook_handler.py\",\n                code: `import requests\\n\\n# ❌ 硬編碼 API Secret\\nLINE_CHANNEL_SECRET = \"sk_live_99abc881234567890ffff\"\\n\\ndef handle_event(event):\\n    headers = {\"Authorization\": f\"Bearer {LINE_CHANNEL_SECRET}\"}\\n    res = requests.post(\"https://api.line.me/v2/bot/message/reply\", headers=headers, json=event)\\n    return res.status_code`,\n                findings: [\n                    {\n                        line: 4,\n                        severity: \"CRITICAL\",\n                        category: \"SECURITY\",\n                        desc: \"敏感 API Token / Key 硬編碼於程式碼中，提交至 Git 倉庫將導致資安外洩。\",\n                        suggest: \"改由環境變數讀取：`LINE_CHANNEL_SECRET = os.getenv('LINE_CHANNEL_SECRET')`\"\n                    },\n                    {\n                        line: 8,\n                        severity: \"WARNING\",\n                        category: \"PERFORMANCE\",\n                        desc: \"HTTP 請求未設置 `timeout` 參數，若 LINE API 延遲將導致服務無期限阻塞。\",\n                        suggest: \"加入 Timeout 參數：`requests.post(..., timeout=5.0)`\"\n                    }\n                ]\n            }\n        };\n\n        let currentFindingList = [];\n\n        function loadSampleCode() {\n            const key = document.getElementById('sampleSelect').value;\n            const item = sampleCodes[key];\n            document.getElementById('codeFileName').innerText = item.fileName;\n            document.getElementById('codeEditor').innerText = item.code;\n            document.getElementById('findingsContainer').innerHTML = '\u003cp class=\"text-xs text-slate-400 text-center py-12\">請點擊上方「執行離線 AI 檢測」按鈕開始模擬分析...\u003c/p>';\n            document.getElementById('scanStatusBadge').className = \"text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded\";\n            document.getElementById('scanStatusBadge').innerText = \"已載入範例\";\n        }\n\n        function runLocalAnalysis() {\n            const key = document.getElementById('sampleSelect').value;\n            const item = sampleCodes[key];\n            currentFindingList = item.findings;\n\n            document.getElementById('scanStatusBadge').className = \"text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded\";\n            document.getElementById('scanStatusBadge').innerText = \"100% 離線 AI 檢測完成\";\n\n            renderFindings(currentFindingList);\n        }\n\n        function renderFindings(list) {\n            const container = document.getElementById('findingsContainer');\n            if (list.length === 0) {\n                container.innerHTML = '\u003cp class=\"text-xs text-emerald-600 font-bold text-center py-12\">🎉 通過！未發現任何瑕疵。\u003c/p>';\n                return;\n            }\n\n            container.innerHTML = list.map(item => `\n                \u003cdiv class=\"p-3 rounded-lg border text-xs space-y-1 ${item.severity === 'CRITICAL' ? 'bg-rose-50 border-rose-200' : 'bg-amber-50 border-amber-200'}\">\n                    \u003cdiv class=\"flex items-center justify-between\">\n                        \u003cspan class=\"font-bold px-1.5 py-0.5 rounded ${item.severity === 'CRITICAL' ? 'bg-rose-600 text-white' : 'bg-amber-600 text-white'}\">${item.severity}\u003c/span>\n                        \u003cspan class=\"font-mono text-slate-500\">第 ${item.line} 行\u003c/span>\n                    \u003c/div>\n                    \u003cp class=\"font-bold text-slate-800 mt-1\">${item.desc}\u003c/p>\n                    \u003cp class=\"text-slate-600 bg-white/70 p-2 rounded mt-1 font-mono text-[11px]\">${item.suggest}\u003c/p>\n                \u003c/div>\n            `).join('');\n        }\n\n        function filterFindings(sev) {\n            if (sev === 'ALL') {\n                renderFindings(currentFindingList);\n            } else {\n                renderFindings(currentFindingList.filter(f => f.severity === sev));\n            }\n        }\n\n        // --- 5. Wizard Logic ---\n        const wizardState = {};\n\n        function selectWizardStep(step, val) {\n            wizardState[`step${step}`] = val;\n            document.getElementById(`wizard-step-${step}`).classList.add('hidden');\n\n            if (step \u003c 4) {\n                document.getElementById(`wizard-step-${step + 1}`).classList.remove('hidden');\n            } else {\n                calculateWizardResult();\n            }\n        }\n\n        function calculateWizardResult() {\n            document.getElementById('wizard-result').classList.remove('hidden');\n\n            let title = \"TypeScript + React + Electron (Astral uv)\";\n            let desc = \"適合具備 UI 互動介面、且需打包免安裝桌面軟體的專案。兼具前端 AI 寫碼高準確率與 Python 後端演算能力。\";\n            let lang = \"TypeScript (前端) + Python 3.12 (後端)\";\n            let env = \"Astral uv (--python 3.12)\";\n            let cmd = \"# 建立極速 Python 環境與安裝依賴：\\nuv venv .venv --python 3.12\\nsource .venv/bin/activate\\nuv pip install fastapi uvicorn\\n\\n# 啟動前端開發：\\nnpm run dev\";\n\n            if (wizardState.step1 === 'computation' && wizardState.step2 !== 'mobile') {\n                title = \"Python 3.12 + FastAPI + Astral uv\";\n                desc = \"適合數據清洗、印前 CAD 向量運算與深度學習推論後端。\";\n                lang = \"Python 3.12 (Type Hints 靜態檢查)\";\n                env = \"Astral uv\";\n                cmd = \"uv venv .venv --python 3.12\\n.venv\\\\Scripts\\\\activate\\nuv pip install torch numpy pydantic\";\n            } else if (wizardState.step2 === 'mobile') {\n                title = \"Flutter (Dart) / React Native\";\n                desc = \"適合 iOS/Android 雙平台手機 App 交付。\";\n                lang = \"Dart / TypeScript\";\n                env = \"Flutter SDK / Expo\";\n                cmd = \"flutter create my_ai_app\\ncd my_ai_app\\nflutter run\";\n            }\n\n            document.getElementById('recTitle').innerText = title;\n            document.getElementById('recDesc').innerText = desc;\n            document.getElementById('recLang').innerText = lang;\n            document.getElementById('recEnv').innerText = env;\n            document.getElementById('recCommand').innerText = cmd;\n        }\n\n        function resetWizard() {\n            document.getElementById('wizard-result').classList.add('hidden');\n            document.querySelectorAll('.wizard-step').forEach((el, idx) => {\n                if (idx === 0) el.classList.remove('hidden');\n                else el.classList.add('hidden');\n            });\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>"}],"open":"embed","layout":"sidebar","scheme":"navy","sort":"custom","bundle":true}</script>
<script>(function indexRuntime(){var d=document,root=d.documentElement,D=JSON.parse(d.getElementById('ps-data').textContent),items=D.items,$=function(s){return d.querySelector(s)},K='ps-idx-'+D.id+'-';
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(K+k);localStorage.setItem(K+k,v)}catch(e){}}

  function sz(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}
  function dt(t){if(!t)return '';var x=new Date(t),p=function(n){return ('0'+n).slice(-2)};return x.getFullYear()+'/'+p(x.getMonth()+1)+'/'+p(x.getDate())}

  var EMB=location.protocol==='about:'||location.href.indexOf('about:srcdoc')===0,STATE=-1;
  var q=$('#q'),so=$('#sort'),ly=$('#lay'),sc=$('#sch'),list=$('#list'),vw=$('#viewer'),fr=$('#frame'),order=[],cur=-1,fromList=false;
  so.value=ls('sort')||D.sort||'custom';ly.value=ls('lay')||D.layout||'cards';sc.value=ls('sch')||D.scheme||'navy';
  var m=ls('m');if(m)root.setAttribute('data-m',m);
  function side(){return ly.value==='sidebar'&&innerWidth>800}
  function look(){root.setAttribute('data-s',sc.value);var c=d.body.classList;['cards','list','sidebar','magazine','table','timeline'].forEach(function(x){c.remove('lay-'+x)});c.add('lay-'+ly.value);root.style.setProperty('--hh',$('header').offsetHeight+'px')}
  function fold(x){if(x.grp!=null)return x.grp;var k=x.path.lastIndexOf('/');return k>=0?x.path.slice(0,k):''}
  function mon(t){if(!t)return '未知日期';var x=new Date(t);return x.getFullYear()+' 年 '+(x.getMonth()+1)+' 月'}
  function href(i){return D.open==='direct'&&!D.bundle&&!side()?enc(items[i].path):'#/v/'+i}
  function card(o,pre){var x=o.x;return '<a class="it'+(o.i===cur?' on':'')+'" href="'+href(o.i)+'" data-i="'+o.i+'"><i class="ini">'+esc((x.title||'?').trim().charAt(0))+'</i>'+(pre||'')+'<b>'+esc(x.title)+'</b><span class="pa">'+esc(x.path)+'</span>'+(x.snippet?'<span class="sn">'+esc(x.snippet)+'</span>':'')+'<span class="mt">'+(x.tags?esc(x.tags)+' · ':'')+sz(x.size||0)+(x.mtime?' · '+dt(x.mtime):'')+'</span></a>'}
  function render(){var k=q.value.trim().toLowerCase(),s=so.value,L=ly.value;ls('sort',s);ls('lay',L);ls('sch',sc.value);look();
    var arr=items.map(function(x,i){return {x:x,i:i}}).filter(function(o){return !k||(o.x.title+' '+o.x.path+' '+(o.x.snippet||'')+' '+(o.x.tags||'')).toLowerCase().indexOf(k)>=0});
    var tc=function(a,b){return a.x.title.localeCompare(b.x.title,'zh-Hant',{numeric:true})};
    if(L==='timeline'||s==='mtime')arr.sort(function(a,b){return (b.x.mtime||0)-(a.x.mtime||0)});
    else if(s==='size')arr.sort(function(a,b){return (b.x.size||0)-(a.x.size||0)});
    else if(s==='path')arr.sort(function(a,b){var fa=fold(a.x),fb=fold(b.x);return fa===fb?a.x.path.localeCompare(b.x.path,'zh-Hant',{numeric:true}):fa.localeCompare(fb,'zh-Hant',{numeric:true})});
    else if(s==='title')arr.sort(function(a,b){var fa=fold(a.x),fb=fold(b.x);return fa===fb?tc(a,b):fa.localeCompare(fb,'zh-Hant',{numeric:true})});
    order=arr.map(function(o){return o.i});var h='';
    if(L==='table'){h='<table class="tb"><thead><tr><th style="width:48px">#</th><th>標題</th><th>位置</th><th style="width:90px">大小</th><th style="width:110px">修改日期</th></tr></thead><tbody>';
      arr.forEach(function(o,n){var x=o.x;h+='<tr'+(o.i===cur?' class="on"':'')+'><td class="mt">'+(n+1)+'</td><td><a class="it" href="'+href(o.i)+'" data-i="'+o.i+'"><b>'+esc(x.title)+'</b></a>'+(x.snippet?'<div class="sn">'+esc(x.snippet)+'</div>':'')+'</td><td class="pa">'+esc(x.path)+'</td><td class="mt">'+sz(x.size||0)+'</td><td class="mt">'+dt(x.mtime)+'</td></tr>'});h+='</tbody></table>'}
    else if(L==='timeline'){var lg=null;arr.forEach(function(o){var g=mon(o.x.mtime);if(g!==lg){if(lg!==null)h+='</div>';h+='<h2 class="grp">🕒 '+g+'</h2><div class="tl">';lg=g}h+=card(o,'<span class="dt">'+dt(o.x.mtime)+'</span>')});if(lg!==null)h+='</div>'}
    else{var grp=s==='title'||s==='path',last=null,open=false;
      arr.forEach(function(o){var f=fold(o.x);if(grp&&f!==last){if(open)h+='</div>';if(f||last!==null)h+='<h2 class="grp">📁 '+esc(f||'（根目錄）')+'</h2>';h+='<div class="grid g-'+L+'">';open=true;last=f}else if(!open){h+='<div class="grid g-'+L+'">';open=true}h+=card(o)});if(open)h+='</div>'}
    list.innerHTML=h||'<p class="none">沒有符合的頁面</p>';$('#count').textContent=(k?arr.length+' / ':'')+items.length+' 個頁面'}
  function mark(){[].forEach.call(list.querySelectorAll('.on'),function(e){e.classList.remove('on')});var a=list.querySelector('[data-i="'+cur+'"]');if(a){(a.closest('tr')||a).classList.add('on');if(side())a.scrollIntoView({block:'nearest'})}}
  function fixHash(cd){cd.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();var id=decodeURIComponent(a.getAttribute('href').slice(1)),t=id?(cd.getElementById(id)||cd.getElementsByName(id)[0]):null;if(t)t.scrollIntoView({behavior:'smooth'});else cd.defaultView.scrollTo(0,0)},true)}
  function nf(set){var n=d.createElement('iframe');n.id='frame';n.title='內容';if(set)set(n);if(D.bundle)n.addEventListener('load',function(){try{fixHash(n.contentDocument)}catch(e){}});fr.replaceWith(n);fr=n}
  function nav(i,rep){if(EMB){STATE=i;route();return}var h=i>=0?'#/v/'+i:'';if(rep)location.replace(h||'#');else location.hash=h}
  function show(i){var x=items[i];cur=i;$('#vt').textContent=x.title;d.title=x.title+' － '+D.title;
    nf(function(n){if(D.bundle)n.srcdoc=x.html;else n.src=enc(x.path)});
    $('#nt').style.display=D.bundle?'none':'';$('#nt').href=D.bundle?'#':enc(x.path);var p=order.indexOf(i);$('#pv').disabled=p<=0;$('#nx').disabled=p<0||p>=order.length-1;$('#pos').textContent=p>=0?(p+1)+' / '+order.length:'';
    vw.hidden=false;d.body.classList.toggle('viewing',!side());mark()}
  function hide(){d.body.classList.remove('viewing');d.title=D.title;var had=cur>=0;cur=-1;mark();
    if(side()){vw.hidden=false;$('#vt').textContent='';$('#pos').textContent='';$('#nt').style.display='none';$('#pv').disabled=$('#nx').disabled=true;nf(function(n){n.srcdoc='<p style="font:16px sans-serif;color:#999;text-align:center;margin-top:30vh">← 請從左側選擇要檢視的頁面</p>'})}
    else{vw.hidden=true;if(had)nf()}}
  function route(){var i=-1;if(EMB)i=STATE;else{var mm=location.hash.match(/^#\/v\/(\d+)/);if(mm)i=+mm[1]}if(i>=0&&items[i])show(i);else hide()}
  function back(){if(EMB)return nav(-1);if(fromList){fromList=false;history.back()}else location.hash=''}
  function go(dl){var p=order.indexOf(cur)+dl;if(p>=0&&p<order.length){if(side())fromList=false;nav(order[p],true)}}
  list.addEventListener('click',function(e){var a=e.target.closest('a.it');if(a&&a.getAttribute('href').charAt(0)==='#'){e.preventDefault();var i=+a.dataset.i;if(side())nav(i,true);else{fromList=true;nav(i)}}});
  q.oninput=render;so.onchange=render;sc.onchange=render;var prevL=ly.value;ly.onchange=function(){if(prevL==='sidebar'&&ly.value!=='sidebar'){if(EMB)STATE=-1;else if(location.hash)history.replaceState(null,'',location.pathname+location.search)}prevL=ly.value;render();route()};
  $('#mbtn').onclick=function(){var c=root.getAttribute('data-m')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=c==='dark'?'light':'dark';root.setAttribute('data-m',n);ls('m',n)};
  $('#bk').onclick=back;$('#pv').onclick=function(){go(-1)};$('#nx').onclick=function(){go(1)};
  var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){look();route()},150)});
  addEventListener('hashchange',route);
  addEventListener('keydown',function(e){if(cur>=0&&e.target===d.body){if(e.key==='Escape'&&!side())back();if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)}else if(e.key==='/'&&e.target!==q){e.preventDefault();q.focus()}});
  render();route()})();</script>
