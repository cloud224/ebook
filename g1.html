cnav class=\"hidden md:flex space-x-6 text-sm font-medium text-slate-600\">\n                \u003ca href=\"#dashboard\" class=\"hover:text-amber-600 transition\">市場排名與指標\u003c/a>\n                \u003ca href=\"#explorer\" class=\"hover:text-amber-600 transition\">語言分類圖鑑\u003c/a>\n                \u003ca href=\"#comparator\" class=\"hover:text-amber-600 transition\">多維對比矩陣\u003c/a>\n                \u003ca href=\"#trends\" class=\"hover:text-amber-600 transition\">2026 AI 與技術趨勢\u003c/a>\n                \u003ca href=\"#recommender\" class=\"hover:text-amber-600 transition\">選型決策引擎\u003c/a>\n            \u003c/nav>\n            \u003ca href=\"#recommender\" class=\"bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition shadow-sm\">\n                🎯 開始選型\n            \u003c/a>\n        \u003c/div>\n    \u003c/header>\n\n    \u003cmain class=\"flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12\">\n\n        \u003csection class=\"text-center py-6 md:py-10 space-y-4\">\n            \u003cdiv class=\"inline-flex items-center space-x-2 bg-amber-50 text-amber-800 text-xs px-3 py-1 rounded-full border border-amber-200\">\n                \u003cspan class=\"font-bold\">2026 最新趨勢\u003c/span>\n                \u003cspan>TypeScript 登頂 GitHub 貢獻第一 · Java 25 LTS 效能突破 · Rust 薪資溢價最高\u003c/span>\n            \u003c/div>\n            \u003ch1 class=\"text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight\">\n                全世界程式語言全景與工程選型指南\n            \u003c/h1>\n            \u003cp class=\"max-w-3xl mx-auto text-base md:text-lg text-slate-600 leading-relaxed\">\n                本系統深入剖析全球主流與前沿程式語言的核心機制、功能分類、優缺點及市場趨勢。協助工程團隊、架構師與開發者在 AI 協作時代做出最精準的技術選型與職涯規劃。\n            \u003c/p>\n        \u003c/section>\n\n        \u003csection id=\"dashboard\" class=\"bg-white rounded-2xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-6\">\n            \u003cdiv>\n                \u003ch2 class=\"text-xl md:text-2xl font-bold text-slate-900 flex items-center space-x-2\">\n                    \u003cspan>📊\u003c/span>\n                    \u003cspan>全球市場熱度與生態權重指標\u003c/span>\n                \u003c/h2>\n                \u003cp class=\"text-sm text-slate-600 mt-1\">\n                    本區塊整合 TIOBE、GitHub Octoverse、Stack Overflow Developer Survey 與 PYPL 四大權威權重，提供動態可切換的市場全景分析。\n                \u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"grid grid-cols-2 md:grid-cols-4 gap-4\">\n                \u003cdiv class=\"bg-slate-50 border border-slate-200 rounded-xl p-4 text-center\">\n                    \u003cspan class=\"text-xs text-slate-500 font-semibold block uppercase\">TIOBE #1 霸主\u003c/span>\n                    \u003cspan class=\"text-xl md:text-2xl font-extrabold text-amber-600 mt-1 block\">Python (18.2%)\u003c/span>\n                    \u003cspan class=\"text-xs text-slate-500 mt-1 block\">AI 浪潮持續推升搜尋需求\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"bg-slate-50 border border-slate-200 rounded-xl p-4 text-center\">\n                    \u003cspan class=\"text-xs text-slate-500 font-semibold block uppercase\">GitHub 開源冠軍\u003c/span>\n                    \u003cspan class=\"text-xl md:text-2xl font-extrabold text-indigo-600 mt-1 block\">TypeScript\u003c/span>\n                    \u003cspan class=\"text-xs text-slate-500 mt-1 block\">首度超越 Python 與 JS 登頂\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"bg-slate-50 border border-slate-200 rounded-xl p-4 text-center\">\n                    \u003cspan class=\"text-xs text-slate-500 font-semibold block uppercase\">實際使用率最高\u003c/span>\n                    \u003cspan class=\"text-xl md:text-2xl font-extrabold text-emerald-600 mt-1 block\">JavaScript\u003c/span>\n                    \u003cspan class=\"text-xs text-slate-500 mt-1 block\">連續 12 年 Stack Overflow 稱霸\u003c/span>\n                \u003c/div>\n                \u003cdiv class=\"bg-slate-50 border border-slate-200 rounded-xl p-4 text-center\">\n                    \u003cspan class=\"text-xs text-slate-500 font-semibold block uppercase\">最高薪資溢價\u003c/span>\n                    \u003cspan class=\"text-xl md:text-2xl font-extrabold text-rose-600 mt-1 block\">Rust (+24%)\u003c/span>\n                    \u003cspan class=\"text-xs text-slate-500 mt-1 block\">記憶體安全與高門檻帶動高薪\u003c/span>\n                \u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"flex flex-col md:flex-row items-center justify-between gap-4 pt-2\">\n                \u003cdiv class=\"flex flex-wrap gap-2 text-xs font-semibold\">\n                    \u003cbutton onclick=\"updateMarketChart('tiobe')\" id=\"btn-tiobe\" class=\"px-3 py-1.5 rounded-lg bg-amber-600 text-white transition\">TIOBE 搜尋熱度\u003c/button>\n                    \u003cbutton onclick=\"updateMarketChart('github')\" id=\"btn-github\" class=\"px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition\">GitHub 貢獻活躍度\u003c/button>\n                    \u003cbutton onclick=\"updateMarketChart('stackoverflow')\" id=\"btn-stackoverflow\" class=\"px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition\">Stack Overflow 使用率\u003c/button>\n                    \u003cbutton onclick=\"updateMarketChart('salary')\" id=\"btn-salary\" class=\"px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition\">全球相對薪資指數\u003c/button>\n                \u003c/div>\n                \u003cspan id=\"chart-desc\" class=\"text-xs text-slate-500 italic\">目前顯示：TIOBE 2026 搜尋索引排名數據\u003c/span>\n            \u003c/div>\n\n            \u003cdiv class=\"chart-container\">\n                \u003ccanvas id=\"marketChart\">\u003c/canvas>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"explorer\" class=\"space-y-6\">\n            \u003cdiv class=\"flex flex-col md:flex-row md:items-end justify-between gap-4\">\n                \u003cdi 00 whitespace-nowrap\">AI & 資料科學\u003c/button>\n                \u003cbutton onclick=\"setCategoryTab('web')\" id=\"cat-web\" class=\"px-4 py-2 rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-amber-600 whitespace-nowrap\">Web全端 & 行動端\u003c/button>\n                \u003cbutton onclick=\"setCategoryTab('system')\" id=\"cat-system\" class=\"px-4 py-2 rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-amber-600 whitespace-nowrap\">系統底層 & 高效能\u003c/button>\n                \u003cbutton onclick=\"setCategoryTab('enterprise')\" id=\"cat-enterprise\" class=\"px-4 py-2 rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-amber-600 whitespace-nowrap\">企業級後端 & 雲端\u003c/button>\n                \u003cbutton onclick=\"setCategoryTab('functional')\" id=\"cat-functional\" class=\"px-4 py-2 rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-amber-600 whitespace-nowrap\">函數式 & 新興範式\u003c/button>\n                \u003cbutton onclick=\"setCategoryTab('scripting')\" id=\"cat-scripting\" class=\"px-4 py-2 rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-amber-600 whitespace-nowrap\">腳本、資料庫 & DevOps\u003c/button>\n            \u003c/div>\n\n            \u003cdiv id=\"languageGrid\" class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6\">\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"comparator\" class=\"bg-slate-900 text-white rounded-2xl p-6 md:p-8 shadow-xl space-y-6\">\n            \u003cdiv>\n                \u003cdiv class=\"flex items-center justify-between\">\n                    \u003ch2 class=\"text-xl md:text-2xl font-bold flex items-center space-x-2 text-white\">\n                        \u003cspan>⚡\u003c/span>\n                        \u003cspan>多維度語言動態雷達對比儀\u003c/span>\n                    \u003c/h2>\n                    \u003cspan class=\"text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full\">最多選擇 3 種語言\u003c/span>\n                \u003c/div>\n                \u003cp class=\"text-sm text-slate-300 mt-1\">\n                    勾選下方語言，即可即時生成「執行效能」、「型別/記憶體安全」、「生態系成熟度」、「AI 協作契合度」與「學習/開發效率」五維雷達圖及規格表對比。\n                \u003c/p>\n            \u003c/div>\n\n            \u003cdiv id=\"comparatorCheckboxes\" class=\"flex flex-wrap gap-2 bg-slate-800/80 p-4 rounded-xl border border-slate-700 max-h-36 overflow-y-auto\">\n            \u003c/div>\n\n            \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-12 gap-6 items-center\">\n                \u003cdiv class=\"lg:col-span-6 flex justify-center\">\n                    \u003cdiv class=\"chart-container\" style=\"max-width: 480px;\">\n                        \u003ccanvas id=\"radarChart\">\u003c/canvas>\n                    \u003c/div>\n                \u003c/div>\n                \u003cdiv class=\"lg:col-span-6 overflow-x-auto\">\n                    \u003ctable class=\"w-full text-xs md:text-sm text-left text-slate-300 border-collapse\">\n                        \u003cthead>\n                            \u003ctr class=\"border-b border-slate-700 text-slate-400\">\n                                \u003cth class=\"py-2 px-3\">屬性指標\u003c/th>\n                                \u003cth id=\"comp-head-1\" class=\"py-2 px-3 text-amber-400 font-bold\">-\u003c/th>\n                                \u003cth id=\"comp-head-2\" class=\"py-2 px-3 text-indigo-400 font-bold\">-\u003c/th>\n                                \u003cth id=\"comp-head-3\" class=\"py-2 px-3 text-emerald-400 font-bold\">-\u003c/th>\n                            \u003c/tr>\n                        \u003c/thead>\n                        \u003ctbody id=\"comparisonTableBody\" class=\"divide-y divide-slate-800\">\n                        \u003c/tbody>\n                    \u003c/table>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"trends\" class=\"bg-white rounded-2xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-6\">\n            \u003cdiv>\n                \u003ch2 class=\"text-xl md:text-2xl font-bold text-slate-900 flex items-center space-x-2\">\n                    \u003cspan>🚀\u003c/span>\n                    \u003cspan>2026 AI 時代程式語言結構性演進趨勢\u003c/span>\n                \u003c/h2>\n                \u003cp class=\"text-sm text-slate-600 mt-1\">\n                    AI 輔助編碼工具已深入 73% 以上工程團隊，這對程式語言的選型哲學帶來了前所未有的根本改變。\n                \u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-6\">\n                \u003cdiv class=\"bg-slate-50 border border-slate-200 p-5 rounded-xl space-y-3\">\n                    \u003cdiv class=\"w-10 h-10 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-lg\">🛡️\u003c/div>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base\">「靜態型別溢價」爆發\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-600 leading-relaxed\">\n                        當 AI 輔助生成大量程式碼時，TypeScript、Rust 與 Go 的嚴格型別檢查機制成了最有效率的防錯第一道防線，顯著降低生成程式碼的邏輯漏洞。\n                    \u003c/p>\n                    \u003cdiv class=\"text-xs font-semibold text-indigo-600 pt-1\">關鍵語言：TypeScript, Rust, Go, C#\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"bg-slate-50 border border-slate-200 p-5 rounded-xl space-y-3\">\n                    \u003cdiv class=\"w-10 h-10 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold text-lg\">⚙️\u003c/div>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base\">記憶體安全規範與升級\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-600 leading-relaxed\">\n                        各國政府與大型企業將記憶體安全升至合規層級。C++26 導入「契約式設計」與「靜態反射」以強化安全性，而 Rust 則加速滲透至系統與基礎架構核心。\n                    \u003c/p>\n                    \u003cdiv class=\"text-xs font-semibold text-amber-600 pt-1\">關鍵語言：Rust, C++26, Zig\u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"bg-slate-50 border border-slate-200 p-5 rounded-xl space-y-3\">\n                    \u003cdiv class=\"w-10 h-10 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-lg\">☕\u003c/div>\n                    \u003ch3 class=\"font-bold text-slate-900 text-base\"> Java 25 LTS 雲端高併發革命\u003c/h3>\n                    \u003cp class=\"text-xs text-slate-600 leading-relaxed\">\n                        最新的 Java 25 LTS 透過「精簡物件標頭」減少 22% 記憶體負擔，結合 Scoped Values 與虛擬執行緒，大幅超越傳統微服務的並發處理效能。\n                    \u003c/p>\n                    \u003cdiv class=\"text-xs font-semibold text-emerald-600 pt-1\">關鍵語言：Java 25, Kotlin, Go\u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"recommender\" class=\"bg-gradient-to-br from-amber-500/10 via-indigo-500/5 to-slate-100 rounded-2xl p-6 md:p-8 border border-amber-200/60 shadow-sm space-y-6\">\n            \u003cdiv>\n                \u003ch2 class=\"text-xl md:text-2xl font-bold text-slate-900 flex items-center space-x-2\">\n                    \u003cspan>🎯\u003c/span>\n                    \u003cspan>互動式技術選型與學習路徑決策引擎\u003c/span>\n                \u003c/h2>\n                \u003cp class=\"text-sm text-slate-600 mt-1\">\n                    回答 3 個簡單問題，系統將為您推薦最適合的程式語言組合與策略建議。\n                \u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"bg-white rounded-xl p-6 border border-slate-200 shadow-xs space-y-6\">\n                \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-4\">\n                    \u003cdiv>\n                        \u003clabel class=\"block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2\">1. 主要開發領域 / 目標\u003c/label>\n                        \u003cselect id=\"recDomain\" class=\"w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-amber-500\">\n                            \u003coption value=\"ai\">AI 應用與數據分析\u003c/option>\n rtObj.data.labels = ['TypeScript', 'Python', 'JavaScript', 'Java', 'C++', 'Go', 'C#', 'Rust', 'Kotlin'];\n                marketChartObj.data.datasets[0].data = [98, 95, 92, 78, 72, 68, 65, 58, 48];\n                marketChartObj.data.datasets[0].backgroundColor = '#4f46e5';\n            } else if (type === 'stackoverflow') {\n                btnSo.className = 'px-3 py-1.5 rounded-lg bg-emerald-600 text-white transition';\n                desc.innerText = '目前顯示：Stack Overflow Developer Survey 實際使用率 (%)';\n                marketChartObj.data.labels = ['JavaScript', 'SQL', 'Python', 'TypeScript', 'Java', 'C#', 'C++', 'Go', 'Rust'];\n                marketChartObj.data.datasets[0].data = [62.3, 48.7, 51.2, 38.5, 30.5, 27.1, 22.4, 15.6, 14.2];\n                marketChartObj.data.datasets[0].backgroundColor = '#059669';\n            } else if (type === 'salary') {\n                btnSalary.className = 'px-3 py-1.5 rounded-lg bg-rose-600 text-white transition';\n                desc.innerText = '目前顯示：全球工程師平均薪資溢價指數 (以 Rust 100 為基準)';\n                marketChartObj.data.labels = ['Rust', 'Elixir', 'Mojo', 'Go', 'C++', 'Swift', 'TypeScript', 'Java', 'Python'];\n                marketChartObj.data.datasets[0].data = [100, 96, 95, 92, 90, 88, 88, 84, 82];\n                marketChartObj.data.datasets[0].backgroundColor = '#e11d48';\n            }\n            marketChartObj.update();\n        }\n\n        function renderLanguageCards(items) {\n            const grid = document.getElementById('languageGrid');\n            grid.innerHTML = '';\n\n            items.forEach(lang => {\n                const isSelected = selectedForComp.includes(lang.id);\n                const card = document.createElement('div');\n                card.className = 'bg-white rounded-xl p-5 border border-slate-200 shadow-xs hover:shadow-md transition flex flex-col justify-between space-y-4';\n                \n                let prosList = lang.pros.map(p => `\u003cli class=\"flex items-start space-x-1.5\">\u003cspan class=\"text-emerald-500 font-bold\">✓\u003c/span>\u003cspan>${p}\u003c/span>\u003c/li>`).join('');\n                let consList = lang.cons.map(c => `\u003cli class=\"flex items-start space-x-1.5\">\u003cspan class=\"text-rose-500 font-bold\">✕\u003c/span>\u003cspan>${c}\u003c/span>\u003c/li>`).join('');\n\n                card.innerHTML = `\n                    \u003cdiv class=\"space-y-3\">\n                        \u003cdiv class=\"flex items-start justify-between\">\n                            \u003cdiv>\n                                \u003cspan class=\"text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200\">${lang.categoryName}\u003c/span>\n                                \u003ch3 class=\"text-xl font-bold text-slate-900 mt-1\">${lang.name}\u003c/h3>\n                            \u003c/div>\n                            \u003cbutton onclick=\"toggleCompSelection('${lang.id}')\" class=\"text-xs px-2.5 py-1 rounded-lg border font-semibold transition ${isSelected ? 'bg-amber-600 text-white border-amber-600' : 'bg-slate-50 text-slate-600 border-slate-300 hover:bg-slate-100'}\">\n                                ${isSelected ? '✓ 已加入對比' : '+ 加入對比'}\n                            \u003c/button>\n                        \u003c/div>\n\n                        \u003cdiv class=\"flex flex-wrap gap-1.5 text-xs text-slate-500\">\n                            \u003cspan class=\"bg-slate-50 px-2 py-0.5 rounded border border-slate-200\">${lang.paradigm}\u003c/span>\n                            \u003cspan class=\"bg-slate-50 px-2 py-0.5 rounded border border-slate-200\">${lang.memory}\u003c/span>\n                        \u003c/div>\n\n                        \u003cdiv class=\"space-y-2 pt-2 border-t border-slate-100 text-xs\">\n                            \u003cdiv class=\"font-bold text-slate-700\">核心優勢：\u003c/div>\n                            \u003cul class=\"space-y-1 text-slate-600\">${prosList}\u003c/ul>\n                            \u003cdiv class=\"font-bold text-slate-700 pt-1\">主要短板：\u003c/div>\n                            \u003cul class=\"space-y-1 text-slate-600\">${consList}\u003c/ul>\n                        \u003c/div>\n                    \u003c/div>\n\n                    \u003cdiv class=\"pt-3 border-t border-slate-100 space-y-2\">\n                        \u003cdiv class=\"text-xs text-slate-500\">\n                            \u003cspan class=\"font-semibold text-slate-700\">典型應用：\u003c/span> ${lang.useCases.join(' · ')}\n                        \u003c/div>\n                        \u003cdiv class=\"grid grid-cols-3 gap-1 text-center pt-1 text-xs\">\n                            \u003cdiv class=\"bg-slate-50 p-1.5 rounded border border-slate-100\">\n                                \u003cspan class=\"text-slate-400 block text-[10px]\">效能分數\u003c/span>\n                                \u003cspan class=\"font-bold text-slate-800\">${lang.performance}\u003c/span>\n                            \u003c/div>\n                            \u003cdiv class=\"bg-slate-50 p-1.5 rounded border border-slate-100\">\n                                \u003cspan class=\"text-slate-400 block text-[10px]\">AI 協作度\u003c/span>\n                                \u003cspan class=\"font-bold text-amber-600\">${lang.aiSynergy}\u003c/span>\n                            \u003c/div>\n                            \u003cdiv class=\"bg-slate-50 p-1.5 rounded border border-slate-100\">\n                                \u003cspan class=\"text-slate-400 block text-[10px]\">薪資指數\u003c/span>\n                                \u003cspan class=\"font-bold text-indigo-600\">${lang.salary}\u003c/span>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                `;\n                grid.appendChild(card);\n            });\n        }\n\n        let currentCategory = 'all';\n\n        function setCategoryTab(cat) {\n            currentCategory = cat;\n            const tabs = ['all', 'ai', 'web', 'system', 'enterprise', 'functional', 'scripting'];\n            tabs.forEach(t => {\n                const el = document.getElementById(`cat-${t}`);\n                if (t === cat) {\n                    el.className = 'px-4 py-2 rounded-t-lg border-b-2 border-amber-600 text-amber-600 whitespace-nowrap font-bold';\n                } else {\n                    el.className = 'px-4 py-2 rounded-t-lg border-b-2 border-transparent text-slate-600 hover:text-amber-600 whitespace-nowrap';\n                }\n            });\n            filterLanguages();\n        }\n\n        function filterLanguages() {\n            const search = document.getElementById('searchInput').value.toLowerCase();\n            const paradigm = document.getElementById('paradigmFilter').value;\n\n            const filtered = languageData.filter(item => {\n                const matchCat = (currentCategory === 'all') || (item.category === currentCategory);\n                const matchSearch = item.name.toLowerCase().includes(search) || \n                                    item.useCases.some(u => u.toLowerCase().includes(search)) ||\n                                    item.categoryName.toLowerCase().includes(search);\n                \n                let matchParadigm = true;\n                if (paradigm === '靜態強型別') matchParadigm = item.paradigm.includes('靜態強型別');\n                if (paradigm === '動態弱型別') matchParadigm = item.paradigm.includes('動態');\n                if (paradigm === '記憶體安全/無GC') matchParadigm = item.memory.includes('無GC');\n                if (paradigm === 'GC垃圾回收') matchParadigm = item.memory.includes('GC');\n\n                return matchCat && matchSearch && matchParadigm;\n            });\n\n            renderLanguageCards(filtered);\n        }\n\n        function initComparatorCheckboxes() {\n            const container = document.getElementById('comparatorCheckboxes');\n            container.innerHTML = '';\n\n            languageData.forEach(lang => {\n                const checked = selectedForComp.includes(lang.id);\n                const label = document.createElement('label');\n                label.className = `inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold cursor-pointer transition ${checked ? 'bg-amber-500/20 text-amber-300 border-amber-500/50' : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'}`;\n                label.innerHTML = `\n                    \u003cinput type=\"checkbox\" value=\"${lang.id}\" ${checked ? 'checked' : ''} onchange=\"handleCompCheckbox(this)\" class=\"hidden\">\n                    \u003cspan>${lang.name}\u003c/span>\n                `;\n                container.appendChild(label);\n            });\n        }\n\n        function handleCompCheckbox(cb) {\n            const val = cb.value;\n            if (cb.checked) {\n                if (selectedForComp.length >= 3) {\n                    alert('最多只能同時對比 3 種程式語言！');\n                    cb.checked = false;\n                    return;\n                }\n                selectedForComp.push(val);\n            } else {\n                selectedForComp = selectedForComp.filter(id => id !== val);\n            }\n            updateComparatorUI();\n            filterLanguages();\n        }\n\n        function toggleCompSelection(id) {\n            if (selectedForComp.includes(id)) {\n                selectedForComp = selectedForComp.filter(i => i !== id);\n            } else {\n                if (selectedForComp.length >= 3) {\n                    alert('最多只能同時對比 3 種程式語言！');\n                    return;\n                }\n                selectedForComp.push(id);\n            }\n            updateComparatorUI();\n            filterLanguages();\n        }\n\n        function updateComparatorUI() {\n            initComparatorCheckboxes();\n\n            const selectedObjs = selectedForComp.map(id => languageData.find(l => l.id === id)).filter(Boolean);\n\n            const colors = [\n                { border: '#f59e0b', bg: 'rgba(245, 158, 11, 0.2)' },\n                { border: '#818cf8', bg: 'rgba(129, 140, 248, 0.2)' },\n                { border: '#34d399', bg: 'rgba(52, 211, 153, 0.2)' }\n            ];\n\n            const radarDatasets = selectedObjs.map((obj, index) => ({\n                label: obj.name,\n                data: [obj.performance, obj.typeSafety, obj.ecosystem, obj.aiSynergy, obj.productivity],\n                borderColor: colors[index].border,\n                backgroundColor: colors[index].bg,\n                borderWidth: 2,\n                pointBackgroundColor: colors[index].border\n            }));\n\n            if (radarChartObj) {\n                radarChartObj.data.datasets = radarDatasets;\n                radarChartObj.update();\n            } else {\n                const ctx = document.getElementById('radarChart').getContext('2d');\n                radarChartObj = new Chart(ctx, {\n                    type: 'radar',\n                    data: {\n                        labels: ['執行效能', '型別/記憶體安全', '生態系成熟度', 'AI 協作契合度', '開發效率'],\n                        datasets: radarDatasets\n                    },\n                    options: {\n                        responsive: true,\n                        maintainAspectRatio: false,\n                        scales: {\n                            r: {\n                                angleLines: { color: 'rgba(255, 255, 255, 0.1)' },\n                                grid: { color: 'rgba(255, 255, 255, 0.1)' },\n                                pointLabels: { color: '#94a3b8', font: { size: 11 } },\n                                ticks: { display: false, backdropColor: 'transparent' },\n                                min: 0,\n                                max: 100\n                            }\n                        },\n                        plugins: {\n                            legend: {\n                                labels: { color: '#f8fafc', font: { size: 12 } }\n                            }\n                        }\n                    }\n                });\n            }\n\n            for (let i = 1; i \u003c= 3; i++) {\n                const head = document.getElementById(`comp-head-${i}`);\n                if (selectedObjs[i - 1]) {\n                    head.innerText = selectedObjs[i - 1].name;\n                } else {\n                    head.innerText = '-';\n                }\n            }\n\n            const tbody = document.getElementById('comparisonTableBody');\n            tbody.innerHTML = '';\n\n            const metrics = [\n                { key: 'categoryName', label: '功能類別' },\n                { key: 'paradigm', label: '編程範式' },\n                { key: 'memory', label: '記憶體機制' },\n                { key: 'performance', label: '執行效能 (0-100)' },\n                { key: 'aiSynergy', label: 'AI 協作契合度' },\n                { key: 'salary', label: '薪資溢價指數' }\n            ];\n\n            metrics.forEach(m => {\n                const tr = document.createElement('tr');\n                tr.className = 'hover:bg-slate-800/50';\n                \n                let tdHtml = `\u003ctd class=\"py-2.5 px-3 font-semibold text-slate-400\">${m.label}\u003c/td>`;\n                for (let i = 0; i \u003c 3; i++) {\n                    if (selectedObjs[i]) {\n                        tdHtml += `\u003ctd class=\"py-2.5 px-3 text-slate-200\">${selectedObjs[i][m.key]}\u003c/td>`;\n                    } else {\n                        tdHtml += `\u003ctd class=\"py-2.5 px-3 text-slate-600\">-\u003c/td>`;\n                    }\n                }\n                tr.innerHTML = tdHtml;\n                tbody.appendChild(tr);\n            });\n        }\n\n        function generateRecommendation() {\n            const domain = document.getElementById('recDomain').value;\n            const priority = document.getElementById('recPriority').value;\n            const level = document.getElementById('recLevel').value;\n            const resultDiv = document.getElementById('recResult');\n\n            let recommendedStack = [];\n            let rationale = '';\n\n            if (domain === 'ai') {\n                recommendedStack = ['Python', 'Mojo', 'SQL'];\n                rationale = 'AI 與數據分析領域首選 Python 打造模型與 PyTorch 管道，搭配 SQL 進行巨量資料抽取。高算力優化場景可引入 Mojo 或 C++。';\n            } else if (domain === 'web') {\n                recommendedStack = ['TypeScript', 'SQL', 'Python/Go'];\n                rationale = '現代全端 SaaS 首選 TypeScript，達到前後端靜態型別統一與高 AI 協作防錯。後端 API 可選 Go 或 Python (FastAPI)。';\n            } else if (domain === 'backend') {\n                if (priority === 'safety' || priority === 'performance') {\n                    recommendedStack = ['Rust', 'Go', 'Java 25 LTS'];\n                    rationale = '追求極致安全性與微服務吞吐量，選用 Rust 與 Go；傳統大型企業後端建議升級至 Java 25 LTS 享用虛擬執行緒紅利。';\n                } else {\n                    recommendedStack = ['Java 25 LTS', 'Go', 'C#'];\n                    rationale = '兼顧人才庫成熟度與系統穩定性，Java 25 與 Go 為雲端原生架構最佳基石。';\n                }\n            } else if (domain === 'system') {\n                recommendedStack = ['Rust', 'C++26', 'Zig'];\n                rationale = '底層系統、驅動程式與遊戲引擎極度依賴資源控制。首選 Rust 保障記憶體安全，關鍵算力模組可搭配 C++26 或 Zig。';\n            } else if (domain === 'mobile') {\n                recommendedStack = ['TypeScript (React Native)', 'Kotlin', 'Swift'];\n                rationale = '跨平台快速驗證首選 TypeScript，若追求 Apple/Android 生態系極致體驗則選擇 Swift 與 Kotlin 原生開發。';\n            }\n\n            resultDiv.className = 'bg-slate-50 border border-amber-200 rounded-xl p-5 space-y-3';\n            resultDiv.innerHTML = `\n                \u003cdiv class=\"flex items-center space-x-2 text-amber-800 font-bold text-base\">\n                    \u003cspan>💡\u003c/span>\n                    \u003cspan>專屬選型推薦組合：${recommendedStack.join(' + ')}\u003c/span>\n                \u003c/div>\n                \u003cp class=\"text-xs md:text-sm text-slate-700 leading-relaxed\">${rationale}\u003c/p>\n                \u003cdiv class=\"pt-2 flex flex-wrap gap-2 text-xs\">\n                    \u003cspan class=\"bg-amber-100 text-amber-900 px-2.5 py-1 rounded font-semibold\">目標領域：${domain.toUpperCase()}\u003c/span>\n                    \u003cspan class=\"bg-indigo-100 text-indigo-900 px-2.5 py-1 rounded font-semibold\">優先考量：${priority}\u003c/span>\n                    \u003cspan class=\"bg-slate-200 text-slate-800 px-2.5 py-1 rounded font-semibold\">工程階層：${level}\u003c/span>\n                \u003c/div>\n            `;\n        }\n\n        window.addEventListener('DOMContentLoaded', () => {\n            initMarketChart();\n            renderLanguageCards(languageData);\n            updateComparatorUI();\n        });\n    \u003c/script>\n\u003c/body>\n\u003c/html>"},{"title":"AI 工具矩陣與頂級實戰全書 | AI Arsenal Playbook","path":"最新AI免費資源指南/AI 工具矩陣與全場景實戰手冊.html","snippet":"AI AIArsenal 全球工具指南 工具定位 四大工作流 三秒決策 實戰 Prompt 點數防坑 Claude Projects 🖨️ 列印 / 儲存 PDF 全套軟體與 AI 點數最佳化 AI 工具矩陣與全場景實…","size":38377,"mtime":1793454844402,"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-TW\" class=\"scroll-smooth\">\n\u003chead>\n    \u003cmeta charset=\"utf-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>AI 工具矩陣與頂級實戰全書 | AI Arsenal Playbook\u003c/title>\n    \u003c!-- Tailwind CSS CDN -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003cscript>\n        tailwind.config = {\n            theme: {\n                extend: {\n                    colors: {\n                        brand: {\n                            50: '#f0f7ff',\n                            100: '#e0effe',\n                            500: '#2563eb',\n                            600: '#1d4ed8',\n                            700: '#1e40af',\n                            900: '#0f172a',\n                        },\n                        warmbg: '#f8fafc',\n                    }\n                }\n            }\n        }\n    \u003c/script>\n    \u003cstyle>\n        /* Embedded minimal custom styling for precise UX */\n        body {\n            background-color: #f8fafc;\n            color: #1e293b;\n            font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, \"Noto Sans TC\", sans-serif;\n        }\n        .tab-active {\n            border-bottom: 3px solid #2563eb;\n            color: #2563eb;\n            font-weight: 700;\n        }\n        .code-scroll::-webkit-scrollbar {\n            height: 6px;\n        }\n        .code-scroll::-webkit-scrollbar-thumb {\n            background: #475569;\n            border-radius: 4px;\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"antialiased min-h-screen flex flex-col\">\n\n    \u003c!-- Chosen Palette: Neutral Slate & Indigo / Warm Accent -->\n    \u003c!-- Application Structure Plan: \n        Designed as an all-in-one Interactive AI Knowledge Dashboard.\n        1. Top Hero & Global Navigation Header.\n        2. Interactive Tool Selector / Quick Matrix Filter.\n        3. 4 Master Workflows with step-by-step interactive tabs.\n        4. 3-Second Decision Engine (Quick Tool Finder & Comparative Matrix).\n        5. Detailed Real-World Prompt Library with 1-Click Copy functions.\n        6. Credit Allocation & Quota Optimization Guide.\n        7. Claude Pro Projects Step-by-Step Masterclass with copyable Markdown template.\n        Rationale: Empowers the user to quickly query, copy prompts, and understand workflow synergies without endless scrolling.\n    -->\n    \u003c!-- Visualization & Content Choices: \n        - Matrix Layouts: Structured Tailwind Grid & Flex containers for comparing Claude vs Gemini vs Copilot.\n        - Copy Buttons: JS event handling to copy prompt templates directly to clipboard.\n        - Dynamic Tab View: Switch between Workflows and Decision Guides seamlessly.\n        - NO SVG graphics used (using clean unicode icons and styled text badges).\n        - NO Mermaid JS used.\n    -->\n    \u003c!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->\n\n    \u003c!-- Top Navigation Header -->\n    \u003cheader class=\"sticky top-0 z-50 bg-slate-900 text-white shadow-md border-b border-slate-800\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between\">\n            \u003cdiv class=\"flex items-center space-x-3\">\n                \u003cspan class=\"bg-blue-600 text-white font-bold px-2.5 py-1 rounded-md text-sm\">AI\u003c/span>\n                \u003cspan class=\"font-bold text-lg tracking-tight\">AIArsenal 全球工具指南\u003c/span>\n            \u003c/div>\n            \u003cnav class=\"hidden md:flex space-x-6 text-sm font-medium\">\n                \u003ca href=\"#matrix\" class=\"hover:text-blue-400 transition\">工具定位\u003c/a>\n                \u003ca href=\"#workflows\" class=\"hover:text-blue-400 transition\">四大工作流\u003c/a>\n                \u003ca href=\"#decision\" class=\"hover:text-blue-400 transition\">三秒決策\u003c/a>\n                \u003ca href=\"#prompts\" class=\"hover:text-blue-400 transition\">實戰 Prompt\u003c/a>\n                \u003ca href=\"#quotas\" class=\"hover:text-blue-400 transition\">點數防坑\u003c/a>\n                \u003ca href=\"#projects\" class=\"hover:text-blue-400 transition\">Claude Projects\u003c/a>\n            \u003c/nav>\n            \u003cbutton onclick=\"window.print()\" class=\"bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg border border-slate-700 font-medium transition\">\n                🖨️ 列印 / 儲存 PDF\n            \u003c/button>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- Main Content Container -->\n    \u003cmain class=\"flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12\">\n\n        \u003c!-- Banner / Hero Section -->\n        \u003csection class=\"bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white rounded-2xl p-8 shadow-xl border border-slate-800\">\n            \u003cdiv class=\"max-w-3xl\">\n                \u003cspan class=\"inline-block bg-blue-500/20 text-blue-300 text-xs font-semibold px-3 py-1 rounded-full border border-blue-400/30 mb-3\">全套軟體與 AI 點數最佳化\u003c/span>\n                \u003ch1 class=\"text-3xl sm:text-4xl font-extrabold tracking-tight mb-3\">AI 工具矩陣與全場景實戰手冊\u003c/h1>\n                \u003cp class=\"text-slate-300 text-base leading-relaxed\">\n                    整合 Claude Pro、Gemini Pro、Perplexity Pro、M365 Copilot、Adobe CC Pro (4,000點)、GitHub Education、Colab 與 Suno 的完美協同方案。\n                \u003c/p>\n                \u003cdiv class=\"mt-6 flex flex-wrap gap-2\">\n                    \u003cspan class=\"bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-md border border-slate-700\">Claude Pro (主力大腦)\u003c/span>\n                    \u003cspan class=\"bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-md border border-slate-700\">Perplexity Pro (即時檢索)\u003c/span>\n                    \u003cspan class=\"bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-md border border-slate-700\">Gemini Pro (巨量檔案)\u003c/span>\n                    \u003cspan class=\"bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-md border border-slate-700\">M365 Copilot (60點代工)\u003c/span>\n                    \u003cspan class=\"bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-md border border-slate-700\">Adobe Firefly (4000點)\u003c/span>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- Section 1: Tool Matrix -->\n        \u003csection id=\"matrix\" class=\"bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-slate-200\">\n            \u003cdiv class=\"mb-6\">\n                \u003ch2 class=\"text-2xl font-bold text-slate-900 mb-2\">01. 核心工具定位與最佳分工\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm\">每個 AI 工具都有其不可替代的「物理強項」，明確分工可避免浪費高階點數與額度。\u003c nt-bold text-rose-600\">專業視覺與創作\u003c/td>\n                            \u003ctd class=\"p-3.5 font-semibold text-slate-900\">Creative Cloud Pro\u003cbr>\u003cspan class=\"text-xs text-slate-500\">(每月 4,000 點)\u003c/span>\u003c/td>\n                            \u003ctd class=\"p-3.5\">Adobe Firefly 生成式填色、Illustrator 向量圖生成、Premiere 影音 AI 處理\u003c/td>\n                            \u003ctd class=\"p-3.5\">\u003cspan class=\"bg-rose-100 text-rose-800 text-xs px-2 py-0.5 rounded font-medium\">額度極度充沛\u003c/span> 瘋狂修圖、擴圖、向量設計，商用版權安全。\u003c/td>\n                        \u003c/tr>\n                        \u003ctr class=\"hover:bg-slate-50\">\n                            \u003ctd class=\"p-3.5 font-bold text-orange-600\">音樂與音效生成\u003c/td>\n                            \u003ctd class=\"p-3.5 font-semibold text-slate-900\">Suno AI\u003c/td>\n                            \u003ctd class=\"p-3.5\">輸入文字或歌詞即可生成完整編曲、人聲演唱的高品質歌曲\u003c/td>\n                            \u003ctd class=\"p-3.5\">\u003cspan class=\"bg-orange-100 text-orange-800 text-xs px-2 py-0.5 rounded font-medium\">配樂庫\u003c/span> 簡報、影片或遊戲所需的背景 BGM 與主題曲。\u003c/td>\n                        \u003c/tr>\n                    \u003c/tbody>\n                \u003c/table>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- Section 2: Workflows -->\n        \u003csection id=\"workflows\" class=\"bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-slate-200\">\n            \u003cdiv class=\"mb-6\">\n                \u003ch2 class=\"text-2xl font-bold text-slate-900 mb-2\">02. 四大實戰串聯工作流 (Workflows)\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm\">單獨使用很強，但將工具鏈接起來可以實現一個人當一個團隊的效果。\u003c/p>\n            \u003c/div>\n\n            \u003c!-- Workflow Cards Grid -->\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n                \u003c!-- Workflow 1 -->\n                \u003cdiv class=\"border border-slate-200 rounded-xl p-5 bg-slate-50 hover:border-blue-300 transition\">\n                    \u003cdiv class=\"flex items-center justify-between mb-3\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base\">1. 深度研究與商業提案流\u003c/h3>\n                        \u003cspan class=\"bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-semibold\">商業提案 / 研究\u003c/span>\n                    \u003c/div>\n                    \u003col class=\"space-y-3 text-xs sm:text-sm text-slate-700\">\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-blue-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">1\u003c/span>\n                            \u003cdiv>\u003cstrong>Perplexity Pro (蒐集情報)：\u003c/strong> 開啟 Pro Search 進行地毯式搜尋，抓出具備真實數據與引用的初步研究報告。\u003c/div>\n                        \u003c/li>\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-blue-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">2\u003c/span>\n                            \u003cdiv>\u003cstrong>Gemini Pro (吞吐文獻)：\u003c/strong> 載入十幾份 PDF 財報與產業長影片，利用超長視窗進行跨文件對比與摘要。\u003c/div>\n                        \u003c/li>\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-blue-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">3\u003c/span>\n                            \u003cdiv>\u003cstrong>Claude Pro (撰寫潤飾)：\u003c/strong> 將摘要重點交給 Claude 撰寫成結構嚴謹、文筆自然的完整提案計畫書。\u003c/div>\n                        \u003c/li>\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-blue-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">4\u003c/span>\n                            \u003cdiv>\u003cstrong>M365 Copilot (一鍵簡報)：\u003c/strong> 貼入 Word 後，在 PowerPoint 中用 Copilot 扣 1 點額度直接「根據 Word 生成簡報」。\u003c/div>\n                        \u003c/li>\n                    \u003c/ol>\n                \u003c/div>\n\n                \u003c!-- Workflow 2 -->\n                \u003cdiv class=\"border border-slate-200 rounded-xl p-5 bg-slate-50 hover:border-indigo-300 transition\">\n                    \u003cdiv class=\"flex items-center justify-between mb-3\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base\">2. 全端軟體開發與資料科學流\u003c/h3>\n                        \u003cspan class=\"bg-indigo-100 text-indigo-800 text-xs px-2.5 py-1 rounded-full font-semibold\">軟體開發 / AI\u003c/span>\n                    \u003c/div>\n                    \u003col class=\"space-y-3 text-xs sm:text-sm text-slate-700\">\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-indigo-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">1\u003c/span>\n                            \u003cdiv>\u003cstrong>Claude Pro (架構與原型)：\u003c/strong> 討論系統架構，開啟 Artifacts 功能直接生成前端 UI 預覽或核心邏輯。\u003c/div>\n                        \u003c/li>\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-indigo-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">2\u003c/span>\n                            \u003cdiv>\u003cstrong>GitHub Education (本地開發)：\u003c/strong> 開啟 VS Code，啟用 GitHub Copilot 享受實時代碼自動補完與除錯。\u003c/div>\n                        \u003c/li>\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-indigo-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">3\u003c/span>\n                            \u003cdiv>\u003cstrong>Google Colab (雲端運算)：\u003c/strong> 將數據清理、爬蟲或機器學習模型丟上 Colab，調用免費雲端 GPU 跑完運算。\u003c/div>\n                        \u003c/li>\n                    \u003c/ol>\n                \u003c/div>\n\n                \u003c!-- Workflow 3 -->\n                \u003cdiv class=\"border border-slate-200 rounded-xl p-5 bg-slate-50 hover:border-rose-300 transition\">\n                    \u003cdiv class=\"flex items-center justify-between mb-3\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base\">3. 自媒體、行銷與影音創作流\u003c/h3>\n                        \u003cspan class=\"bg-rose-100 text-rose-800 text-xs px-2.5 py-1 rounded-full font-semibold\">行銷 / 影音製作\u003c/span>\n                    \u003c/div>\n                    \u003col class=\"space-y-3 text-xs sm:text-sm text-slate-700\">\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">1\u003c/span>\n                            \u003cdiv>\u003cstrong>Perplexity + Claude (企劃與腳本)：\u003c/strong> 用 Perplexity 抓熱點，再請 Claude 撰寫分鏡腳本與配樂歌詞。\u003c/div>\n                        \u003c/li>\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">2\u003c/span>\n                            \u003cdiv>\u003cstrong>Adobe Creative Cloud (視覺產出)：\u003c/strong> 消耗 4,000 點數中的一部分，在 Photoshop / Firefly 大量生成插圖與主視覺。\u003c/div>\n                        \u003c/li>\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">3\u003c/span>\n                            \u003cdiv>\u003cstrong>Suno AI (原創配樂)：\u003c/strong> 將寫好的歌詞與曲風指示丟進 Suno，生成專屬片頭曲、Lofi 背景音樂。\u003c/div>\n                        \u003c/li>\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">4\u003c/span>\n                            \u003cdiv>\u003cstrong>Premiere Pro (合成剪輯)：\u003c/strong> 在 Premiere 中整合文字轉語音、自動字幕與音樂延伸功能快速成片。\u003c/div>\n                        \u003c/li>\n                    \u003c/ol>\n                \u003c/div>\n\n                \u003c!-- Workflow 4 -->\n                \u003cdiv class=\"border border-slate-200 rounded-xl p-5 bg-slate-50 hover:border-teal-300 transition\">\n                    \u003cdiv class=\"flex items-center justify-between mb-3\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base\">4. 個人知識管理與導師學習流\u003c/h3>\n                        \u003cspan class=\"bg-teal-100 text-teal-800 text-xs px-2.5 py-1 rounded-full font-semibold\">知識沉澱 / 學習\u003c/span>\n                    \u003c/div>\n                    \u003col class=\"space-y-3 text-xs sm:text-sm text-slate-700\">\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-teal-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">1\u003c/span>\n                            \u003cdiv>\u003cstrong>Gemini Pro (全書與課程摘要)：\u003c/strong> 貼入 2 小時 YouTube 演講或整本 PDF，提煉章節心智圖與核心概念。\u003c/div>\n                        \u003c/li>\n                        \u003cli class=\"flex items-start\">\n                            \u003cspan class=\"bg-teal-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shrink-0 mr-2.5 mt-0.5\">2\u003c/span>\n                            \u003cdiv>\u003cstrong>Claude Projects (打造專家大腦)：\u003c/strong> 將提煉好的精華知識庫餵給 Claude Project，建立可以無限對話的專屬主題導師。\u003c/div>\n                        \u003c/li>\n                    \u003c/ol>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- Section 3: Decision Engine -->\n        \u003csection id=\"decision\" class=\"bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-slate-200\">\n            \u003cdiv class=\"mb-6\">\n                \u003ch2 class=\"text-2xl font-bold text-slate-900 mb-2\">03. 三秒鐘快速決策法 (Claude vs Gemini vs Copilot)\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm\">不知道該開啟哪一個視窗？用「輸入資料量」與「最終產出格式」快速判定：\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-6 mb-8\">\n                \u003c!-- Claude Box -->\n                \u003cdiv class=\"border-t-4 border-blue-600 bg-slate-50 p-5 rounded-xl border-x border-b border-slate-200\">\n                    \u003cdiv class=\"flex items-center justify-between mb-2\">\n                        \u003ch3 class=\"font-bold text-lg text-slate-900\">選 Claude Pro\u003c/h3>\n                        \u003cspan class=\"text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-semibold\">總編輯 & 架構師\u003c/span>\n                    \u003c/div>\n                    \u003cul class=\"text-xs sm:text-sm text-slate-600 space-y-2 mt-3\">\n                        \u003cli>\u003cstrong>輸入量：\u003c/strong> 中長篇（單一專案、數份關鍵文件）。\u003c/li>\n                        \u003cli>\u003cstrong>文字品質：\u003c/strong> \u003cstrong>最高\u003c/strong>（無「AI 味」、語意幽微精準）。\u003c/li>\n                        \u003cli>\u003cstrong>產出物：\u003c/strong> 高品質文章、企劃書、程式碼、\u003cstrong>互動網頁/圖表預覽\u003c/strong>。\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n\n                \u003c!-- Gemini Box -->\n                \u003cdiv class=\"border-t-4 border-purple-600 bg-slate-50 p-5 rounded-xl border-x border-b border-slate-200\">\n                    \u003cdiv class=\"flex items-center justify-between mb-2\">\n                        \u003ch3 class=\"font-bold text-lg text-slate-900\">選 Gemini Pro\u003c/h3>\n                        \u003cspan class=\"text-xs bg-purple-100 text-purple-800 px-2 py-0.5 rounded font-semibold\">圖書館管理員\u003c/span>\n                    \u003c/div>\n                    \u003cul class=\"text-xs sm:text-sm text-slate-600 space-y-2 mt-3\">\n                        \u003cli>\u003cstrong>輸入量：\u003c/strong> \u003cstrong>極巨量\u003c/strong>（整本書、長影片、幾十份 PDF）。\u003c/li>\n                        \u003cli>\u003cstrong>文字品質：\u003c/strong> 中等（擅長提煉、結構化清單、中英比對）。\u003c/li>\n                        \u003cli>\u003cstrong>產出物：\u003c/strong> 跨檔案分析報告、Google Docs/Gmail 草稿。\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n\n                \u003c!-- Copilot Box -->\n                \u003cdiv class=\"border-t-4 border-amber-500 bg-slate-50 p-5 rounded-xl border-x border-b border-slate-200\">\n                    \u003cdiv class=\"flex items-center justify-between mb-2\">\n                        \u003ch3 class=\"font-bold text-lg text-slate-900\">選 M365 Copilot\u003c/h3>\n                        \u003cspan class=\"text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-semibold\">Office 格式秘書\u003c/span>\n                    \u003c/div>\n                    \u003cul class=\"text-xs sm:text-sm text-slate-600 space-y-2 mt-3\">\n                        \u003cli>\u003cstrong>輸入量：\u003c/strong> 已經在 Word / Excel / Outlook 中的檔案。\u003c/li>\n                        \u003cli>\u003cstrong>文字品質：\u003c/strong> 標準商務制式化（公文、商業信件）。\u003c/li>\n                        \u003cli>\u003cstrong>產出物：\u003c/strong> \u003cstrong>直接生成 PPT 投影片、Excel 公式與樞紐分析\u003c/strong>。\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- Section 4: Real-World Prompts -->\n        \u003csection id=\"prompts\" class=\"bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-slate-200\">\n            \u003cdiv class=\"mb-6\">\n                \u003ch2 class=\"text-2xl font-bold text-slate-900 mb-2\">04. 具體場景與真實 Prompt 範例\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm\">直接複製以下提示詞，精確調用不同工具的最佳能力：\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"space-y-6\">\n                \u003c!-- Prompt 1 -->\n                \u003cdiv class=\"border border-slate-200 rounded-xl p-5 bg-slate-50\">\n                    \u003cdiv class=\"flex items-center justify-between mb-2\">\n                        \u003cdiv class=\"flex items-center space-x-2\">\n                            \u003cspan class=\"bg-blue-600 text-white text-xs px-2 py-0.5 rounded font-semibold\">Claude Pro\u003c/span>\n                            \u003ch3 class=\"font-bold text-slate-900\">高難度談判與商業信件撰寫\u003c/h3>\n                        \u003c/div>\n                        \u003cbutton onclick=\"copyCode('prompt-1')\" class=\"text-xs bg-white border border-slate-300 hover:bg-slate-100 px-2.5 py-1 rounded transition text-slate-700\">📋 複製 Prompt\u003c/button>\n                    \u003c/div>\n                    \u003cp class=\"text-xs text-slate-500 mb-3\">優勢：文字最像真人，能精準抓到婉轉、堅定與語氣階層的差異。\u003c/p>\n                    \u003cpre id=\"prompt-1\" class=\"bg-slate-900 text-slate-200 text-xs p-3.5 rounded-lg overflow-x-auto font-mono code-scroll\">我要寫一封婉拒客戶無理砍價、但又不能得罪對方的電子郵件。請給我三種版本：\n1. 溫和堅定版\n2. 提供替代服務範疇版\n3. 暗示合作底線版\n語氣請符合台灣商業溝通習慣，句式要自然且具專業感。\u003c/pre>\n                \u003c/div>\n\n                \u003c!-- Prompt 2 -->\n                \u003cdiv class=\"border border-slate-200 rounded-xl p-5 bg-slate-50\">\n                    \u003cdiv class=\"flex items-center justify-between mb-2\">\n                        \u003cdiv class=\"flex items-center space-x-2\">\n                            \u003cspan class=\"bg-blue-600 text-white text-xs px-2 py-0.5 rounded font-semibold\">Claude Pro\u003c/span>\n                            \u003ch3 class=\"font-bold text-slate-900\">利用 Artifacts 生成互動式網頁圖表\u003c/h3>\n                        \u003c/div>\n                        \u003cbutton onclick=\"copyCode('prompt-2')\" class=\"text-xs bg-white border border-slate-300 hover:bg-slate-100 px-2.5 py-1 rounded transition text-slate-700\">📋 複製 Prompt\u003c/button>\n                    \u003c/div>\n                    \u003cp class=\"text-xs text-slate-500 mb-3\">優勢：可以直接在右側視窗渲染出 HTML/CSS/JS 小工具。\u003c/p>\n                    \u003cpre id=\"prompt-2\" class=\"bg-slate-900 text-slate-200 text-xs p-3.5 rounded-lg overflow-x-auto font-mono code-scroll\">這是我們團隊專案流程的文字描述：[貼入流程]。\n請幫我將這段文字繪製成一張清晰的流程圖，並使用 HTML/CSS (Tailwind) 做成一個可以用滑鼠點擊展開細節的互動式資訊卡組件。\u003c/pre>\n                \u003c/div>\n\n                \u003c!-- Prompt 3 -->\n                \u003cdiv class=\"border border-slate-200 rounded-xl p-5 bg-slate-50\">\n                    \u003cdiv class=\"flex items-center justify-between mb-2\">\n                        \u003cdiv class=\"flex items-center space-x-2\">\n                            \u003cspan class=\"bg-purple-600 text-white text-xs px-2 py-0.5 rounded font-semibold\">Gemini Pro\u003c/span>\n                            \u003ch3 class=\"font-bold text-slate-900\">跨多份百頁 PDF 與音訊檔案比對\u003c/h3>\n                        \u003c/div>\n                        \u003cbutton onclick=\"copyCode('prompt-3')\" class=\"text-xs bg-white border border-slate-300 hover:bg-slate-100 px-2.5 py-1 rounded transition text-slate-700\">📋 複製 Prompt\u003c/button>\n                    \u003c/div>\n                    \u003cp class=\"text-xs text-slate-500 mb-3\">優勢：輕鬆吃下上百頁報告與一小時會議錄音而不觸發上限。\u003c/p>\n                    \u003cpre id=\"prompt-3\" class=\"bg-slate-900 text-slate-200 text-xs p-3.5 rounded-lg overflow-x-auto font-mono code-scroll\">（上傳 5 份產業報告 PDF 與 1 個一小時會議錄音檔）\n請比對這五份報告中的市場預測數據，並告訴我會議錄音中第 35 分鐘提到的決策，是否有違背這些報告的整體趨勢？請列出對比表格與具體時間戳記。\u003c/pre>\n                \u003c/div>\n\n                \u003c!-- Prompt 4 -->\n                \u003cdiv class=\"border border-slate-200 rounded-xl p-5 bg-slate-50\">\n                    \u003cdiv class=\"flex items-center justify-between mb-2\">\n                        \u003cdiv class=\"flex items-center space-x-2\">\n                            \u003cspan class=\"bg-amber-600 text-white text-xs px-2 py-0.5 rounded font-semibold\">M365 Copilot\u003c/span>\n                            \u003ch3 class=\"font-bold text-slate-900\">Word 文檔一鍵轉 PowerPoint 排版\u003c/h3>\n                        \u003c/div>\n                        \u003cbutton onclick=\"copyCode('prompt-4')\" class=\"text-xs bg-white border border-slate-300 hover:bg-slate-100 px-2.5 py-1 rounded transition text-slate-700\">📋 複製 Prompt\u003c/button>\n                    \u003c/div>\n                    \u003cp class=\"text-xs text-slate-500 mb-3\">優勢：直接在 Office 內部套用範本與自動配圖，不需手動複製貼上。\u003c/p>\n                    \u003cpre id=\"prompt-4\" class=\"bg-slate-900 text-slate-200 text-xs p-3.5 rounded-lg overflow-x-auto font-mono code-scroll\">（在 PowerPoint 內點開 Copilot 按鈕）\n根據我的 OneDrive 中的『年度企劃書.docx』檔案，幫我生成一份 12 頁的簡報，套用公司標準主題色彩，並在重點頁面自動搭配適當圖案與條列式排版。\u003c/pre>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- Section 5: Quotas & Pitfalls -->\n        \u003csection id=\"quotas\" class=\"bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-slate-200\">\n            \u003cdiv class=\"mb-6\">\n                \u003ch2 class=\"text-2xl font-bold text-slate-900 mb-2\">05. 避坑指南與點數額度最佳化\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm\">如何最聰明地省下寶貴的限制額度，發揮極致 CP 值。\u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-6\">\n                \u003c!-- Quota Tip 1 -->\n                \u003cdiv class=\"p-5 bg-amber-50 rounded-xl border border-amber-200\">\n                    \u003ch3 class=\"font-bold text-amber-900 text-sm mb-2\">⚠️ 拯救 M365 的每月 60 點\u003c/h3>\n                    \u003cp class=\"text-xs text-amber-800 leading-relaxed\">\n                        60 點非常珍貴，\u003cstrong>千萬不要\u003c/strong>拿它在 Word 或網頁版對話閒聊。日常問答請用免費的 Copilot Chat（含 GPT 模型）或 Claude；點數專門留給「Word 轉 PPT」或「Excel 複雜樞紐分析」。\n                    \u003c/p>\n                \u003c/div>\n\n                \u003c!-- Quota Tip 2 -->\n                \u003cdiv class=\"p-5 bg-rose-50 rounded-xl border border-rose-200\">\n                    \u003ch3 class=\"font-bold text-rose-900 text-sm mb-2\">🎨 榨乾 Adobe 4,000 點\u003c/h3>\n                    \u003cp class=\"text-xs text-rose-800 leading-relaxed\">\n                        4,000 點對個人來說幾乎用不完。除了生圖，記得在 Premiere Pro（音訊增強、自動延長片段）與 Illustrator（文字轉向量圖形、重新上色）中大膽使用，大幅縮短設計排版時間。\n                    \u003c/p>\n                \u003c/div>\n\n                \u003c!-- Quota Tip 3 -->\n                \u003cdiv class=\"p-5 bg-indigo-50 rounded-xl border border-indigo-200\">\n                    \u003ch3 class=\"font-bold text-indigo-900 text-sm mb-2\">🎓 挖掘 GitHub Education 寶藏\u003c/h3>\n                    \u003cp class=\"text-xs text-indigo-800 leading-relaxed\">\n                        除了 GitHub Copilot 免費外，記得去領取 GitHub Student Developer Pack，內含 Namecheap 免費網域、DigitalOcean 雲端主機額度與 JetBrains 全套 IDE 免費授權。\n                    \u003c/p>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Caution checklist -->\n            \u003cdiv class=\"mt-6 bg-slate-100 p-4 rounded-lg border border-slate-200 text-xs text-slate-700\">\n                \u003cstrong class=\"text-slate-900 block mb-1\">🚫 日常使用三大禁忌：\u003c/strong>\n                \u003cul class=\"list-disc pl-5 space-y-1\">\n                    \u003cli>\u003cstrong>不要拿 Claude Pro 當搜尋引擎：\u003c/strong> 查最新新聞或論文連結請用 Perplexity AI Pro，把 Claude 寶貴的額度留給思考與寫作。\u003c/li>\n                    \u003cli>\u003cstrong>不要在 Word 內請 Copilot 從零寫長文：\u003c/strong> 扣點數且文筆不如 Claude。正確做法：Claude 寫好 $\\rightarrow$ 貼入 Word $\\rightarrow$ 用 1 點 Copilot 轉成 PPT。\u003c/li>\n                    \u003cli>\u003cstrong>不要把數百頁 PDF 直接塞給 Claude：\u003c/strong> 聊兩三句就會觸發每 5 小時訊息上限。超大檔案先丟 Gemini 提煉精華，再貼給 Claude 加工。\u003c/li>\n                \u003c/ul>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- Section 6: Claude Projects Masterclass -->\n        \u003csection id=\"projects\" class=\"bg-white rounded-xl p-6 sm:p-8 shadow-sm border border-slate-200\">\n            \u003cdiv class=\"mb-6\">\n                \u003ch2 class=\"text-2xl font-bold text-slate-900 mb-2\">06. Claude Pro Projects 專屬大腦實戰教學\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm\">打造不需要每次重新下指令、自動記憶個人風格與專案背景的獨立工作區。\u003c/p>\n            \u003c/div>\n\n            \u003c!-- Steps Grid -->\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 gap-6 mb-8\">\n                \u003cdiv class=\"border border-slate-200 p-5 rounded-xl bg-slate-50\">\n                    \u003ch3 class=\"font-bold text-slate-900 text-sm mb-2\">第一步：建立專案與面板設定\u003c/h3>\n                    \u003col class=\"list-decimal pl-4 text-xs text-slate-600 space-y-1.5\">\n                        \u003cli>點擊 Claude 網頁左側選單的 \u003cstrong>「Projects」\u003c/strong>。\u003c/li>\n                        \u003cli>點擊右上角 \u003cstrong>「Create Project」\u003c/strong> 並命名（例：個人品牌寫作）。\u003c/li>\n                        \u003cli>專案核心由兩大部分組成：\n                            \u003cul class=\"list-disc pl-4 mt-1 text-slate-500\">\n                                \u003cli>\u003cstrong>Set Project Instructions:\u003c/strong> 設定 Claude 的思維、語氣與規則。\u003c/li>\n                                \u003cli>\u003cstrong>Project Knowledge:\u003c/strong> 提供背景資料、過往範文與專業詞彙。\u003c/li>\n                            \u003c/ul>\n                        \u003c/li>\n                    \u003c/ol>\n                \u003c/div>\n\n                \u003cdiv class=\"border border-slate-200 p-5 rounded-xl bg-slate-50\">\n                    \u003ch3 class=\"font-bold text-slate-900 text-sm mb-2\">第二步：餵入「專案知識庫」(Knowledge)\u003c/h3>\n                    \u003cul class=\"list-disc pl-4 text-xs text-slate-600 space-y-1.5\">\n                        \u003cli>\u003cstrong>上傳內容：\u003c/strong> 自己最滿意的 3~5 篇範文、產品規格書 (PRD)、專用術語對照表。\u003c/li>\n                        \u003cli>\u003cstrong>格式優先：\u003c/strong> 優先使用 \u003ccode>.txt\u003c/code> 或 \u003ccode>.md\u003c/code> (Markdown)，Token 消耗最小、讀取最快。\u003c/li>\n                        \u003cli>\u003cstrong>容量控制：\u003c/strong> 知識庫控制在 20%~30% 以下，避免每次對話吃掉過多 Context。\u003c/li>\n                    \u003c/ul>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Instructions Template -->\n            \u003cdiv class=\"border border-slate-200 rounded-xl p-5 bg-slate-900 text-slate-100\">\n                \u003cdiv class=\"flex items-center justify-between mb-3\">\n                    \u003ch3 class=\"font-bold text-sm text-white\">📋 專屬指令範本 (Project Instructions Markdown)\u003c/h3>\n                    \u003cbutton onclick=\"copyCode('markdown-template')\" class=\"text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded transition\">複製系統指令\u003c/button>\n                \u003c/div>\n                \u003cpre id=\"markdown-template\" class=\"text-xs text-slate-300 overflow-x-auto font-mono code-scroll leading-relaxed\"># 角色與任務\n你是我的專屬內容總編與寫作搭檔。你熟悉我的個人風格、目標受眾與業務背景。\n\n# 語言與格式規範\n1. 語言：一律使用台灣繁體中文（zh-TW），嚴禁出現中國大陸用語（如：視頻→影片、質量→品質、抓手、賦能）。\n2. 排版：段落簡短（每段不超過 3 句話），善用條列式清單、粗體關鍵字與 Markdown 表格。\n3. 標點：句中使用全形標點符號，數字與英文單字前後保持半形空格。\n\n# 寫作語氣與風格 (Style Guide)\n- 語氣特徵：專業、有溫度、平易近人、帶有一點幽默與洞察，像經驗豐富的朋友在咖啡廳聊天。\n- 說理方式：先講結論/故事，再給具體作法，最後帶出核心啟發。\n- 負面清單（絕對禁止）：\n  - 避免陳腔濫調的開頭（例如：「在這個瞬息萬變的時代...」）。\n  - 避免空泛的結語（例如：「讓我們一起期待未來的發展吧！」）。\n  - 不要在回覆開頭過度奉承說「這是一個非常棒的問題」。\n\n# 專案/業務背景摘要\n- 我的定位：[填入角色，如：專注 B2B SaaS 的產品行銷經理]\n- 目標受眾：[填入讀者群，如：台灣中小型企業主管與創業者]\n- 核心價值觀：實戰大於理論，講究數據與落地步驟。\u003c/pre>\n            \u003c/div>\n        \u003c/section>\n\n    \u003c/main>\n\n    \u003c!-- Footer -->\n    \u003cfooter class=\"bg-slate-900 border-t border-slate-800 text-slate-400 text-xs py-6 text-center\">\n        \u003cp>AI Arsenal 全球工具指南 | 打造極致 AI 協同生產力工作流\u003c/p>\n    \u003c/footer>\n\n    \u003c!-- Copy Code JS Logic -->\n    \u003cscript>\n        function copyCode(elementId) {\n            const text = document.getElementById(elementId).innerText;\n            navigator.clipboard.writeText(text).then(() => {\n                alert('已成功複製到剪貼簿！');\n            }).catch(err => {\n                console.error('複製失敗: ', err);\n            });\n        }\n    \u003c/script>\n\u003c/body>\n\u003c/html>"},{"title":"跨程式語言通用核心基礎 - 語音導覽與互動儀表板","path":"程式語言通用核心指南/程式語言通用核心指南.html","snippet":"🎧 程式語言通用核心指南 語音摘要與互動知識體系儀表板 語音摘要 四大層次架構 設計議題比較 5步驟學習路徑 🎙️ 智慧語音朗讀系統 核心知識語音摘要 (Voice Summary) 本區塊將以語音方式為您導讀報告核…","size":36848,"mtime":1793441974979,"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-TW\">\n\u003chead>\n    \u003cmeta charset=\"utf-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>跨程式語言通用核心基礎 - 語音導覽與互動儀表板\u003c/title>\n    \u003c!-- Tailwind CSS CDN -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003c!-- Chart.js CDN -->\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/chart.js\">\u003c/script>\n    \u003c!-- Google Fonts -->\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">\n    \u003cstyle>\n        body {\n            font-family: 'Noto Sans TC', sans-serif;\n            background-color: #FAF8F5;\n            color: #2D3748;\n        }\n        .chart-container {\n            position: relative;\n            width: 100%;\n            max-width: 580px;\n            margin-left: auto;\n            margin-right: auto;\n            height: 320px;\n            max-height: 380px;\n        }\n        @media (min-width: 768px) {\n            .chart-container {\n                height: 350px;\n            }\n        }\n        .active-transcript-sentence {\n            background-color: #FEF3C7;\n            color: #92400E;\n            font-weight: 600;\n            padding: 2px 4px;\n            border-radius: 4px;\n            transition: all 0.2s ease;\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"min-h-screen flex flex-col\">\n\n    \u003c!-- Chosen Palette: Warm Neutral Clarity (Cream #FAF8F5, Slate Gray #2D3748, Amber #D97706, Indigo #4F46E5) -->\n    \u003c!-- Application Structure Plan: Designed as a dual-purpose Web Speech audio guide and interactive dashboard. Section 1 features an active Speech Synthesis player with sentence-by-sentence text highlighting. Section 2 provides interactive visual breakdown of Sebesta's 4 layers and CS2023 course hours using Chart.js. Section 3 hosts a filterable design-issue comparison matrix. Section 4 offers an interactive 5-step learning path checklist with instant progress tracking. This structure allows both auditory listeners and visual learners to digest complex computer science concepts effortlessly. -->\n    \u003c!-- Visualization & Content Choices: 1. CS2023 & Sebesta Layer Breakdown -> Chart.js Bar & Doughnut Charts (Canvas rendered, responsive container). 2. Audio Script Player -> Web Speech API with dynamic transcript highlighting. 3. 16-Chapter Matrix -> Filterable HTML Grid with stateful JS filtering. 4. Checklist -> Stateful HTML/JS interactive task tracker. Confirming NO SVG / NO Mermaid JS. -->\n    \u003c!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->\n\n    \u003c!-- Header Navigation -->\n    \u003cheader class=\"sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-amber-100 shadow-sm\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4\">\n            \u003cdiv class=\"flex items-center gap-3\">\n                \u003cspan class=\"inline-flex items-center justify-center w-10 h-10 rounded-xl bg-amber-500 text-white font-bold text-lg shadow\">\n                    🎧\n                \u003c/span>\n                \u003cdiv>\n                    \u003ch1 class=\"font-bold text-lg text-slate-800 leading-tight\">程式語言通用核心指南\u003c/h1>\n                    \u003cp class=\"text-xs text-slate-500\">語音摘要與互動知識體系儀表板\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            \n            \u003cnav class=\"flex items-center gap-2 text-sm font-medium text-slate-600\">\n                \u003ca href=\"#audio-player\" class=\"px-3 py-1.5 rounded-lg hover:bg-amber-50 hover:text-amber-700 transition\">語音摘要\u003c/a>\n                \u003ca href=\"#structure-overview\" class=\"px-3 py-1.5 rounded-lg hover:bg-amber-50 hover:text-amber-700 transition\">四大層次架構\u003c/a>\n                \u003ca href=\"#matrix-section\" class=\"px-3 py-1.5 rounded-lg hover:bg-amber-50 hover:text-amber-700 transition\">設計議題比較\u003c/a>\n                \u003ca href=\"#action-checklist\" class=\"px-3 py-1.5 rounded-lg hover:bg-amber-50 hover:text-amber-700 transition\">5步驟學習路徑\u003c/a>\n            \u003c/nav>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- Main Container -->\n    \u003cmain class=\"flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12\">\n\n        \u003c!-- SECTION 1: Audio Summary Player & Interactive Transcript -->\n        \u003csection id=\"audio-player\" class=\"bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-amber-100/60 relative overflow-hidden\">\n            \u003cdiv class=\"absolute -right-12 -top-12 w-48 h-48 bg-amber-100/40 rounded-full blur-2xl pointer-events-none\">\u003c/div>\n            \n            \u003cdiv class=\"mb-6\">\n                \u003cdiv class=\"inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-semibold mb-2\">\n                    \u003cspan>🎙️ 智慧語音朗讀系統\u003c/span>\n                \u003c/div>\n                \u003ch2 class=\"text-2xl font-bold text-slate-800\">核心知識語音摘要 (Voice Summary)\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm mt-1\">\n                    本區塊將以語音方式為您導讀報告核心精華。您可以點擊下方播放鈕直接聆聽，並隨同即時同步的逐字重點進行全域學習。\n                \u003c/p>\n            \u003c/div>\n\n            \u003c!-- Audio Controller Box -->\n            \u003cdiv class=\"bg-slate-50 rounded-xl p-4 sm:p-6 border border-slate-200 mb-6 flex flex-col md:flex-row items-center justify-between gap-6\">\n                \u003c!-- Play Controls -->\n                \u003cdiv class=\"flex items-center gap-3 w-full md:w-auto justify-center\">\n                    \u003cbutton id=\"btn-play\" onclick=\"playAudioSummary()\" class=\"flex items-center gap-2 bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md transition transform active:scale-95\">\n                        \u003cspan id=\"play-icon\">▶\u003c/span>\n                        \u003cspan id=\"play-text\">播放語音摘要\u003c/span>\n                    \u003c/button>\n                    \u003cbutton id=\"btn-pause\" onclick=\"pauseAudioSummary()\" class=\"hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2.5 rounded-xl transition\">\n                        ⏸ 暫停\n                    \u003c/button>\n                    \u003cbutton id=\"btn-stop\" onclick=\"stopAudioSummary()\" class=\"bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2.5 rounded-xl transition\">\n                        ⏹ 重置\n                    \u003c/button>\n                \u003c/div>\n\n                \u003c!-- Settings: Speed & Voice Choice -->\n                \u003cdiv class=\"flex flex-wrap items-center justify-center gap-4 w-full md:w-auto text-sm\">\n                    \u003cdiv class=\"flex items-center gap-2\">\n                        \u003clabel for=\"rate-select\" class=\"text-slate-600 font-medium\">語速:\u003c/label>\n                        \u003cselect id=\"rate-select\" onchange=\"updateRate()\" class=\"bg-white border border-slate-300 rounded-lg px-2.5 py-1 text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500\">\n                            \u003coption value=\"0.8\">0.8x (慢)\u003c/option>\n                            \u003coption value=\"1\" selected>1.0x (標準)\u003c/option>\n                            \u003coption value=\"1.2\">1.2x (快)\u003c/option>\n                            \u003coption value=\"1.5\">1.5x (特快)\u003c/option>\n                        \u003c/select>\n                    \u003c/div>\n                    \u003cdiv class=\"flex items-center gap-2\">\n                        \u003cspan id=\"speech-status\" class=\"text-xs px-2.5 py-1 rounded-full bg-slate-200 text-slate-600 font-medium\">\n                            準備就緒\n                        \u003c/span>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Interactive Transcript Blocks -->\n            \u003cdiv id=\"transcript-container\" class=\"space-y-4 max-h-80 overflow-y-auto pr-2 border-l-2 border-amber-200 pl-4 text-slate-700 leading-relaxed text-sm sm:text-base\">\n                \u003cdiv id=\"section-s1\" class=\"p-2 rounded hover:bg-amber-50/50 transition\">\n                    \u003cspan class=\"font-bold text-amber-800 block text-xs mb-1\">【導言：跨語言的心智模型】\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"0\">學習任何一門程式語言，最核心的任務不是死記特定語法，而是建立跨語言的通用概念框架。\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"1\">根據 Sebesta 教授經典教材《程式語言概念》，當代程式語言底層可拆解為四大層次：評估準則與剖析、變數繫結與控制流、抽象化與並行、以及多元程式設計典範。\u003c/span>\n                \u003c/div>\n\n                \u003cdiv id=\"section-s2\" class=\"p-2 rounded hover:bg-amber-50/50 transition\">\n                    \u003cspan class=\"font-bold text-indigo-800 block text-xs mb-1\">【重點 1：看穿設計取捨與評估標準】\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"2\">ACM CS2023 課綱將程式語言基礎列為核心支柱，劃定 26 小時的核心時數。\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"3\">工程師的核心競爭力，在於理解語言設計背後的設計議題與取捨，批判性比較不同語言替代方案，而非僅止於符號操作。\u003c/span>\n                \u003c/div>\n\n                \u003cdiv id=\"section-s3\" class=\"p-2 rounded hover:bg-amber-50/50 transition\">\n                    \u003cspan class=\"font-bold text-emerald-800 block text-xs mb-1\">【重點 2：從語法到執行期連結】\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"4\">掌握 BNF 與屬性文法能幫助理解靜態語意，而理解副程式呼叫與返回的底層連結實作，則是看透程式執行期的關鍵。\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"5\">現代語言更持續導入如 Swift 的可選型別，以及 Python 的迭代器與反射機制，來提升安全性與開發效率。\u003c/span>\n                \u003c/div>\n\n                \u003cdiv id=\"section-s4\" class=\"p-2 rounded hover:bg-amber-50/50 transition\">\n                    \u003cspan class=\"font-bold text-amber-800 block text-xs mb-1\">【重點 3：實務 5 步驟微型手冊學習法】\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"6\">當掌握通用框架後，面對新語言僅需約 100 頁的微型手冊即可快速上手。\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"7\">學習路徑包含：確認實現方式、釐清變數與型別、掌握控制結構與副程式、檢視 OOP 與例外處理，最後融合多元典範。\u003c/span>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 2: Conceptual Breakdown & Visual Charts -->\n        \u003csection id=\"structure-overview\" class=\"space-y-6\">\n            \u003cdiv class=\"border-b border-slate-200 pb-3\">\n                \u003ch2 class=\"text-2xl font-bold text-slate-800\">四大演進層次與 CS2023 時數配置\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm mt-1\">\n                    本區塊展示 Sebesta《程式語言概念》16 大章節的四大層次分配，以及國際權威 ACM CS2023 課綱中對「程式語言基礎（FPL）」與相關學門的核心時數權重配置。\n                \u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch\">\n                \u003c!-- Chart 1: Sebesta 16 Chapters Distribution -->\n                \u003cdiv class=\"bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between\">\n                    \u003cdiv>\n                        \u003ch3 class=\"font-bold text-slate-800 text-lg mb-1\">Sebesta 16 章四大知識層次分佈\u003c/h3>\n                        \u003cp class=\"text-xs text-slate-500 mb-4\">點擊圖表區塊可檢視各層次對應之關鍵設計議題\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"chart-container\">\n                        \u003ccanvas id=\"layersDoughnutChart\">\u003c/canvas>\n                    \u003c/div>\n                    \u003cdiv id=\"layer-detail-box\" class=\"mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900\">\n                        💡 點擊上方圓餅圖區塊，查看各層次所涵蓋的關鍵章節與設計重點。\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Chart 2: CS2023 Core Hours -->\n                \u003cdiv class=\"bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between\">\n                    \u003cdiv>\n                        \u003ch3 class=\"font-bold text-slate-800 text-lg mb-1\">ACM CS2023 相關學科核心時數配置\u003c/h3>\n                        \u003cp class=\"text-xs text-slate-500 mb-4\">強調程式語言基礎與軟體工程、系統運算的深層連結 (CS-Core Hours)\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"chart-container\">\n                        \u003ccanvas id=\"cs2023BarChart\">\u003c/canvas>\n                    \u003c/div>\n                    \u003cdiv class=\"mt-4 p-3 bg-indigo-50 border border-indigo-200 rounded-xl text-xs text-indigo-900\">\n                        📌 CS2023 劃定 26 小時 FPL 核心課程，並佐以 18 小時自動機、語意推理與軟體工程等跨領域時數。\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 3: Design Issues Comparison Matrix -->\n        \u003csection id=\"matrix-section\" class=\"bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200 space-y-6\">\n            \u003cdiv class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-4\">\n                \u003cdiv>\n                    \u003ch2 class=\"text-2xl font-bold text-slate-800\">16章跨語言核心設計議題（Design Issues）矩陣\u003c/h2>\n                    \u003cp class=\"text-slate-600 text-sm mt-1\">\n                        理解不同語言在相同問題上的設計取捨。請選擇特定層次進行動態篩選探索：\n                    \u003c/p>\n                \u003c/div>\n                \u003c!-- Filter Buttons -->\n                \u003cdiv class=\"flex flex-wrap gap-2\" id=\"matrix-filters\">\n                    \u003cbutton onclick=\"filterMatrix('all')\" class=\"matrix-btn active-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-600 text-white transition\">全部章節\u003c/button>\n                    \u003cbutton onclick=\"filterMatrix('L1')\" class=\"matrix-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition\">第一層：基礎剖析\u003c/button>\n                    \u003cbutton onclick=\"filterMatrix('L2')\" class=\"matrix-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition\">第二層：變數控制\u003c/button>\n                    \u003cbutton onclick=\"filterMatrix('L3')\" class=\"matrix-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition\">第三層：抽象並行\u003c/button>\n                    \u003cbutton onclick=\"filterMatrix('L4')\" class=\"matrix-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition\">第四層：多元典範\u003c/button>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Interactive Table/Grid -->\n            \u003cdiv class=\"overflow-x-auto\">\n                \u003ctable class=\"w-full text-left text-sm text-slate-700 border-collapse\">\n                    \u003cthead>\n                        \u003ctr class=\"bg-slate-50 border-b border-slate-200 text-slate-800\">\n                            \u003cth class=\"p-3 font-semibold\">章節\u003c/th>\n                            \u003cth class=\"p-3 font-semibold\">核心模組名稱\u003c/th>\n                            \u003cth class=\"p-3 font-semibold\">跨語言必懂之關鍵設計議題 (Design Issues)\u003c/th>\n                            \u003cth class=\"p-3 font-semibold\">代表性語言實例\u003c/th>\n                        \u003c/tr>\n                    \u003c/thead>\n                    \u0
