03ctbody id=\"matrix-table-body\" class=\"divide-y divide-slate-100\">\n                        \u003c!-- Dynamic content populated by JavaScript -->\n                    \u003c/tbody>\n                \u003c/table>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 4: 5-Step Action Checklist & Practical Path -->\n        \u003csection id=\"action-checklist\" class=\"bg-amber-900/5 rounded-2xl p-6 sm:p-8 border border-amber-200 space-y-6\">\n            \u003cdiv>\n                \u003cspan class=\"text-xs font-bold uppercase tracking-wider text-amber-700\">Practical Roadmap\u003c/span>\n                \u003ch2 class=\"text-2xl font-bold text-slate-800\">新語言快速上手：5步驟實務學習檢核清單\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm mt-1\">\n                    基於 Sebesta 配套「微型手冊（Mini-manuals）」學習哲學。當你學習任何新程式語言時，請對照以下步驟勾選完成檢核：\n                \u003c/p>\n            \u003c/div>\n\n            \u003c!-- Progress Bar -->\n            \u003cdiv class=\"bg-white p-4 rounded-xl border border-amber-200 flex flex-col sm:flex-row items-center justify-between gap-4\">\n                \u003cdiv class=\"w-full sm:w-2/3\">\n                    \u003cdiv class=\"flex justify-between text-xs font-semibold text-slate-700 mb-1\">\n                        \u003cspan>學習檢核完成度\u003c/span>\n                        \u003cspan id=\"checklist-progress-text\">0% (0/5)\u003c/span>\n                    \u003c/div>\n                    \u003cdiv class=\"w-full bg-slate-200 rounded-full h-2.5 overflow-hidden\">\n                        \u003cdiv id=\"checklist-progress-bar\" class=\"bg-amber-600 h-2.5 rounded-full transition-all duration-300\" style=\"width: 0%\">\u003c/div>\n                    \u003c/div>\n                \u003c/div>\n                \u003cbutton onclick=\"resetChecklist()\" class=\"text-xs font-medium text-amber-800 hover:underline\">\n                    🔄 重置檢核表\n                \u003c/button>\n            \u003c/div>\n\n            \u003c!-- Checklist Items -->\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4\" id=\"checklist-items\">\n                \u003c!-- Card 1 -->\n                \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 cursor-pointer hover:border-amber-400 transition\" onclick=\"toggleCheck(1)\">\n                    \u003cinput type=\"checkbox\" id=\"chk-1\" class=\"mt-1 h-4 w-4 text-amber-600 rounded focus:ring-amber-500\">\n                    \u003cdiv>\n                        \u003ch4 class=\"font-bold text-slate-800 text-sm\">1. 確認起源與實現方式\u003c/h4>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">對應 Ch 1-4：了解歷史背景、BNF 語法描述與編譯/直譯器處理器架構。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n                \u003c!-- Card 2 -->\n                \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 cursor-pointer hover:border-amber-400 transition\" onclick=\"toggleCheck(2)\">\n                    \u003cinput type=\"checkbox\" id=\"chk-2\" class=\"mt-1 h-4 w-4 text-amber-600 rounded focus:ring-amber-500\">\n                    \u003cdiv>\n                        \u003ch4 class=\"font-bold text-slate-800 text-sm\">2. 釐清變數與型別系統\u003c/h4>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">對應 Ch 5-6：鎖定作用域規則、動/靜態繫結，以及是否具備可選型別 (Optional Types)。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n                \u003c!-- Card 3 -->\n                \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 cursor-pointer hover:border-amber-400 transition\" onclick=\"toggleCheck(3)\">\n                    \u003cinput type=\"checkbox\" id=\"chk-3\" class=\"mt-1 h-4 w-4 text-amber-600 rounded focus:ring-amber-500\">\n                    \u003cdiv>\n                        \u003ch4 class=\"font-bold text-slate-800 text-sm\">3. 掌握控制結構與副程式\u003c/h4>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">對應 Ch 7-10：熟悉迭代器 (Iterators)、運算式求值與底層副程式連結 (Subprogram Linkage)。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n                \u003c!-- Card 4 -->\n                \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 cursor-pointer hover:border-amber-400 transition\" onclick=\"toggleCheck(4)\">\n                    \u003cinput type=\"checkbox\" id=\"chk-4\" class=\"mt-1 h-4 w-4 text-amber-600 rounded focus:ring-amber-500\">\n                    \u003cdiv>\n                        \u003ch4 class=\"font-bold text-slate-800 text-sm\">4. 檢視模組封裝與物件導向\u003c/h4>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">對應 Ch 11-14：掌握 ADT 封裝、繼承、動態方法繫結、反射 (Reflection) 與例外處理。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n                \u003c!-- Card 5 -->\n                \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 cursor-pointer hover:border-amber-400 transition\" onclick=\"toggleCheck(5)\">\n                    \u003cinput type=\"checkbox\" id=\"chk-5\" class=\"mt-1 h-4 w-4 text-amber-600 rounded focus:ring-amber-500\">\n                    \u003cdiv>\n                        \u003ch4 class=\"font-bold text-slate-800 text-sm\">5. 融合多元典範與電腦系統\u003c/h4>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">對應 Ch 15-16 與 CS2023：理解函數式 (Scheme/Haskell) 思維，並印證 OS 與演算法底層。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n    \u003c/main>\n\n    \u003c!-- Footer -->\n    \u003cfooter class=\"bg-slate-800 text-slate-400 py-6 border-t border-slate-700 mt-12\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 text-center text-xs space-y-2\">\n            \u003cp>基於 Robert W. Sebesta《Concepts of Programming Languages》第 10-12 版與 ACM CS2023 課綱建構\u003c/p>\n            \u003cp class=\"text-slate-500\">單頁互動式應用程式 (SPA) — 語音導覽與知識體系整合版\u003c/p>\n        \u003c/div>\n    \u003c/footer>\n\n    \u003c!-- JavaScript Logic -->\n    \u003cscript>\n        // --- DATA STORE: Sebesta 16 Chapters ---\n        const matrixData = [\n            { layer: 'L1', layerName: '第一層：語法與剖析', ch: 'Ch 1', title: '基礎知識 (Preliminaries)', issues: '語言評估準則 (可讀/易寫/可靠性)、設計取捨、基本實現方式 (編譯/直譯/混合)', lang: '通用評估框架' },\n            { layer: 'L1', layerName: '第一層：語法與剖析', ch: 'Ch 2', title: '主要語言的演變 (Evolution)', issues: '語言起源與設計目的演進 (11-12版移除過時語言，納入 Python/Ruby/Swift)', lang: 'C, C++, Java, Swift, Python, Ruby' },\n            { layer: 'L1', layerName: '第一層：語法與剖析', ch: 'Ch 3', title: '描述語法與語意 (Syntax & Semantics)', issues: 'BNF 形式語法、屬性文法 (靜態語意)、操作/指稱/公理三大語意描述方法', lang: '語法規範與編譯器前端' },\n            { layer: 'L1', layerName: '第一層：語法與剖析', ch: 'Ch 4', title: '詞法與語法分析 (Lexical/Syntax)', issues: '詞法分析器 (Lexer) 與語法分析器 (Parser) 設計、為編譯器設計奠基', lang: 'GCC, LLVM 語言處理器' },\n            \n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 5', title: '名稱、繫結與作用域 (Names/Bindings/Scopes)', issues: '變數多重屬性、靜態與動態繫結 (Binding Time)、作用域 (Scope) 與生命週期', lang: 'C++, Java, Python, JavaScript' },\n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 6', title: '資料型別 (Data Types)', issues: '基本型別、複合型別、函數式資料結構、可選型別 (Optional Types)', lang: 'Swift (Optional), Rust, Haskell' },\n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 7', title: '運算式與賦值敘述 (Expressions)', issues: '運算式求值順序、副作用 (Side Effects)、過載運算子與賦值敘述取捨', lang: 'C, C++, Java, Python' },\n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 8', title: '敘述層級控制結構 (Control Structures)', issues: '選擇與重複敘述、函數式控制結構、迭代器 (Iterators) 機制', lang: 'Python (Iterators), Ruby' },\n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 9', title: '副程式 (Subprograms)', issues: '參數傳遞機制 (傳值/傳址/傳名稱)、過載副程式、泛型副程式設計', lang: 'C++, Java, Ada' },\n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 10', title: '實作副程式 (Implementing Subprograms)', issues: '副程式連結 (Subprogram Linkage)、活動記錄 (Activation Records)、堆疊與指標', lang: '組合語言與執行期堆疊' },\n\n            { layer: 'L3', layerName: '第三層：抽象與系統', ch: 'Ch 11', title: '抽象資料型別與封裝 (ADTs)', issues: '資料抽象化、資訊隱藏 (Information Hiding)、封裝結構與模組化設計', lang: 'C++, Java, Ada' },\n            { layer: 'L3', layerName: '第三層：抽象與系統', ch: 'Ch 12', title: '物件導向支援 (Support for OOP)', issues: '繼承 (Inheritance)、動態方法繫結 (Dynamic Binding)、反射 (Reflection)', lang: 'Smalltalk, C++, Java, Python, Ruby' },\n            { layer: 'L3', layerName: '第三層：抽象與系統', ch: 'Ch 13', title: '並行性 (Concurrency)', issues: '次序並行與單元並行、同步機制 (管程/訊息傳遞)、並行程式單元', lang: 'Java, Ada, Go' },\n            { layer: 'L3', layerName: '第三層：抽象與系統', ch: 'Ch 14', title: '例外與事件處理 (Exceptions/Events)', issues: '例外處理器 (Exception Handlers) 傳播機制、事件驅動程式設計', lang: 'Python, Ruby, C++, Java' },\n\n            { layer: 'L4', layerName: '第四層：多元典範', ch: 'Ch 15', title: '函數式程式語言 (Functional)', issues: '純函數、高階函數、λ算則、特殊形式與主流語言函數式結構引進', lang: 'Scheme, ML, Haskell, F#' },\n            { layer: 'L4', layerName: '第四層：多元典範', ch: 'Ch 16', title: '邏輯程式語言 (Logic)', issues: '謂詞邏輯、事實與規則資料庫、合一 (Unifier) 與反解歸導推論引擎', lang: 'Prolog' }\n        ];\n\n        // --- WEB SPEECH SYNTHESIS PLAYER LOGIC ---\n        let synth = window.speechSynthesis;\n        let utterance = null;\n        let isSpeaking = false;\n        let sentences = [];\n        let currentSentenceIdx = 0;\n\n        function initAudioSentences() {\n            const elements = document.querySelectorAll('.sentence');\n            sentences = Array.from(elements).map(el => el.innerText);\n        }\n\n        function playAudioSummary() {\n            if (!('speechSynthesis' in window)) {\n                alert('您的瀏覽器不支援 Web Speech 語音合成 API，請使用 Chrome, Edge 或 Safari 瀏覽器。');\n                return;\n            }\n\n            if (synth.speaking && synth.paused) {\n                synth.resume();\n                updateSpeechUI(true, '播放中...');\n                return;\n            }\n\n            if (synth.speaking) {\n                synth.cancel();\n            }\n\n            initAudioSentences();\n            currentSentenceIdx = 0;\n            speakNextSentence();\n        }\n\n        function speakNextSentence() {\n            if (currentSentenceIdx >= sentences.length) {\n                updateSpeechUI(false, '朗讀完成');\n                highlightSentence(-1);\n                return;\n            }\n\n            const text = sentences[currentSentenceIdx];\n            utterance = new SpeechSynthesisUtterance(text);\n            utterance.lang = 'zh-TW';\n            \n            const rateSelect = document.getElementById('rate-select');\n            utterance.rate = parseFloat(rateSelect.value) || 1.0;\n\n            utterance.onstart = () => {\n                updateSpeechUI(true, `朗讀中 (${currentSentenceIdx + 1}/${sentences.length})`);\n                highlightSentence(currentSentenceIdx);\n            };\n\n            utterance.onend = () => {\n                currentSentenceIdx++;\n                speakNextSentence();\n            };\n\n            utterance.onerror = () => {\n                updateSpeechUI(false, '發生錯誤');\n            };\n\n            synth.speak(utterance);\n        }\n\n        function pauseAudioSummary() {\n            if (synth.speaking && !synth.paused) {\n                synth.pause();\n                updateSpeechUI(false, '已暫停');\n            }\n        }\n\n        function stopAudioSummary() {\n            if (synth.speaking || synth.paused) {\n                synth.cancel();\n            }\n            currentSentenceIdx = 0;\n            highlightSentence(-1);\n            updateSpeechUI(false, '已重置');\n        }\n\n        function updateRate() {\n            if (synth.speaking) {\n                playAudioSummary(); // Restart with new rate\n            }\n        }\n\n        function highlightSentence(idx) {\n            const sentenceEls = document.querySelectorAll('.sentence');\n            sentenceEls.forEach((el, i) => {\n                if (i === idx) {\n                    el.classList.add('active-transcript-sentence');\n                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n                } else {\n                    el.classList.remove('active-transcript-sentence');\n                }\n            });\n        }\n\n        function updateSpeechUI(playing, statusText) {\n            const btnPlay = document.getElementById('btn-play');\n            const btnPause = document.getElementById('btn-pause');\n            const speechStatus = document.getElementById('speech-status');\n            const playText = document.getElementById('play-text');\n            const playIcon = document.getElementById('play-icon');\n\n            speechStatus.innerText = statusText;\n\n            if (playing) {\n                btnPlay.classList.add('hidden');\n                btnPause.classList.remove('hidden');\n                speechStatus.className = 'text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-medium animate-pulse';\n            } else {\n                btnPlay.classList.remove('hidden');\n                btnPause.classList.add('hidden');\n                speechStatus.className = 'text-xs px-2.5 py-1 rounded-full bg-slate-200 text-slate-600 font-medium';\n            }\n        }\n\n        // --- RENDER MATRIX TABLE ---\n        function renderMatrix(filter = 'all') {\n            const tbody = document.getElementById('matrix-table-body');\n            tbody.innerHTML = '';\n\n            const filteredData = filter === 'all' ? matrixData : matrixData.filter(item => item.layer === filter);\n\n            filteredData.forEach(item => {\n                const tr = document.createElement('tr');\n                tr.className = 'hover:bg-slate-50/80 transition border-b border-slate-100';\n\n                let badgeColor = 'bg-slate-100 text-slate-700';\n                if (item.layer === 'L1') badgeColor = 'bg-amber-100 text-amber-800';\n                if (item.layer === 'L2') badgeColor = 'bg-blue-100 text-blue-800';\n                if (item.layer === 'L3') badgeColor = 'bg-indigo-100 text-indigo-800';\n                if (item.layer === 'L4') badgeColor = 'bg-emerald-100 text-emerald-800';\n\n                tr.innerHTML = `\n                    \u003ctd class=\"p-3 font-semibold text-slate-800 whitespace-nowrap\">\n                        \u003cspan class=\"inline-block px-2 py-0.5 rounded text-xs ${badgeColor} mb-1 block w-fit\">${item.ch}\u003c/span>\n                    \u003c/td>\n                    \u003ctd class=\"p-3 font-bold text-slate-800\">${item.title}\u003c/td>\n                    \u003ctd class=\"p-3 text-slate-600\">${item.issues}\u003c/td>\n                    \u003ctd class=\"p-3 text-xs font-mono text-slate-500\">${item.lang}\u003c/td>\n                `;\n                tbody.appendChild(tr);\n            });\n        }\n\n        function filterMatrix(layer) {\n            renderMatrix(layer);\n            const btns = document.querySelectorAll('.matrix-btn');\n            btns.forEach(btn => {\n                btn.classList.remove('bg-amber-600', 'text-white');\n                btn.classList.add('bg-slate-100', 'text-slate-600');\n            });\n            event.target.classList.remove('bg-slate-100', 'text-slate-600');\n            event.target.classList.add('bg-amber-600', 'text-white');\n        }\n\n        // --- CHECKLIST LOGIC ---\n        let checkedState = [false, false, false, false, false];\n\n        function toggleCheck(step) {\n            const idx = step - 1;\n            checkedState[idx] = !checkedState[idx];\n            document.getElementById(`chk-${step}`).checked = checkedState[idx];\n            updateChecklistUI();\n        }\n\n        function resetChecklist() {\n            checkedState = [false, false, false, false, false];\n            for (let i = 1; i \u003c= 5; i++) {\n                document.getElementById(`chk-${i}`).checked = false;\n            }\n            updateChecklistUI();\n        }\n\n        function updateChecklistUI() {\n            const count = checkedState.filter(Boolean).length;\n            const pct = Math.round((count / 5) * 100);\n            document.getElementById('checklist-progress-text').innerText = `${pct}% (${count}/5)`;\n            document.getElementById('checklist-progress-bar').style.width = `${pct}%`;\n        }\n\n        // --- CHART.JS INITIALIZATION ---\n        function initCharts() {\n            // Chart 1: Layers Distribution Doughnut Chart\n            const ctx1 = document.getElementById('layersDoughnutChart').getContext('2d');\n            new Chart(ctx1, {\n                type: 'doughnut',\n                data: {\n                    labels: ['第一層：基礎剖析 (Ch 1-4)', '第二層：變數與控制 (Ch 5-10)', '第三層：抽象與系統 (Ch 11-14)', '第四層：多元典範 (Ch 15-16)'],\n                    datasets: [{\n                        data: [4, 6, 4, 2],\n                        backgroundColor: ['#F59E0B', '#3B82F6', '#6366F1', '#10B981'],\n                        borderWidth: 2,\n                        borderColor: '#ffffff'\n                    }]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    plugins: {\n                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },\n                        tooltip: {\n                            callbacks: {\n                                label: function(context) {\n                                    return ` ${context.label}: ${context.raw} 章節`;\n                                }\n                            }\n                        }\n                    },\n                    onClick: (evt, activeElements) => {\n                        if (activeElements.length > 0) {\n                            const idx = activeElements[0].index;\n                            const details = [\n                                '第一層：涵蓋評估準則、語言演化、BNF 語法與詞法剖析機制。',\n                                '第二層：涵蓋變數繫結、作用域、資料型別 (含 Swift 可選型別) 與副程式連結實作。',\n                                '第三層：涵蓋 ADT 封裝、OOP (繼承/動態繫結/反射)、並行與例外處理。',\n                                '第四層：涵蓋 Scheme/Haskell 函數式思維與 Prolog 邏輯推論典範。'\n                            ];\n                            document.getElementById('layer-detail-box').innerText = '💡 ' + details[idx];\n                        }\n                    }\n                }\n            });\n\n            // Chart 2: CS2023 Course Hours Bar Chart\n            const ctx2 = document.getElementById('cs2023BarChart').getContext('2d');\n            new Chart(ctx2, {\n                type: 'bar',\n                data: {\n                    labels: ['程式語言基礎 (FPL)', '自動機與形式語言', '語意與推理', '軟體工程基礎'],\n                    datasets: [{\n                        label: 'ACM CS2023 核心時數 (Hours)',\n                        data: [26, 8, 5, 5],\n                        backgroundColor: '#6366F1',\n                        borderRadius: 6\n                    }]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    scales: {\n                        y: { beginAtZero: true, grid: { color: '#F3F4F6' } },\n                        x: { grid: { display: false } }\n                    },\n                    plugins: {\n                        legend: { display: false }\n                    }\n                }\n            });\n        }\n\n        // --- ON DOM LOADED ---\n        document.addEventListener('DOMContentLoaded', () => {\n            renderMatrix('all');\n            initCharts();\n            initAudioSentences();\n        });\n    \u003c/script>\n\u003c/body>\n\u003c/html>"},{"title":"跨程式語言通用核心基礎 - 語音導覽與互動儀表板","path":"程式語言通用核心基礎指南/程式語言通用核心指南.html","snippet":"🎧 程式語言通用核心指南 語音摘要與互動知識體系儀表板 語音摘要 四大層次架構 設計議題比較 5步驟學習路徑 🎙️ 智慧語音朗讀系統 核心知識語音摘要 (Voice Summary) 本區塊將以語音方式為您導讀報告核…","size":36848,"mtime":1793454015328,"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-TW\">\n\u003chead>\n    \u003cmeta charset=\"utf-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>跨程式語言通用核心基礎 - 語音導覽與互動儀表板\u003c/title>\n    \u003c!-- Tailwind CSS CDN -->\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003c!-- Chart.js CDN -->\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/chart.js\">\u003c/script>\n    \u003c!-- Google Fonts -->\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">\n    \u003cstyle>\n        body {\n            font-family: 'Noto Sans TC', sans-serif;\n            background-color: #FAF8F5;\n            color: #2D3748;\n        }\n        .chart-container {\n            position: relative;\n            width: 100%;\n            max-width: 580px;\n            margin-left: auto;\n            margin-right: auto;\n            height: 320px;\n            max-height: 380px;\n        }\n        @media (min-width: 768px) {\n            .chart-container {\n                height: 350px;\n            }\n        }\n        .active-transcript-sentence {\n            background-color: #FEF3C7;\n            color: #92400E;\n            font-weight: 600;\n            padding: 2px 4px;\n            border-radius: 4px;\n            transition: all 0.2s ease;\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"min-h-screen flex flex-col\">\n\n    \u003c!-- Chosen Palette: Warm Neutral Clarity (Cream #FAF8F5, Slate Gray #2D3748, Amber #D97706, Indigo #4F46E5) -->\n    \u003c!-- Application Structure Plan: Designed as a dual-purpose Web Speech audio guide and interactive dashboard. Section 1 features an active Speech Synthesis player with sentence-by-sentence text highlighting. Section 2 provides interactive visual breakdown of Sebesta's 4 layers and CS2023 course hours using Chart.js. Section 3 hosts a filterable design-issue comparison matrix. Section 4 offers an interactive 5-step learning path checklist with instant progress tracking. This structure allows both auditory listeners and visual learners to digest complex computer science concepts effortlessly. -->\n    \u003c!-- Visualization & Content Choices: 1. CS2023 & Sebesta Layer Breakdown -> Chart.js Bar & Doughnut Charts (Canvas rendered, responsive container). 2. Audio Script Player -> Web Speech API with dynamic transcript highlighting. 3. 16-Chapter Matrix -> Filterable HTML Grid with stateful JS filtering. 4. Checklist -> Stateful HTML/JS interactive task tracker. Confirming NO SVG / NO Mermaid JS. -->\n    \u003c!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->\n\n    \u003c!-- Header Navigation -->\n    \u003cheader class=\"sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-amber-100 shadow-sm\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4\">\n            \u003cdiv class=\"flex items-center gap-3\">\n                \u003cspan class=\"inline-flex items-center justify-center w-10 h-10 rounded-xl bg-amber-500 text-white font-bold text-lg shadow\">\n                    🎧\n                \u003c/span>\n                \u003cdiv>\n                    \u003ch1 class=\"font-bold text-lg text-slate-800 leading-tight\">程式語言通用核心指南\u003c/h1>\n                    \u003cp class=\"text-xs text-slate-500\">語音摘要與互動知識體系儀表板\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            \n            \u003cnav class=\"flex items-center gap-2 text-sm font-medium text-slate-600\">\n                \u003ca href=\"#audio-player\" class=\"px-3 py-1.5 rounded-lg hover:bg-amber-50 hover:text-amber-700 transition\">語音摘要\u003c/a>\n                \u003ca href=\"#structure-overview\" class=\"px-3 py-1.5 rounded-lg hover:bg-amber-50 hover:text-amber-700 transition\">四大層次架構\u003c/a>\n                \u003ca href=\"#matrix-section\" class=\"px-3 py-1.5 rounded-lg hover:bg-amber-50 hover:text-amber-700 transition\">設計議題比較\u003c/a>\n                \u003ca href=\"#action-checklist\" class=\"px-3 py-1.5 rounded-lg hover:bg-amber-50 hover:text-amber-700 transition\">5步驟學習路徑\u003c/a>\n            \u003c/nav>\n        \u003c/div>\n    \u003c/header>\n\n    \u003c!-- Main Container -->\n    \u003cmain class=\"flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12\">\n\n        \u003c!-- SECTION 1: Audio Summary Player & Interactive Transcript -->\n        \u003csection id=\"audio-player\" class=\"bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-amber-100/60 relative overflow-hidden\">\n            \u003cdiv class=\"absolute -right-12 -top-12 w-48 h-48 bg-amber-100/40 rounded-full blur-2xl pointer-events-none\">\u003c/div>\n            \n            \u003cdiv class=\"mb-6\">\n                \u003cdiv class=\"inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-semibold mb-2\">\n                    \u003cspan>🎙️ 智慧語音朗讀系統\u003c/span>\n                \u003c/div>\n                \u003ch2 class=\"text-2xl font-bold text-slate-800\">核心知識語音摘要 (Voice Summary)\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm mt-1\">\n                    本區塊將以語音方式為您導讀報告核心精華。您可以點擊下方播放鈕直接聆聽，並隨同即時同步的逐字重點進行全域學習。\n                \u003c/p>\n            \u003c/div>\n\n            \u003c!-- Audio Controller Box -->\n            \u003cdiv class=\"bg-slate-50 rounded-xl p-4 sm:p-6 border border-slate-200 mb-6 flex flex-col md:flex-row items-center justify-between gap-6\">\n                \u003c!-- Play Controls -->\n                \u003cdiv class=\"flex items-center gap-3 w-full md:w-auto justify-center\">\n                    \u003cbutton id=\"btn-play\" onclick=\"playAudioSummary()\" class=\"flex items-center gap-2 bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md transition transform active:scale-95\">\n                        \u003cspan id=\"play-icon\">▶\u003c/span>\n                        \u003cspan id=\"play-text\">播放語音摘要\u003c/span>\n                    \u003c/button>\n                    \u003cbutton id=\"btn-pause\" onclick=\"pauseAudioSummary()\" class=\"hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2.5 rounded-xl transition\">\n                        ⏸ 暫停\n                    \u003c/button>\n                    \u003cbutton id=\"btn-stop\" onclick=\"stopAudioSummary()\" class=\"bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2.5 rounded-xl transition\">\n                        ⏹ 重置\n                    \u003c/button>\n                \u003c/div>\n\n                \u003c!-- Settings: Speed & Voice Choice -->\n                \u003cdiv class=\"flex flex-wrap items-center justify-center gap-4 w-full md:w-auto text-sm\">\n                    \u003cdiv class=\"flex items-center gap-2\">\n                        \u003clabel for=\"rate-select\" class=\"text-slate-600 font-medium\">語速:\u003c/label>\n                        \u003cselect id=\"rate-select\" onchange=\"updateRate()\" class=\"bg-white border border-slate-300 rounded-lg px-2.5 py-1 text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500\">\n                            \u003coption value=\"0.8\">0.8x (慢)\u003c/option>\n                            \u003coption value=\"1\" selected>1.0x (標準)\u003c/option>\n                            \u003coption value=\"1.2\">1.2x (快)\u003c/option>\n                            \u003coption value=\"1.5\">1.5x (特快)\u003c/option>\n                        \u003c/select>\n                    \u003c/div>\n                    \u003cdiv class=\"flex items-center gap-2\">\n                        \u003cspan id=\"speech-status\" class=\"text-xs px-2.5 py-1 rounded-full bg-slate-200 text-slate-600 font-medium\">\n                            準備就緒\n                        \u003c/span>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Interactive Transcript Blocks -->\n            \u003cdiv id=\"transcript-container\" class=\"space-y-4 max-h-80 overflow-y-auto pr-2 border-l-2 border-amber-200 pl-4 text-slate-700 leading-relaxed text-sm sm:text-base\">\n                \u003cdiv id=\"section-s1\" class=\"p-2 rounded hover:bg-amber-50/50 transition\">\n                    \u003cspan class=\"font-bold text-amber-800 block text-xs mb-1\">【導言：跨語言的心智模型】\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"0\">學習任何一門程式語言，最核心的任務不是死記特定語法，而是建立跨語言的通用概念框架。\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"1\">根據 Sebesta 教授經典教材《程式語言概念》，當代程式語言底層可拆解為四大層次：評估準則與剖析、變數繫結與控制流、抽象化與並行、以及多元程式設計典範。\u003c/span>\n                \u003c/div>\n\n                \u003cdiv id=\"section-s2\" class=\"p-2 rounded hover:bg-amber-50/50 transition\">\n                    \u003cspan class=\"font-bold text-indigo-800 block text-xs mb-1\">【重點 1：看穿設計取捨與評估標準】\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"2\">ACM CS2023 課綱將程式語言基礎列為核心支柱，劃定 26 小時的核心時數。\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"3\">工程師的核心競爭力，在於理解語言設計背後的設計議題與取捨，批判性比較不同語言替代方案，而非僅止於符號操作。\u003c/span>\n                \u003c/div>\n\n                \u003cdiv id=\"section-s3\" class=\"p-2 rounded hover:bg-amber-50/50 transition\">\n                    \u003cspan class=\"font-bold text-emerald-800 block text-xs mb-1\">【重點 2：從語法到執行期連結】\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"4\">掌握 BNF 與屬性文法能幫助理解靜態語意，而理解副程式呼叫與返回的底層連結實作，則是看透程式執行期的關鍵。\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"5\">現代語言更持續導入如 Swift 的可選型別，以及 Python 的迭代器與反射機制，來提升安全性與開發效率。\u003c/span>\n                \u003c/div>\n\n                \u003cdiv id=\"section-s4\" class=\"p-2 rounded hover:bg-amber-50/50 transition\">\n                    \u003cspan class=\"font-bold text-amber-800 block text-xs mb-1\">【重點 3：實務 5 步驟微型手冊學習法】\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"6\">當掌握通用框架後，面對新語言僅需約 100 頁的微型手冊即可快速上手。\u003c/span>\n                    \u003cspan class=\"sentence\" data-idx=\"7\">學習路徑包含：確認實現方式、釐清變數與型別、掌握控制結構與副程式、檢視 OOP 與例外處理，最後融合多元典範。\u003c/span>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 2: Conceptual Breakdown & Visual Charts -->\n        \u003csection id=\"structure-overview\" class=\"space-y-6\">\n            \u003cdiv class=\"border-b border-slate-200 pb-3\">\n                \u003ch2 class=\"text-2xl font-bold text-slate-800\">四大演進層次與 CS2023 時數配置\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm mt-1\">\n                    本區塊展示 Sebesta《程式語言概念》16 大章節的四大層次分配，以及國際權威 ACM CS2023 課綱中對「程式語言基礎（FPL）」與相關學門的核心時數權重配置。\n                \u003c/p>\n            \u003c/div>\n\n            \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch\">\n                \u003c!-- Chart 1: Sebesta 16 Chapters Distribution -->\n                \u003cdiv class=\"bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between\">\n                    \u003cdiv>\n                        \u003ch3 class=\"font-bold text-slate-800 text-lg mb-1\">Sebesta 16 章四大知識層次分佈\u003c/h3>\n                        \u003cp class=\"text-xs text-slate-500 mb-4\">點擊圖表區塊可檢視各層次對應之關鍵設計議題\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"chart-container\">\n                        \u003ccanvas id=\"layersDoughnutChart\">\u003c/canvas>\n                    \u003c/div>\n                    \u003cdiv id=\"layer-detail-box\" class=\"mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900\">\n                        💡 點擊上方圓餅圖區塊，查看各層次所涵蓋的關鍵章節與設計重點。\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- Chart 2: CS2023 Core Hours -->\n                \u003cdiv class=\"bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between\">\n                    \u003cdiv>\n                        \u003ch3 class=\"font-bold text-slate-800 text-lg mb-1\">ACM CS2023 相關學科核心時數配置\u003c/h3>\n                        \u003cp class=\"text-xs text-slate-500 mb-4\">強調程式語言基礎與軟體工程、系統運算的深層連結 (CS-Core Hours)\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"chart-container\">\n                        \u003ccanvas id=\"cs2023BarChart\">\u003c/canvas>\n                    \u003c/div>\n                    \u003cdiv class=\"mt-4 p-3 bg-indigo-50 border border-indigo-200 rounded-xl text-xs text-indigo-900\">\n                        📌 CS2023 劃定 26 小時 FPL 核心課程，並佐以 18 小時自動機、語意推理與軟體工程等跨領域時數。\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 3: Design Issues Comparison Matrix -->\n        \u003csection id=\"matrix-section\" class=\"bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200 space-y-6\">\n            \u003cdiv class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-4\">\n                \u003cdiv>\n                    \u003ch2 class=\"text-2xl font-bold text-slate-800\">16章跨語言核心設計議題（Design Issues）矩陣\u003c/h2>\n                    \u003cp class=\"text-slate-600 text-sm mt-1\">\n                        理解不同語言在相同問題上的設計取捨。請選擇特定層次進行動態篩選探索：\n                    \u003c/p>\n                \u003c/div>\n                \u003c!-- Filter Buttons -->\n                \u003cdiv class=\"flex flex-wrap gap-2\" id=\"matrix-filters\">\n                    \u003cbutton onclick=\"filterMatrix('all')\" class=\"matrix-btn active-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-600 text-white transition\">全部章節\u003c/button>\n                    \u003cbutton onclick=\"filterMatrix('L1')\" class=\"matrix-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition\">第一層：基礎剖析\u003c/button>\n                    \u003cbutton onclick=\"filterMatrix('L2')\" class=\"matrix-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition\">第二層：變數控制\u003c/button>\n                    \u003cbutton onclick=\"filterMatrix('L3')\" class=\"matrix-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition\">第三層：抽象並行\u003c/button>\n                    \u003cbutton onclick=\"filterMatrix('L4')\" class=\"matrix-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition\">第四層：多元典範\u003c/button>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- Interactive Table/Grid -->\n            \u003cdiv class=\"overflow-x-auto\">\n                \u003ctable class=\"w-full text-left text-sm text-slate-700 border-collapse\">\n                    \u003cthead>\n                        \u003ctr class=\"bg-slate-50 border-b border-slate-200 text-slate-800\">\n                            \u003cth class=\"p-3 font-semibold\">章節\u003c/th>\n                            \u003cth class=\"p-3 font-semibold\">核心模組名稱\u003c/th>\n                            \u003cth class=\"p-3 font-semibold\">跨語言必懂之關鍵設計議題 (Design Issues)\u003c/th>\n                            \u003cth class=\"p-3 font-semibold\">代表性語言實例\u003c/th>\n                        \u003c/tr>\n                    \u003c/thead>\n                    \u003ctbody id=\"matrix-table-body\" class=\"divide-y divide-slate-100\">\n                        \u003c!-- Dynamic content populated by JavaScript -->\n                    \u003c/tbody>\n                \u003c/table>\n            \u003c/div>\n        \u003c/section>\n\n        \u003c!-- SECTION 4: 5-Step Action Checklist & Practical Path -->\n        \u003csection id=\"action-checklist\" class=\"bg-amber-900/5 rounded-2xl p-6 sm:p-8 border border-amber-200 space-y-6\">\n            \u003cdiv>\n                \u003cspan class=\"text-xs font-bold uppercase tracking-wider text-amber-700\">Practical Roadmap\u003c/span>\n                \u003ch2 class=\"text-2xl font-bold text-slate-800\">新語言快速上手：5步驟實務學習檢核清單\u003c/h2>\n                \u003cp class=\"text-slate-600 text-sm mt-1\">\n                    基於 Sebesta 配套「微型手冊（Mini-manuals）」學習哲學。當你學習任何新程式語言時，請對照以下步驟勾選完成檢核：\n                \u003c/p>\n            \u003c/div>\n\n            \u003c!-- Progress Bar -->\n            \u003cdiv class=\"bg-white p-4 rounded-xl border border-amber-200 flex flex-col sm:flex-row items-center justify-between gap-4\">\n                \u003cdiv class=\"w-full sm:w-2/3\">\n                    \u003cdiv class=\"flex justify-between text-xs font-semibold text-slate-700 mb-1\">\n                        \u003cspan>學習檢核完成度\u003c/span>\n                        \u003cspan id=\"checklist-progress-text\">0% (0/5)\u003c/span>\n                    \u003c/div>\n                    \u003cdiv class=\"w-full bg-slate-200 rounded-full h-2.5 overflow-hidden\">\n                        \u003cdiv id=\"checklist-progress-bar\" class=\"bg-amber-600 h-2.5 rounded-full transition-all duration-300\" style=\"width: 0%\">\u003c/div>\n                    \u003c/div>\n                \u003c/div>\n                \u003cbutton onclick=\"resetChecklist()\" class=\"text-xs font-medium text-amber-800 hover:underline\">\n                    🔄 重置檢核表\n                \u003c/button>\n            \u003c/div>\n\n            \u003c!-- Checklist Items -->\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4\" id=\"checklist-items\">\n                \u003c!-- Card 1 -->\n                \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 cursor-pointer hover:border-amber-400 transition\" onclick=\"toggleCheck(1)\">\n                    \u003cinput type=\"checkbox\" id=\"chk-1\" class=\"mt-1 h-4 w-4 text-amber-600 rounded focus:ring-amber-500\">\n                    \u003cdiv>\n                        \u003ch4 class=\"font-bold text-slate-800 text-sm\">1. 確認起源與實現方式\u003c/h4>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">對應 Ch 1-4：了解歷史背景、BNF 語法描述與編譯/直譯器處理器架構。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n                \u003c!-- Card 2 -->\n                \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 cursor-pointer hover:border-amber-400 transition\" onclick=\"toggleCheck(2)\">\n                    \u003cinput type=\"checkbox\" id=\"chk-2\" class=\"mt-1 h-4 w-4 text-amber-600 rounded focus:ring-amber-500\">\n                    \u003cdiv>\n                        \u003ch4 class=\"font-bold text-slate-800 text-sm\">2. 釐清變數與型別系統\u003c/h4>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">對應 Ch 5-6：鎖定作用域規則、動/靜態繫結，以及是否具備可選型別 (Optional Types)。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n                \u003c!-- Card 3 -->\n                \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 cursor-pointer hover:border-amber-400 transition\" onclick=\"toggleCheck(3)\">\n                    \u003cinput type=\"checkbox\" id=\"chk-3\" class=\"mt-1 h-4 w-4 text-amber-600 rounded focus:ring-amber-500\">\n                    \u003cdiv>\n                        \u003ch4 class=\"font-bold text-slate-800 text-sm\">3. 掌握控制結構與副程式\u003c/h4>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">對應 Ch 7-10：熟悉迭代器 (Iterators)、運算式求值與底層副程式連結 (Subprogram Linkage)。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n                \u003c!-- Card 4 -->\n                \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 cursor-pointer hover:border-amber-400 transition\" onclick=\"toggleCheck(4)\">\n                    \u003cinput type=\"checkbox\" id=\"chk-4\" class=\"mt-1 h-4 w-4 text-amber-600 rounded focus:ring-amber-500\">\n                    \u003cdiv>\n                        \u003ch4 class=\"font-bold text-slate-800 text-sm\">4. 檢視模組封裝與物件導向\u003c/h4>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">對應 Ch 11-14：掌握 ADT 封裝、繼承、動態方法繫結、反射 (Reflection) 與例外處理。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n                \u003c!-- Card 5 -->\n                \u003cdiv class=\"bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-start gap-3 cursor-pointer hover:border-amber-400 transition\" onclick=\"toggleCheck(5)\">\n                    \u003cinput type=\"checkbox\" id=\"chk-5\" class=\"mt-1 h-4 w-4 text-amber-600 rounded focus:ring-amber-500\">\n                    \u003cdiv>\n                        \u003ch4 class=\"font-bold text-slate-800 text-sm\">5. 融合多元典範與電腦系統\u003c/h4>\n                        \u003cp class=\"text-xs text-slate-500 mt-1\">對應 Ch 15-16 與 CS2023：理解函數式 (Scheme/Haskell) 思維，並印證 OS 與演算法底層。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n    \u003c/main>\n\n    \u003c!-- Footer -->\n    \u003cfooter class=\"bg-slate-800 text-slate-400 py-6 border-t border-slate-700 mt-12\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 text-center text-xs space-y-2\">\n            \u003cp>基於 Robert W. Sebesta《Concepts of Programming Languages》第 10-12 版與 ACM CS2023 課綱建構\u003c/p>\n            \u003cp class=\"text-slate-500\">單頁互動式應用程式 (SPA) — 語音導覽與知識體系整合版\u003c/p>\n        \u003c/div>\n    \u003c/footer>\n\n    \u003c!-- JavaScript Logic -->\n    \u003cscript>\n        // --- DATA STORE: Sebesta 16 Chapters ---\n        const matrixData = [\n            { layer: 'L1', layerName: '第一層：語法與剖析', ch: 'Ch 1', title: '基礎知識 (Preliminaries)', issues: '語言評估準則 (可讀/易寫/可靠性)、設計取捨、基本實現方式 (編譯/直譯/混合)', lang: '通用評估框架' },\n            { layer: 'L1', layerName: '第一層：語法與剖析', ch: 'Ch 2', title: '主要語言的演變 (Evolution)', issues: '語言起源與設計目的演進 (11-12版移除過時語言，納入 Python/Ruby/Swift)', lang: 'C, C++, Java, Swift, Python, Ruby' },\n            { layer: 'L1', layerName: '第一層：語法與剖析', ch: 'Ch 3', title: '描述語法與語意 (Syntax & Semantics)', issues: 'BNF 形式語法、屬性文法 (靜態語意)、操作/指稱/公理三大語意描述方法', lang: '語法規範與編譯器前端' },\n            { layer: 'L1', layerName: '第一層：語法與剖析', ch: 'Ch 4', title: '詞法與語法分析 (Lexical/Syntax)', issues: '詞法分析器 (Lexer) 與語法分析器 (Parser) 設計、為編譯器設計奠基', lang: 'GCC, LLVM 語言處理器' },\n            \n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 5', title: '名稱、繫結與作用域 (Names/Bindings/Scopes)', issues: '變數多重屬性、靜態與動態繫結 (Binding Time)、作用域 (Scope) 與生命週期', lang: 'C++, Java, Python, JavaScript' },\n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 6', title: '資料型別 (Data Types)', issues: '基本型別、複合型別、函數式資料結構、可選型別 (Optional Types)', lang: 'Swift (Optional), Rust, Haskell' },\n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 7', title: '運算式與賦值敘述 (Expressions)', issues: '運算式求值順序、副作用 (Side Effects)、過載運算子與賦值敘述取捨', lang: 'C, C++, Java, Python' },\n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 8', title: '敘述層級控制結構 (Control Structures)', issues: '選擇與重複敘述、函數式控制結構、迭代器 (Iterators) 機制', lang: 'Python (Iterators), Ruby' },\n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 9', title: '副程式 (Subprograms)', issues: '參數傳遞機制 (傳值/傳址/傳名稱)、過載副程式、泛型副程式設計', lang: 'C++, Java, Ada' },\n            { layer: 'L2', layerName: '第二層：變數型別控制', ch: 'Ch 10', title: '實作副程式 (Implementing Subprograms)', issues: '副程式連結 (Subprogram Linkage)、活動記錄 (Activation Records)、堆疊與指標', lang: '組合語言與執行期堆疊' },\n\n            { layer: 'L3', layerName: '第三層：抽象與系統', ch: 'Ch 11', title: '抽象資料型別與封裝 (ADTs)', issues: '資料抽象化、資訊隱藏 (Information Hiding)、封裝結構與模組化設計', lang: 'C++, Java, Ada' },\n            { layer: 'L3', layerName: '第三層：抽象與系統', ch: 'Ch 12', title: '物件導向支援 (Support for OOP)', issues: '繼承 (Inheritance)、動態方法繫結 (Dynamic Binding)、反射 (Reflection)', lang: 'Smalltalk, C++, Java, Python, Ruby' },\n            { layer: 'L3', layerName: '第三層：抽象與系統', ch: 'Ch 13', title: '並行性 (Concurrency)', issues: '次序並行與單元並行、同步機制 (管程/訊息傳遞)、並行程式單元', lang: 'Java, Ada, Go' },\n            { layer: 'L3', layerName: '第三層：抽象與系統', ch: 'Ch 14', title: '例外與事件處理 (Exceptions/Events)', issues: '例外處理器 (Exception Handlers) 傳播機制、事件驅動程式設計', lang: 'Python, Ruby, C++, Java' },\n\n            { layer: 'L4', layerName: '第四層：多元典範', ch: 'Ch 15', title: '函數式程式語言 (Functional)', issues: '純函數、高階函數、λ算則、特殊形式與主流語言函數式結構引進', lang: 'Scheme, ML, Haskell, F#' },\n            { layer: 'L4', layerName: '第四層：多元典範', ch: 'Ch 16', title: '邏輯程式語言 (Logic)', issues: '謂詞邏輯、事實與規則資料庫、合一 (Unifier) 與反解歸導推論引擎', lang: 'Prolog' }\n        ];\n\n        // --- WEB SPEECH SYNTHESIS PLAYER LOGIC ---\n        let synth = window.speechSynthesis;\n        let utterance = null;\n        let isSpeaking = false;\n        let sentences = [];\n        let currentSentenceIdx = 0;\n\n        function initAudioSentences() {\n            const elements = document.querySelectorAll('.sentence');\n            sentences = Array.from(elements).map(el => el.innerText);\n        }\n\n        function playAudioSummary() {\n            if (!('speechSynthesis' in window)) {\n                alert('您的瀏覽器不支援 Web Speech 語音合成 API，請使用 Chrome, Edge 或 Safari 瀏覽器。');\n                return;\n            }\n\n            if (synth.speaking && synth.paused) {\n                synth.resume();\n                updateSpeechUI(true, '播放中...');\n                return;\n            }\n\n            if (synth.speaking) {\n                synth.cancel();\n            }\n\n            initAudioSentences();\n            currentSentenceIdx = 0;\n            speakNextSentence();\n        }\n\n        function speakNextSentence() {\n            if (currentSentenceIdx >= sentences.length) {\n                updateSpeechUI(false, '朗讀完成');\n                highlightSentence(-1);\n                return;\n            }\n\n            const text = sentences[currentSentenceIdx];\n            utterance = new SpeechSynthesisUtterance(text);\n            utterance.lang = 'zh-TW';\n            \n            const rateSelect = document.getElementById('rate-select');\n            utterance.rate = parseFloat(rateSelect.value) || 1.0;\n\n            utterance.onstart = () => {\n                updateSpeechUI(true, `朗讀中 (${currentSentenceIdx + 1}/${sentences.length})`);\n                highlightSentence(currentSentenceIdx);\n            };\n\n            utterance.onend = () => {\n                currentSentenceIdx++;\n                speakNextSentence();\n            };\n\n            utterance.onerror = () => {\n                updateSpeechUI(false, '發生錯誤');\n            };\n\n            synth.speak(utterance);\n        }\n\n        function pauseAudioSummary() {\n            if (synth.speaking && !synth.paused) {\n                synth.pause();\n                updateSpeechUI(false, '已暫停');\n            }\n        }\n\n        function stopAudioSummary() {\n            if (synth.speaking || synth.paused) {\n                synth.cancel();\n            }\n            currentSentenceIdx = 0;\n            highlightSentence(-1);\n            updateSpeechUI(false, '已重置');\n        }\n\n        function updateRate() {\n            if (synth.speaking) {\n                playAudioSummary(); // Restart with new rate\n            }\n        }\n\n        function highlightSentence(idx) {\n            const sentenceEls = document.querySelectorAll('.sentence');\n            sentenceEls.forEach((el, i) => {\n                if (i === idx) {\n                    el.classList.add('active-transcript-sentence');\n                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n                } else {\n                    el.classList.remove('active-transcript-sentence');\n                }\n            });\n        }\n\n        function updateSpeechUI(playing, statusText) {\n            const btnPlay = document.getElementById('btn-play');\n            const btnPause = document.getElementById('btn-pause');\n            const speechStatus = document.getElementById('speech-status');\n            const playText = document.getElementById('play-text');\n            const playIcon = document.getElementById('play-icon');\n\n            speechStatus.innerText = statusText;\n\n            if (playing) {\n                btnPlay.classList.add('hidden');\n                btnPause.classList.remove('hidden');\n                speechStatus.className = 'text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-medium animate-pulse';\n            } else {\n                btnPlay.classList.remove('hidden');\n                btnPause.classList.add('hidden');\n                speechStatus.className = 'text-xs px-2.5 py-1 rounded-full bg-slate-200 text-slate-600 font-medium';\n            }\n        }\n\n        // --- RENDER MATRIX TABLE ---\n        function renderMatrix(filter = 'all') {\n            const tbody = document.getElementById('matrix-table-body');\n            tbody.innerHTML = '';\n\n            const filteredData = filter === 'all' ? matrixData : matrixData.filter(item => item.layer === filter);\n\n            filteredData.forEach(item => {\n                const tr = document.createElement('tr');\n                tr.className = 'hover:bg-slate-50/80 transition border-b border-slate-100';\n\n                let badgeColor = 'bg-slate-100 text-slate-700';\n                if (item.layer === 'L1') badgeColor = 'bg-amber-100 text-amber-800';\n                if (item.layer === 'L2') badgeColor = 'bg-blue-100 text-blue-800';\n                if (item.layer === 'L3') badgeColor = 'bg-indigo-100 text-indigo-800';\n                if (item.layer === 'L4') badgeColor = 'bg-emerald-100 text-emerald-800';\n\n                tr.innerHTML = `\n                    \u003ctd class=\"p-3 font-semibold text-slate-800 whitespace-nowrap\">\n                        \u003cspan class=\"inline-block px-2 py-0.5 rounded text-xs ${badgeColor} mb-1 block w-fit\">${item.ch}\u003c/span>\n                    \u003c/td>\n                    \u003ctd class=\"p-3 font-bold text-slate-800\">${item.title}\u003c/td>\n                    \u003ctd class=\"p-3 text-slate-600\">${item.issues}\u003c/td>\n                    \u003ctd class=\"p-3 text-xs font-mono text-slate-500\">${item.lang}\u003c/td>\n                `;\n                tbody.appendChild(tr);\n            });\n        }\n\n        function filterMatrix(layer) {\n            renderMatrix(layer);\n            const btns = document.querySelectorAll('.matrix-btn');\n            btns.forEach(btn => {\n                btn.classList.remove('bg-amber-600', 'text-white');\n                btn.classList.add('bg-slate-100', 'text-slate-600');\n            });\n            event.target.classList.remove('bg-slate-100', 'text-slate-600');\n            event.target.classList.add('bg-amber-600', 'text-white');\n        }\n\n        // --- CHECKLIST LOGIC ---\n        let checkedState = [false, false, false, false, false];\n\n        function toggleCheck(step) {\n            const idx = step - 1;\n            checkedState[idx] = !checkedState[idx];\n            document.getElementById(`chk-${step}`).checked = checkedState[idx];\n            updateChecklistUI();\n        }\n\n        function resetChecklist() {\n            checkedState = [false, false, false, false, false];\n            for (let i = 1; i \u003c= 5; i++) {\n                document.getElementById(`chk-${i}`).checked = false;\n            }\n            updateChecklistUI();\n        }\n\n        function updateChecklistUI() {\n            const count = checkedState.filter(Boolean).length;\n            const pct = Math.round((count / 5) * 100);\n            document.getElementById('checklist-progress-text').innerText = `${pct}% (${count}/5)`;\n            document.getElementById('checklist-progress-bar').style.width = `${pct}%`;\n        }\n\n        // --- CHART.JS INITIALIZATION ---\n        function initCharts() {\n            // Chart 1: Layers Distribution Doughnut Chart\n            const ctx1 = document.getElementById('layersDoughnutChart').getContext('2d');\n            new Chart(ctx1, {\n                type: 'doughnut',\n                data: {\n                    labels: ['第一層：基礎剖析 (Ch 1-4)', '第二層：變數與控制 (Ch 5-10)', '第三層：抽象與系統 (Ch 11-14)', '第四層：多元典範 (Ch 15-16)'],\n                    datasets: [{\n                        data: [4, 6, 4, 2],\n                        backgroundColor: ['#F59E0B', '#3B82F6', '#6366F1', '#10B981'],\n                        borderWidth: 2,\n                        borderColor: '#ffffff'\n                    }]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    plugins: {\n                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },\n                        tooltip: {\n                            callbacks: {\n                                label: function(context) {\n                                    return ` ${context.label}: ${context.raw} 章節`;\n                                }\n                            }\n                        }\n                    },\n                    onClick: (evt, activeElements) => {\n                        if (activeElements.length > 0) {\n                            const idx = activeElements[0].index;\n                            const details = [\n                                '第一層：涵蓋評估準則、語言演化、BNF 語法與詞法剖析機制。',\n                                '第二層：涵蓋變數繫結、作用域、資料型別 (含 Swift 可選型別) 與副程式連結實作。',\n                                '第三層：涵蓋 ADT 封裝、OOP (繼承/動態繫結/反射)、並行與例外處理。',\n                                '第四層：涵蓋 Scheme/Haskell 函數式思維與 Prolog 邏輯推論典範。'\n                            ];\n                            document.getElementById('layer-detail-box').innerText = '💡 ' + details[idx];\n                        }\n                    }\n                }\n            });\n\n            // Chart 2: CS2023 Course Hours Bar Chart\n            const ctx2 = document.getElementById('cs2023BarChart').getContext('2d');\n            new Chart(ctx2, {\n                type: 'bar',\n                data: {\n                    labels: ['程式語言基礎 (FPL)', '自動機與形式語言', '語意與推理', '軟體工程基礎'],\n                    datasets: [{\n                        label: 'ACM CS2023 核心時數 (Hours)',\n                        data: [26, 8, 5, 5],\n                        backgroundColor: '#6366F1',\n                        borderRadius: 6\n                    }]\n                },\n                options: {\n                    responsive: true,\n                    maintainAspectRatio: false,\n                    scales: {\n                        y: { beginAtZero: true, grid: { color: '#F3F4F6' } },\n                        x: { grid: { display: false } }\n                    },\n                    plugins: {\n                        legend: { display: false }\n                    }\n                }\n            });\n        }\n\n        // --- ON DOM LOADED ---\n        document.addEventListener('DOMContentLoaded', () => {\n            renderMatrix('all');\n            initCharts();\n            initAudioSentences();\n        });\n    \u003c/script>\n\u003c/body>\n\u003c/html>"},{"title":"2026 電腦與手機完整防毒防駭語音摘要與互動指南","path":"電腦與手機完整防毒防駭指南/2026 全平台防毒防駭終極指南.html","snippet":"🛡️ 2026 全平台防毒防駭終極指南 語音導覽與互動式端點防禦藍圖 系統版本：2026Q4 最新基線 🎙️ 語音摘要與逐字稿 📊 2026威脅趨勢 💻📱 作業系統安全設定 🧪 防毒軟體評測數據 🌐 加密D…","size":53408,"mtime":1793454339338,"html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-TW\">\n\u003chead>\n    \u003cmeta charset=\"utf-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>2026 電腦與手機完整防毒防駭語音摘要與互動指南\u003c/title>\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/chart.js\">\u003c/script>\n    \u003cstyle>\n        .chart-container {\n            position: relative;\n            width: 100%;\n            max-width: 650px;\n            margin-left: auto;\n            margin-right: auto;\n            height: 320px;\n            max-height: 400px;\n        }\n        @media (min-width: 768px) {\n            .chart-container {\n                height: 360px;\n            }\n        }\n        .active-tab {\n            border-bottom: 3px solid #4f46e5;\n            color: #4f46e5;\n            font-weight: 600;\n        }\n        .active-script {\n            background-color: #eef2ff;\n            border-left: 4px solid #4f46e5;\n        }\n    \u003c/style>\n\u003c/head>\n\u003c!-- Chosen Palette: Warm Neutral Security (Slate & Warm Indigo) -->\n\u003c!-- Application Structure Plan: Designed a 6-tab interactive SPA centered around a Voice Summary Player (Web Speech API) with interactive transcript synchronization, followed by threat analytical dashboards, OS defense step-by-step checklists, AV-TEST benchmark comparison charts, dynamic DNS selector, and an interactive Incident Response decision tool. This non-linear navigation allows users to listen to spoken key takeaways while simultaneously exploring technical implementation details, statistics, and SOPs. -->\n\u003c!-- Visualization & Content Choices: \n1. Audio Player & Script: Web Speech API + Dynamic Paragraph Highlight -> Speech synthesis with user playback controls -> Allows auditory learning and rapid overview -> Web Speech API / Vanilla JS.\n2. Threat Vector Breakdown: Chart.js Bar Chart -> Visualizes attack types (ClickFix, Infostealers, NFC Relay, Zero-Click) -> Interactive hover and details -> Chart.js Canvas.\n3. AV Performance Comparison: Chart.js Grouped Bar Chart -> Compares Microsoft Defender, Bitdefender, Kaspersky, ESET, Norton -> Interactive dataset toggle -> Chart.js Canvas.\n4. OS Defense Matrix: Dynamic HTML/Tailwind Tabs & Progress Checklist -> Steps for Win11, macOS, Android, iOS -> Click-to-complete state -> HTML/CSS/JS.\n5. Encrypted DNS & LINE Protection: Interactive Matrix & Diagnostic Quiz -> Helps users pick Quad9 vs Cloudflare and verify LINE settings -> Dynamic DOM update -> HTML/CSS/JS.\n6. Incident SOP Decision Flow: Interactive Scenario Switcher -> Step-by-step emergency actions for breaches -> State-driven workflow -> HTML/CSS/JS.\nConfirming NO SVG graphics used. NO Mermaid JS used. -->\n\u003c!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->\n\u003cbody class=\"bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col\">\n\n    \u003cheader class=\"bg-slate-900 text-white shadow-md sticky top-0 z-50\">\n        \u003cdiv class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4\">\n            \u003cdiv class=\"flex items-center space-x-3\">\n                \u003cspan class=\"text-2xl\">🛡️\u003c/span>\n                \u003cdiv>\n                    \u003ch1 class=\"text-xl font-bold tracking-tight\">2026 全平台防毒防駭終極指南\u003c/h1>\n                    \u003cp class=\"text-xs text-slate-400\">語音導覽與互動式端點防禦藍圖\u003c/p>\n                \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs text-slate-300\">\n                \u003cspan class=\"w-2.5 h-2.5 bg-emerald-500 rounded-full inline-block animate-pulse\">\u003c/span>\n                \u003cspan>系統版本：2026Q4 最新基線\u003c/span>\n            \u003c/div>\n        \u003c/div>\n        \u003cnav class=\"bg-slate-800 border-t border-slate-700 overflow-x-auto\">\n            \u003cdiv class=\"max-w-7xl mx-auto px-4 flex whitespace-nowrap text-sm\">\n                \u003cbutton onclick=\"switchTab('audio')\" id=\"tab-audio\" class=\"px-4 py-3 text-slate-300 hover:text-white transition active-tab\">🎙️ 語音摘要與逐字稿\u003c/button>\n                \u003cbutton onclick=\"switchTab('threats')\" id=\"tab-threats\" class=\"px-4 py-3 text-slate-300 hover:text-white transition\">📊 2026威脅趨勢\u003c/button>\n                \u003cbutton onclick=\"switchTab('os-matrix')\" id=\"tab-os-matrix\" class=\"px-4 py-3 text-slate-300 hover:text-white transition\">💻📱 作業系統安全設定\u003c/button>\n                \u003cbutton onclick=\"switchTab('av-test')\" id=\"tab-av-test\" class=\"px-4 py-3 text-slate-300 hover:text-white transition\">🧪 防毒軟體評測數據\u003c/button>\n                \u003cbutton onclick=\"switchTab('dns-line')\" id=\"tab-dns-line\" class=\"px-4 py-3 text-slate-300 hover:text-white transition\">🌐 加密DNS & LINE防盜\u003c/button>\n                \u003cbutton onclick=\"switchTab('sop')\" id=\"tab-sop\" class=\"px-4 py-3 text-slate-300 hover:text-white transition\">🚨 中毒緊急應變 SOP\u003c/button>\n            \u003c/div>\n        \u003c/nav>\n    \u003c/header>\n\n    \u003cmain class=\"flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8\">\n\n        \u003csection id=\"sec-audio\" class=\"space-y-6\">\n            \u003cdiv class=\"bg-white rounded-xl shadow-sm border border-slate-200 p-6\">\n                \u003cdiv class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-4 mb-6\">\n                    \u003cdiv>\n                        \u003ch2 class=\"text-2xl font-bold text-slate-900 flex items-center gap-2\">\n                            \u003cspan>🎙️\u003c/span> 語音重點摘要與互動朗讀\n                        \u003c/h2>\n                        \u003cp class=\"text-sm text-slate-600 mt-1\">本模組將報告精華轉化為語音導覽，您可以點擊播放收聽完整的資安防禦策略，或選擇特定章節朗讀。\u003c/p>\n                    \u003c/div>\n                    \u003cdiv class=\"flex flex-wrap items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200\">\n                        \u003cbutton onclick=\"playAudio()\" id=\"btn-play\" class=\"bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow-sm\">\n                            \u003cspan>▶️\u003c/span> 播放語音\n                        \u003c/button>\n                        \u003cbutton onclick=\"pauseAudio()\" id=\"btn-pause\" class=\"bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow-sm\">\n                            \u003cspan>⏸️\u003c/span> 暫停\n                        \u003c/button>\n                        \u003cbutton onclick=\"stopAudio()\" id=\"btn-stop\" class=\"bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow-sm\">\n                            \u003cspan>⏹️\u003c/span> 停止\n                        \u003c/button>\n                        \u003cdiv class=\"flex items-center gap-1 pl-2 border-l border-slate-300\">\n                            \u003cspan class=\"text-xs text-slate-500\">語速:\u003c/span>\n                            \u003cselect id=\"select-rate\" onchange=\"changeRate()\" class=\"bg-white border border-slate-300 rounded px-2 py-1 text-xs\">\n                                \u003coption value=\"0.8\">0.8x\u003c/option>\n                                \u003coption value=\"1.0\" selected>1.0x\u003c/option>\n                                \u003coption value=\"1.25\">1.25x\u003c/option>\n                                \u003coption value=\"1.5\">1.5x\u003c/option>\n                            \u003c/select>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"mb-4 flex items-center justify-between text-xs text-slate-500 bg-indigo-50/50 p-3 rounded-lg border border-indigo-100\">\n                    \u003cdiv id=\"audio-status\" class=\"flex items-center gap-2 font-medium text-indigo-900\">\n                        \u003cspan class=\"w-2 h-2 rounded-full bg-slate-400 inline-block\" id=\"status-dot\">\u003c/span>\n                        \u003cspan id=\"status-text\">語音系統就緒，請點擊播放\u003c/span>\n                    \u003c/div>\n                    \u003cspan>點擊下文任一段落可直接播放該單元\u003c/span>\n                \u003c/div>\n\n                \u003cdiv class=\"space-y-4 text-slate-700 text-sm leading-relaxed\" id=\"script-container\">\n                    \u003cdiv id=\"script-ch1\" onclick=\"playChapter(1)\" class=\"p-4 rounded-xl border border-slate-200 hover:border-indigo-300 transition cursor-pointer\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base mb-2 flex items-center justify-between\">\n                            \u003cspan>第一章：2026年資安威脅新型態與 ClickFix 社交工程\u003c/span>\n                            \u003cspan class=\"text-xs font-normal text-indigo-600\">點擊朗讀 ▶\u003c/span>\n                        \u003c/h3>\n                        \u003cp>歡迎收聽 2026 年完整防毒防駭語音摘要。在今年，傳統防毒軟體已無法單靠檔案掃描達成完全安全。駭客攻擊重心已全面轉向社交工程誘騙與竊資軟體。例如熱門的 ClickFix 攻擊，會利用假冒的驗證碼或當機視窗，誘導使用者複製惡意指令並親手貼入電腦的命令提示字元或終端機執行，進而繞過防毒防線並搜刮瀏覽器密碼與登入 Cookie。同時，手機端也出現了感應實體金融卡進行遠端盜刷的 NFC 中繼攻擊。\u003c/p>\n                    \u003c/div>\n\n                    \u003cdiv id=\"script-ch2\" onclick=\"playChapter(2)\" class=\"p-4 rounded-xl border border-slate-200 hover:border-indigo-300 transition cursor-pointer\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base mb-2 flex items-center justify-between\">\n                            \u003cspan>第二章：電腦端 Windows 11 與 macOS 關鍵系統強化\u003c/span>\n                            \u003cspan class=\"text-xs font-normal text-indigo-600\">點擊朗讀 ▶\u003c/span>\n                        \u003c/h3>\n                        \u003cp>防禦的第一步是鎖死作業系統的系統級權限。Windows 11 用戶應升級至最新版本，並開啟智慧應用程式控制（Smart App Control）以強制封鎖無數位簽章的未知程式，同時確認啟用預設的管理員保護（Administrator Protection）與記憶體完整性防護。macOS 用戶則應更新至 Tahoe 26.7 或 Golden Gate 27.2，善用系統內建的終端機貼上防護，並嚴防網頁誘導開啟「工序指令編寫程式」貼上惡意指令的繞過手法。\u003c/p>\n                    \u003c/div>\n\n                    \u003cdiv id=\"script-ch3\" onclick=\"playChapter(3)\" class=\"p-4 rounded-xl border border-slate-200 hover:border-indigo-300 transition cursor-pointer\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base mb-2 flex items-center justify-between\">\n                            \u003cspan>第三章：防毒軟體評測數據與選購建議\u003c/span>\n                            \u003cspan class=\"text-xs font-normal text-indigo-600\">點擊朗讀 ▶\u003c/span>\n                        \u003c/h3>\n                        \u003cp>根據 2026 年 AV-TEST 與 AV-Comparatives 權威實驗室測試，Windows 內建的 Microsoft Defender 已具備 100% 的基礎病毒攔截率，但在系統效能佔用上稍高。若需要極低系統負載與無檔案進階攻擊防護，第三方防毒軟體如 Bitdefender、Kaspersky、ESET 與 Norton 均表現優異。在 Mac 平台上，因內建 XProtect 缺乏細部控管，建議頻繁下載外來檔案的使用者加裝高分第三方防毒。\u003c/p>\n                    \u003c/div>\n\n                    \u003cdiv id=\"script-ch4\" onclick=\"playChapter(4)\" class=\"p-4 rounded-xl border border-slate-200 hover:border-indigo-300 transition cursor-pointer\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base mb-2 flex items-center justify-between\">\n                            \u003cspan>第四章：手機端 Android 進階保護與 iOS 失竊防護\u003c/span>\n                            \u003cspan class=\"text-xs font-normal text-indigo-600\">點擊朗讀 ▶\u003c/span>\n                        \u003c/h3>\n                        \u003cp>手機防禦重點在於封鎖未知側載與實體防盜。Android 16 用戶應一鍵開啟「進階保護（Advanced Protection）」，系統將全面禁止第三方 APK 側載與未認證的無障礙權限，並啟用 72 小時閒置自動重開機加密與 Gemini AI 來電防詐。iPhone 用戶則應將「失竊裝置防護」設定為「永遠」，確保手機遭竊後變更密碼需強制等待一小時安全延遲與 Face ID 驗證。\u003c/p>\n                    \u003c/div>\n\n                    \u003cdiv id=\"script-ch5\" onclick=\"playChapter(5)\" class=\"p-4 rounded-xl border border-slate-200 hover:border-indigo-300 transition cursor-pointer\">\n                        \u003ch3 class=\"font-bold text-slate-900 text-base mb-2 flex items-center justify-between\">\n                            \u003cspan>第五章：加密 DNS、LINE 防盜與中毒緊急 SOP\u003c/span>\n                            \u003cspan class=\"text-xs font-normal text-indigo-600\">點擊朗讀 ▶\u003c/span>\n                        \u003c/h3>\n                        \u003cp>最後，請將設備 DNS 設定為可攔截惡意網域的 Quad9 9.9.9.9 或 Cloudflare 1.1.1.2，並清理瀏覽器擴充功能。LINE 帳號務必完成電話與雙重帳號綁定。若不幸遇到 LINE 帳號異狀，切記絕對不要刪除 App，只需在原手機點選「再次登入」即可強制踢出駭客；若電腦誤觸惡意指令，請立即實體斷網，並使用 Windows 11 的「雲端重建」功能進行乾淨重灌。\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"sec-threats\" class=\"space-y-6 hidden\">\n            \u003cdiv class=\"bg-white rounded-xl shadow-sm border border-slate-200 p-6\">\n                \u003cdiv class=\"border-b border-slate-100 pb-4 mb-6\">\n                    \u003ch2 class=\"text-2xl font-bold text-slate-900 flex items-center gap-2\">\n                        \u003cspan>📊\u003c/span> 2026 年最新威脅型態數據分析\n                    \u003c/h2>\n                    \u003cp class=\"text-sm text-slate-600 mt-1\">本章節解構攻擊者如何利用 AI 語意誘餌、ClickFix 社交工程與憑證竊取軟體繞過傳統防禦線。\u003c/p>\n                \u003c/div>\n\n                \u003cdiv class=\"grid grid-cols-1 md:grid-cols-4 gap-4 mb-8\">\n                    \u003cdiv class=\"bg-indigo-50 border border-indigo-100 rounded-xl p-4\">\n                        \u003cdiv class=\"text-xs font-semibold text-indigo-600 uppercase tracking-wider\">竊資軟體外洩紀錄\u003c/div>\n                        \u003cdiv class=\"text-2xl font-extrabold text-indigo-900 mt-1\">18億組\u003c/div>\n                        \u003cdiv class=\"text-xs text-indigo-700 mt-1\">來自580萬台受感染設備 (KELA)\u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"bg-rose-50 border border-rose-100 rounded-xl p-4\">\n                        \u003cdiv class=\"text-xs font-semibold text-rose-600 uppercase tracking-wider\">CVE 漏洞利用增幅\u003c/div>\n                        \u003cdiv class=\"text-2xl font-extrabold text-rose-900 mt-1\">+34%\u003c/div>\n                        \u003cdiv class=\"text-xs text-rose-700 mt-1\">2026上半年達215個高危漏洞\u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"bg-amber-50 border border-amber-100 rounded-xl p-4\">\n                        \u003cdiv class=\"text-xs font-semibold text-amber-600 uppercase tracking-wider\">Android 攻擊激增\u003c/div>\n                        \u003cdiv class=\"text-2xl font-extrabold text-amber-900 mt-1\">+29%\u003c/div>\n                        \u003cdiv class=\"text-xs text-amber-700 mt-1\">攔截逾25.5萬次金融木馬\u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"bg-emerald-50 border border-emerald-100 rounded-xl p-4\">\n                        \u003cdiv class=\"text-xs font-semibold text-emerald-600 uppercase tracking-wider\">LINE 涉詐處置\u003c/div>\n                        \u003cdiv class=\"text-2xl font-extrabold text-emerald-900 mt-1\">13.3萬個\u003c/div>\n                        \u003cdiv class=\"text-xs text-emerald-700 mt-1\">官方累計封鎖帳號 (台灣)\u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv class=\"grid grid-cols-1 lg:grid-cols-2 gap-8 items-center\">\n                    \u003cdiv>\n                        \u003ch3 class=\"text-lg font-bold text-slate-900 mb-3\">2026 現代資安攻擊途徑分布\u003c/h3>\n                        \u003cp class=\"text-sm text-slate-600 mb-4\">駭客不再依賴軟體漏洞入侵，而是誘騙使用者自行輸入指令或授權權限。\u003c/p>\n                        \u003cdiv class=\"chart-container\">\n                            \u003ccanvas id=\"chart-threats\">\u003c/canvas>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"space-y-4 text-sm text-slate-700\">\n                        \u003cdiv class=\"p-4 bg-slate-50 rounded-xl border border-slate-200\">\n                            \u003ch4 class=\"font-bold text-slate-900 flex items-center gap-2\">\n                                \u003cspan class=\"text-indigo-600\">●\u003c/span> ClickFix & CrashFix 社交工程\n                            \u003c/h4>\n                            \u003cp class=\"mt-1 text-xs leading-relaxed text-slate-600\">偽造 CAPTCHA 人機驗證或瀏覽器當機修復視窗，指示使用者複製 PowerShell / Terminal 指令執行，避開系統掃描。\u003c/p>\n                        \u003c/div>\n                        \u003cdiv class=\"p-4 bg-slate-50 rounded-xl border border-slate-200\">\n                            \u003ch4 class=\"font-bold text-slate-900 flex items-center gap-2\">\n                                \u003cspan class=\"text-indigo-600\">●\u003c/span> 瀏覽器擴充功能供應鏈劫持\n                            \u003c/h4>\n                            \u003cp class=\"mt-1 text-xs leading-relaxed text-slate-600\">駭客收購或入侵熱門 Chrome 擴充功能，利用 `chrome.cookies.getAll` 竊取登入權杖，實現無密碼 Session 劫持。\u003c/p>\n                        \u003c/div>\n                        \u003cdiv class=\"p-4 bg-slate-50 rounded-xl border border-slate-200\">\n                            \u003ch4 class=\"font-bold text-slate-900 flex items-center gap-2\">\n                                \u003cspan class=\"text-indigo-600\">●\u003c/span> 行動端 NFC 中繼與無障礙木馬\n                            \u003c/h4>\n                            \u003cp class=\"mt-1 text-xs leading-relaxed text-slate-600\">誘騙受害者將實體金融卡貼近手機背面，透過 WebSocket 中繼 NFC 資料至 ATM 盜刷，或濫用無障礙服務轉帳。\u003c/p>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n        \u003c/section>\n\n        \u003csection id=\"sec-os-matrix\" class=\"space-y-6 hidden\">\n            \u003cdiv class=\"bg-white rounded-xl shadow-sm border border-slate-200 p-6\">\n                \u003cdiv class=\"border-b border-slate-100 pb-4 mb-6\">\n                    \u003ch2 class=\"text-2xl font-bold text-slate-900 flex items-center gap-2\">\n                        \u003cspan>💻📱\u003c/span> 跨平台作業系統核心防禦矩陣\n                    \u003c/h2>\n                    \u003cp class=\"text-sm text-slate-600 mt-1\">請選擇您的作業系統，依序勾選完成最新安全基線設定。\u003c/p>\n                \u003c/div>\n\n                \u003cdiv class=\"flex flex-wrap gap-2 mb-6 border-b border-slate-200 pb-3\">\n                    \u003cbutton onclick=\"setOsTab('win')\" id=\"ostab-win\" class=\"px-4 py-2 rounded-lg font-medium text-sm bg-indigo-600 text-white\">Windows 11 (25H2/26H2)\u003c/button>\n                    \u003cbutton onclick=\"setOsTab('mac')\" id=\"ostab-mac\" class=\"px-4 py-2 rounded-lg font-medium text-sm bg-slate-100 text-slate-700 hover:bg-slate-200\">macOS (Tahoe/Golden Gate)\u003c/button>\n                    \u003cbutton onclick=\"setOsTab('android')\" id=\"ostab-android\" class=\"px-4 py-2 rounded-lg font-medium text-sm bg-slate-100 text-slate-700 hover:bg-slate-200\">Android 16+\u003c/button>\n                    \u003cbutton onclick=\"setOsTab('ios')\" id=\"ostab-ios\" class=\"px-4 py-2 rounded-lg font-medium text-sm bg-slate-100 text-slate-700 hover:bg-slate-200\">iOS / iPadOS (iOS 26.4+)\u003c/button>\n                \u003c/div>\n\n                \u003cdiv id=\"os-content-win\" class=\"space-y-4\">\n                    \u003cdiv class=\"bg-amber-50 border border-amber-200 text-amber-900 p-3 rounded-lg text-xs\">\n                        ⚠️ \u003cstrong>版本警示：\u003c/strong> Windows 11 24H2 家用版/專業版已於 2026年10月13日終止安全更新，請立即升級至 25H2 或 26H2。\n                    \u003c/div>\n                    \u003cdiv class=\"space-y-3\">\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">1. 啟用智慧應用程式控制 (Smart App Control, SAC)\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">前往「Windows 安全性 > 應用程式與瀏覽器控制」。已安裝 2026年4月 KB5079391 更新後，現有系統免重灌即可直接開啟。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">2. 確認管理員保護 (Administrator Protection) 生效\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">2026年10月更新 (KB5127648) 預設啟用。提權時強制 Windows Hello 驗證並隔離管理員憑證。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">3. 開啟記憶體完整性 (HVCI) 與 CET 堆疊保護\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">前往「裝置安全性 > 核心隔離詳細資料」，將核心程序隔離於虛擬化安全記憶體中。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv id=\"os-content-mac\" class=\"space-y-4 hidden\">\n                    \u003cdiv class=\"space-y-3\">\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">1. 升級至 macOS Golden Gate 27.2 / Tahoe 26.7.2\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">修補 2026年最新累積的 299 個系統與安全漏洞，保持 Gatekeeper 與 XProtect (v5360+) 自動更新。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">2. 注意終端機與 Script Editor 貼上警告\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">macOS 26.4+ 會自動阻擋可疑指令貼入 Terminal；若網頁引導您開啟「工序指令編寫程式」貼上指令，切勿執行。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n                            \u003cdiv>\n                                \u003cspan class=\"font-bold text-sm text-slate-900\">3. 審查敏感資料存取權限\u003c/span>\n                                \u003cp class=\"text-xs text-slate-600 mt-0.5\">防範 AMOS 竊資軟體彈出偽造 `dscl` 密碼視窗，定期檢查「隱私權與安全性」中的檔案與檔案夾存取授權。\u003c/p>\n                            \u003c/div>\n                        \u003c/label>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cdiv id=\"os-content-android\" class=\"space-y-4 hidden\">\n                    \u003cdiv class=\"space-y-3\">\n                        \u003clabel class=\"flex items-start gap-3 p-3 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50/30\">\n                            \u003cinput type=\"checkbox\" class=\"mt-1 w-4 h-4 text-indigo-600 rounded\">\n
